name: Pubblica server notifiche (Cloudflare Worker)

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/cloudflare-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Controllo segreti
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ]; then echo "::error::Manca il segreto CLOUDFLARE_API_TOKEN (Settings > Secrets and variables > Actions)"; exit 1; fi
          if [ -z "$CF_ACCOUNT" ]; then echo "::error::Manca il segreto CLOUDFLARE_ACCOUNT_ID (Settings > Secrets and variables > Actions)"; exit 1; fi

      - name: Controllo chiave Cloudflare
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "lunghezza della chiave: ${#CF_TOKEN} (di solito 40) | caratteri strani: $(printf '%s' "$CF_TOKEN" | tr -d 'A-Za-z0-9_-' | wc -c) | inizia con cfut_ o cfat_: $(case "$CF_TOKEN" in cfut_*|cfat_*) echo si;; *) echo no;; esac)"
          chiama() { curl -s -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4$1"; }
          esito() { python3 -c 'import sys,json; d=json.load(sys.stdin); print("riuscito:", d.get("success"), "| errori:", [(e.get("code"), e.get("message")) for e in d.get("errors", [])]); sys.exit(0 if d.get("success") else 1)'; }
          { chiama /user/tokens/verify | esito; } || { chiama "/accounts/$CF_ACCOUNT/tokens/verify" | esito; } || { echo "::error::La chiave CLOUDFLARE_API_TOKEN non è valida. Creane una nuova e incollala di nuovo nel segreto."; exit 1; }
          chiama "/accounts/$CF_ACCOUNT/workers/scripts" | esito || { echo "::error::La chiave non ha accesso a Workers su questo account. Controlla CLOUDFLARE_ACCOUNT_ID e il modello del token (Modifica Cloudflare Workers)."; exit 1; }

      - name: Database di foto e vocali (Cloudflare D1)
        working-directory: worker
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          QUANTI: "4"
        run: |
          # piano gratuito: 500 MB per database, 10 database per account. 4 database = circa 1,7 GB di foto e vocali.
          python3 - <<'PY'
          import json, os, sys, urllib.request
          tok, acc, n = os.environ["CF_TOKEN"], os.environ["CF_ACCOUNT"], int(os.environ["QUANTI"])
          def api(metodo, via, corpo=None):
              r = urllib.request.Request("https://api.cloudflare.com/client/v4/accounts/%s/d1/database%s" % (acc, via), method=metodo,
                  data=json.dumps(corpo).encode() if corpo else None, headers={"Authorization": "Bearer " + tok, "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(r) as x: return json.load(x)
              except urllib.error.HTTPError as e:
                  return json.loads(e.read() or b"{}")
          def avviso():
              print("::warning::La chiave Cloudflare non può usare D1: pubblico il server SENZA foto e vocali in chat. "
                    "Aggiungi al token CLOUDFLARE_API_TOKEN il permesso Account > D1 > Edit e rilancia questo workflow.")
              sys.exit(0)
          elenco = api("GET", "?per_page=100")
          if not elenco.get("success"): avviso()
          ids = {d["name"]: d["uuid"] for d in elenco.get("result") or []}
          righe = ""
          for i in range(n):
              nome = "jona-allegati-%d" % i
              if nome not in ids:
                  nuovo = api("POST", "", {"name": nome})
                  if not nuovo.get("success"): print(nuovo.get("errors")); avviso()
                  ids[nome] = nuovo["result"]["uuid"]; print("Creato il database", nome)
              righe += '\n[[d1_databases]]\nbinding = "ALLEGATI%d"\ndatabase_name = "%s"\ndatabase_id = "%s"\n' % (i, nome, ids[nome])
          with open("wrangler.toml", "a") as f: f.write(righe)
          print("Foto e vocali: %d database collegati." % n)
          PY

      - name: Pubblica il Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: "4"
          command: deploy

      - name: Pubblica il link corto degli inviti (Worker «invito»)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker/invito
          wranglerVersion: "4"
          command: deploy

      - name: Chiave delle notifiche (solo la prima volta)
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ELENCO=$(npx --yes wrangler@4 secret list) || { echo "::error::Non riesco a leggere i segreti del Worker: non creo una chiave nuova."; exit 1; }
          if printf '%s' "$ELENCO" | grep -q '"VAPID_JWK"'; then echo "La chiave delle notifiche c'è già: non la tocco."; exit 0; fi
          node -e 'const {generateKeyPairSync}=require("crypto");const {privateKey}=generateKeyPairSync("ec",{namedCurve:"prime256v1"});process.stdout.write(JSON.stringify(privateKey.export({format:"jwk"})))' | npx --yes wrangler@4 secret put VAPID_JWK
          echo "Chiave delle notifiche creata."

      - name: Chiave Gemini del ristorante (se c'è il segreto GEMINI_API_KEY)
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then echo "Nessun segreto GEMINI_API_KEY: Gemini resta solo con la chiave di ogni telefono."; exit 0; fi
          printf '%s' "$GEMINI_API_KEY" | npx --yes wrangler@4 secret put GEMINI_KEY
          echo "Chiave Gemini del ristorante salvata nel server."

      - name: Chiave del ponte con l'app dell'hotel (se c'è il segreto PONTE_KEY)
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PONTE_KEY: ${{ secrets.PONTE_KEY }}
        run: |
          if [ -z "$PONTE_KEY" ]; then echo "Nessun segreto PONTE_KEY: il ponte accetta solo i telefoni del ristorante (l'hotel non può ancora collegarsi)."; exit 0; fi
          printf '%s' "$PONTE_KEY" | npx --yes wrangler@4 secret put PONTE_KEY
          echo "Chiave del ponte salvata nel server."

      - name: Prova del server
        run: |
          # un sottodominio appena creato può metterci qualche minuto a rispondere: riprova fino a 3 minuti
          prova() {
            curl -sf https://jona-notifiche.jona-ristorante-by-ynoy-corp.workers.dev/salute | tee /dev/stderr | grep -q '"push":true' &&
            curl -sf https://jona-notifiche.jona-ristorante-by-ynoy-corp.workers.dev/chiave | grep -q '"chiave":"B' &&
            curl -sf https://invito.jona-ristorante-by-ynoy-corp.workers.dev/ABCDEF | grep -q '#i=ABCDEF'
          }
          for i in $(seq 1 18); do sleep 10; if prova; then echo "Server a posto."; exit 0; fi; echo "Non risponde ancora ($i/18)"; done
          echo "::error::Il server non risponde dopo 3 minuti."; exit 1
