name: Pubblica server notifiche (Cloudflare Worker)

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/cloudflare-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Controllo segreti
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ]; then echo "::error::Manca il segreto CLOUDFLARE_API_TOKEN (Settings > Secrets and variables > Actions)"; exit 1; fi
          if [ -z "$CF_ACCOUNT" ]; then echo "::error::Manca il segreto CLOUDFLARE_ACCOUNT_ID (Settings > Secrets and variables > Actions)"; exit 1; fi

      - name: Pubblica il Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
