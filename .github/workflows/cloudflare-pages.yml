name: Pubblica l'app (Cloudflare Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

env:
  PROGETTO: jona-ristorante-by-ynoy-corp

jobs:
  pubblica:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Progetto Pages (lo crea se manca)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then echo "::error::Mancano i segreti CLOUDFLARE_API_TOKEN o CLOUDFLARE_ACCOUNT_ID (Settings > Secrets and variables > Actions)"; exit 1; fi
          python3 - <<'PY'
          import json, os, sys, urllib.request
          tok, acc, nome = os.environ["CF_TOKEN"], os.environ["CF_ACCOUNT"], os.environ["PROGETTO"]
          def api(metodo, via, corpo=None):
              r = urllib.request.Request("https://api.cloudflare.com/client/v4/accounts/%s/pages/projects%s" % (acc, via), method=metodo,
                  data=json.dumps(corpo).encode() if corpo else None, headers={"Authorization": "Bearer " + tok, "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(r) as x: return json.load(x)
              except urllib.error.HTTPError as e:
                  return json.loads(e.read() or b"{}")
          def manca_permesso(d):
              print(d.get("errors"))
              print("::error::La chiave Cloudflare non può usare Pages. Aggiungi al token CLOUDFLARE_API_TOKEN il permesso Account > Cloudflare Pages > Edit e rilancia questo workflow.")
              sys.exit(1)
          d = api("GET", "/" + nome)
          if d.get("success"): print("Il progetto", nome, "c'è già."); sys.exit(0)
          if any(e.get("code") in (10000, 9109) for e in d.get("errors") or []): manca_permesso(d)
          n = api("POST", "", {"name": nome, "production_branch": "main"})
          if not n.get("success"): manca_permesso(n)
          print("Creato il progetto", nome)
          PY

      - name: Prepara i file dell'app
        run: |
          mkdir -p sito
          cp index.html sw.js manifest.webmanifest firebase-config.js _headers *.png sito/
          cp -r lib media sito/
          ls -la sito

      - name: Pubblica
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: pages deploy sito --project-name=${{ env.PROGETTO }} --branch=main --commit-dirty=true

      - name: Prova dell'app
        run: |
          sleep 10
          curl -sf "https://$PROGETTO.pages.dev/" | grep -q 'const APP_VER='
          curl -sfI "https://$PROGETTO.pages.dev/manifest.webmanifest" | tee /dev/stderr | grep -qi 'access-control-allow-origin: \*'
