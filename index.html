<style>
*{box-sizing:border-box}
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --font:"Jost","Futura","Avenir Next","Century Gothic",system-ui,sans-serif;
  --bg:#EFEBE6;--surface:#FFFFFF;--sunk:#F6F3EF;--ink:#2B2321;--ink2:#5E534D;--muted:#8A7F76;--line:#E4DDD5;--sand:#BDB2A6;
  --solid:#3A2F2C;--on-solid:#F3EDE7;
  --lagoon:#1F7F86;--on-lagoon:#FFFFFF;--lagoon-soft:#DBECEC;
  --mirto:#3B7A57;--mirto-soft:#DFEDE4;--corallo:#AE4E37;--corallo-soft:#F5E1DA;--ocra:#94661C;--ocra-soft:#F3E7D1;
  --lift:0 1px 0 rgba(43,35,33,.04),0 12px 30px -18px rgba(43,35,33,.30);
  --cocoa:#3A2F2C;--linen:#CFC5BA;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1E1816;--surface:#29211F;--sunk:#231C1A;--ink:#F1EBE5;--ink2:#CFC4BA;--muted:#A0948A;--line:#3D3330;--sand:#C9BEB2;
    --solid:#E9E1D9;--on-solid:#2A2220;--lagoon:#57B0B6;--on-lagoon:#0E2426;--lagoon-soft:#1D3436;
    --mirto:#7DBE98;--mirto-soft:#1E3127;--corallo:#E08A72;--corallo-soft:#3A2420;--ocra:#D9A955;--ocra-soft:#3A2E1A;
    --lift:0 1px 0 rgba(0,0,0,.2),0 14px 30px -18px rgba(0,0,0,.7);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1E1816;--surface:#29211F;--sunk:#231C1A;--ink:#F1EBE5;--ink2:#CFC4BA;--muted:#A0948A;--line:#3D3330;--sand:#C9BEB2;
  --solid:#E9E1D9;--on-solid:#2A2220;--lagoon:#57B0B6;--on-lagoon:#0E2426;--lagoon-soft:#1D3436;
  --mirto:#7DBE98;--mirto-soft:#1E3127;--corallo:#E08A72;--corallo-soft:#3A2420;--ocra:#D9A955;--ocra-soft:#3A2E1A;
  --lift:0 1px 0 rgba(0,0,0,.2),0 14px 30px -18px rgba(0,0,0,.7);color-scheme:dark;
}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
html.on-wall{background:var(--cocoa)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--font);-webkit-font-smoothing:antialiased;min-height:100%}
html.on-wall body{background:var(--cocoa)}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
img{max-width:100%}
:focus-visible{outline:2px solid var(--lagoon);outline-offset:2px}
.ic{width:20px;height:20px;flex:none}
.ic.big{width:44px;height:44px}
.muted{color:var(--muted)}
.small{font-size:13px}
[hidden]{display:none!important}

.wall-sub{font:300 17px/1.4 var(--font);letter-spacing:.06em;color:#B9AEA2;margin:22px 0 0}
.wall-groups{width:100%;max-width:760px}
.wall h2{font:400 14px var(--font);letter-spacing:.08em;color:#A3978D;margin:38px 0 16px;text-align:center}
.faces{display:flex;flex-wrap:wrap;justify-content:center;gap:24px 14px}
.face{width:100px;display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;color:inherit;padding:6px 0;border-radius:14px}
.face .av{box-shadow:0 0 0 1.5px rgba(207,197,186,.35),0 14px 26px -12px rgba(0,0,0,.7);transition:transform .15s}
.face:hover .av{box-shadow:0 0 0 2px var(--linen),0 14px 26px -12px rgba(0,0,0,.7)}
.face:active .av{transform:scale(.95)}
.face .fn{font:400 15.5px/1.2 var(--font)}
.face .fr{font:300 12.5px/1.2 var(--font);color:#A3978D;margin-top:-4px}
.face.pending{opacity:.55}
.wall-new{margin-top:44px;background:transparent;border:1px solid rgba(207,197,186,.35);color:#E4DCD3;min-height:46px;padding:0 22px;border-radius:999px;display:inline-flex;align-items:center;gap:8px;font:400 15px var(--font)}
.wall-new:hover{border-color:var(--linen)}
.wall-card{width:100%;max-width:520px;margin-top:30px;background:var(--surface);color:var(--ink);border-radius:22px;padding:22px 20px 24px;box-shadow:0 30px 60px -30px rgba(0,0,0,.7)}
.wall-card h1{font:300 26px/1.2 var(--font);margin:0 0 6px}
.wall-msg{max-width:420px;text-align:center;color:#CFC5BA;font:300 16px/1.6 var(--font);margin-top:26px}
.intro .logo-full,.intro .wall-sub,.intro .wall-card{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
.intro .wall-sub{animation-delay:.12s}.intro .wall-card{animation-delay:.2s}
.intro .face{animation:rise .55s calc(.2s + var(--i,0)*40ms) cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- avatar ---------- */
.av{--s:44px;width:var(--s);height:var(--s);border-radius:50%;flex:none;display:grid;place-items:center;overflow:hidden;background:var(--c,#8A7F76);color:#fff;font:400 calc(var(--s)*.38)/1 var(--font);letter-spacing:.02em}
.av img{width:100%;height:100%;object-fit:cover;display:block}

/* ---------- shell ---------- */
.main{max-width:880px;margin:0 auto;padding:0 16px 110px}

.top-t{flex:1;font:300 17px var(--font);letter-spacing:.04em;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-btn{border:0;background:none;padding:0;border-radius:50%}
.icon-btn{width:40px;height:40px;flex:none;display:grid;place-items:center;border:0;border-radius:50%;background:transparent;color:var(--ink2);position:relative}
.icon-btn:hover{background:var(--sunk)}
.icon-btn.danger{color:var(--corallo)}
.bell .dot{position:absolute;top:3px;right:2px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--corallo);color:#fff;font:600 11px/18px var(--font);text-align:center}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--surface) 90%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.nav-brand{display:none}
.nav button{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 4px;border:0;background:none;color:var(--muted);font:400 11.5px/1.2 var(--font);position:relative;border-radius:12px}
.nav button[aria-current="page"]{color:var(--ink)}
.nav button[aria-current="page"] .ic{color:var(--lagoon)}
.nav .badge{position:absolute;top:0;left:calc(50% + 5px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--corallo);color:#fff;font:600 11px/18px var(--font)}
@media (min-width:980px){
  .nav{top:0;bottom:0;right:auto;width:232px;flex-direction:column;justify-content:flex-start;gap:2px;padding:30px 14px;border-top:0;border-right:1px solid var(--line);background:var(--surface)}
  .nav-brand{display:block;margin:0 0 28px 12px}
  .nav-brand .logo-full{width:120px;background:var(--sand);animation:none}
  .nav button{flex:0 0 auto;max-width:none;flex-direction:row;gap:12px;padding:11px 14px;font-size:15px}
  .nav button[aria-current="page"]{background:var(--sunk)}
  .nav .badge{position:static;margin-left:auto}
  .main{margin-left:calc(232px + max(0px,(100vw - 232px - 880px)/2));padding-bottom:60px}
  .top .mark{display:none}
}

/* ---------- type & structure ---------- */
.vhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.vt{font:300 31px/1.15 var(--font);letter-spacing:.005em;margin:10px 0 4px}
.vsub{color:var(--muted);margin:0 0 18px}
.sec{display:flex;align-items:baseline;gap:8px;font:400 15px var(--font);color:var(--ink2);margin:26px 2px 10px}
.sec span{color:var(--muted);font-size:13px}
.panel{background:var(--surface);border-radius:18px;box-shadow:var(--lift);margin-bottom:14px}
.hint{color:var(--muted);font-size:14px;text-align:center;margin:18px 0}
.row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.panel>.row:first-child,.panel>*:first-child>.row:first-child{border-top:0}
.row.link:hover{background:var(--sunk)}
.panel>.row.link:first-child{border-radius:18px 18px 0 0}
.panel>.row.link:last-child{border-radius:0 0 18px 18px}
.panel>.row.link:only-child{border-radius:18px}
.row.dim{opacity:.55}
.row-i{flex:1;min-width:0}
.row-t{font:400 16px/1.3 var(--font)}
.row-m{font-size:13.5px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.row-m .ic{width:15px;height:15px}
.fdot{width:40px;height:40px;border-radius:12px;flex:none;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 16%,var(--surface));color:var(--c);font:500 17px var(--font)}
.fdot.lg{width:46px;height:46px;font-size:20px}
.tag{display:inline-block;font:400 11.5px/1 var(--font);padding:4px 7px;border-radius:6px;background:var(--sunk);color:var(--muted);vertical-align:2px;border:1px solid var(--line)}
.tag.gm{background:var(--lagoon-soft);color:var(--lagoon);border-color:transparent}
.tag.best{background:var(--mirto-soft);color:var(--mirto);border-color:transparent}
.sup{display:inline-flex;align-items:center;gap:7px;font:500 13.5px/1.2 var(--font);color:var(--ink2)}
.sup i{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.sup.big{font-size:18px;font-weight:400;color:var(--ink)}
.sup.big i{width:11px;height:11px}
.st{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font:500 12.5px/1.2 var(--font);background:var(--sunk);color:var(--muted);white-space:nowrap}
.st.wait{background:var(--ocra-soft);color:var(--ocra)}
.st.ok{background:var(--mirto-soft);color:var(--mirto)}
.st.ko{background:var(--corallo-soft);color:var(--corallo)}
.st.sent{background:var(--lagoon-soft);color:var(--lagoon)}
.banner{background:var(--ocra-soft);color:var(--ocra);padding:12px 14px;border-radius:12px;font-size:14.5px;margin:6px 0 14px}
.wall .banner{max-width:520px;margin-top:22px}
.callout{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;background:var(--lagoon-soft);color:var(--ink);margin-bottom:14px}
.callout>.ic{color:var(--lagoon)}
.callout>div{flex:1;min-width:0}
.empty{text-align:center;padding:46px 20px;color:var(--muted)}
.empty .ic{width:34px;height:34px;color:var(--sand);margin-bottom:8px}
.empty p{margin:0 0 16px;max-width:360px;margin-inline:auto}
.empty b{display:block;color:var(--ink);font-weight:400;font-size:18px;margin-bottom:4px}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid transparent;font:500 15px/1.1 var(--font);background:var(--sunk);color:var(--ink);text-decoration:none;white-space:nowrap}
.btn .ic{width:18px;height:18px}
.btn.primary{background:var(--lagoon);color:var(--on-lagoon)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.dark{background:var(--solid);color:var(--on-solid)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.ghost:hover{background:var(--sunk)}
.btn.danger{color:var(--corallo)}
.btn.block{width:100%}
.btn.big{min-height:54px;font-size:16.5px;border-radius:14px}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.btns.col{flex-direction:column}
.inp{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:400 16px/1.3 var(--font)}
.inp:focus{border-color:var(--lagoon);outline:none;box-shadow:0 0 0 3px var(--lagoon-soft)}
.inp.sm{min-height:38px;padding:7px 10px;font-size:15px}
textarea.inp{resize:vertical;line-height:1.45}
.inp.mono{font:400 14px/1.5 ui-monospace,Menlo,Consolas,monospace}
select.inp{appearance:none;-webkit-appearance:none;padding-right:34px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat}
.lbl{display:block;font:500 13.5px var(--font);color:var(--ink2);margin:14px 0 6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.two.stack{grid-template-columns:1fr}}
.sync-pill{display:inline-flex;align-items:center;gap:5px;font:500 12.5px var(--font);background:var(--ocra-soft);color:var(--ocra);padding:4px 10px;border-radius:999px;white-space:nowrap}.sync-pill .ic{width:15px;height:15px}
.qr{display:flex;justify-content:center;margin:14px 0 0}.qr img{width:min(240px,70vw);height:auto;background:#fff;padding:10px;border-radius:12px}
.invite-steps{margin:0;padding-left:20px;color:var(--ink2);line-height:1.5}
.testbar{display:flex;align-items:center;gap:10px;margin:0 0 14px}
.seg{display:inline-flex;padding:3px;background:var(--sunk);border-radius:999px;border:1px solid var(--line);max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg.wide{display:flex}
.seg.wide button{flex:1}
.seg button{border:0;background:none;padding:8px 14px;border-radius:999px;font:400 14.5px var(--font);color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none;margin:0 -2px}
.chips::-webkit-scrollbar,.seg::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 15px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font:400 14.5px var(--font);color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--solid);color:var(--on-solid);border-color:var(--solid)}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:16px;padding:0 6px 0 16px;box-shadow:var(--lift);margin:4px 0 14px;border:1px solid transparent}
.search:focus-within{border-color:var(--lagoon)}
.search .ic{color:var(--muted)}
.search input:placeholder-shown~.icon-btn{display:none}
.search input::-webkit-search-cancel-button{display:none}
.search input{flex:1;border:0;background:none;min-height:54px;font:400 17px var(--font);outline:none;min-width:0}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--sunk);flex:none}
.step button{width:40px;height:40px;border:0;background:none;display:grid;place-items:center;color:var(--ink);border-radius:50%}
.step button .ic{width:17px;height:17px}
.step input{width:46px;text-align:center;border:0;background:none;font:500 16px var(--font);color:var(--ink);padding:0;min-height:40px}
.step input:focus{outline:none}
.add{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--lagoon);background:transparent;color:var(--lagoon);display:grid;place-items:center;flex:none}
.add:hover{background:var(--lagoon);color:var(--on-lagoon)}
.toggle{position:relative;width:50px;height:30px;flex:none}
.toggle input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.toggle span{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:.2s;pointer-events:none}
.toggle span::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
.toggle input:checked+span{background:var(--lagoon)}
.toggle input:checked+span::after{transform:translateX(20px)}
.toggle input:focus-visible+span{outline:2px solid var(--lagoon);outline-offset:2px}

/* ---------- catalog ---------- */
.pg{padding:14px 16px 4px;border-top:1px solid var(--line)}
.pg:first-child{border-top:0}
.pg-t{font:400 17.5px/1.3 var(--font)}
.pg-c{font-size:13px;color:var(--muted);margin-top:1px}
.opt{display:flex;align-items:center;gap:12px;padding:10px 0}
.opt+.opt{border-top:1px dashed var(--line)}
.opt-i{flex:1;min-width:0}
.opt-n{font-size:14.5px;color:var(--ink2);margin-top:2px}
.opt-m{font-size:13.5px;color:var(--muted);margin-top:2px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.opt-m b{color:var(--ink);font-weight:500}
.free{display:flex;align-items:center;gap:12px;padding:16px;border-top:1px solid var(--line);color:var(--ink2)}
.free>div{flex:1}

/* ---------- lines (cart / requests / orders) ---------- */
.fsec{padding:6px 16px 8px;border-top:1px solid var(--line)}
.fsec:first-child{border-top:0}
.fsec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0 4px}
.fsec-h .muted{display:inline-flex;align-items:center;gap:6px}
.fsec-h .ic{width:15px;height:15px}
.line{display:flex;align-items:center;gap:8px;padding:9px 0}
.line+.line{border-top:1px dashed var(--line)}
.ln-i{flex:1;min-width:0}
.ln-n{font:400 15.5px/1.3 var(--font)}
.ln-m{font-size:13px;color:var(--muted);margin-top:1px}
.ln-m .was{color:var(--ocra)}
.ln-u{font-size:13px;color:var(--muted);min-width:22px}
.line.wrap{flex-wrap:wrap}
.ln-x{flex-basis:100%;display:flex;align-items:center;gap:8px;padding-top:2px}
.ln-x select{max-width:420px}
.unit-inp{width:70px;min-height:34px;padding:4px 8px;font-size:14px;margin-top:6px}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:14px 16px;border-top:1px solid var(--line);font-size:15px;color:var(--ink2)}
.total b{font:500 19px var(--font);color:var(--ink)}
.cart-foot{margin-top:6px}
.req-h{display:flex;align-items:center;gap:12px;padding:16px 16px 6px}
.req-who{flex:1;min-width:0}
.req-n{font:400 17px/1.25 var(--font)}
.req-m{font-size:13.5px;color:var(--muted)}
.req-t{font-size:13px;color:var(--muted);white-space:nowrap}
.req-note{margin:6px 16px 4px;padding:10px 12px;border-radius:10px;background:var(--sunk);font-size:14.5px;color:var(--ink2)}
.req-f{padding:12px 16px 16px;border-top:1px solid var(--line);display:grid;gap:12px}
.req-btns{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.req-btns .btn.primary{min-width:140px}
.rs{border-top:1px solid var(--line)}
.panel>.rs:first-child{border-top:0}
.rs summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer}
.rs summary::-webkit-details-marker{display:none}
.rs-i{flex:1;min-width:0;display:flex;align-items:center;gap:12px}
.rs-t{font:400 16px/1.3 var(--font)}
.rs-m{font-size:13px;color:var(--muted)}
.rs-b{padding:0 16px 14px}
.rs-b .fsec{padding:4px 0;border-top:1px dashed var(--line)}
.gm-note{background:var(--sunk);border-radius:10px;padding:10px 12px;margin:4px 0 10px;font-size:14.5px}
.removed{font-size:13.5px;color:var(--corallo);margin:6px 0 0}
.ord-h{display:flex;align-items:flex-start;gap:10px;padding:16px 16px 8px}
.ord-h>div{flex:1}
.ord-m{font-size:13.5px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:4px}
.ord-m .ic{width:15px;height:15px}
.olines{padding:0 16px}
.ord-body{padding:0 16px 16px}
.ord-act{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 10px}
.ord-act .btn{flex:1 1 150px}
.sline{display:flex;align-items:center;gap:12px;padding:10px 16px;border-top:1px dashed var(--line)}
.sline>div{flex:1;min-width:0}
.sl-q{font-weight:500;white-space:nowrap}
.fsum-h{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 8px}

/* ---------- sheets ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(24,18,16,.48);opacity:0;transition:opacity .22s}
.sheet{position:relative;width:100%;max-width:640px;max-height:92vh;max-height:92dvh;overflow:auto;overscroll-behavior:contain;background:var(--surface);color:var(--ink);border-radius:22px 22px 0 0;padding:6px 20px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sheet.tall{height:92vh;height:92dvh}
.open .scrim{opacity:1}
.open .sheet{transform:none}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 8px}
.sh-h{display:flex;align-items:center;gap:12px;position:sticky;top:0;background:var(--surface);padding:8px 0 12px;z-index:3}
.sh-t{flex:1;font:300 23px/1.2 var(--font);min-width:0}
.sh-s{font:400 13.5px var(--font);color:var(--muted);margin-top:2px}
.sheet-foot{position:sticky;bottom:0;background:var(--surface);display:flex;gap:10px;padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);margin-top:14px;z-index:3;box-shadow:0 30px 0 var(--surface)}
.sheet-foot .btn{flex:1}
@media (min-width:700px){
  .sheet-wrap{align-items:center;padding:24px}
  .sheet{border-radius:22px;max-height:88vh;transform:translateY(20px) scale(.98);opacity:0;transition:transform .22s,opacity .22s}
  .sheet.tall{height:88vh}
  .open .sheet{opacity:1;transform:none}
  .grab{display:none}
  .sh-h{padding-top:14px}
}
.pin-head{text-align:center;padding-top:10px}
.pin-head .av{margin:0 auto 10px}
.pin-name{font:300 22px var(--font)}
.pin-dots{display:flex;gap:16px;justify-content:center;margin:20px 0 24px}
.pin-dots i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--sand);transition:background .12s}
.pin-dots i.on{background:var(--ink);border-color:var(--ink)}
.pad{display:grid;grid-template-columns:repeat(3,74px);gap:14px 22px;justify-content:center;padding-bottom:6px}
.pad button{height:74px;border-radius:50%;border:1px solid var(--line);background:var(--sunk);font:300 27px var(--font);color:var(--ink);display:grid;place-items:center}
.pad button:active{background:var(--line)}
.pad .pk-t{border:0;background:none;font-size:15px;color:var(--muted)}
.shake{animation:shake .38s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.photo-btns{display:flex;gap:8px;justify-content:center;margin:8px 0 2px}
.photo-pick{display:grid;place-items:center;width:112px;height:112px;margin:6px auto 4px;border-radius:50%;border:1.5px dashed var(--sand);background:var(--sunk);color:var(--muted);cursor:pointer;overflow:hidden;text-align:center;font-size:12.5px;line-height:1.25;padding:10px}
.photo-pick .ic{width:26px;height:26px;margin:0 auto 4px;display:block}
.photo-pick.has{padding:0;border-style:solid;border-color:var(--line)}
.photo-pick img{width:100%;height:100%;object-fit:cover}
.photo-note{text-align:center;font-size:13px;color:var(--muted);margin:0}
.done{text-align:center;padding:20px 4px 4px}
.done .ic{color:var(--mirto)}
.done h2{font:300 26px var(--font);margin:10px 0 6px}
.done .btns{margin-top:22px}
.imp-opts{display:grid;gap:10px;margin-top:6px}
.imp-opt{display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer;text-align:left;width:100%}
.imp-opt:hover{background:var(--sunk)}
.imp-opt .ic{width:24px;height:24px;color:var(--lagoon)}
.imp-opt b{display:block;font-weight:400;font-size:16px}
.imp-opt span{font-size:13.5px;color:var(--muted)}
.imp-opt.off{opacity:.5;cursor:default}
.busy{text-align:center;padding:40px 10px}
.spin{width:38px;height:38px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--lagoon);margin:0 auto 18px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.err{background:var(--corallo-soft);color:var(--corallo);padding:11px 13px;border-radius:10px;font-size:14.5px;margin:8px 0}
.rv{display:flex;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.rv.off{opacity:.5}
.rv-c{width:22px;height:22px;margin-top:9px;accent-color:var(--lagoon);flex:none}
.rv-f{flex:1;min-width:0;display:grid;gap:6px}
.rv-g{display:grid;grid-template-columns:1fr .8fr .8fr;gap:6px}
.rv-g select{grid-column:1/-1}
.rv-f .st{justify-self:start}
.checkall{display:flex;align-items:center;gap:10px;font-size:14.5px;padding:8px 0}
.checkall input{width:20px;height:20px;accent-color:var(--lagoon)}
.setrow{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.setrow:first-of-type{border-top:0}
.setrow>div{flex:1}
.setrow b{display:block;font-weight:400}
.setrow span{font-size:13.5px;color:var(--muted)}
.prow{display:flex;align-items:center;gap:12px;padding:12px 2px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.prow:hover{background:var(--sunk)}
.prow .row-i{flex:1}
.prow .pr{font-weight:500;white-space:nowrap}
.notif{display:flex;gap:12px;padding:14px 2px;border-top:1px solid var(--line)}
.notif .ic{color:var(--muted);margin-top:2px}
.notif.unread .nt{font-weight:500}
.notif .nt{font-size:15.5px}
.notif .nx{font-size:14px;color:var(--muted)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar select{width:auto;min-width:160px}

/* ---------- v2 ---------- */
.local-note{color:#A3978D;font:300 13px/1.4 var(--font);text-align:center;margin:18px 0 0;max-width:420px}
.login h1{margin-bottom:2px}
.nav.n6 button{font-size:10.5px}
.rc{display:flex;align-items:flex-start;gap:10px;padding:12px 0;border-top:1px dashed var(--line)}
.rc:first-child{border-top:0}
.rc .ln-i select{margin-top:8px;max-width:260px}
.rc.bad .ln-n{color:var(--corallo)}
.rc-q{display:flex;flex-direction:column;align-items:center;gap:2px}
.bolla{display:grid;gap:8px;justify-items:start;margin:4px 0}
.bolla img{max-height:320px;border-radius:12px;border:1px solid var(--line)}
.row.link span.btn{pointer-events:none}
/* ---------- toasts ---------- */
#toasts{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:90;display:grid;gap:8px;width:min(92vw,420px);pointer-events:none}
.toast{background:var(--solid);color:var(--on-solid);padding:12px 16px;border-radius:14px;font:400 15px/1.35 var(--font);box-shadow:0 16px 34px -14px rgba(0,0,0,.5);opacity:0;transform:translateY(-8px);transition:opacity .25s,transform .25s}
.toast.in{opacity:1;transform:none}
.toast.err{background:var(--corallo);color:#fff}
.toast.warn{background:var(--ocra);color:#fff}
/* ---------- staff: interfaccia semplice (testi e pulsanti grandi) ---------- */
.steps3{display:flex;flex-wrap:wrap;gap:6px 18px;list-style:none;padding:0;margin:2px 0 14px;color:var(--muted);font-size:14px}
.steps3 li{display:inline-flex;align-items:center;gap:7px}
.steps3 b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--lagoon-soft);color:var(--lagoon);font:600 12.5px/1 var(--font)}
.pg.one{padding:12px 16px}
.pg.one .opt{padding:0;flex-wrap:wrap;row-gap:8px}
.pg.one .opt-i{flex:1 1 140px}
.pg.one .step{margin-left:auto}
.pg.one .opt-n{margin-top:3px}
.cartbar{position:fixed;left:0;right:0;bottom:calc(var(--navh,62px) + env(safe-area-inset-bottom,0px));z-index:29;padding:10px 12px 10px;background:linear-gradient(to top,var(--bg) 55%,transparent);pointer-events:none}

const STOP=new Set(['con','per','del','della','dei','delle','alla','allo','agli','alle','gli','una','uno','tipo','the','and','kg','gr','grammi','pz','conf','cartone','lt','litri','ml','busta','sacco','latta','fresco','fresca','freschi']);
const gkey=n=>{const w=norm(n).split(' ').filter(x=>x.length>2&&!STOP.has(x)&&!/^\d/.test(x));return w.slice(0,2).join(' ')||norm(n)};

function num(v){if(v==null||v==='')return null;if(typeof v==='number')return isFinite(v)?v:null;let s=String(v).replace(/[^\d,.\-]/g,'');if(!s)return null;if(s.includes(',')&&s.includes('.'))s=s.lastIndexOf(',')>s.lastIndexOf('.')?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,'');else if(s.includes(','))s=s.replace(',','.');const n=parseFloat(s);return isNaN(n)?null:Math.round(n*1000)/1000}
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function loadImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const i=new Image();i.onload=()=>{res(i);setTimeout(()=>URL.revokeObjectURL(u),1000)};i.onerror=()=>rej(new Error('img'));i.src=u})}
async function fileToAvatar(file){const img=await loadImg(file);const s=Math.min(img.width,img.height);const c=document.createElement('canvas');c.width=c.height=256;c.getContext('2d').drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,256,256);return c.toDataURL('image/jpeg',.8)}
async function shrink(file,max=2000){const img=await loadImg(file);const sc=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,'image/jpeg',.86))}

/* ================= data store (sostituibile) =================
   Interfaccia unica usata da tutta l'app: collection(nome).doc(id).set/update/delete,
   collection(nome).orderBy().limit().onSnapshot(). Questa versione "locale" salva sul
   dispositivo; le versioni Firebase e Google Fogli implementeranno la stessa interfaccia. */
const LocalStore=(()=>{
  const KEY='jona_db_v2';let data={};
  try{data=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){data={}}
  const subs=new Set();let t=null;
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){throw{code:'quota_exceeded'}}};
  const fire=()=>{clearTimeout(t);t=setTimeout(()=>subs.forEach(s=>s()),0)};
  addEventListener('storage',e=>{if(e.key===KEY){try{data=JSON.parse(e.newValue||'{}')||{}}catch(_){}fire()}});
  const doc=(c,id)=>({id,
    set:async d=>{(data[c]=data[c]||{})[id]=clone(d);save();fire()},
    update:async d=>{if(!data[c]||!data[c][id])throw{code:'not_found'};Object.assign(data[c][id],clone(d));save();fire()},
    delete:async()=>{if(data[c]&&data[c][id]){delete data[c][id];save();fire()}}});
  const query=(c,ord,lim)=>({
    orderBy:(f,dir)=>query(c,[f,dir],lim),limit:n=>query(c,ord,n),
    onSnapshot(next){let prev=null;
      const run=()=>{let ds=Object.entries(data[c]||{}).map(([id,d])=>({id,data:()=>d}));
        if(ord)ds.sort((a,b)=>(ord[1]==='desc'?-1:1)*((a.data()[ord[0]]||0)-(b.data()[ord[0]]||0)));
        if(lim)ds=ds.slice(0,lim);
        const changes=ds.filter(d=>!prev||!prev.has(d.id)).map(d=>({type:'added',doc:d}));prev=new Set(ds.map(d=>d.id));
        next({docs:ds,docChanges:()=>changes})};
      subs.add(run);setTimeout(run,0);return()=>subs.delete(run)}});
  return{kind:'locale',collection:c=>Object.assign(query(c),{doc:id=>doc(c,id||uid())}),
    dump:()=>clone(data),load:d=>{const old=data;data=clone(d);try{save()}catch(e){data=old;throw e}fire()},
    empty:()=>!Object.keys(data.fornitori||{}).length};
})();

/* ================= database centrale (Firebase) =================
   Stessa interfaccia del salvataggio locale. Firestore tiene una copia dei dati sul telefono:
   l'app funziona anche senza rete e invia le modifiche appena torna la connessione.
   I prodotti stanno in un documento per fornitore («listini/<fornitore>»): ogni apertura legge pochi documenti.
   Accesso: accesso anonimo + chiave del ristorante (link o QR); vedi firebase/firestore.rules. */
const fbCfg=()=>self.JONA_FIREBASE||ls('jona_fb')||null;
const FB_COLS=['staff','fornitori','config','richieste','ordini','notifiche'];
const randKey=(n=24)=>{const a='abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789';return[...crypto.getRandomValues(new Uint8Array(n))].map(x=>a[x%a.length]).join('')};
function fbInit(){
  const app=firebase.apps.length?firebase.app():firebase.initializeApp(fbCfg());const fs=firebase.firestore(),auth=firebase.auth();
  const emu=ls('jona_fb_emu');if(emu&&!fbInit.emu){fbInit.emu=1;fs.useEmulator(emu,8080);auth.useEmulator('http://'+emu+':9099',{disableWarnings:true})}
  return{fs,auth};
}
async function fbSignIn(auth){await new Promise(r=>{const u=auth.onAuthStateChanged(()=>{u();r()})});if(!auth.currentUser)await auth.signInAnonymously();return auth.currentUser.uid}
async function fbPublic(){try{await need('firebase');const{fs}=fbInit();const d=await fs.doc('pubblico/stato').get();return!!(d.exists&&d.data().attivo)}catch(e){return null}}
function FirebaseStore(key){
  const{fs,auth}=fbInit();
  fs.enablePersistence({synchronizeTabs:true}).catch(()=>{});
  const FV=firebase.firestore.FieldValue,FP=firebase.firestore.FieldPath;
  const st={ready:false,err:'',pend:0,net:navigator.onLine!==false,busy:''};
  const ping=()=>schedule();
  addEventListener('online',()=>{st.net=true;ping()});addEventListener('offline',()=>{st.net=false;ping()});
  const mapErr=e=>({code:!e?'fb':e.code==='not-found'?'not_found':e.code==='permission-denied'?'fb_perm':e.code==='unavailable'?'fb_net':e.code?'fb':'fb',msg:e&&e.message});
  let okReady;const readyP=new Promise(r=>okReady=r);
  const track=p=>{st.pend++;ping();p.then(()=>{st.pend--;ping()},e=>{st.pend--;const m=mapErr(e);if(m.code==='fb_perm'){st.err='fb_perm';st.ready=false}ping();toast(errMsg(m),'err')})};
  const run=f=>{track(readyP.then(f));return Promise.resolve()};
  const cache={};
  // ---- collegamento: accesso anonimo e iscrizione del telefono con la chiave ----
  (async function connect(){
    try{
      const u=await fbSignIn(auth);
      if(ls('jona_member')!==u){const m=await fs.doc('membri/'+u).get().catch(()=>null);
        if(!m||!m.exists)await fs.doc('membri/'+u).set({k:key,creato:now(),ua:navigator.userAgent.slice(0,120)});ls('jona_member',u)}
      if(ls('jona_fb_upload')){st.busy='upload';ping();await loadAll(LocalStore.dump());ls('jona_fb_upload',null);st.busy='';toast('Database centrale attivo: i dati di questo telefono sono stati caricati')}
      st.ready=true;st.err='';ping();okReady();
    }catch(e){st.err=mapErr(e).code;st.busy='';ping();if(st.err!=='fb_perm')setTimeout(connect,5000)}
  })();
  // ---- prodotti raggruppati per fornitore ----
  const L={data:{},fidOf:{},buf:new Map(),t:null};
  const pCur=pid=>L.buf.has(pid)?L.buf.get(pid):L.data[pid];
  function lFlush(){
    const buf=L.buf;L.buf=new Map();L.t=null;const byF=new Map();
    const add=(fid,pid,v)=>{if(!byF.has(fid))byF.set(fid,new Map());byF.get(fid).set(pid,v)};
    for(const [pid,d] of buf){const old=L.fidOf[pid];const fid=d?String(d.fornitoreId||'_'):null;
      if(old&&old!==fid)add(old,pid,FV.delete());if(fid)add(fid,pid,d)}
    for(const [fid,m] of byF){const obj={p:{}},paths=[];for(const [pid,v] of m){obj.p[pid]=v;paths.push(new FP('p',pid))}
      track(readyP.then(()=>fs.collection('listini').doc(fid).set(obj,{mergeFields:paths})))}
  }
  const lPut=(pid,d)=>{L.buf.set(pid,d);if(!L.t)L.t=setTimeout(lFlush,30);return Promise.resolve()};
  const pDoc=pid=>({id:pid,
    set:d=>lPut(pid,clone(d)),
    update:async d=>{const cur=pCur(pid);if(!cur)throw{code:'not_found'};return lPut(pid,Object.assign(clone(cur),clone(d)))},
    delete:()=>pCur(pid)?lPut(pid,null):Promise.resolve()});
  // ---- documenti normali ----
  const doc=(c,id)=>c==='prodotti'?pDoc(id):({id,
    set:d=>run(()=>fs.collection(c).doc(id).set(clone(d))),
    update:d=>run(()=>fs.collection(c).doc(id).update(clone(d))),
    delete:()=>run(()=>fs.collection(c).doc(id).delete())});
  const wrap=s=>({docs:s.docs.map(d=>({id:d.id,data:()=>d.data()})),docChanges:()=>s.docChanges().map(ch=>({type:ch.type,doc:{id:ch.doc.id,data:()=>ch.doc.data()}}))});
  const query=(c,ord,lim)=>({
    orderBy:(f,dir)=>query(c,[f,dir],lim),limit:n=>query(c,ord,n),
    onSnapshot(next){let un=null,stop=false;
      readyP.then(()=>{if(stop)return;
        const onErr=e=>{st.err=mapErr(e).code;ping()};
        if(c==='prodotti'){let prev=null;
          un=fs.collection('listini').onSnapshot(s=>{const m={},fo={};for(const d of s.docs){const p=(d.data()||{}).p||{};for(const pid in p){m[pid]=p[pid];fo[pid]=d.id}}
            L.data=m;L.fidOf=fo;cache.prodotti=m;
            const docs=Object.keys(m).map(id=>({id,data:()=>m[id]}));const changes=docs.filter(d=>!prev||!prev.has(d.id)).map(d=>({type:'added',doc:d}));prev=new Set(Object.keys(m));
            next({docs,docChanges:()=>changes})},onErr);return}
        let q=fs.collection(c);if(ord)q=q.orderBy(ord[0],ord[1]||'asc');if(lim)q=q.limit(lim);
        un=q.onSnapshot(s=>{const m={};s.docs.forEach(d=>{m[d.id]=d.data()});cache[c]=m;next(wrap(s))},onErr)});
      return()=>{stop=true;if(un)un()}}});
  // ---- ripristino o primo caricamento: sostituisce tutto ----
  async function loadAll(d){
    const ops=[];
    for(const c of FB_COLS){const s=await fs.collection(c).get();const nw=d[c]||{};
      s.docs.forEach(x=>{if(!nw[x.id])ops.push(b=>b.delete(x.ref))});
      for(const id in nw){const v=clone(nw[id]);delete v.id;ops.push(b=>b.set(fs.collection(c).doc(id),v))}}
    const ls0=await fs.collection('listini').get();ls0.docs.forEach(x=>ops.push(b=>b.delete(x.ref)));
    const byF={};for(const [pid,p] of Object.entries(d.prodotti||{})){const v=clone(p);delete v.id;const f=String(v.fornitoreId||'_');(byF[f]=byF[f]||{})[pid]=v}
    for(const f in byF)ops.push(b=>b.set(fs.collection('listini').doc(f),{p:byF[f]}));
    for(let i=0;i<ops.length;i+=400){const b=fs.batch();ops.slice(i,i+400).forEach(o=>o(b));await b.commit()}
  }
  return{kind:'firebase',collection:c=>Object.assign(query(c),{doc:id=>doc(c,id||uid())}),
    status:()=>({ready:st.ready,err:st.err,pend:st.pend+(L.buf.size?1:0),net:st.net,busy:st.busy}),
    dump:()=>clone(cache),
    load:async d=>{if(!navigator.onLine)throw{code:'fb_net'};await readyP;await loadAll(d)},
    empty:()=>false};
}

const ref=(c,id)=>S.db.collection(c).doc(id);
const put=(c,id,d)=>ref(c,id).set(d);
const upd=(c,id,d)=>ref(c,id).update(d);
const del=(c,id)=>ref(c,id).delete();
function errMsg(e){const c=e&&e.code;return({
  quota_exceeded:'Memoria del dispositivo piena. Esporta un backup dalle Impostazioni e pulisci notifiche o foto delle bolle vecchie.',
  not_found:'Questo elemento non esiste più. Ricarica la pagina.',
  fb_perm:'Questo telefono non ha più accesso al database del ristorante. Chiedi allo chef un nuovo QR code o link.',
  fb_net:'Serve la connessione a internet. Riprova quando c\'è rete.',
  fb:'Il database non ha accettato la modifica. Riprova.',
  lib:'Non riesco a caricare il componente per i file. Controlla la connessione e riprova.',
  xml:'Il file XML non sembra una fattura elettronica valida.',
  p7m:'Il file .p7m è firmato digitalmente: scarica la versione .xml dal cassetto fiscale o dal gestionale.'
}[c])||('Operazione non riuscita'+(c?' ('+c+')':'')+'. Riprova.')}
function subscribe(name){
  let q=S.db.collection(name);if(COLS[name])q=COLS[name](q);
  q.onSnapshot(snap=>{
    const first=!S.loaded[name];const m={};
    snap.docs.forEach(d=>{m[d.id]=Object.assign({id:d.id},d.data())});
    if(name==='notifiche'&&!first)onNewNotifs(snap);
    S.data[name]=m;S.loaded[name]=true;
    if(name==='prodotti')rebuildIndex();
    schedule();
  });
}
function onNewNotifs(snap){
  const me=meU();if(!me)return;
  for(const ch of snap.docChanges()){
    if(ch.type!=='added')continue;const n=ch.doc.data();
    if(!n||n.da===me.id||now()-(n.creato||0)>120000)continue;
    if(n.a===me.id||(isGM(me)&&n.a==='gm')||(isMgr(me)&&n.a==='gestori')){toast(n.titolo+(n.testo?': '+n.testo:''));try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}}
  }
}
async function notify(a,titolo,testo,tipo,rif){const me=meU();await put('notifiche',uid(),{a,titolo,testo:testo||'',tipo:tipo||'',rif:rif||'',letta:false,creato:now(),da:me?me.id:''})}
function saveBlob(name,blob){const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}

let rq=false,lastHtml='';
function schedule(){if(rq)return;rq=true;requestAnimationFrame(()=>{rq=false;render()})}
function paint(el,html){
  const a=document.activeElement;const id=(a&&a.id&&el.contains(a))?a.id:null;let s1=null,s2=null;
  if(id){try{s1=a.selectionStart;s2=a.selectionEnd}catch(e){}}
  const st=el.scrollTop;el.innerHTML=html;el.scrollTop=st;
  if(id){const n=document.getElementById(id);if(n){n.focus({preventScroll:true});try{if(s1!=null)n.setSelectionRange(s1,s2)}catch(e){}}}
}
function render(){
  const html=view();
  document.documentElement.classList.toggle('on-wall',S.wallMode);
  document.documentElement.classList.toggle('staff-ui',!S.wallMode&&!isMgr(meU()));
  if(html!==lastHtml){paint($('#app'),html);lastHtml=html}
  for(const o of sheets)if(o.live&&o.live())paintSheet(o);
}
function repaint(){render();refreshSheet()}
function allLoaded(){return(S.loadTimeout&&S.db.kind!=='firebase')||Object.keys(COLS).every(k=>S.loaded[k])}
function view(){
  S.wallMode=true;
  if(S.fbLibErr)return wallMsg('Serve la connessione','Per aprire l\'app la prima volta serve internet. Controlla la rete e riprova.',`<button type="button" class="btn primary block" data-a="reload">Riprova</button>`);
  if(S.db&&S.db.kind==='firebase'){const s=S.db.status();if(!s.ready)return wallFb(s)}
  if(S.db&&S.db.kind==='locale'&&fbCfg()&&ls('jona_key')==null&&!Object.keys(D().staff||{}).length&&S.loaded.staff){if(S.fbActive===undefined)return`<div class="wall linen"><div class="logo-full" role="img" aria-label="Jona Ristorante"></div><p class="wall-sub">Un momento…</p></div>`;if(S.fbActive!==false)return screenJoin()}
  if(!S.db||!allLoaded())return`<div class="wall linen"><div class="logo-full" role="img" aria-label="Jona Ristorante"></div><p class="wall-sub">Un momento…</p></div>`;
  if(!Object.keys(D().staff).length)return screenSetup();

  S.wallMode=false;
  return shell(me);
}

function cartQty(pid){const c=S.cart.find(c=>c.pid===pid);return c?c.qta:0}

function setCart(pid,q,extra){q=Math.max(0,r3(q));const i=S.cart.findIndex(c=>c.pid===pid);if(q<=0){if(i>=0)S.cart.splice(i,1)}else if(i>=0)S.cart[i].qta=q;else S.cart.push(Object.assign({pid,qta:q},extra||{}));saveCart();render()}
function vCatalogo(me){

function catSearch(cats){
  return`<div class="search">${ic('search')}<input id="q" type="search" placeholder="${isMgr(meU())?'Prodotto, codice o fornitore':'Cerca un prodotto, es. zucchero'}" value="${esc(S.q)}" data-in="q" autocomplete="off" enterkeyhint="search"><button type="button" class="icon-btn" data-a="qclear" aria-label="Svuota ricerca">${ic('x')}</button></div>
  ${cats.length?`<div class="chips" role="group" aria-label="Categorie"><button type="button" class="chip" aria-pressed="${!S.cat}" data-a="cat" data-v="">Tutte</button>${cats.map(c=>`<button type="button" class="chip" aria-pressed="${S.cat===c}" data-a="cat" data-v="${esc(c)}">${esc(c)}</button>`).join('')}</div>`:''}`;

// Quante volte l'utente ha chiesto ogni prodotto (una volta per richiesta) e quando l'ultima volta.
function usualOf(me){const m=new Map();for(const r of Object.values(D().richieste)){if(r.utenteId!==me.id)continue;const seen=new Set();for(const it of r.items||[]){if(!it.pid||seen.has(it.pid))continue;seen.add(it.pid);const x=m.get(it.pid)||{n:0,t:0};x.n++;x.t=Math.max(x.t,r.creato||0);m.set(it.pid,x)}}return m}
function catResults(){
  const me=meU();const sp=showPrices();const q=norm(S.q);const toks=q?q.split(' '):[];
  const U=usualOf(me);let list=prods();let title='',keep=false;
  if(toks.length)list=list.filter(p=>{const h=norm(p.nome+' '+(p.codice||'')+' '+forn(p.fornitoreId).nome+' '+(p.categoria||''));return toks.every(t=>h.includes(t))});
  if(S.cat)list=list.filter(p=>(p.categoria||'Altro')===S.cat);
  const hit=new Set(list.map(p=>p.id));
  if(!toks.length&&!S.cat){
    const rec=[...U.entries()].filter(([pid])=>D().prodotti[pid]).sort((a,b)=>b[1].n-a[1].n||b[1].t-a[1].t).slice(0,12).map(([pid])=>D().prodotti[pid]);
    if(rec.length){list=rec;title='I tuoi soliti';keep=true}else{list=list.slice().sort(byNome).slice(0,40);title='Tutti i prodotti'}
  }
  const groups=new Map();
  for(const p of list){const k=gkey(p.nome);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(p)}
  if(toks.length||S.cat){for(const [k,arr] of groups){for(const p of S.gidx.get(k)||[])if(!arr.includes(p))arr.push(p)}}
  let arr=[...groups.values()];if(!keep)arr.sort((a,b)=>byNome(a[0],b[0]));arr=arr.slice(0,80);
  let html='';
  if(title)html+=`<h2 class="sec">${title}</h2>`;
  if(arr.length)html+=`<div class="panel">${arr.map(g=>isMgr(me)?groupHTML(g,sp):staffGroup(g,U,hit)).join('')}${toks.length?freeRow():''}</div>`;
  else if(toks.length)html+=`<div class="panel">${freeRow(true)}</div>`;
  return html;
}
// Staff: l'opzione che aggiunge il "+": quella già nel carrello, altrimenti (tra quelle che corrispondono alla ricerca)
// la più economica se ci sono i prezzi, poi quella che l'utente ha chiesto più spesso, poi la prima.
function defOpt(items,U,hit){
  const c=items.find(p=>cartQty(p.id));if(c)return c;
  const pool=items.some(p=>hit&&hit.has(p.id))?items.filter(p=>hit.has(p.id)):items;
  const pr=pool.filter(p=>p.prezzo!=null).sort((a,b)=>a.prezzo-b.prezzo);if(pr.length)return pr[0];
  let b=null;for(const p of pool){const x=U.get(p.id);if(x&&(!b||x.n>U.get(b.id).n))b=p}
  return b||pool[0];
}
// Staff: una riga per prodotto, senza scelta del fornitore (lo chef può cambiarlo quando approva).
function staffGroup(items,U,hit){
  const p=defOpt(items,U,hit);const q=cartQty(p.id);
  const title=items.map(x=>x.nome).sort((a,b)=>a.length-b.length)[0];
  return`<div class="pg one"><div class="opt"><div class="opt-i"><div class="pg-t">${esc(title)}</div>${p.nome!==title?`<div class="opt-n">${esc(p.nome)}</div>`:''}<div class="pg-c">${esc(p.categoria||'Altro')}${p.unita?' · '+esc(p.unita):''}</div></div>
  ${q?stepper('c',p.id,q,`data-p="${p.id}"`):`<button type="button" class="add" data-a="cadd" data-p="${p.id}" aria-label="Aggiungi ${esc(title)}">${ic('plus')}</button>`}</div></div>`;
}
function groupHTML(items,sp){
  items=items.slice().sort((a,b)=>(a.prezzo??1e9)-(b.prezzo??1e9));
  const multi=new Set(items.map(p=>p.fornitoreId)).size>1;
  const title=multi?items.map(p=>p.nome).sort((a,b)=>a.length-b.length)[0]:items[0].nome;
  const best=multi&&sp&&items[0].prezzo!=null?items[0].id:null;
  return`<div class="pg"><div class="pg-t">${esc(title)}</div><div class="pg-c">${esc(items[0].categoria||'Altro')}${multi?`, da ${new Set(items.map(p=>p.fornitoreId)).size} fornitori`:''}</div>
  ${items.map(p=>{const q=cartQty(p.id);return`<div class="opt"><div class="opt-i"><span class="sup" style="--c:${fcolor(p.fornitoreId)}"><i></i>${esc(forn(p.fornitoreId).nome)}</span>${p.id===best?' <span class="tag best">più conveniente</span>':''}${p.demo?' <span class="tag">demo</span>':''}
  ${multi&&p.nome!==title?`<div class="opt-n">${esc(p.nome)}</div>`:''}
  <div class="opt-m">${p.codice?`<span>cod. ${esc(p.codice)}</span>`:''}${sp&&p.prezzo!=null?`<span><b>${eur(p.prezzo)}</b>${p.unita?' / '+esc(p.unita):''}</span>`:(p.unita?`<span>${esc(p.unita)}</span>`:'')}</div></div>
  ${q?stepper('c',p.id,q,`data-p="${p.id}"`):`<button type="button" class="add" data-a="cadd" data-p="${p.id}" aria-label="Aggiungi ${esc(p.nome)}">${ic('plus')}</button>`}</div>`}).join('')}</div>`;
}
function freeRow(alone){return`<div class="free" ${alone?'style="border-top:0"':''}>${ic('paste')}<div>${alone?'Nessun prodotto trovato.':'Non è quello giusto?'} Puoi chiedere «${esc(S.q.trim())}» allo chef, sceglierà lui il fornitore.</div><button type="button" class="btn ghost sm" data-a="cfree">Chiedi</button></div>`}

/* ================= staff: carrello ================= */
function cartLines(){return S.cart.map(c=>c.libero?Object.assign({},c,{fid:''}):Object.assign({},c,{p:D().prodotti[c.pid],fid:(D().prodotti[c.pid]||{}).fornitoreId})).filter(x=>x.libero||x.p)}

  <div class="panel">${staff?`<div class="fsec">${lines.map(lineH).join('')}</div>`:[...g.entries()].map(([fid,ls])=>`<div class="fsec"><div class="fsec-h"><span class="sup" style="--c:${fcolor(fid)}"><i></i>${fid?esc(forn(fid).nome):'Fuori listino, lo assegna lo chef'}</span><span class="muted small">${ls.length}</span></div>
  ${ls.map(lineH).join('')}</div>`).join('')}
  ${sp&&tot?`<div class="total"><span>Totale stimato</span><b>${eur(tot)}</b></div>`:''}</div>
  <label class="lbl" for="cart-note">Nota per lo chef</label><textarea id="cart-note" class="inp" rows="2" placeholder="Es. serve per il servizio di stasera" data-in="cnote">${esc(S.cnote)}</textarea>
  <div class="cart-foot" style="margin-top:16px"><button type="button" class="btn primary block big" data-a="csend">${ic('send')} Invia allo chef</button></div>`;
}
async function sendCart(){
  const me=meU();const lines=cartLines();if(!lines.length)return;
  const items=lines.map(l=>l.libero?{libero:true,nome:l.nome,qta:l.qta,unita:l.unita||'pz',fornitoreId:'',fornitoreNome:'',codice:'',prezzo:null}
    :{pid:l.p.id,nome:l.p.nome,codice:l.p.codice||'',unita:l.p.unita||'',prezzo:l.p.prezzo??null,fornitoreId:l.p.fornitoreId,fornitoreNome:forn(l.p.fornitoreId).nome,qta:l.qta});
  const dup=findDoppi(items,me);
  if(dup.length){
    const L=dup.slice(0,5).map(d=>`${d.nome}: chiesto da ${d.self?'te':firstName(d.da)} ${quandoAlle(d.quando)} (${d.st})`);if(dup.length>5)L.push('…e altri '+(dup.length-5));
    if(!await ask('Attenzione: già richiesto',L.join('\n')+'\n\nÈ corretto inviarlo di nuovo?','Sì, invia lo stesso'))return;
  }
  const id=uid();const nf=new Set(items.map(i=>i.fornitoreId).filter(Boolean)).size;
  const doc={utenteId:me.id,utenteNome:fullName(me),reparto:me.reparto||'altro',mansione:me.mansione||'',items,nota:S.cnote.trim(),stato:'inviata',creato:now()};
  if(dup.length)doc.doppi=dup.map(d=>({nome:d.nome,da:d.da,quando:d.quando}));
  await put('richieste',id,doc);
  await notify('gm','Nuova richiesta da '+me.nome,`${REPARTI[me.reparto]||''}, ${items.length} ${items.length===1?'articolo':'articoli'}${nf?' da '+nf+(nf===1?' fornitore':' fornitori'):''}${dup.length?' (possibile doppione)':''}`,'richiesta',id);
  S.cart=[];saveCart();S.cnote='';S.tab='miei';render();window.scrollTo(0,0);
  openSheet({render:()=>`<div class="grab"></div><div class="done">${ic('check','big')}<h2>Inviato allo chef</h2><p class="muted">Riceverai una notifica quando approva o rifiuta la richiesta.</p><div class="btns col"><button type="button" class="btn primary block" data-a="logout">${ic('logout')} Esci dal profilo</button><button type="button" class="btn ghost block" data-a="closeSheet">Continua</button></div></div>`});
}

// Richieste delle ultime 24 ore (non rifiutate, di chiunque) con lo stesso prodotto: stesso pid o un'alternativa
// dello stesso gruppo (lo chef può aver cambiato fornitore), oppure stesso nome per i prodotti scritti a mano.
function findDoppi(items,me){
  const since=now()-864e5,out=[],seen=new Set();
  const rs=Object.values(D().richieste).filter(r=>(r.creato||0)>=since&&r.stato!=='rifiutata').sort((a,b)=>b.creato-a.creato);
  for(const x of items){
    const p=x.pid&&D().prodotti[x.pid];const ids=new Set(p?(S.gidx.get(gkey(p.nome))||[]).map(q=>q.id):[]);if(x.pid)ids.add(x.pid);const nn=norm(x.nome);
    for(const r of rs){if(seen.has(nn+'|'+r.id))continue;
      if((r.items||[]).some(it=>(it.pid&&ids.has(it.pid))||norm(it.nome)===nn)){seen.add(nn+'|'+r.id);out.push({nome:x.nome,da:r.utenteNome||'',self:r.utenteId===me.id,quando:r.creato,st:reqStatus(r)[1].toLowerCase()})}}
  }
  return out;
}
function quandoAlle(t){const d=new Date(t),td=new Date(),y=new Date(td);y.setDate(td.getDate()-1);const hm=d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});return(d.toDateString()===td.toDateString()?'oggi':d.toDateString()===y.toDateString()?'ieri':d.toLocaleDateString('it-IT',{day:'numeric',month:'short'}))+' alle '+hm}

/* ================= requests readonly ================= */
function reqStatus(r){
  if(r.stato==='inviata')return['wait','In attesa'];
  if(r.stato==='rifiutata')return['ko','Rifiutata'];
  const fs=[...new Set((r.items||[]).map(i=>i.fornitoreId).filter(Boolean))];const done=fs.filter(f=>r.ordinati&&r.ordinati[f]).length;
  const arr=fs.filter(f=>r.arrivati&&r.arrivati[f]).length;
  if(fs.length&&arr===fs.length)return['ok','Arrivata'];
  if(fs.length&&done===fs.length)return['sent','Ordinata'];
  if(done)return['sent','Ordinata in parte'];
  return['ok',r.modificata?'Approvata con modifiche':'Approvata'];
}
function groupByF(items){const g=new Map();for(const it of items){const k=it.fornitoreId||'';if(!g.has(k))g.set(k,[]);g.get(k).push(it)}return[...g.entries()]}
function itemsRO(r){
  return groupByF(r.items||[]).map(([fid,its])=>`<div class="fsec"><div class="fsec-h"><span class="sup" style="--c:${fcolor(fid)}"><i></i>${fid?esc(forn(fid).nome||its[0].fornitoreNome):'Da assegnare'}</span>${r.ordinati&&r.ordinati[fid]?`<span class="muted small">ordinato ${ago(r.ordinati[fid])}</span>`:''}</div>
  ${its.map(it=>`<div class="line"><div class="ln-i"><div class="ln-n">${esc(it.nome)}</div><div class="ln-m">${it.codice?'cod. '+esc(it.codice)+' ':''}${it.qtaOrig!=null&&it.qtaOrig!==it.qta?`<span class="was">chiesti ${fq(it.qtaOrig)}, lo chef ha messo ${fq(it.qta)}</span>`:''}</div></div><b>${fq(it.qta)}</b><span class="ln-u">${esc(it.unita||'')}</span></div>`).join('')}</div>`).join('')
  +((r.rimossi&&r.rimossi.length)?`<p class="removed">Tolti dallo chef: ${esc(r.rimossi.map(x=>x.nome).join(', '))}</p>`:'');
}
function reqSummary(r,who){
  const [k,l]=reqStatus(r);const u=D().staff[r.utenteId]||{id:r.utenteId,nome:r.utenteNome};const n=(r.items||[]).length;
  return`<details class="rs"><summary><div class="rs-i">${who?avatar(u,38):''}<div><div class="rs-t">${who?esc(r.utenteNome)+', ':''}${n} ${n===1?'articolo':'articoli'}</div><div class="rs-m">${ago(r.creato)}${who?', '+esc(REPARTI[r.reparto]||''):''}</div></div></div>${pill(k,l)}</summary>
  <div class="rs-b">${r.notaGM?`<p class="gm-note"><b>Chef:</b> ${esc(r.notaGM)}</p>`:''}${r.nota?`<p class="muted small" style="margin:0 0 6px">Nota: ${esc(r.nota)}</p>`:''}${itemsRO(r)}</div></details>`;
}
function vMiei(me){
  const rs=Object.values(D().richieste).filter(r=>r.utenteId===me.id).sort((a,b)=>b.creato-a.creato);
  if(!rs.length)return`<h1 class="vt">I miei ordini</h1>`+empty('clock','Nessuna richiesta ancora','Le richieste che invii allo chef compaiono qui, con lo stato aggiornato.');
  const open=rs.filter(r=>r.stato==='inviata').length;
  return`<h1 class="vt">I miei ordini</h1><p class="vsub">${open?open+' in attesa dello chef':'Tutte le richieste sono state gestite'}</p><div class="panel">${rs.slice(0,60).map(r=>reqSummary(r,false)).join('')}</div>`;
}
</script>
<script>
/* ================= sheets & toasts ================= */
const sheets=[];
function openSheet(o){
  const el=document.createElement('div');el.className='sheet-wrap';
  el.innerHTML=`<div class="scrim" data-a="closeSheet"></div><div class="sheet ${o.cls||''}" role="dialog" aria-modal="true"></div>`;
  $('#sheets').appendChild(el);o.el=el;sheets.push(o);paintSheet(o);
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('open')));
  document.body.classList.add('noscroll');
  setTimeout(()=>{const f=o.el.querySelector('[autofocus]');if(f)f.focus()},280);
  return o;
}
function paintSheet(o){const h=o.render();if(h!==o.last){paint(o.el.querySelector('.sheet'),h);o.last=h}}
function refreshSheet(){const o=sheets[sheets.length-1];if(o)paintSheet(o)}
function closeSheet(instant){const o=sheets.pop();if(!o)return;if(o.onClose)o.onClose();o.el.classList.remove('open');if(instant)o.el.remove();else setTimeout(()=>o.el.remove(),260);if(!sheets.length)document.body.classList.remove('noscroll')}
function toast(msg,kind){const t=document.createElement('div');t.className='toast '+(kind||'');t.textContent=msg;$('#toasts').appendChild(t);requestAnimationFrame(()=>requestAnimationFrame(()=>t.classList.add('in')));setTimeout(()=>{t.classList.remove('in');setTimeout(()=>t.remove(),300)},kind==='err'?5200:3400)}
function ask(title,text,ok,danger,input){
  return new Promise(res=>{let done=false;S.askVal=input&&input.value||'';
    openSheet({onClose:()=>{if(!done)res(false)},render:()=>`<div class="grab"></div><div class="sh-h"><div class="sh-t">${esc(title)}</div></div>${text?`<p class="muted" style="margin-top:0;white-space:pre-line">${esc(text)}</p>`:''}
    ${input?`<label class="lbl" for="ask-in">${esc(input.label)}</label><input class="inp" id="ask-in" value="${esc(S.askVal)}" data-in="askv" placeholder="${esc(input.ph||'')}">`:''}
    <div class="btns" style="margin-top:20px"><button type="button" class="btn ghost" data-a="closeSheet">Annulla</button><button type="button" class="btn ${danger?'dark':'primary'}" id="ask-ok">${esc(ok)}</button></div>`});
    $('#ask-ok').onclick=()=>{done=true;const v=S.askVal;closeSheet();res(input?{v}:true)};
  });
}

/* ================= GM: richieste ================= */
function itemsOf(r){return S.drafts[r.id]||r.items||[]}
function draft(rid){if(!S.drafts[rid]){const r=D().richieste[rid];S.drafts[rid]=clone(r.items||[]).map(it=>Object.assign(it,{qtaOrig:it.qtaOrig??it.qta}));S.removed[rid]=[]}return S.drafts[rid]}
function altsOf(it){const p=D().prodotti[it.pid];const arr=S.gidx.get(gkey(p?p.nome:it.nome))||[];return arr.some(x=>x.id===it.pid)?arr:[]}
function vRichieste(){
  const pend=Object.values(D().richieste).filter(r=>r.stato==='inviata').sort((a,b)=>a.creato-b.creato);
  const seg=`<div class="seg" role="group" aria-label="Raggruppa">${[['utente','Per persona'],['fornitore','Per fornitore'],['reparto','Per reparto']].map(([k,l])=>`<button type="button" aria-pressed="${S.grp===k}" data-a="grp" data-v="${k}">${l}</button>`).join('')}</div>`;
  let body;
  if(!pend.length)body=empty('inbox','Nessuna richiesta in attesa','Quando qualcuno dello staff invia una richiesta ricevi una notifica e la trovi qui.');
  else if(S.grp==='fornitore')body=bySupplier(pend);
  else if(S.grp==='reparto')body=Object.entries(REPARTI).map(([k,l])=>{const rs=pend.filter(r=>(r.reparto||'altro')===k);return rs.length?`<h2 class="sec">${l}<span>${rs.length}</span></h2>${rs.map(reqCard).join('')}`:''}).join('');
  else body=`<div style="height:12px"></div>`+pend.map(reqCard).join('');
  const t0=new Date();t0.setHours(0,0,0,0);
  const dec=Object.values(D().richieste).filter(r=>r.stato!=='inviata'&&(r.deciso||0)>=t0.getTime()).sort((a,b)=>b.deciso-a.deciso);
  return`<h1 class="vt">Richieste</h1><p class="vsub">${pend.length?`${pend.length} da approvare`:'Tutto in ordine'}</p>${pend.length?seg:''}${body}
  ${dec.length?`<h2 class="sec">Gestite oggi<span>${dec.length}</span></h2><div class="panel">${dec.map(r=>reqSummary(r,true)).join('')}</div>`:''}`;
}
function bySupplier(pend){
  const m=new Map();
  for(const r of pend)for(const it of itemsOf(r)){const fid=it.fornitoreId||'';if(!m.has(fid))m.set(fid,new Map());const L=m.get(fid);const k=it.pid||('l:'+norm(it.nome));
    if(!L.has(k))L.set(k,{nome:it.nome,codice:it.codice,unita:it.unita,qta:0,da:[]});const x=L.get(k);x.qta=r3(x.qta+Number(it.qta));x.da.push(firstName(r.utenteNome)+' '+fq(it.qta))}
  return`<div style="height:12px"></div>`+[...m.entries()].map(([fid,L])=>`<section class="panel"><div class="fsum-h"><span class="sup big" style="--c:${fcolor(fid)}"><i></i>${fid?esc(forn(fid).nome):'Da assegnare'}</span><span class="muted small">${L.size} ${L.size===1?'prodotto':'prodotti'}</span></div>
  ${[...L.values()].map(x=>`<div class="sline"><div><div class="ln-n">${esc(x.nome)}</div><div class="ln-m">${x.codice?'cod. '+esc(x.codice)+', ':''}${esc(x.da.join(', '))}</div></div><span class="sl-q">${fq(x.qta)} ${esc(x.unita||'')}</span></div>`).join('')}</section>`).join('')
  +`<p class="hint">Per approvare o modificare passa alla vista Per persona.</p>`;
}
function reqCard(r){
  const items=itemsOf(r).map((it,idx)=>Object.assign({},it,{idx}));const u=D().staff[r.utenteId]||{id:r.utenteId,nome:r.utenteNome};const dirty=!!S.drafts[r.id];
  let tot=0;for(const it of items)if(it.prezzo!=null)tot+=it.prezzo*it.qta;
  return`<article class="panel">
  <header class="req-h">${avatar(u,46)}<div class="req-who"><div class="req-n">${esc(r.utenteNome)}</div><div class="req-m">${esc([r.mansione,REPARTI[r.reparto]].filter(Boolean).join(', '))}</div></div><time class="req-t">${ago(r.creato)}</time></header>
  ${r.nota?`<p class="req-note">${esc(r.nota)}</p>`:''}
  ${r.doppi&&r.doppi.length?`<div class="banner dup" role="note">${ic('warn')}<div><b>Possibile doppione.</b> Già chiesto nelle ultime 24 ore:<ul>${r.doppi.slice(0,5).map(d=>`<li>${esc(d.nome)}: chiesto da ${esc(d.da||'?')} ${esc(quandoAlle(d.quando))}</li>`).join('')}</ul>Decidi tu se ordinarlo di nuovo.</div></div>`:''}
  ${groupByF(items).map(([fid,its])=>{const f=forn(fid);const m=fid&&METODI[f.metodo];return`<div class="fsec"><div class="fsec-h"><span class="sup" style="--c:${fcolor(fid)}"><i></i>${fid?esc(f.nome):'Fuori listino, scegli il fornitore'}</span>${m?`<span class="muted small">${ic(m.i)} ${m.l}</span>`:''}</div>${its.map(it=>gmLine(r.id,it)).join('')}</div>`}).join('')}
  ${items.length?'':'<p class="muted" style="padding:0 16px">Hai tolto tutti gli articoli: puoi rifiutare la richiesta.</p>'}
  ${tot?`<div class="total"><span>Totale stimato</span><b>${eur(tot)}</b></div>`:''}
  <div class="req-f"><input class="inp" id="gmn-${r.id}" placeholder="Nota per ${esc(firstName(r.utenteNome))} (facoltativa)" value="${esc(S.gmn[r.id]||'')}" data-in="gmn" data-r="${r.id}">
  <div class="req-btns">${dirty?`<button type="button" class="btn ghost" data-a="rreset" data-r="${r.id}">Annulla modifiche</button>`:''}<button type="button" class="btn ghost danger" data-a="reject" data-r="${r.id}">${ic('x')} Rifiuta</button><button type="button" class="btn primary" data-a="approve" data-r="${r.id}">${ic('check')} Approva</button></div></div></article>`;
}
function gmLine(rid,it){
  let sw='';
  if(it.libero)sw=`<select class="inp sm" id="rsup-${rid}-${it.idx}" data-ch="rsup" data-r="${rid}" data-i="${it.idx}" aria-label="Fornitore"><option value="">Scegli il fornitore…</option>${Object.values(D().fornitori).sort(byNome).map(f=>`<option value="${f.id}" ${it.fornitoreId===f.id?'selected':''}>${esc(f.nome)}</option>`).join('')}</select>`;
  else{const alts=altsOf(it);if(alts.length>1)sw=`<select class="inp sm" id="rsw-${rid}-${it.idx}" data-ch="rswap" data-r="${rid}" data-i="${it.idx}" aria-label="Cambia fornitore">${alts.map(p=>`<option value="${p.id}" ${p.id===it.pid?'selected':''}>${esc(forn(p.fornitoreId).nome)}${p.prezzo!=null?', '+eur(p.prezzo)+(p.unita?' / '+p.unita:''):''}</option>`).join('')}</select>`}
  const ch=it.qtaOrig!=null&&it.qtaOrig!==it.qta;
  return`<div class="line wrap"><div class="ln-i"><div class="ln-n">${esc(it.nome)}${it.libero?' <span class="tag">fuori listino</span>':''}</div><div class="ln-m">${it.codice?'cod. '+esc(it.codice):''}${it.prezzo!=null?' '+eur(it.prezzo)+(it.unita?' / '+esc(it.unita):''):''}${ch?` <span class="was">chiesti ${fq(it.qtaOrig)}</span>`:''}</div></div>
  ${stepper('rq',rid+'-'+it.idx,it.qta,`data-r="${rid}" data-i="${it.idx}"`)}<span class="ln-u">${esc(it.unita||'')}</span><button type="button" class="icon-btn" data-a="rrm" data-r="${rid}" data-i="${it.idx}" aria-label="Togli ${esc(it.nome)}">${ic('x')}</button>${sw?`<div class="ln-x">${sw}</div>`:''}</div>`;
}
async function approve(rid){
  const r=D().richieste[rid];if(!r||r.stato!=='inviata')return;const me=meU();
  let items=clone(itemsOf(r)).filter(i=>Number(i.qta)>0);
  if(!items.length)return toast('La richiesta è vuota: rifiutala.','warn');
  const miss=items.find(i=>!i.fornitoreId);if(miss)return toast('Scegli il fornitore per «'+miss.nome+'».','warn');
  const removed=(S.removed[rid]||[]).concat(itemsOf(r).filter(i=>!(Number(i.qta)>0)).map(i=>({nome:i.nome,qta:i.qtaOrig??i.qta})));
  let modified=removed.length>0;
  items=items.map(i=>{if(i.qtaOrig!=null&&i.qtaOrig!==i.qta)modified=true;else delete i.qtaOrig;if(i.cambiato)modified=true;return i});
  const notaGM=(S.gmn[rid]||'').trim();
  await upd('richieste',rid,{stato:'approvata',items,rimossi:removed,modificata:modified,notaGM,deciso:now(),decisoDa:me.id});
  for(const [fid,its] of groupByF(items)){
    const oid='aperto_'+fid;const cur=D().ordini[oid];
    const o=cur?clone(cur):{fornitoreId:fid,fornitoreNome:forn(fid).nome,stato:'aperto',items:[],richieste:[],creato:now()};
    for(const it of its){const key=it.pid||('l:'+norm(it.nome));let L=o.items.find(x=>x.key===key);
      if(!L){L={key,pid:it.pid||'',nome:it.nome,codice:it.codice||'',unita:it.unita||'',prezzo:it.prezzo??null,qta:0,da:[]};o.items.push(L)}
      L.qta=r3(L.qta+Number(it.qta));L.da.push({n:r.utenteNome,r:r.reparto,q:Number(it.qta)})}
    if(!o.richieste.includes(rid))o.richieste.push(rid);o.aggiornato=now();delete o.id;
    await put('ordini',oid,o);
  }
  await notify(r.utenteId,modified?'Richiesta approvata con modifiche':'Richiesta approvata',notaGM||(items.length+' '+(items.length===1?'articolo verrà ordinato':'articoli verranno ordinati')),'approvata',rid);
  delete S.drafts[rid];delete S.removed[rid];delete S.gmn[rid];toast('Approvata. Gli articoli sono in Invii.');
}
async function reject(rid){
  const r=D().richieste[rid];if(!r)return;
  const a=await ask('Rifiutare la richiesta di '+firstName(r.utenteNome)+'?','Riceverà una notifica con il motivo.','Rifiuta',true,{label:'Motivo (facoltativo)',value:S.gmn[rid]||'',ph:'Es. abbiamo ancora scorte'});
  if(!a)return;
  await upd('richieste',rid,{stato:'rifiutata',notaGM:a.v.trim(),deciso:now(),decisoDa:S.me});
  await notify(r.utenteId,'Richiesta rifiutata',a.v.trim()||'Parlane con lo chef','rifiutata',rid);
  delete S.drafts[rid];delete S.gmn[rid];toast('Richiesta rifiutata');
}

/* ================= GM: invii ai fornitori ================= */
function waNum(s){let d=String(s||'').replace(/\D/g,'');if(d.startsWith('00'))d=d.slice(2);if(d.length===10&&d.startsWith('3'))d='39'+d;return d}
function metaOf(o){if(!S.ometa[o.id])S.ometa[o.id]={consegna:o.consegna||'',fascia:o.fascia||'mattina',note:o.noteFornitore||''};return S.ometa[o.id]}
function orderText(o){
  const f=forn(o.fornitoreId),m=metaOf(o),me=meU()||{};
  const lines=o.items.map(l=>`- ${fq(l.qta)} ${l.unita||''} ${l.nome}${l.codice?' (cod. '+l.codice+')':''}`.replace(/\s+/g,' '));
  return`Buongiorno${f.referente?' '+f.referente:''},\nvi inviamo l'ordine di ${cfg().nomeLocale}:\n\n${lines.join('\n')}\n${m.consegna?'\nConsegna richiesta: '+fdate(new Date(m.consegna+'T12:00').getTime())+(m.fascia?', '+m.fascia:''):''}${cfg().luogoConsegna?'\nLuogo di consegna: '+cfg().luogoConsegna:''}${m.note?'\n'+m.note:''}\n\nGrazie,\n${fullName(me)}`;
}
const mailHref=o=>{const f=forn(o.fornitoreId);return`mailto:${encodeURIComponent(f.email||'')}?subject=${encodeURIComponent('Ordine '+cfg().nomeLocale+' del '+new Date().toLocaleDateString('it-IT'))}&body=${encodeURIComponent(orderText(o))}`};
function vInvii(){
  const all=Object.values(D().ordini);
  const open=all.filter(o=>o.stato==='aperto'&&o.items&&o.items.length).sort((a,b)=>byNome({nome:a.fornitoreNome},{nome:b.fornitoreNome}));
  const sent=all.filter(o=>o.stato==='inviato').sort((a,b)=>(b.inviato||0)-(a.inviato||0)).slice(0,25);
  return`<div class="vhead"><div><h1 class="vt">Invii</h1><p class="vsub">${open.length?`${open.length} ${open.length===1?'ordine pronto':'ordini pronti'} da mandare ai fornitori`:'Niente da inviare'}</p></div><button type="button" class="btn ghost" data-a="newOrder">${ic('plus')} Ordine diretto</button></div>
  ${open.length?open.map(orderCard).join(''):empty('truck','Nessun ordine da inviare','Quando approvi una richiesta gli articoli arrivano qui, già divisi per fornitore.')}
  ${sent.length?`<h2 class="sec">Inviati di recente</h2><div class="panel">${sent.map(o=>`<button type="button" class="row link" data-a="sentView" data-o="${o.id}"><span class="fdot" style="--c:${fcolor(o.fornitoreId)}">${esc((forn(o.fornitoreId).nome||'?').charAt(0))}</span><div class="row-i"><div class="row-t">${esc(forn(o.fornitoreId).nome||o.fornitoreNome)}</div><div class="row-m">${ago(o.inviato)}, ${o.items.length} ${o.items.length===1?'articolo':'articoli'}</div></div>${o.ricevuto?(o.differenze?pill('wait','differenze'):pill('ok','arrivato')):pill('sent','in arrivo')}</button>`).join('')}</div>`:''}`;
}
function primaryActions(o){
  const f=forn(o.fornitoreId),me=f.metodo||'email';

async function confirmReceipt(oid,all){

  bkImport:()=>pickFile({accept:'.json,application/json'},async fs=>{let j;try{j=JSON.parse(await fs[0].text())}catch(e){return toast('File di backup non valido.','err')}
    if(!j||j.app!=='jona-ordini'||!j.dati)return toast('Questo non è un backup di Jona Ordini.','err');
    if(!await ask('Ripristinare il backup del '+new Date(j.data).toLocaleDateString('it-IT')+'?',S.db.kind==='firebase'?'Tutti i dati attuali verranno sostituiti su tutti i telefoni.':'Tutti i dati attuali su questo dispositivo verranno sostituiti.','Ripristina',true))return;
    try{await S.db.load(j.dati);toast('Backup ripristinato')}catch(e){toast(errMsg(e),'err')}}),
  demoDel:async()=>{const ds=prods().filter(p=>p.demo);if(!await ask('Eliminare '+ds.length+' prodotti di esempio?','','Elimina',true))return;await runPool(ds.map(p=>()=>del('prodotti',p.id)));toast('Prodotti demo eliminati')},
  notifDel:async()=>{const ns=Object.values(D().notifiche).filter(n=>n.letta);await runPool(ns.map(n=>()=>del('notifiche',n.id)));toast('Notifiche pulite')}
};
const IN={
  q:t=>{S.q=t.value;const r=$('#results');if(r)r.innerHTML=catResults();else render()},
  login:t=>{S.login[t.dataset.k]=t.value},
  joinK:t=>{S.joinK=t.value},
  form:t=>{S.form[t.dataset.k]=t.value},
  cnote:t=>{S.cnote=t.value},
  gmn:t=>{S.gmn[t.dataset.r]=t.value},
  ometa:t=>{const o=D().ordini[t.dataset.o];if(o)metaOf(o)[t.dataset.k]=t.value},
  rcvnote:t=>{rcvState(t.dataset.o).note=t.value},
  supq:t=>{S.supQ=t.value;const l=$('#sup-list');if(l)l.innerHTML=supList(S.supFid)},
  fe:t=>{S.fe[t.dataset.k]=t.value},
  pe:t=>{S.pe[t.dataset.k]=t.value},
  rv:t=>{if(S.rev)S.rev.items[+t.dataset.i][t.dataset.k]=t.dataset.k==='prezzo'?num(t.value):t.value},
  pkq:t=>{S.pkq=t.value;refreshSheet()},
  imptxt:t=>{S.imp.txt=t.value},
  askv:t=>{S.askVal=t.value},
  cfgName:t=>{S.cfgName=t.value},
  cfgLuogo:t=>{S.cfgLuogo=t.value}
};
const CH={
  formsel:t=>{S.form[t.dataset.k]=t.value},
  cv:t=>{const v=num(t.value);setCart(t.dataset.p,v==null?0:v)},
  cunit:t=>{const c=S.cart.find(x=>x.pid===t.dataset.p);if(c){c.unita=t.value.trim();saveCart()}},
  rqv:t=>{const x=draft(t.dataset.r);x[+t.dataset.i].qta=Math.max(0,num(t.value)||0);render()},
  rsup:t=>{const x=draft(t.dataset.r);const it=x[+t.dataset.i];it.fornitoreId=t.value;it.fornitoreNome=t.value?forn(t.value).nome:'';render()},
  rswap:t=>{const p=D().prodotti[t.value];if(!p)return;const x=draft(t.dataset.r);Object.assign(x[+t.dataset.i],{pid:p.id,nome:p.nome,codice:p.codice||'',unita:p.unita||'',prezzo:p.prezzo??null,fornitoreId:p.fornitoreId,fornitoreNome:forn(p.fornitoreId).nome,cambiato:true});render()},
  oqv:t=>{const v=num(t.value);return setOrderQty(t.dataset.o,+t.dataset.i,v==null?0:v)},
  ometasel:t=>{const o=D().ordini[t.dataset.o];if(o)metaOf(o)[t.dataset.k]=t.value},
  rq2v:t=>{const R=rcvState(t.dataset.o);const L=R.lines[+t.dataset.i];L.arr=Math.max(0,num(t.value)||0);if(L.arr!==L.qta&&!L.motivo)L.motivo='quantita';refreshSheet()},
  rmot:t=>{const R=rcvState(t.dataset.o);const L=R.lines[+t.dataset.i];L.motivo=t.value;if(t.value==='mancante')L.arr=0;if(!t.value)L.arr=L.qta;refreshSheet()},
  rvsel:t=>{S.rev.items[+t.dataset.i].sel=t.checked;refreshSheet()},
  rvall:t=>{S.rev.items.forEach(i=>{if(i.fid)i.sel=t.checked});refreshSheet()},
  rvf:t=>{const it=S.rev.items[+t.dataset.i];it.fid=t.value;it.sel=!!t.value;refreshSheet()},
  rvallf:t=>{if(!t.value)return;S.rev.items.forEach(i=>{if(!i.fid){i.fid=t.value;i.sel=true}});refreshSheet()},
  rvcat:t=>{S.rev.items[+t.dataset.i].categoria=t.value},
  hfwho:t=>{S.hf.who=t.value;render()},
  fesel:t=>{S.fe[t.dataset.k]=t.value},
  pesel:t=>{S.pe[t.dataset.k]=t.value}
};
async function guard(fn,el){
  if(el&&el.tagName==='BUTTON'){if(el.dataset.busy)return;el.dataset.busy='1'}
  try{await fn()}catch(e){console.warn(e);toast(errMsg(e),'err')}finally{if(el&&el.isConnected)delete el.dataset.busy}
}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const f=A[t.dataset.a];if(!f)return;if(t.tagName!=='A')e.preventDefault();guard(()=>f(t.dataset,t),t)});
document.addEventListener('input',e=>{const t=e.target;const f=t.dataset&&IN[t.dataset.in];if(f)f(t)});
document.addEventListener('change',e=>{const t=e.target;const f=t.dataset&&CH[t.dataset.ch];if(f)guard(()=>f(t))});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&sheets.length){closeSheet();return}
  if(e.key==='Enter'&&e.target&&e.target.closest&&e.target.closest('[data-form="login"]')){e.preventDefault();guard(doLogin)}
});

/* ================= avvio ================= */
(()=>{const h=new URLSearchParams(location.hash.slice(1));const k=h.get('k');if(!k)return;
  if(h.get('c')){try{ls('jona_fb',JSON.parse(atob(h.get('c'))))}catch(e){}}
  if(/^[A-Za-z0-9]{16,64}$/.test(k)&&ls('jona_key')!==k){ls('jona_key',k);ls('jona_member',null)}
  history.replaceState(null,'',location.pathname+location.search)})();
async function boot(){
  applyTheme();document.documentElement.classList.add('intro');setTimeout(()=>document.documentElement.classList.remove('intro'),2600);
  $('#picker').addEventListener('change',()=>{const p=$('#picker');const fs=[...(p.files||[])];const cb=pickCb;pickCb=null;if(fs.length&&cb)guard(()=>cb(fs))});
  render();
  const key=ls('jona_key');
  if(fbCfg()&&key){try{await need('firebase');S.db=FirebaseStore(key)}catch(e){S.fbLibErr=true;render();return}}
  else S.db=LocalStore;
  try{await seedIfEmpty()}catch(e){toast(errMsg(e),'err')}
  if(S.db.kind==='locale'&&fbCfg())fbPublic().then(a=>{S.fbActive=a;schedule()});
  Object.keys(COLS).forEach(subscribe);
  setTimeout(()=>{if(!allLoaded()){S.loadTimeout=true;render()}},5000);
}
boot();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
</body>
