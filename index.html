async function jonaAsk(q){
  const J=S.jona;q=String(q||J.q||'').trim();if(!q||J.busy)return;if(!gemOn())return toast('Prima inserisci la chiave Gemini.','warn');
  J.msgs.push({r:'q',t:q});J.q='';J.busy=true;refreshSheet();const sc=()=>setTimeout(()=>{const m=$('#jona-msgs');if(m)m.scrollTop=m.scrollHeight},30);sc();
  const sys='Sei Jona, l\'assistente dell\'app degli ordini di cucina e sala del ristorante «'+cfg().nomeLocale+'». Rispondi in italiano semplice e breve, come a un collega in cucina. '
    +'Usa solo i dati JSON qui sotto: fai i conti con precisione (somme di prezzo × quantità, date, turni) e se i dati non bastano dillo chiaramente. Euro con la virgola (12,50 €). Puoi usare elenchi con «- » e il grassetto con **.\nDATI:\n'+jonaCtx();
  const contents=J.msgs.slice(-8).map(m=>({role:m.r==='q'?'user':'model',parts:[{text:m.t}]}));
  const g=await gemCall({system_instruction:{parts:[{text:sys}]},contents,generationConfig:{temperature:0.2}});
  J.busy=false;J.msgs.push({r:'a',t:g.txt||(g.err||'Non ho una risposta adesso.')+' Riprova.'});
  refreshSheet();sc();
}
function jonaMic(){
  const C=vSR();if(!C)return;let r;try{r=new C()}catch(e){return}r.lang='it-IT';r.interimResults=true;r.maxAlternatives=1;
  toast('Parla adesso…');r.onresult=e=>{const t=[...e.results].map(x=>x[0].transcript).join(' ');S.jona.q=t;const el=$('#jona-q');if(el)el.value=t;if(e.results[e.results.length-1].isFinal)jonaAsk(t)};
  r.onerror=()=>toast('Non ho sentito: riprova o scrivi.','warn');try{r.start()}catch(e){}
}

/* ================= chat tra colleghi =================
   Collezione «messaggi»: un documento per messaggio {c,da,t,creato}; «messaggi/letti» = {<persona>:{<chat>:ultimo letto}}.
   c: 'tutti' | 'rep_cucina' | 'rep_sala' | 'rep_altro' | 'dm_<idA>_<idB>' (id in ordine alfabetico).
   Su Firebase la chat parla direttamente con Firestore (come le push): finché le regole non hanno «messaggi» l'app non si blocca
   e la chat spiega come attivarla. Si leggono gli ultimi 500 messaggi; «Messaggi precedenti» carica i più vecchi. */
const CHAT={on:false,err:'',msgs:[],old:[],letti:{},seen:null,retry:0,box:null,last:{}};
const chFb=()=>!!S.db&&S.db.kind==='firebase';
const chCol=()=>fbInit().fs.collection('messaggi');
const chDm=(a,b)=>'dm_'+[a,b].sort().join('--'); // «--» non compare negli id (che possono avere «_»)
const chDmIds=c=>c.slice(3).split('--');
function chWatch(){
  if(CHAT.on||now()<CHAT.retry||!S.db||!realU())return;
  if(chFb()){if(!S.db.status().ready)return;CHAT.on=true;
    CHAT.un=chCol().orderBy('creato','desc').limit(500).onSnapshot({includeMetadataChanges:true},q=>{CHAT.err='';
      CHAT.msgs=q.docs.map(d=>Object.assign({id:d.id,pend:d.metadata.hasPendingWrites},d.data()));chNew();schedule()},
      e=>{CHAT.err=e&&e.code||'errore';CHAT.on=false;CHAT.retry=now()+60000;schedule()});
    chCol().doc('letti').onSnapshot(d=>{CHAT.letti=d.exists?d.data():{};schedule()},()=>{});
  }else{CHAT.on=true;
    S.db.collection('messaggi').orderBy('creato','desc').limit(500).onSnapshot(q=>{const all=q.docs.map(d=>Object.assign({id:d.id},d.data()));
      const l=all.find(m=>m.id==='letti');CHAT.lettiOk=!!l;CHAT.letti=l?Object.assign({},l):{};delete CHAT.letti.id;CHAT.msgs=all.filter(m=>m.creato&&m.c);chNew();schedule()})}
}
// chat visibili: tutti, il proprio reparto (i gestori vedono tutti i reparti), i messaggi diretti
const chPeople=()=>Object.values(D().staff).filter(u=>u.stato==='attivo');
function chMembers(c){const P=chPeople();if(c==='tutti')return P;if(c.startsWith('rep_'))return P.filter(u=>isMgr(u)||(u.reparto||'altro')===c.slice(4));if(c.startsWith('dm_'))return chDmIds(c).map(id=>D().staff[id]).filter(Boolean);return[]}
function chCan(c,me){if(c==='tutti')return true;if(c.startsWith('rep_'))return isMgr(me)||(me.reparto||'altro')===c.slice(4);if(c.startsWith('dm_'))return chDmIds(c).includes(me.id);return false}
function chInfo(c,me){
  if(c==='tutti'){const n=chPeople().length;return{n:'Tutto lo staff',s:n===1?'1 persona':n+' persone',g:'tutti'}}
  if(c.startsWith('rep_'))return{n:REPARTI[c.slice(4)]||c.slice(4),s:chMembers(c).map(u=>u.nome).join(', '),g:c.slice(4)};
  const o=D().staff[chDmIds(c).find(id=>id!==me.id)]||{nome:'Profilo eliminato'};return{n:fullName(o),s:isMgr(o)?RUOLI[o.ruolo]:[o.mansione,REPARTI[o.reparto]].filter(Boolean).join(', '),u:o};
}
const chAll=()=>CHAT.old.length?CHAT.msgs.concat(CHAT.old.filter(o=>!CHAT.msgs.some(m=>m.id===o.id))):CHAT.msgs;
const chRead=(me,c)=>((CHAT.letti[me.id]||{})[c])||0;
function chList(me){
  const by=new Map();for(const m of chAll())if(chCan(m.c,me)){const x=by.get(m.c);if(!x||m.creato>x.creato)by.set(m.c,m)}
  const base=['tutti'].concat(isMgr(me)?Object.keys(REPARTI).map(r=>'rep_'+r).filter(c=>chMembers(c).length>1):['rep_'+(me.reparto||'altro')]);
  const cs=[...new Set(base.concat([...by.keys()]))];
  return cs.map(c=>({c,last:by.get(c),un:chAll().filter(m=>m.c===c&&m.da!==me.id&&m.creato>chRead(me,c)).length})).sort((a,b)=>((b.last||{}).creato||0)-((a.last||{}).creato||0));
}
const chUnread=me=>me?chList(me).reduce((s,x)=>s+x.un,0):0;
// avviso in app per i messaggi nuovi di altri (non quando la chat è aperta proprio lì)
function chNew(){
  const me=realU();if(!me)return;const ids=new Set(CHAT.msgs.map(m=>m.id));
  if(CHAT.seen){for(const m of CHAT.msgs)if(!CHAT.seen.has(m.id)&&m.da!==me.id&&chCan(m.c,me)&&now()-m.creato<120000&&!(S.chat&&S.chat.c===m.c&&!document.hidden)){
    const u=D().staff[m.da]||{nome:'?'};toast(u.nome+(m.c.startsWith('dm_')?'':' · '+chInfo(m.c,me).n)+': '+m.t.slice(0,80));try{navigator.vibrate&&navigator.vibrate(40)}catch(e){}}}
  CHAT.seen=ids;
}
async function chSend(){
  const C=S.chat,me=realU();if(!C||!C.c||!me)return;const el=$('#ch-ta');const t=String(el?el.value:C.draft[C.c]||'').trim();if(!t)return;
  if(t.length>2000)return toast('Messaggio troppo lungo.','warn');
  const d={c:C.c,da:me.id,t,creato:now()};C.draft[C.c]='';if(el){el.value='';el.style.height=''}C.stick=true;
  if(chFb())netWatch(chCol().add(d)).catch(e=>toast(e&&e.code==='permission-denied'?'La chat non è ancora attiva sul database.':'Messaggio non inviato: riprova.','err'));
  else await put('messaggi',uid(),d);
  chMarkRead(C.c,d.creato);chPush(C.c,me,t);
}
function chPush(c,me,t){const to=chMembers(c).filter(u=>u.id!==me.id).map(u=>u.id),info=chInfo(c,me);
  if(to.length)pushSend(to,me.nome+(c.startsWith('dm_')?'':' · '+info.n),t.slice(0,140))}

/* ---- foto e vocali: il file va nel Worker (database D1, in base64), nel messaggio restano tipo, id e anteprima.
   {tipo:'foto', m, w, h, mini} | {tipo:'audio', m, dur}; «t» resta un testo («📷 Foto») per le liste, gli avvisi e le versioni vecchie.
   I file scaricati restano nella cache «jona-allegati» del telefono (il service worker non la cancella). */
const ALG={ok:null,p:null,url:{},load:{},gone:{},pl:null,sp:null,io:null,au:null,auOk:0};
const algOn=()=>chFb()&&ALG.ok===true;
function algCheck(){if(ALG.ok!==null||ALG.p||!chFb())return;
  ALG.p=fetch(PUSH_URL+'/salute').then(r=>r.json()).then(j=>{ALG.ok=!!j.allegati;chPaint(true)}).catch(()=>{}).finally(()=>{ALG.p=null})}
async function algTok(){try{return await fbInit().auth.currentUser.getIdToken()}catch(e){return''}}
const algB64=blob=>new Promise((ok,ko)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]||'');r.onerror=()=>ko(r.error);r.readAsDataURL(blob)});
async function algUp(blob){
  const r=await fetch(PUSH_URL+'/allegati',{method:'POST',headers:{'content-type':'text/plain','x-tipo':blob.type.split(';')[0],authorization:'Bearer '+await algTok()},body:await algB64(blob)});
  const j=await r.json().catch(()=>({}));if(!r.ok||!j.id)throw Object.assign(new Error(j.errore||'errore'),{status:r.status});return j.id}
function algGet(id){
  if(ALG.url[id])return Promise.resolve(ALG.url[id]);
  return ALG.load[id]||(ALG.load[id]=(async()=>{const key=PUSH_URL+'/allegati/'+id;let c=null,res=null;
    try{c=await caches.open('jona-allegati');res=await c.match(key)}catch(e){}
    if(!res){const r=await fetch(key,{headers:{authorization:'Bearer '+await algTok()}});
      if(r.status===404){ALG.gone[id]=1;throw Object.assign(new Error('via'),{gone:1})}if(!r.ok)throw new Error('errore '+r.status);
      const bin=atob(await r.text()),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
      res=new Response(new Blob([u],{type:r.headers.get('x-tipo')||''}));
      if(c)try{await c.put(key,res.clone());const ks=await c.keys();for(const k of ks.slice(0,Math.max(0,ks.length-400)))await c.delete(k)}catch(e){}}
    return ALG.url[id]=URL.createObjectURL(await res.blob())})().finally(()=>{delete ALG.load[id]}))}
async function algSpace(){try{const r=await fetch(PUSH_URL+'/allegati/spazio',{headers:{authorization:'Bearer '+await algTok()}});if(r.ok){ALG.sp=await r.json();chPaint(true)}}catch(e){}}
const algMB=b=>b>=1e9?(b/1e9).toFixed(1).replace('.',',')+' GB':Math.round(b/1e6)+' MB';
// foto: lato lungo 1280 px (WebP 0,7, o JPEG dove il WebP non c'è), anteprima 40 px dentro il messaggio
async function algImg(file){
  const im=await loadImg(file),W=im.naturalWidth||im.width,H=im.naturalHeight||im.height;
  const cv=m=>{const k=Math.min(1,m/Math.max(W,H)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(W*k));c.height=Math.max(1,Math.round(H*k));c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c};
  const big=cv(1280);let blob=await new Promise(r=>big.toBlob(r,'image/webp',.7));
  if(!blob||blob.type!=='image/webp')blob=await new Promise(r=>big.toBlob(r,'image/jpeg',.72));
  return{blob,w:big.width,h:big.height,mini:cv(40).toDataURL('image/jpeg',.5)}}
async function chFile(tipo,blob,x){
  const me=realU();if(!x.c||!me||!blob)return;
  if(blob.size>1.3e6)return toast(tipo==='foto'?'Foto troppo grande.':'Vocale troppo lungo.','warn');
  CHAT.up=(CHAT.up||0)+1;chPaint(true);
  try{const id=await algUp(blob);ALG.url[id]=URL.createObjectURL(blob);
    const t=tipo==='foto'?'📷 Foto':'🎤 Messaggio vocale ('+chDur(x.dur)+')';
    const d=Object.assign({c:x.c,da:me.id,t,creato:now(),tipo,m:id},tipo==='foto'?{w:x.w,h:x.h,mini:x.mini}:Object.assign({dur:x.dur},x.wf?{wf:x.wf}:{}));
    if(S.chat)S.chat.stick=true;
    netWatch(chCol().add(d)).catch(e=>toast('Messaggio non inviato: riprova.','err'));
    chMarkRead(x.c,d.creato);chPush(x.c,me,t)}
  catch(e){const nf=(tipo==='foto'?'Foto':'Vocale')+' non inviat'+(tipo==='foto'?'a':'o');
    toast(e.status===403?'Questo telefono non è collegato al ristorante.':e.status===503?'Foto e vocali non sono ancora attivi sul server.':e.status===413?(tipo==='foto'?'Foto troppo grande.':'Vocale troppo lungo.'):e.status?nf+' (errore '+e.status+'): riprova o avvisa lo sviluppatore.':nf+': controlla la connessione e riprova.','err')}
  finally{CHAT.up--;chPaint(true)}}
function chPhoto(){const c=S.chat&&S.chat.c;if(!c)return;
  pickFile({accept:'image/*'},async fs=>{let x;try{x=await algImg(fs[0])}catch(e){return toast('Non riesco ad aprire questa foto.','err')}chFile('foto',x.blob,Object.assign(x,{c}))})}
const chDur=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
// vocali: mono, al massimo 2 minuti, sempre in AAC dove si può (lo leggono iPhone e Android).
// Chrome con «audio/mp4» senza codec registra Opus dentro l'MP4, che l'iPhone non legge: l'MP4 semplice solo su iPhone/Safari;
// su Android l'AAC si fa con il codificatore del telefono (WebCodecs) e diventa un file .aac (ADTS). Ultima scelta il WebM/Opus.
const chApple=()=>/iPhone|iPad|iPod/.test(navigator.userAgent)||/Safari/.test(navigator.userAgent)&&!/Chrome|Chromium|CriOS|Android|Edg/.test(navigator.userAgent)||navigator.maxTouchPoints>1&&/Macintosh/.test(navigator.userAgent);
async function aacOk(){if(!window.AudioEncoder||!window.MediaStreamTrackProcessor)return false;
  try{return!!(await AudioEncoder.isConfigSupported({codec:'mp4a.40.2',sampleRate:48000,numberOfChannels:1,bitrate:32000})).supported}catch(e){return false}}
// fa le veci di MediaRecorder: legge il microfono, codifica in AAC e aggiunge a ogni pezzo l'intestazione ADTS di 7 byte
function aacRec(st){
  const rd=new MediaStreamTrackProcessor({track:st.getAudioTracks()[0]}).readable.getReader(),out=[];
  const R={mimeType:'audio/aac',state:'recording',ondataavailable:null,onstop:null,start(){}};let enc=null,sr=48000,nc=1,end=false;
  const SR=[96000,88200,64000,48000,44100,32000,24000,22050,16000,12000,11025,8000,7350];
  const hd=n=>{const f=n+7,i=Math.max(0,SR.indexOf(sr));return new Uint8Array([0xFF,0xF1,64|i<<2|nc>>2,(nc&3)<<6|f>>11,f>>3&255,(f&7)<<5|31,0xFC])};
  (async()=>{try{for(;;){const{value:ad,done}=await rd.read();if(done)break;if(end){ad.close();break}
      if(!enc){sr=ad.sampleRate;nc=ad.numberOfChannels;
        enc=new AudioEncoder({output:c=>{const b=new Uint8Array(c.byteLength);c.copyTo(b);out.push(hd(b.length),b)},error:e=>{R.err=e}});
        enc.configure({codec:'mp4a.40.2',sampleRate:sr,numberOfChannels:nc,bitrate:32000})}
      enc.encode(ad);ad.close()}
    if(enc&&enc.state==='configured')await enc.flush()}catch(e){R.err=e}
    R.state='inactive';if(out.length&&!R.err&&R.ondataavailable)R.ondataavailable({data:new Blob(out,{type:'audio/aac'})});if(R.onstop)R.onstop()})();
  R.stop=()=>{end=true;rd.cancel().catch(()=>{})};return R}
// forma d'onda dei vocali: volume ogni 100 ms mentre si registra, poi 40 barre da 0 a 9 nel messaggio («wf»; 0 = silenzio, linea piatta)
const WF_N=40;
function wfStart(st,R){R.lv=[];try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const ac=new A(),an=ac.createAnalyser();an.fftSize=1024;ac.createMediaStreamSource(st).connect(an);

    for(const w of said){let b=0,bi=-1;f.toks.forEach((x,i)=>{const s=vSimSup(w,x);if(s>b){b=s;bi=i}});if(b>=.8){m++;used.add(bi);if(b===1)ex++}}

    const sc=m/said.length+.5*used.size/f.toks.length;

// Senza virgole («4 kg pomodori da Mariano 2 casse di zucchine»): taglia dove comincia (o finisce) un'altra quantità.
function vSplit(T,ctx){
  const isW=t=>vNum(t.n)==null&&!VUNIT.has(t.n)&&!VSTOPW.has(t.n)&&!VFILL.has(t.n)&&!VMARK.has(t.n)&&!ctx.supw.has(t.n)&&!/^(mezzo|mezza|paio|dozzin[ae])$/.test(t.n);
  const qs=[];
  for(let i=0;i<T.length;i++){const n=T[i].n;if(!(/^\d/.test(n)||vWordNum(n)!=null||n==='mezzo'||n==='mezza'))continue;
    const r=vQty(T,i);if(!r)continue;qs.push([i,r.end,!/^\d/.test(n)&&VNUM.get(n)===1&&!r.u&&!(T[i+1]&&T[i+1].n==='paio')]);i=r.end-1}
  if(!qs.length)return[T];
  // «un/una» senza unità conta solo se le quantità vengono prima dei prodotti
  const words=(a,b)=>T.slice(a,b).some(isW);const cuts=[];

  else{const q2=qs.filter(x=>!x[2]);for(let k=0;k<q2.length;k++){const nx=k+1<q2.length?q2[k+1][0]:T.length;if(words(q2[k][1],nx))cuts.push(q2[k][1])}}
  if(!cuts.length)return[T];
  const out=[];let a=0;for(const c of cuts){out.push(T.slice(a,c));a=c}out.push(T.slice(a));return out.filter(x=>x.length);
}
function vQty(T,i){
  let j=i,n=null,u=null;const at=k=>T[k]?T[k].n:'';const half=k=>at(k)==='e'&&(at(k+1)==='mezzo'||at(k+1)==='mezza');
  const t=at(j);
  if((t==='un'||t==='uno')&&at(j+1)==='paio'){n=2;j+=2}
  else if(t==='mezzo'||t==='mezza'){n=.5;j++}
  else{const v=t?vNum(t):null;if(v!=null){n=v;j++;if(half(j)){n+=.5;j+=2}}}
  if(/^dozzin[ae]$/.test(at(j))){n=(n==null?1:n)*12;u='pz';j++}
  else{const uu=vUnitAt(T,j);if(uu){u=uu;j++;if(n==null)n=1;if(half(j)){n+=.5;j+=2}}}
  if(n==null||n<=0)return null;
  while(T[j]&&VART.has(T[j].n))j++;

}
const vWords=T=>T.some(t=>vNum(t.n)==null&&!VUNIT.has(t.n)&&!VSTOPW.has(t.n)&&!VFILL.has(t.n)&&!/^(mezzo|mezza|paio|dozzin[ae])$/.test(t.n));
function vLine(T,ctx){
  const detto=T.map(t=>t.o).join(' ').replace(/' /g,"'");
  T=T.filter((t,i,a)=>!(t.n==='per'&&a[i+1]&&/^(favore|cortesia)$/.test(a[i+1].n))&&!(/^(favore|cortesia)$/.test(t.n)&&a[i-1]&&a[i-1].n==='per'));
  for(let i=0;i+2<T.length;i++)if(T[i].n==='piu'&&T[i+1].n==='o'&&T[i+2].n==='meno'){T.splice(i,3);i--}
  const clean=()=>{for(;;){if(T.length&&VFILL.has(T[0].n))T=T.slice(1);else if(T.length>1&&T[0].n==='un'&&T[1].n==='po')T=T.slice(2);else break}while(T.length&&VTRAIL.has(T[T.length-1].n))T=T.slice(0,-1)};
  clean();
  let sup=null,lead=false;
  if(T.length>1&&VMARK.has(T[0].n))for(let k=Math.min(4,T.length-1);k>=1;k--){const s=vSup(T.slice(1,1+k),'strict',ctx);if(s){sup=s.id;lead=true;T=T.slice(1+k);clean();break}}
  // nome del fornitore senza «da» alla fine: «caffè pascucci»
  const bare=()=>{for(const k of [2,1]){if(T.length<=k)continue;const tail=T.slice(-k);if(!vWords(T.slice(0,-k))||tail.some(t=>ctx.vocab.has(t.n)))continue;const s=vSup(tail,'exact',ctx);if(s){sup=s.id;T=T.slice(0,-k);return}}};
  if(!sup&&T.length>1){
    for(let j=T.length-2;j>=1;j--){const w=T[j].n;if(!VMARK.has(w)&&!VMARKW.has(w))continue;let tail=T.slice(j+1),qt=[];const head=T.slice(0,j);if(!vWords(head))continue;
      for(let i=1;i<tail.length;i++){const r=vQty(tail,i);if(r&&r.end===tail.length){qt=tail.slice(i);tail=tail.slice(0,i);break}}
      const s=VMARK.has(w)?vSup(tail,'loose',ctx):tail.every(t=>!ctx.vocab.has(t.n))?vSup(tail,'strict',ctx):null;

  let q=vQty(T,0);
  if(q)T=T.slice(q.end);
  else for(let i=1;i<T.length;i++){const r=vQty(T,i);if(r&&r.end===T.length){q=r;T=T.slice(0,i);break}}

  while(T.length&&(VART.has(T[T.length-1].n)||VMARK.has(T[T.length-1].n)||VTRAIL.has(T[T.length-1].n)))T=T.slice(0,-1);
  const toks=vSig(T.map(t=>t.n));

  return{qta:q?q.q:null,unita:q?q.u:null,testo:T.map(t=>t.o).join(' ').replace(/' /g,"'"),toks,fornitore:sup,lead,detto};
}
// Testo detto → righe {qta,unita,testo,fornitore} (qta/unita null se non dette; fornitore = id o null).
function parseVoice(text,ctx){
  ctx=ctx||vCtx();const out=[];let lead=null,tail=null;
  for(const seg of vSegments(vTokens(text),ctx)){
    const L=vLine(seg,ctx);if(!L)continue;
    if(L.onlySup){lead=L.fornitore;tail=L.fornitore;continue}
    tail=null;if(L.lead)lead=L.fornitore;
    if(!L.fornitore&&lead)L.fornitore=lead;
    out.push(L);
  }
  if(tail)out.forEach(L=>{if(!L.fornitore)L.fornitore=tail});
  return out;
}
// Prodotto del catalogo per una riga: punteggio sulle parole dette (la prima conta doppio), poi preferenze come il "+" del catalogo.
function vMatch(L,ctx){
  const S0=L.toks;const list=[];if(!S0.length)return{best:null,list};
  const W=S0.map((w,i)=>i?1:2),WT=W.reduce((a,b)=>a+b,0);
  for(const x of ctx.ps){
    if(!x.t.length)continue;let cov=0;const hit=new Set();
    S0.forEach((w,i)=>{let b=0,bi=-1;x.t.forEach((y,j)=>{const s=vSim(w,y);if(s>b){b=s;bi=j}});cov+=W[i]*b;if(b>=.8)hit.add(bi)});
    cov/=WT;if(cov<=0)continue;
    let sc=.7*cov+.3*hit.size/x.t.length;
    if(vSim(S0[0],x.t[0])>=.8)sc+=.05;
    if(L.fornitore&&x.p.fornitoreId===L.fornitore)sc+=.15;
    list.push({p:x.p,cov,sc:r3(sc)});
  }
  list.sort((a,b)=>b.sc-a.sc||byNome(a.p,b.p));
  const top=list[0];if(!top||top.cov<.6)return{best:null,list};
  let best=top.p;
  if(!(L.fornitore&&best.fornitoreId===L.fornitore)){const k=gkey(best.nome);const grp=list.filter(c=>c.cov>=.6&&c.sc>=top.sc-.15&&gkey(c.p.nome)===k).map(c=>c.p);if(grp.length>1)best=defOpt(grp,usualOf(meU()),null)}
  return{best,list};
}
// Quantità per il prodotto scelto: kg/etti/grammi e litri si convertono; se l'unità detta non si converte va nella nota per lo chef.
function vSetP(r,p){
  const L=r.line;let q=L.qta==null?1:L.qta,u=L.unita,nota='';
  if(p){
    const pu=vPUnit(p.unita),q0=q,said=()=>fq(q0)+' '+vULab(u,q0);
    if(u&&u!==pu){const a=VFAM[u],b=VFAM[pu],sz=vSize(p.nome),c=sz&&VFAM[sz.u];
      if(a&&b&&a[0]===b[0])q=q*a[1]/b[1];
      else if((u==='pz'||pu==='pz')&&VSMALL.has(u)&&VSMALL.has(pu)){}
      else if(a&&!b&&c&&c[0]===a[0]){const x=q*a[1]/(sz.v*c[1]);q=Math.max(1,Math.round(x));if(Math.abs(x-q)>.001)nota=said()}
      else if(!a&&b&&c&&c[0]===b[0])q=q*sz.v*c[1]/b[1];
      else{nota=said();if(pu&&!b)q=a?1:Math.max(1,Math.round(q))}}

  }else{
    if(u==='hg'){q=q/10;u='kg'}

    Object.assign(r,{pid:null,nome:vCap(L.testo)+(f?' (da '+f+')':''),unita:u?vULab(u,q):'pz',qta:r3(q),nota:''});

}
function vRows(text,ctx){

}

const AG_MESI=['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
const agD=g=>{const [y,m,d]=g.split('-').map(Number);return new Date(y,m-1,d)};
const agAdd=(g,n)=>{const d=agD(g);d.setDate(d.getDate()+n);return today(d)};
const agWd=g=>(agD(g).getDay()+6)%7;
const agLun=g=>agAdd(g,-agWd(g));
const agLbl=g=>{const d=agD(g);return AG_GG[agWd(g)]+' '+d.getDate()+' '+AG_MESI[d.getMonth()]};
function agAll(){const out=[];for(const [doc,v] of Object.entries(D().config))if(/^agenda_(\d{4}-\d{2}|ric)$/.test(doc)&&v&&v.e)
  for(const [id,e] of Object.entries(v.e))if(e&&e.t&&e.g)out.push(Object.assign({},e,{id,doc}));return out}
const agGet=id=>agAll().find(e=>e.id===id)||null;
/* creano e modificano: gestori, sviluppatore e staff dei reparti F&B Manager e Responsabile */
const agCan=u=>isMgr(u)||(!!u&&['fb','resp'].includes(u.reparto));
const AG_K={ev:'Evento',info:'Informazione',op:'Aggiornamento operativo',memo:'Memo'},agK=e=>AG_K[e&&e.k]?e.k:'ev';
const agSee=(e,me)=>!!me&&(e.da===me.id||e.vis==='tutti'||(e.vis==='rep'&&(isMgr(me)||(e.rep||[]).includes(me.reparto)))||(e.vis==='pers'&&(e.per||[]).includes(me.id)));
/* v61 destinatari: chi lo vede (tranne chi l'ha scritto) e chi ha toccato «Ok, visto» dopo l'ultima modifica */
const agDest=e=>e.vis==='io'?[]:Object.values(D().staff).filter(u=>u&&u.stato==='attivo'&&u.id!==e.da&&(e.vis==='rep'?(e.rep||[]).includes(u.reparto)||(e.per||[]).includes(u.id):agSee(e,u)));
const agVisto=(e,id)=>!!(e.visto&&e.visto[id]>=(e.mod||0));
const agVisLbl=e=>e.vis==='tutti'?'Tutti':e.vis==='rep'?(e.rep||[]).map(r=>REPARTI[r]||r).join(', '):e.vis==='pers'?(e.per||[]).map(id=>{const u=D().staff[id];return u?u.nome||fullName(u):'?'}).join(', '):'Solo io';
const agOnDay=(e,g)=>e.r==='s'?e.g<=g&&agWd(e.g)===agWd(g):e.r==='m'?e.g<=g&&agD(e.g).getDate()===agD(g).getDate():e.g===g;
const agDay=(g,me)=>agAll().filter(e=>agSee(e,me)&&agOnDay(e,g)).sort((a,b)=>(a.h||'99').localeCompare(b.h||'99')||a.t.localeCompare(b.t));
/* v58 avvisi: minuti prima dell'evento (senza ora = le 09:00), «cose da fare» per evento (cl) */
const AG_AV=[[0,'All\'ora'],[15,'15 min prima'],[30,'30 min prima'],[60,'1 ora prima'],[120,'2 ore prima'],[1440,'1 giorno prima']];
const agAvOk=l=>Array.isArray(l)?[...new Set(l.filter(m=>AG_AV.some(a=>a[0]===m)))].sort((a,b)=>a-b):[];
const agAvLbl=l=>agAvOk(l).map(m=>AG_AV.find(a=>a[0]===m)[1].toLowerCase()).join(', ');
const agAvTxt=(m,h)=>m===0?'Adesso'+(h?' · '+h:''):m<60?'Tra '+m+' minuti':m===60?'Tra 1 ora':m===120?'Tra 2 ore':'Domani'+(h?' alle '+h:'');
const agTs=(g,h,m)=>{const [H,M]=(h||'09:00').split(':').map(Number),d=agD(g);d.setHours(H,M,0,0);return d.getTime()-m*60000};
/* v59 appunti del giorno: lista personale con spunta (config/agnote_<AAAA-MM>, n.d<AAAAMMGG>.<persona>) */
const agNoteDoc=g=>'agnote_'+g.slice(0,7),agNoteK=g=>'d'+g.replace(/-/g,'');
function agNotes(g,u){const d=D().config[agNoteDoc(g)],x=u&&d&&d.n&&d.n[agNoteK(g)];const l=x&&x[u.id];return Array.isArray(l)?l.filter(y=>y&&y.t):[]}
async function agNotesPut(g,u,l){const doc=agNoteDoc(g),k=agNoteK(g),v=l.map(x=>({t:String(x.t).trim().slice(0,120),ok:!!x.ok})).filter(x=>x.t).slice(0,60);
  /* il documento del mese si crea una volta sola: due scritture di fila (es. «Sposta a domani») non si sovrascrivono */
  if(D().config[doc]||agNotesPut.fatti.has(doc))await upd('config',doc,{['n.'+k+'.'+u.id]:v});else{agNotesPut.fatti.add(doc);await put('config',doc,{tipo:'agnote',n:{[k]:{[u.id]:v}}})}}
agNotesPut.fatti=new Set();
const agHm=()=>{const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
/* tutti gli avvisi con orario fra da e a (ms), per ogni evento; chi li riceve si sceglie con agSee */
function agInst(da,a){const out=[],g0=agAdd(today(new Date(da)),-1),g1=agAdd(today(new Date(a)),2);
  for(const e of agAll()){const av=agAvOk(e.av);if(!av.length)continue;
    for(let g=g0;g<=g1;g=agAdd(g,1)){if(!agOnDay(e,g))continue;for(const m of av){const at=agTs(g,e.h,m);if(at>=da&&at<=a)out.push({id:e.id,e,g,m,at,t:e.t,h:e.h||''})}}}
  return out.sort((x,y)=>x.at-y.at||(x.id+x.m<y.id+y.m?-1:1))}
async function agTick(me){if(!funzOn('agenda')||!me)return;const t=now(),rem=ls('jona_agrem')||{};let ch=false;
  for(const k in rem)if(rem[k]<t-864e5){delete rem[k];ch=true}
  for(const a of agInst(t-20*60000,t)){if(!agSee(a.e,me))continue;const k=a.id+'|'+a.at;if(rem[k])continue;rem[k]=t;ch=true;
    const nid='ag_'+a.id+'_'+a.at+'_'+me.id;
    if(!D().notifiche[nid])await put('notifiche',nid,{a:me.id,titolo:a.t,testo:agAvTxt(a.m,a.h),tipo:'agenda',rif:a.id,letta:false,creato:now(),da:me.id});
    toast(a.t+' · '+agAvTxt(a.m,a.h),'warn')}
  if(ch)ls('jona_agrem',rem)}
/* avvisi dal server: chi scrive in agenda manda al Worker (/agenda) gli avvisi dei prossimi 2 giorni con le iscrizioni di chi li riceve */
function agPlan(){const st=D().staff,ps=Object.entries(PUSH.subs).sort((a,b)=>a[0]<b[0]?-1:1).map(([,p])=>p),t=now(),ev=[];
  for(const a of agInst(t-20*60000,t+48*36e5)){const subs=ps.filter(p=>{const u=st[p.u];return !!u&&u.stato==='attivo'&&agSee(a.e,u)}).map(p=>p.sub);
    if(subs.length)ev.push({k:a.id+'|'+a.at,at:a.at,t:a.t,x:agAvTxt(a.m,a.h),subs})}
  return JSON.stringify({ev:ev.slice(0,120)})}
async function agSrv(){if(!pushFb()||!funzOn('agenda'))return false;pushWatch();if(!PUSH.ld)return false;
  const body=agPlan(),h=await sha(body),last=ls('jona_agpl')||{};
  if(last.h===h&&now()-(last.t||0)<6*36e5)return true;
  if(agSrv.busy||now()<(agSrv.retry||0))return false;
  agSrv.busy=1;try{const r=await fetch(PUSH_URL+'/agenda',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+await algTok()},body});
    if(!r.ok)throw new Error('agenda '+r.status);ls('jona_agpl',{h,t:now()});return true}
  catch(e){agSrv.retry=now()+15*60000;return false}finally{agSrv.busy=0}}

/* riga veloce: «domani ore 20 gruppo Rossi 40 coperti» → {t,g,h,cop} */
function agParse(txt,base=new Date()){let s=' '+String(txt||'').replace(/\s+/g,' ').trim()+' ';const oggi=today(base);let g='',h='',cop=0;
  const cut=re=>{const m=s.match(re);if(m)s=s.replace(re,' ');return m};
  let m=cut(/\s(\d{1,4})\s*(?:coperti|persone|pax|ospiti)\b/i);if(m)cop=+m[1];
  m=cut(/\s(?:alle\s+ore|alle|ore|h)\s*(\d{1,2})(?:[:.,](\d{2}))?(?=\s)/i);if(m&&+m[1]<24&&(!m[2]||+m[2]<60))h=String(m[1]).padStart(2,'0')+':'+(m[2]||'00');
  if(cut(/\sdopodomani(?=\s)/i))g=agAdd(oggi,2);else if(cut(/\sdomani(?=\s)/i))g=agAdd(oggi,1);else if(cut(/\soggi(?=\s)/i))g=oggi;
  if(!g){m=cut(/\s(?:il\s+|giorno\s+)?(\d{1,2})\s+(gennaio|febbraio|marzo|aprile|maggio|giugno|luglio|agosto|settembre|ottobre|novembre|dicembre)(?:\s+(\d{4}))?(?=\s)/i);
    if(m){const d=+m[1],mo=AG_MESI.indexOf(m[2].toLowerCase());let y=m[3]?+m[3]:base.getFullYear();let c=today(new Date(y,mo,d));if(!m[3]&&c<oggi)c=today(new Date(y+1,mo,d));if(agD(c).getDate()===d)g=c}}
  if(!g){m=cut(/\s(?:il\s+)?(\d{1,2})[/.-](\d{1,2})(?:[/.-](\d{2,4}))?(?=\s)/);
    if(m){const d=+m[1],mo=+m[2]-1;let y=m[3]?(+m[3]<100?2000+ +m[3]:+m[3]):base.getFullYear();let c=today(new Date(y,mo,d));if(!m[3]&&c<oggi)c=today(new Date(y+1,mo,d));if(mo<12&&agD(c).getDate()===d)g=c}}
  if(!g){m=cut(/\s(?:(?:il\s+)?prossimo\s+|(?:di\s+)?)?(luned[iì]|marted[iì]|mercoled[iì]|gioved[iì]|venerd[iì]|sabato|domenica)(?:\s+prossimo)?(?=\s)/i);
    if(m){const w=['lun','mar','mer','gio','ven','sab','dom'].indexOf(m[1].toLowerCase().slice(0,3));g=agAdd(oggi,(w-agWd(oggi)+7)%7)}}
  if(!g){m=cut(/\s(?:il\s+|giorno\s+)?(\d{1,2})(?=\s)/);
    if(m&&+m[1]>=1&&+m[1]<=31){const d=+m[1];let c=today(new Date(base.getFullYear(),base.getMonth(),d));if(c<oggi)c=today(new Date(base.getFullYear(),base.getMonth()+1,d));if(agD(c).getDate()===d)g=c}}
  const t=s.replace(/\s(?:il|alle|per|di|del|da)\s*$/i,' ').replace(/^\s*(?:il|alle|per)\s/i,' ').replace(/\s+/g,' ').trim();
  return{t:t?t[0].toUpperCase()+t.slice(1):'',g:g||oggi,h,cop}}

function agOpen(){if(!funzOn('agenda'))return;S.ag={v:'oggi',g:today(),sel:'',q:'',nt:''};usoSegna('agenda');openSheet({cls:'tall',live:()=>true,render:agSheet,onClose:()=>agMicStop()})}
function agEvH(e,me,mgr,next){const vis=agVisLbl(e),dst=mgr&&e.vis!=='io'?agDest(e):[],vst=dst.filter(u=>agVisto(e,u.id)).length;
  const k=agK(e),av=agAvLbl(e.av),cl=Array.isArray(e.cl)?e.cl:[],fatte=cl.filter(x=>x.ok).length;
  const inner=`<span class="ag-h">${e.h?esc(e.h):'—'}</span><span class="ag-b">${k!=='ev'?`<span class="ag-k ag-k-${k}">${AG_K[k]}</span>`:''}<b>${esc(e.t)}</b><span class="muted small">${e.cop?esc(e.cop)+' coperti · ':''}${esc(vis)}${e.r?' · ogni '+(e.r==='s'?'settimana':'mese'):''}${av?' · avviso '+esc(av):''}${cl.length?' · '+fatte+'/'+cl.length+' fatte':''}${dst.length?' · visto da '+vst+'/'+dst.length:''}${e.note?' · '+esc(e.note):''}</span></span>`;
  const main=mgr?`<button type="button" class="ag-ev" data-a="agEdit" data-v="${e.id}">${inner}</button>`:`<div class="ag-ev">${inner}</div>`;
  const lst=cl.length?`<div class="ag-cl">${cl.map((x,i)=>{const b=`<span class="ag-bx">${x.ok?ic('check'):''}</span><span class="ag-ct${x.ok?' ok':''}">${esc(x.t)}</span>`;
    return mgr?`<button type="button" class="ag-ck" aria-pressed="${!!x.ok}" data-a="agCk" data-v="${e.id}|${i}">${b}</button>`:`<div class="ag-ck">${b}</div>`}).join('')}</div>`:'';
  return`<div class="ag-w${next?' ag-next':''}">${main}${lst}</div>`}
function agList(g,me,mgr){const l=agDay(g,me),hm=agHm(),nx=g===today()?l.findIndex(e=>e.h&&e.h>=hm):-1;return l.length?l.map((e,i)=>agEvH(e,me,mgr,i===nx)).join(''):`<p class="muted small ag-vuoto">Niente in agenda.</p>`}
function agNotesH(g){const u=realU(),l=agNotes(g,u),todo=l.filter(x=>!x.ok).length;

/* Giorno: appunti, «Tutto il giorno» e le ore dalle 7 alle 23 (tocca un'ora vuota per un evento nuovo) */
function agDayH(g,me,mgr){if(!mgr)return agList(g,me,mgr);
  const l=agDay(g,me),hm=agHm(),isT=g===today(),tutto=l.filter(e=>!e.h),ore=l.filter(e=>e.h),nx=isT?ore.findIndex(e=>e.h>=hm):-1,ch=isT?+hm.slice(0,2):-1;
  let h0=7,h1=23;for(const e of ore){const h=+e.h.slice(0,2);if(h<h0)h0=h;if(h>h1)h1=h}
  const p2=h=>String(h).padStart(2,'0');let righe='';
  for(let h=h0;h<=h1;h++){const ev=ore.filter(e=>+e.h.slice(0,2)===h);
    righe+=`<div class="ag-hr${h===ch?' ora':''}"><span class="ag-hl">${p2(h)}:00</span><div class="ag-hs">${ev.length?ev.map(e=>agEvH(e,me,mgr,ore.indexOf(e)===nx)).join(''):`<button type="button" class="ag-add" data-a="agNewAt" data-v="${p2(h)}:00" aria-label="Nuovo evento alle ${p2(h)}:00"></button>`}</div></div>`}
  return agNotesH(g)+(tutto.length?`<div class="ag-sec">Tutto il giorno</div>${tutto.map(e=>agEvH(e,me,mgr,false)).join('')}`:'')+`<div class="ag-sec">Ore</div>${l.length?'':'<p class="muted small ag-vuoto">Niente in agenda. Tocca un\'ora per segnare un evento.</p>'}<div class="ag-tl">${righe}</div>`}
function agSheet(){const A_=S.ag,me=meU(),mgr=agCan(me);let nav='',body='';
  if(A_.v==='oggi'){nav=A_.g===today()?'Oggi, '+agLbl(A_.g):agCap(agLbl(A_.g));body=agDayH(A_.g,me,mgr)}
  else if(A_.v==='sett'){const l=agLun(A_.g);nav='Settimana dal '+agD(l).getDate()+' '+AG_MESI[agD(l).getMonth()];
    body=[0,1,2,3,4,5,6].map(i=>{const g=agAdd(l,i),nt=mgr?agNotes(g,realU()).filter(x=>!x.ok).length:0;return`<div class="ag-dt${g===today()?' oggi':''}"><button type="button" class="ag-dl" data-a="agDayGo" data-v="${g}">${agCap(agLbl(g))}${nt?` · ${nt} ${nt===1?'appunto':'appunti'}`:''} ›</button>${mgr?`<button type="button" class="icon-btn" data-a="agNewAt" data-g="${g}" data-v="" aria-label="Nuovo evento ${agLbl(g)}">${ic('plus')}</button>`:''}</div>${agDay(g,me).length?agList(g,me,mgr):''}`}).join('')}
  else{const d=agD(A_.g),p=today(new Date(d.getFullYear(),d.getMonth(),1)),n=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(),vu=agWd(p);
    nav=AG_MESI[d.getMonth()][0].toUpperCase()+AG_MESI[d.getMonth()].slice(1)+' '+d.getFullYear();
    let c=['L','M','M','G','V','S','D'].map(x=>`<span class="ag-wd">${x}</span>`).join('')+'<span></span>'.repeat(vu);
    for(let i=0;i<n;i++){const g=agAdd(p,i),k=agDay(g,me).length+(mgr?agNotes(g,realU()).filter(x=>!x.ok).length:0);c+=`<button type="button" class="ag-c${g===today()?' oggi':''}" aria-pressed="${A_.sel===g}" data-a="agSel" data-v="${g}" aria-label="${agLbl(g)}${k?', '+k+' eventi':''}">${i+1}${k?`<i>${k>3?'•••':'•'.repeat(k)}</i>`:''}</button>`}
    body=`<div class="ag-grid">${c}</div>`+(A_.sel?`<div class="ag-dt"><button type="button" class="ag-dl" data-a="agDayGo" data-v="${A_.sel}">${agCap(agLbl(A_.sel))} · apri il giorno ›</button></div>${agList(A_.sel,me,mgr)}`:`<p class="muted small ag-vuoto">Tocca un giorno per vedere gli eventi.</p>`)}
  return`<div class="grab"></div><div class="sh-h"><div class="sh-t">Agenda<div class="sh-s">${mgr?'Eventi, gruppi e cose da ricordare':'Gli eventi che ti riguardano'}</div></div><button type="button" class="icon-btn" data-a="closeSheet" aria-label="Chiudi">${ic('x')}</button></div>
  ${mgr?`<div class="ag-q"><input class="inp" id="ag-q" data-in="agQ" value="${esc(A_.q)}" placeholder="Es. domani ore 20 gruppo Rossi 40 coperti" aria-label="Scrivi o detta un evento" enterkeyhint="done">${vSR()?`<button type="button" class="icon-btn${A_.mic?' on':''}" data-a="agMic" aria-label="Detta">${ic('mic')}</button>`:''}<button type="button" class="btn primary sm" data-a="agQuick">Aggiungi</button></div>
  <div class="ag-2" style="margin:8px 0 4px"><button type="button" class="btn ghost sm" data-a="agFoto">${ic('camera')} Foto dell'agenda</button><button type="button" class="btn ghost sm" data-a="agNew">${ic('plus')} Nuovo evento</button></div>`:''}
  <div class="seg wide" style="margin-top:10px">${[['oggi','Giorno'],['sett','Settimana'],['mese','Mese']].map(([k,l])=>`<button type="button" aria-pressed="${A_.v===k}" data-a="agV" data-v="${k}">${l}</button>`).join('')}</div>
  <div class="ag-nav"><button type="button" class="icon-btn" data-a="agGo" data-v="-1" aria-label="Prima">‹</button><b>${esc(nav)}</b><button type="button" class="icon-btn" data-a="agGo" data-v="1" aria-label="Dopo">›</button></div>
  ${agVedeOggi()?'':`<div class="ag-oggi"><button type="button" class="btn ghost sm" data-a="agToday">Torna a oggi</button></div>`}

const agVedeOggi=()=>{const A_=S.ag,t=today();return A_.v==='oggi'?A_.g===t:A_.v==='sett'?agLun(A_.g)===agLun(t):A_.g.slice(0,7)===t.slice(0,7)};

let agRec=null;
function agMicStop(){const r=agRec;agRec=null;if(S.ag)S.ag.mic=false;if(r)try{r.abort()}catch(e){}}
function agMic(){const C=vSR();if(!C)return;if(agRec){agMicStop();refreshSheet();return}
  let r;try{r=new C()}catch(e){return toast(VERR.other[1],'warn')}
  agRec=r;r.lang='it-IT';r.interimResults=false;r.continuous=false;S.ag.mic=true;refreshSheet();
  r.onresult=e=>{if(agRec!==r)return;const t=String((e.results[0]&&e.results[0][0]&&e.results[0][0].transcript)||'').trim();agMicStop();if(t){S.ag.q=t;agQuick()}else refreshSheet()};
  r.onerror=e=>{if(agRec!==r)return;agMicStop();refreshSheet();if(e.error!=='aborted')toast((VERR[e.error]||VERR.other)[1],'warn')};

/* striscia «Oggi in hotel» e pulsante nell'intestazione */
/* scatola nera (S3): gli errori dei telefoni vanno al Worker (/errori, primo D1); lo sviluppatore li vede in cima all'app */
const ERR={q:[],seen:{},list:[],at:0,busy:0};
function errLog(m,st){try{m=String(m||'').slice(0,500);if(!m||/ResizeObserver loop/.test(m))return;const k=m.slice(0,120),x=ERR.seen[k];if(x){x.n++;return}
  if(Object.keys(ERR.seen).length>=30)return;const e={m,s:String(st||'').slice(0,1500),v:String(APP_VER),u:S.me||'',p:S.tab||'',t:Date.now(),n:1};ERR.seen[k]=e;ERR.q.push(e);setTimeout(errFlush,5000)}catch(_){}}
addEventListener('error',e=>errLog(e.message||(e.error&&e.error.message),e.error&&e.error.stack));
addEventListener('unhandledrejection',e=>{const r=e.reason;errLog(r&&r.message?r.message:String(r),r&&r.stack)});
const errOk=()=>!DEMO&&S.db&&S.db.kind==='firebase'&&S.db.status().ready;
async function errFlush(){if(!ERR.q.length||ERR.busy||!errOk())return;ERR.busy=1;const l=ERR.q.splice(0,10);
  try{const r=await fetch(PUSH_URL+'/errori',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+await algTok()},body:JSON.stringify({e:l})});if(r.status>=500)ERR.q.unshift(...l)}
  catch(_){ERR.q.unshift(...l)}finally{ERR.busy=0}}
async function errLoad(){if(!errOk()||!isDev(realU()))return;ERR.at=now();
  try{const r=await fetch(PUSH_URL+'/errori',{headers:{authorization:'Bearer '+await algTok()}});if(r.ok){ERR.list=(await r.json()).e||[];schedule()}}catch(_){}}
setInterval(()=>{errFlush();if(now()-ERR.at>600000)errLoad()},60000);
const errNew=()=>{const v=Number(ls('jona_err_vis')||0);return ERR.list.filter(e=>e.t>v)};

  return`<button type="button" class="ag-strip err-strip" data-a="errOpen">${ic('warn')}<span><b>${l.length===1?'1 errore nuovo':l.length+' errori nuovi'} sui telefoni</b> Tocca per vederli (solo sviluppatore)</span></button>`}

  ${ERR.list.length?`<div class="panel">${ERR.list.map(e=>`<div class="row"><div class="row-i"><div class="row-t">${esc(e.m)}${e.n>1?` <span class="tag">×${e.n}</span>`:''}</div><div class="row-m">${esc(new Date(e.t).toLocaleString('it-IT',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}))} · ${esc(nm(e.u))} · v${esc(e.v||'?')}${e.p?' · '+esc(e.p):''}</div>${e.s?`<pre class="err-s">${esc(e.s)}</pre>`:''}</div></div>`).join('')}</div>`:'<p class="muted">Nessun errore registrato.</p>'}
  <div class="btns col" style="margin-top:14px"><button type="button" class="btn primary block" data-a="errSeen">Segna come visti</button></div>`})}

async function guard(fn,el){
  if(el&&el.tagName==='BUTTON'){if(el.dataset.busy)return;el.dataset.busy='1'}
  try{await fn()}catch(e){console.warn(e);toast(errMsg(e),'err')}finally{if(el&&el.isConnected)delete el.dataset.busy}
}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const f=A[t.dataset.a];if(!f)return;if(t.tagName!=='A')e.preventDefault();guard(()=>f(t.dataset,t),t)});
document.addEventListener('input',e=>{const t=e.target;const f=t.dataset&&IN[t.dataset.in];if(f)f(t)});
document.addEventListener('change',e=>{const t=e.target;const f=t.dataset&&CH[t.dataset.ch];if(f)guard(()=>f(t))});
document.addEventListener('keydown',e=>{
  const tid=e.target&&e.target.id;
  if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&(tid==='ch-ta'||tid==='jona-q')){e.preventDefault();guard(tid==='ch-ta'?chSend:()=>jonaAsk());return}
  if(e.key==='Enter'&&!e.isComposing&&(tid==='ag-q'||tid==='ag-nt'||tid==='agf-cl')){e.preventDefault();const k=tid==='ag-q'?'agQuick':tid==='ag-nt'?'agNtAdd':'agClAdd';guard(()=>A[k]({}));return}
  if(e.key==='Escape'&&sheets.length){closeSheet();return}
  if(e.key==='Escape'&&CHAT.box){if(S.chat&&S.chat.c){S.chat.c=null;chPaint(true)}else chClose();return}
  if(e.key==='Enter'&&e.target&&e.target.closest&&e.target.closest('[data-form="login"]')){e.preventDefault();guard(doLogin)}
});

/* ---- indietro del telefono (gesto dal bordo o tasto): torna indietro di un passo dentro l'app invece di uscire.
   Finché c'è qualcosa da chiudere resta una voce in più nella cronologia («trap»): il gesto la toglie, «navBack» fa un passo
   e, se resta ancora qualcosa, la voce si rimette. Ordine: foto aperta, barra delle reazioni, conversazione → lista, chat,
   passo indietro dentro il foglio (sugBack/impBack), foglio, scheda precedente. */
const NAV={trap:false,skip:0,tabs:[]};
const navVis=el=>!!(el&&el.getClientRects().length);
const navCan=()=>!!(CHAT.box||sheets.length||NAV.tabs.length);
function navSync(){if(NAV.skip)return;const need=navCan();
  if(need&&!NAV.trap){try{history.pushState({jona:1},'');NAV.trap=true}catch(e){}}
  else if(!need&&NAV.trap){NAV.trap=false;NAV.skip=1;history.back()}}
function navBack(){
  if(CHAT.box){const v=CHAT.box.querySelector('.cht-view');if(v)return v.remove();
    if(CHAT.box.querySelector('.cht-rb'))return chReClose();
    if(S.chat&&S.chat.rec)return chRecStop(false);
    const b=CHAT.box.querySelector('[data-a="chBack"]');if(S.chat&&S.chat.c&&navVis(b))return b.click();
    return chClose()}
  const o=sheets[sheets.length-1];
  if(o){const b=[...o.el.querySelectorAll('[data-a="sugBack"],[data-a="impBack"]')].find(navVis);return b?b.click():closeSheet()}
  while(NAV.tabs.length){const t=NAV.tabs.pop();if(t&&t!==S.tab){S.tab=t;window.scrollTo(0,0);return render()}}}
addEventListener('popstate',()=>{if(NAV.skip){NAV.skip=0;return navSync()}NAV.trap=false;guard(navBack);navSync()});

/* ================= avvio ================= */
(()=>{const h=new URLSearchParams(location.hash.slice(1));const k=h.get('k'),c=h.get('i');if(!k&&!c)return;
  if(c&&/^[A-HJ-NP-Z2-9]{6}$/i.test(c))ls('jona_icode',c.toUpperCase());
  if(/^[A-Za-z0-9]{20,64}$/.test(h.get('t')||''))ls('jona_itk',h.get('t'));
  if(h.get('c')){try{ls('jona_fb',JSON.parse(atob(h.get('c'))))}catch(e){}}
  if(/^[A-Za-z0-9]{16,64}$/.test(k)&&ls('jona_key')!==k){ls('jona_key',k);ls('jona_member',null)}
  history.replaceState(null,'',location.pathname+location.search)})();
async function boot(){
  applyTheme();document.documentElement.classList.add('intro');setTimeout(()=>document.documentElement.classList.remove('intro'),4100);
  /* chi è già entrato vede l'apertura fino alla fine dell'animazione (4,4 s; un tocco la salta); niente con «riduci movimento» né nelle prove automatiche */
  if(ls('jona_me')&&!animOff()&&!navigator.webdriver){S.splash=true;const end=()=>{if(!S.splash)return;S.splash=false;removeEventListener('click',end,true);render()};addEventListener('click',end,true);setTimeout(end,3800)}
  $('#picker').addEventListener('change',()=>{const p=$('#picker');const fs=[...(p.files||[])];const cb=pickCb;pickCb=null;if(fs.length&&cb)guard(()=>cb(fs))});
  render();
  const icod=ls('jona_icode');if(icod){ls('jona_icode',null);try{const k=await invRedeem(icod);if(ls('jona_key')!==k){ls('jona_key',k);ls('jona_member',null)}}catch(e){S.joinK=icod;toast(e.message==='scaduto'?'Codice d\'invito scaduto: chiedi allo chef un invito nuovo.':'Non riesco a leggere il codice: controlla la rete e tocca «Collega».','warn')}}
  const key=ls('jona_key');
  if(fbCfg()&&key){try{await need('firebase');S.db=FirebaseStore(key);render()}catch(e){S.fbLibErr=true;render();return}}
  else S.db=LocalStore;
  try{await seedIfEmpty()}catch(e){toast(errMsg(e),'err')}
  if(S.db.kind==='locale'&&fbCfg())fbPublic().then(a=>{S.fbActive=a;schedule()});
  Object.keys(COLS).forEach(subscribe);
  regRestore();
  setTimeout(()=>{if(!allLoaded()){S.loadTimeout=true;render()}},5000);
}
boot();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
  // versione nuova pubblicata mentre l'app era aperta: il service worker nuovo prende il posto del vecchio → avviso «App da aggiornare»
  const had=!!navigator.serviceWorker.controller;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had)updOn()});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)navigator.serviceWorker.getRegistration().then(r=>r&&r.update()).catch(()=>{})})}
