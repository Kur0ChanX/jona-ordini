    dev:{aggiunte:['`config/app.funz` {agenda} con `FUNZ`/`funzOn`/`funzSet`; conta d\'uso `config/uso_<AAAA-MM>` {agenda:{<persona>:giorni}}, una scrittura al giorno per telefono (`jona_uso`).','Agenda in `config/agenda_<AAAA-MM>` e `config/agenda_ric` {e:{<id>:ev}}, scrittura `e.<id>`, cancellazione `e.<id>: null`; `agParse` per la riga veloce, `agFotoGo` con `gemCall`, `agStrip` dopo `pushAsk`. Nessuna regola nuova.','Tipo `ev.k` (`AG_K`: ev, info, op, memo; vecchi eventi = ev). Creano e modificano `agCan`: `isMgr` o reparto `fb`/`resp`.']}},
  {v:41,data:'2026-10-07',titolo:'Invito WhatsApp con profilo pronto',
    tutti:['Staff → Aggiungi: crei il profilo e mandi il link su WhatsApp. Il link vale una volta sola: chi lo apre sceglie la sua password ed entra subito, senza approvazione.','Impostazioni → «Entrata libera»: per 48 ore chi inquadra il QR della cucina o apre un invito entra subito, senza approvazione. Poi si richiude da sola.'],
    dev:{aggiunte:['Invito monouso: `inviti/<gettone>` {sid, fino 7 giorni}, link `INV_URL/<codice>/<gettone>` → `#i=…&t=…` (`jona_itk`), `screenInvite`/`itGo`; `phone.tk` in un batch approva il membro (`tk`), cancella l\'invito e attiva `staff/<sid>` (stato `invitato` → `attivo`, password scelta). Gestore: `invMonoSend`, `invMonoSheet`, «Nuovo link d\'invito». Regole: `invitoBuono`, `mioInvito`, `match /inviti`, `match /staff`.','`pubblico/porta` {fino} (al massimo 49 ore avanti, regole); `phone.auto` dopo la richiesta: `ok:true` da sé e profilo con `phStaff`; `ptRow`/`ptSet` in Impostazioni. Servono le regole nuove.']}},
  {v:40,data:'2026-10-07',titolo:'Notifiche più semplici',
    tutti:['Se le notifiche non sono attive, in alto compare «Attiva le notifiche»: basta un tocco («Più tardi» la nasconde per 3 giorni).','I gestori vedono in Staff chi riceve gli avvisi (🟢) e chi no (🔴): si sistemano solo i telefoni in rosso.','Se le notifiche non si attivano, l\'app riprova da sola e nella guida mostra l\'errore esatto del telefono.','Guida più completa per i telefoni Oppo, Realme e OnePlus.'],
    dev:{correzioni:['`pushOn`: se `subscribe` fallisce, toglie l\'iscrizione vecchia, aspetta 1,5 s e riprova; `S.pushErr` (nome + messaggio) mostrato in `pushHelp` (`.ph-err`).','`pushAsk`: avviso sotto `banner()` se le notifiche non sono attive (o bloccate → guida), «Più tardi» in `jona_push_ask` per 3 giorni. `vStaff`: 🟢/🔴 per profilo attivo da `PUSH.subs` (`p.u`), conteggio dei senza avvisi; `pushWatch` ridisegna con `schedule()`.','Barra Test: niente più avviso a ogni cambio vista (si accumulavano), pulsante della vista attuale colorato (`.testbar .seg`).','Testi: «Mario» sostituito con «lo sviluppatore» in tutto ciò che vedono gli utenti (prova `tools/test-testbar.mjs`).']}},
  {v:39,data:'2026-10-07',titolo:'Logo di apertura più grande',
    tutti:['All\'apertura il logo «by YNOY CORP» è più grande e più in alto, con «by» più vicino.'],
    dev:{correzioni:['`.wall-by i` 172 px, `gap` 2 px, niente spazio sopra; schermata d\'apertura con classe `splash` e `.splash .wall-by` 24 px dal fondo.']}},
  {v:38,data:'2026-10-07',titolo:'Logo di apertura più pulito',
    tutti:['Il logo «by YNOY CORP» all\'apertura è un po\' più grande, più in alto ed entra prima: niente più righe bianche durante l\'animazione.'],
    dev:{correzioni:['`.wall-by i` 155 px, `media/ynoy.png` con 8 px trasparenti per lato (riga bianca sul bordo), margine in basso -12 px; `byIn` da 0,6 s, `ynoyIn` da 1 s senza `filter:blur` (righe bianche sui telefoni Android con maschera + sfocatura), `ynoyShine` da 2,4 s; `S.splash` 4,4 s, `.intro` tolta a 4,7 s.']}},
  {v:37,data:'2026-10-06',titolo:'Nuovo indirizzo dell\'app',
    tutti:['L\'app ha un indirizzo nuovo: jona-ristorante-by-ynoy-corp.pages.dev. Cancella la vecchia icona dalla schermata Home, installa l\'app dal nuovo indirizzo ed entra con il nuovo invito.'],
    chef:['Manda un invito nuovo a chi usa l\'app (Staff → Invita), poi approva i telefoni in Staff → «Telefoni da approvare».','Il QR fisso della cucina va rifatto e ristampato.'],
    dev:{aggiunte:['App su Cloudflare Pages (`jona-ristorante-by-ynoy-corp.pages.dev`, workflow `cloudflare-pages.yml`, `_headers` con CORS sul manifest). Sottodominio Worker `WK_SUB`=`jona-ristorante-by-ynoy-corp` (`PUSH_URL` di `sw.js`, `sub` VAPID, `APP` del Worker `invito`, prove del workflow). Script in `<head>`: da `*.github.io` passa al nuovo indirizzo solo se il manifest risponde, con `search` e `hash`. Manifest con percorsi relativi. Firma «Jona_Ristorante By YNOY CORP» in `og:site_name` e anteprima dell\'invito; logo YNOY CORP in fondo alle schermate d\'ingresso e di caricamento (`BY`, `.wall-by`, maschera `media/ynoy.png`).']}},
  {v:36,data:'2026-10-05',titolo:'Animazione dell\'invio rifatta',
    tutti:['Animazione «Inviato allo chef» rifatta: ora sei tu, a sinistra, a consegnare il menù allo chef. Bordi della giacca puliti, niente pezzi di sfondo bianco.'],
    chef:['Quando segni un ordine come inviato al fornitore parte un\'animazione: lo chef consegna il menù.','Lo staff vede solo l\'inizio e la fine dei turni: niente ore del giorno, niente totale della settimana, né nella schermata «I miei orari» né nell\'avviso degli orari pubblicati. Il contratto e il confronto con le ore fatte restano solo per chi fa gli orari.'],
    dev:{aggiunte:['`vMieiOrari`: tolto il riquadro `or-mtot` (totale settimana) e le ore di ogni giorno (`or-dm` resta solo per «Finisci dopo mezzanotte»); avviso `orari` senza le ore totali. Il contratto resta in `staff.contratto`, mostrato solo con `isGM`.','`media/invio-chef.mp4` rifatto dal filmato originale con `tools/anim-invio.py` nuovo: niente IA, sfondo = bianco bruciato (min canali ≥ 250), zone bianche chiuse tolte salvo i riflessi sulla giacca (anello ≥ 70% stoffa); divisa dello chef e vestito della ragazza restano pieni; contorno della giacca lisciato (sfocatura σ 7 e soglia a metà, solo entro 30 punti dalla stoffa). Lo script fa due video: `invio-chef.mp4` specchiato (ragazza a sinistra; logo del menù e ricamo della giacca rimessi dritti incollando il riquadro originale nel punto specchiato, riquadri stabilizzati con mediana su 5 fotogrammi) e `invio-fornitore.mp4` invertito nel tempo (chef a sinistra), mostrato da `markSent` con `sendAnim("forn", "Inviato a …")`.']}},
  {v:35,data:'2026-10-05',titolo:'Scadenze per lo staff e QR da cucina',
    tutti:['Se Maurizio fissa una scadenza, ti arriva un avviso sul telefono: «Richieste allo chef entro le…». Arriva anche con l\'app chiusa.','Quando c\'è una versione nuova dell\'app compare l\'avviso «App da aggiornare»: chiudi e riapri l\'app, oppure tocca «Aggiorna ora».'],
    chef:['Impostazioni → «Oggi si ordina» arriva a: scegli chi riceve il promemoria degli ordini. Se non scegli nessuno, arriva a tutti gli Admin Chef.','Impostazioni → Scadenze per lo staff: giorni, ora «Entro le», ora dell\'avviso e reparti. Puoi fare una scadenza per tutte le richieste o una per ogni fornitore.','Impostazioni → QR da cucina: un QR da stampare e appendere che non scade. Chi lo inquadra chiede di entrare e a te arriva una notifica: lo approvi in Staff.'],
    dev:{aggiunte:['`config/app.scad` (`scadL`, `scadDue`, `scadTick`: notifica `scad_<id>_<giorno>_<persona>` per lo staff dei reparti scelti) e `config/app.promA` (`promDest`/`promTo`); `promPlan` manda anche `gest` e `scad` al Worker, `promTick` le scadenze (`s_<id>` in `fatto`).','Worker `/richiesta` (telefono in attesa con `req` → push ai gestori, una volta ogni 10 min), `/inviti` con `{fisso, vecchio}` (QR da cucina, `config/app.qrFisso`), `/invito/<codice>` con al massimo 20 codici sbagliati all\'ora per IP (tabella `inv_err`).','`banner`/`updOn`: avviso «App da aggiornare» su `controllerchange` (controllo con `registration.update()` al ritorno in primo piano) e da `netWatch`, che non ricarica più da solo.']}},
  {v:34,data:'2026-10-04',titolo:'Promemoria degli ordini puntuali',
    chef:['L\'avviso «Oggi si ordina da…» ora lo manda il server all\'ora giusta, anche se nessuno ha l\'app aperta. Basta aprire l\'app una volta dopo l\'aggiornamento.'],
    dev:{aggiunte:['Worker `/promemoria` (solo membri): piano con fuso, fornitori (`g`, `at`, `lim`, `s` = ultimo invio) e iscrizioni dei gestori nella tabella `prom` del primo D1; cron `*/5 * * * *` → `promTick` (una volta al giorno per fornitore, iscrizioni scadute tolte).','App: `promPlan`/`promSrv` in `deadlineTick` mandano il piano solo se cambia (impronta in `jona_prom`, ripetuto ogni 6 h); con il server attivo l\'app scrive solo l\'avviso nella campanella, senza push (`notify` con `np`).']}},
  {v:33,data:'2026-10-04',titolo:'Vocali dall\'iPhone più sicuri',
    tutti:['Su iPhone i vocali partono anche quando prima davano errore. Se un vocale lungo arriva al limite, si ferma e parte da solo. Se un invio non riesce, il messaggio dice il motivo.'],
    dev:{correzioni:['`chAuType`: tipo del vocale normalizzato (Safari può dare `video/mp4` o vuoto, che il Worker rifiutava con 415).','`chRec`: pezzi arrivati dopo `stop` (WebKit) raccolti con un\'attesa di 400 ms; fermata automatica a 1,15 MB (Safari può ignorare `audioBitsPerSecond`).','`chFile`: errore con il codice HTTP e messaggio giusto per 413.']}},
  {v:32,data:'2026-10-04',titolo:'Schermate più leggibili sui telefoni piccoli',
    chef:['Nelle richieste da approvare, sui telefoni piccoli il nome del prodotto ha tutta la riga e quantità, unità e «togli» vanno sotto: niente più parole spezzate una per riga.'],
    tutti:['Sui telefoni piccoli i pulsanti a due scelte (per esempio «Questa settimana» e «Settimana scorsa») vanno a capo invece di nascondere metà della scritta.'],
    dev:{correzioni:['`gmLine` usa `line wrap big` (nome su riga intera quando non c\'è spazio).','`.seg.wide` sotto 360 px: testo a capo, padding ridotto.','`.fadd` («Aggiungi da …») va a capo invece di uscire dal blocco.','Controllo completo: tutte le prove in `tools/` verdi, giro Playwright di ogni scheda per Staff, Admin Chef e Sviluppatore a 320 e 390 px, tema chiaro e scuro.']}},
  {v:31,data:'2026-10-04',titolo:'Chi c\'è in turno oggi, promemoria degli ordini, consumi più comodi',
    chef:['Nella scheda di ogni fornitore puoi scegliere i giorni in cui si ordina: in quei giorni ricevi l\'avviso «Oggi si ordina da…». Senza ora scelta arriva un\'ora prima dell\'ora limite, o alle 10:00. Se l\'ordine è già partito, niente avviso.','In «Consumi e costi» tocca due volte una barra per vedere solo quel fornitore o quel periodo; «Indietro» torna a prima. Tocca il nome di un prodotto per vedere solo quello. Sotto la spesa totale vedi quanto è cambiata rispetto al periodo prima.'],
    tutti:['In «I miei orari» c\'è il riquadro «In turno oggi»: chi lavora oggi e a che ora, con «Adesso» per chi è già in servizio. Lo vede anche chi fa gli orari nella scheda Staff.'],
    dev:{aggiunte:['`orOggi` (da `tp` della settimana corrente, solo persone attive) in `vMieiOrari` e `vOrari` (settimana corrente).','Promemoria per giorno: `fornitori.giorniOrdine` [0=lun..6=dom] e `oraPromemoria`, `promInfo`, ciclo in `deadlineTick` (chiave `p_<fid>` in `jona_rem`, notifica tipo `promemoria`, non ripetuta fra telefoni).','Consumi: `rpCalc(R,rng)`, `rpPrev`/`rpCmp` (confronto con lo stesso tratto del periodo prima), `rpDrill` (secondo tocco, clic o Invio; `data-df`/`data-da`/`data-db`), `rpBack` (pila `S.rp.back`), `rpProd`.']}},
  {v:30,data:'2026-10-04',titolo:'Invito con codice, pallino sull\'icona e vocali con l\'onda',
    chef:['L\'invito ora ha un link corto e un codice di 6 lettere (vale 7 giorni). Se il telefono nuovo chiede un codice, basta scriverlo nella schermata «Collega questo telefono».','L\'anteprima su WhatsApp non ha più il finto pulsante: si tocca il link.'],
    tutti:['I vocali in chat mostrano la forma della voce, come su WhatsApp: barre alte dove si parla, linea piatta nel silenzio. Mentre ascolti le barre si colorano; tocca un punto per saltare lì. Mentre registri vedi le barre muoversi.','Sull\'icona dell\'app compare un pallino col numero delle cose importanti: messaggi in chat non letti, avvisi e cose da approvare. Le novità dell\'app non contano.','Su iPhone il pallino si vede con l\'app sulla schermata Home e le notifiche permesse nelle Impostazioni del telefono. Su Android dipende dal telefono: di solito compare solo con le notifiche attive.'],
    dev:{aggiunte:['Forma d\'onda dei vocali: `wfStart`/`wfStop` (AnalyserNode sul microfono, volume ogni 100 ms), `wfCode` (40 cifre 0–9 nel campo `wf` del messaggio), `wfBars`, `chSeek` (tocco sulle barre per saltare), barre dal vivo durante la registrazione (`#ch-rw`).','Inviti con codice: Worker `invito` (link corto `invito.<WK_SUB>.workers.dev/<CODICE>` → app con `#i=`), `/inviti` e `/invito/<codice>` nel Worker principale (tabella `inviti` nel primo D1, 7 giorni); app `invNew`, `invRedeem`, `jona_icode`, `fbJoinKey` accetta il codice; link lungo `#k=` di ripiego.','`badgeCount`/`appBadge` (in `render`, `obxBadge` lo richiama), numero salvato nella cache `jona-badge` (`./badge-n`); `sw.js` lo aumenta di 1 a ogni push con l\'app non in vista e lo cala dopo l\'invio della coda.']}},
  {v:29,data:'2026-10-04',titolo:'Invito più bello',
    chef:['Impostazioni → Database centrale → Invita: «Manda l\'invito» spedisce un messaggio di benvenuto con i passi da fare, e su WhatsApp il link compare con l\'anteprima del Jona.','Nuovo pulsante «Cartolina con QR»: un\'immagine con logo e QR code da mandare o stampare (per esempio da appendere in cucina).'],
    dev:{aggiunte:['`inviteText`, `inviteCard` (canvas 1080×1350, condivisione file o download), meta Open Graph con `media/invito.jpg`.']}},
  {v:28,data:'2026-10-04',titolo:'Vocali su iPhone e tasto indietro',
    tutti:['I vocali mandati da Android ora si ascoltano anche su iPhone. I vocali vecchi che l\'iPhone non riesce ad aprire vanno rimandati.','Il gesto «indietro» del telefono (scorrere dal bordo dello schermo) ora torna indietro di una pagina: chiude la finestra aperta, la chat o torna alla scheda di prima, invece di uscire dall\'app.'],
    dev:{correzioni:['Chrome con `audio/mp4` senza codec registrava Opus dentro l\'MP4, illeggibile su iPhone: `chRec` usa MediaRecorder solo con `mp4a.40.2` (o MP4 semplice su iPhone/Safari, `chApple`), altrimenti `aacRec` (WebCodecs `AudioEncoder` AAC + intestazioni ADTS, `audio/aac`, 32 kbps), WebM/Opus per ultimo.','`chPlay` usa un solo lettore (`chAu`) sbloccato con un attimo di silenzio dentro il tocco (su iPhone il play dopo lo scaricamento veniva rifiutato); barra con `dur` del messaggio se il file non dice la durata; messaggi d\'errore distinti.'],aggiunte:['Indietro del telefono: `NAV` (una voce in più nella cronologia finché c\'è qualcosa da chiudere, `navSync` in `render`/`openSheet`/`closeSheet`/`chOpen`), `navBack` (foto, reazioni, registrazione, conversazione → lista, chat, `sugBack`/`impBack`, foglio, scheda precedente da `NAV.tabs`).']}},
  {v:27,data:'2026-10-04',titolo:'Reazioni ai messaggi',
    tutti:['In chat puoi rispondere a un messaggio con una faccina: tieni premuto il messaggio e scegli 👍 ❤️ 😂 ✅ 😢 o 👎. Tocca di nuovo la stessa faccina per toglierla.','Tenendo premuto un messaggio scritto puoi anche copiarne il testo.'],
    dev:{aggiunte:['Reazioni in `messaggi/<id>.r.<persona>` (solo le emoji di `CH_RE`, tolta con `FieldValue.delete()`): `chRx`, `chRb`, `chReact`, `chLp` (pressione lunga 450 ms o tasto destro, il clic dopo viene ignorato), `chCopy`. Nessuna regola nuova: `messaggi` è già scrivibile dai membri.']}},
  {v:26,data:'2026-10-04',titolo:'Foto e vocali in chat',
    tutti:['In chat puoi mandare una «foto» (tasto con la macchina fotografica) e un «messaggio vocale» (tasto con il microfono: parla, poi premi la freccia per inviare o il cestino per cancellare). I vocali durano al massimo 2 minuti.','Foto e vocali restano 60 giorni, poi si cancellano da soli.','Nuovi reparti: «F&B Manager» e «Responsabile».','Se hai bloccato le notifiche per sbaglio, l\'app ti spiega passo passo come sbloccarle.'],
    dev:{aggiunte:['Worker `/allegati` (POST base64 con `x-tipo`, GET `/allegati/<db>-<id>`, `/allegati/spazio`) su D1 `ALLEGATI0..3` creati dal workflow (Account › D1 › Edit sul token), tetto 440 MB per database con cancellazione dei più vecchi, cron notturno oltre 60 giorni. App: `ALG`, `algUp`/`algGet` (cache `jona-allegati`), `algImg` (1280 px WebP/JPEG + `mini` 40 px), `chRec` (MediaRecorder MP4/AAC o WebM/Opus, 24 kbps, 2 min), `chPlay`, `chView`, spazio in fondo alla lista chat per lo sviluppatore.','`REPARTI` con `fb` e `resp` (la chiave `altro` resta «Altro»); `PUSH_DENY` e `pushDenied()` in `pushHelp` quando `Notification.permission` è `denied`.']}},
  {v:25,data:'2026-10-04',titolo:'Chat anche sul Wi-Fi lento',
    tutti:['Se il Wi-Fi rallenta i messaggi (per esempio quello dell\'hotel), l\'app se ne accorge e passa da sola a un collegamento che funziona meglio.','Nella chat: «Usa questa chat in modo responsabile e solo per lavoro».'],
    dev:{risolti:['`netWatch`: scrittura non confermata in 4 s con la rete accesa → `jona_fb_lp` e ricarica dopo la conferma (solo senza fogli aperti, testo in chat o scritture in sospeso), altrimenti alla prossima apertura. Usato in `track` e in `chSend`.']}},
  {v:24,data:'2026-10-04',titolo:'Telefoni approvati e chat più svelta',
    tutti:['Quando riapri l\'app la chat si aggiorna subito, senza aspettare.'],
    chef:['Un telefono nuovo non vede più nessun dato finché tu o lo sviluppatore non lo approvate: lo trovi in Staff → «Telefoni da approvare». Con un profilo nuovo, approvando crei anche il profilo.'],
    dev:{aggiunte:['`membri/<uid>.ok=false` per i telefoni nuovi, richiesta in `req` (profilo nuovo con `sid` e `pass`, o «ho già un profilo»); `screenPhone`, `phoneSheet`, `phSend`; gestori: `PH`, `phWatch`, `phApprove`, `phReject`. Regole: `membro()` vuole `ok` non falso, solo chi ha attivato (`chiave.uid`) entra senza attesa. Worker `/gemini` rifiuta `ok:false`.'],
      risolti:['Chat lenta dopo il ritorno in primo piano: `disableNetwork`/`enableNetwork` se l\'app è rimasta nascosta più di 5 s.','L\'approvazione conta solo se confermata dal server (non da una scrittura locale).']}},
  {v:23,data:'2026-10-04',titolo:'Nome utente automatico',
    tutti:['Mentre scrivi nome e cognome, il nome utente si compila da solo (per esempio mario.loi). Puoi cambiarlo se vuoi.','Accenti e apostrofi nel nome utente vanno bene: li togliamo noi.'],
    dev:{risolti:['Registrazione: con il nome utente vuoto o con accenti/apostrofi l\'errore diceva sempre «almeno 3 caratteri». Ora `normUser` toglie accenti e apostrofi e `checkForm` ha tre messaggi (vuoto, corto, caratteri).'],aggiunte:['`userSug`: nome.cognome senza accenti, con un numero se già usato; proposto finché il campo è vuoto o uguale alla proposta (`_uSug`), mai nella modifica di un profilo esistente.']}},
  {v:22,data:'2026-10-04',titolo:'Registrazione più semplice',
    tutti:['Dopo aver creato il profilo vedi la schermata «In attesa di approvazione»: appena Maurizio o lo sviluppatore approvano, l\'app si apre da sola.','Se il telefono ricarica l\'app mentre fai la foto del profilo, i dati scritti restano.'],
    dev:{risolti:['iPhone: la foto profilo veniva aperta a grandezza piena (fino a 48 MP) e Safari ricaricava la pagina. Ora `createImageBitmap` con `resizeWidth:640`, altrimenti la strada di prima.','Modulo di registrazione salvato in `jona_reg` (senza password e foto) prima di aprire fotocamera o galleria, ripristinato all\'avvio da `regRestore` (30 min).'],aggiunte:['`screenWait` e `waitCheck`: `jona_wait` ({id,t}) dopo la registrazione; profilo attivo → `login` automatico; disattivato o cancellato → avviso.']}},
  {v:21,data:'2026-10-04',titolo:'Nuovi telefoni: niente più attese infinite',
    chef:['Se un telefono nuovo non riesce a collegarsi, invece di restare su «Un momento…» dice cosa fare e mostra il pulsante Riprova.'],
    dev:{risolti:['Primo collegamento bloccato su iPhone: accesso e iscrizione in `membri` ora hanno un tempo massimo (`fbTmo`, 20 s); oltre, errore `fb_slow` con Riprova e, al tentativo dopo, Firestore in long polling forzato (`jona_fb_lp`).','La schermata di collegamento compare subito dopo la creazione del database (prima restava quella iniziale finché il collegamento non finiva).']}},
  {v:20,data:'2026-10-04',titolo:'Gemini per tutto il ristorante',
    chef:['«Chiedi a Jona» e le foto dei listini funzionano senza mettere la chiave Gemini su ogni telefono: basta la chiave del ristorante sul server.'],
    dev:{aggiunte:['`/gemini` nel Worker: chiave nel segreto `GEMINI_KEY` (dal segreto GitHub `GEMINI_API_KEY`), accesso solo ai telefoni in `membri/<uid>` (gettone Firebase controllato leggendo il proprio documento), se Gemini risponde 429 aspetta il `retryDelay` e riprova, poi passa al modello Lite.','`gemCall` nell\'app: chiave del telefono se c\'è, altrimenti il server; `/salute` dice `gemini:true`.']}},
  {v:19,data:'2026-10-04',titolo:'Animazione girata',
    tutti:['Nell\'animazione dopo «Invia allo chef» ora è lo chef, a sinistra, che porge il menù JONA.'],
    dev:{correzioni:['`media/invio-chef.mp4` invertito nel tempo (ffmpeg `reverse`) invece che specchiato, così il logo resta leggibile. Per rifarlo: `tools/anim-invio.py` e poi lo stesso `reverse`.']}},
  {v:18,data:'2026-10-04',titolo:'Fornitori più belli e animazione nuova',
    tutti:['L\'animazione dopo «Invia allo chef» è nuova: il menù JONA passa dalle tue mani a quelle dello chef.'],
    chef:['La pagina Fornitori ha schede grandi. Puoi aggiungere il logo di ogni fornitore: apri il fornitore, «Contatti e invio», «Scegli immagine», poi «Salva». Il logo compare anche negli ordini e negli invii.'],
    dev:{aggiunte:['`fDot` (logo o iniziale) in tutti i segni dei fornitori, `fornitori.logo` (data URL, massimo 320 px, `fileToLogo`), griglia `.fgrid`/`.fcard`.','Video rifatto dal filmato nuovo di Mario con `tools/anim-invio.py <video> 4.2 0.12 0.12` (riempimento dei buchi per il logo chiaro, memoria degli scontorni in `/tmp/anim-invio-cache`).'],
      correzioni:['Chat: «1 persona» al singolare.']}},
  {v:17,data:'2026-10-04',titolo:'Chat tra colleghi e «Chiedi a Jona»',
    tutti:['In alto, accanto alla campanella, c\'è la chat: scrivi a tutto lo staff, al tuo reparto o a un collega. Tocca la matita per una chat nuova. Le spunte diventano blu quando l\'altro ha letto.','Quando arriva un messaggio vedi un avviso e il numero dei messaggi nuovi sul pulsante della chat.'],
    chef:['Il pulsante tondo con la stellina in basso a destra è «Chiedi a Jona»: fai domande sui dati dell\'app, scritte o a voce («Quanto abbiamo speso da Metro questo mese?», «Chi lavora sabato sera?»). Risponde Gemini con la chiave di questo telefono.','Nella chat vedi i gruppi di tutti i reparti.'],
    dev:{aggiunte:['Chat: collezione `messaggi` (un documento per messaggio `{c,da,t,creato}`, `messaggi/letti` annidato per persona e chat), chat `tutti`, `rep_<reparto>`, `dm_<a>--<b>`. Parla direttamente con Firestore come le push: senza le regole nuove l\'app non si blocca e la chat spiega come attivarla. Ultimi 500 messaggi in ascolto, «Messaggi precedenti» per i vecchi. Push con `pushSend` a più persone.','«Chiedi a Jona»: `jonaCtx` (riassunto JSON di fornitori, listino, ordini, richieste, staff, orari e timbrature; contratti solo per l\'amministratore), `jonaAsk` con `system_instruction` e le ultime 8 domande, `jonaMic` per dettare.'],
      noti:['Le regole Firestore vanno pubblicate di nuovo (collezione `messaggi`): fino ad allora la chat resta spenta.']}},
  {v:16,data:'2026-10-04',titolo:'Cambi turno, timbratura e ordine suggerito',
    tutti:['Nella voce «Orari» puoi chiedere un cambio turno a un collega: tocca «Chiedi un cambio» sotto il giorno, scegli il collega e, se vuoi, un suo giorno da fare tu. Il collega accetta o rifiuta, poi Maurizio approva e gli orari si aggiornano da soli.','Se Maurizio accende la timbratura, nella voce «Orari» trovi il pulsante «Timbra»: quando arrivi e quando finisci inquadra il QR attaccato in cucina.'],
    chef:['In Invii c\'è «Ordine suggerito»: per ogni fornitore l\'app propone le quantità guardando gli ordini degli ultimi 2 mesi, ogni quanti giorni ordini, la gente prevista e il meteo di Porto Cervo. Controlli, cambi e aggiungi all\'ordine.','Contratto, ore e pause li imposti solo tu, e lo staff non li vede più. Chi fa gli orari li usa per i controlli.','Quando un turno non rispetta una regola, l\'app chiede il consenso prima di salvare: con «Salva lo stesso» l\'errore resta segnato come accettato (bordo tratteggiato) e non blocca la pubblicazione.','I cambi turno chiesti dallo staff li trovi in Staff → Orari, con il controllo delle regole: «Approva» aggiorna gli orari pubblicati e avvisa i due.','Timbratura con QR (in Impostazioni, spenta di partenza): QR da stampare, «Cambia codice», orari timbrati nella tabella e «Presenze» in Excel per il consulente del lavoro.'],
    dev:{aggiunte:['Ordine suggerito: `sugStats` (cadenza mediana e uso al giorno dagli ordini inviati degli ultimi 56 giorni), `sugRows`, `sugSheet`, `sugAdd` (un solo `put` dell\'ordine aperto), meteo Open-Meteo con `meteo()` e `wxFactor`.','Timbratura: `config/app.timbra` e `timbraK`, `config/timbr_<lunedì>` (`t.<id>.<g>` come gli orari, «HH:MM-» = in servizio, `m` = senza QR), `tbPunch` e `tbOpen` (16 ore, dopo mezzanotte), lettura con `BarcodeDetector` o `lib/jsqr-1.4.0.js`, `tbExcel`.','Cambi turno: `cambi.<id>` nella settimana pubblicata, `cmApply` scambia le giornate, `cmDecide` aggiorna `t` e `tp` passando da `orConsent`.','Consenso consapevole: `orConsent` e `ok.<persona>` con i testi degli errori accettati. Contratto modificabile solo con `isGM`.']}},
  {v:15,data:'2026-10-04',titolo:'Invio allo chef con animazione',
    tutti:['Quando tocchi «Invia allo chef» compare una breve animazione: il menù JONA passa dalle tue mani a quelle dello chef. Se hai fretta, tocca lo schermo per saltarla.','Nel carrello il pulsante per i prodotti che servono subito ora si chiama «È urgente».'],
    dev:{aggiunte:['`media/invio-chef.mp4`: video H.264 con il colore sopra e la trasparenza sotto (alpha impilato, 720×404 ciascuna); `sendAnim` lo unisce con WebGL su un canvas trasparente sopra l\'app, poi apre il solito foglio «Inviato allo chef». Caricato come blob da `animPrefetch` (apertura del carrello e invio). Si salta con «riduci movimento», senza WebGL o se il video non parte.','Video ricavato dal filmato di Mario: scontorno con rembg (isnet + u2net), tolti i bianchi e grigi neutri (sfondo e giacca), bordi sfumati, colore dei bordi preso dal soggetto.']}},
  {v:14,data:'2026-10-04',titolo:'Orari del personale',
    tutti:['Nel menu in basso c\'è la nuova voce «Orari»: vedi i tuoi turni della settimana, giorno per giorno, con le ore di lavoro. Il giorno di oggi è evidenziato.','Quando Maurizio pubblica gli orari, o li cambia, ricevi un avviso. Se sono già pronti quelli della settimana dopo, li trovi con «Settimana prossima».'],
    chef:['Nella scheda Staff tocca «Orari»: c\'è la tabella della settimana con tutte le persone, divise per reparto. Tocca una casella per mettere un turno tipo (Pranzo, Cena, Spezzato, Giornata), un\'assenza (Riposo, Ferie, Malattia, Permesso) o gli orari a mano. Con «Uguale anche per» lo metti su più giorni insieme.','Nel profilo di ogni persona ci sono le ore a settimana del contratto, la pausa e i giorni liberi.','L\'app controlla da sola: 11 ore di riposo tra un giorno e l\'altro, un riposo di 24 ore nella settimana, giornate oltre 13 ore, pause, giorni liberi e ore oltre il contratto. Le caselle con un problema hanno il bordo rosso (errore) o giallo (avviso) e in alto trovi l\'elenco «da controllare».','«Copia settimana prima» per partire dai turni già fatti, «Pubblica» per mandarli allo staff, «Avvisa delle modifiche» avvisa solo chi ha i turni cambiati. Lo staff vede gli orari solo dopo la pubblicazione.'],
    dev:{aggiunte:['Orari in `config/orari_<lunedì>`: `t` bozza, `tp` copia pubblicata, valori `HH:MM-HH:MM[,HH:MM-HH:MM]` (fine ≤ inizio = dopo mezzanotte) o `R`/`F`/`M`/`P`. Turni tipo in `config/orari_tipi`, contratto in `staff.contratto` `{ore,pausa,liberi}`. Nessuna regola Firestore nuova.','`orCheck` (sovrapposizioni, 11 ore anche dalla domenica prima, 13 ore, 24 ore di fila, giorni liberi, oltre 6 ore senza pausa, contratto e 48 ore), `vOrari` nella scheda Staff (interruttore in `jona_staffsub`), `orCellSheet`, `orTipiSheet`, `orCopy`, `orPublish` (notifica tipo `orari` solo a chi ha la riga cambiata), `vMieiOrari` nella nuova voce `orari` dello staff.','Una persona si salva con `upd(\'config\',id,{\'t.<persona>\':riga})`: `LocalStore.update` ora capisce i percorsi con il punto, come Firestore.']}},
  {v:13,data:'2026-10-04',titolo:'Prodotti urgenti e prezzi aumentati',
    tutti:['Nel carrello, sotto ogni prodotto, c\'è il pulsante «È urgente?». Toccalo se quel prodotto serve subito: Maurizio riceve un avviso importante e vede la tua richiesta in cima.','Se nel controllo merce manca un prodotto che avevi chiesto tu, ricevi un avviso.'],
    chef:['Le richieste con prodotti urgenti sono in cima, con la scritta rossa URGENTE. La notifica sul telefono resta sullo schermo finché non la tocchi.','Quando carichi un listino o una fattura, in alto vedi i prodotti che costano di più, con la percentuale di aumento. Dopo il salvataggio compare il riepilogo «Prezzi aumentati» e arriva una notifica.','Nella notifica del controllo merce vedi i prodotti mancanti o arrivati in meno e chi li aveva chiesti.'],
    dev:{aggiunte:['Import: `pctUp`, `pctS`, `rvUps` (aumenti rispetto a `matchProd`), banner in `reviewSheet`, `upsSheet` dopo `reviewSave`, notifica tipo `prezzi`; nel listino il pill «era» diventa rosso con la percentuale.','Urgenza: `S.cart[i].urg` (azione `curg`), `items[i].urgente` nella richiesta e `urgente` sulla riga d\'ordine; `reqUrg` ordina le richieste; notifica tipo `urgente` con titolo che inizia per «URGENTE» (`sw.js`: `requireInteraction` e vibrazione lunga).','Controllo merce: `ricezione.righe[i]` ha `key` e `da` (nomi di chi aveva chiesto); `rcvDiffTxt`; avviso per persona a chi aveva chiesto i prodotti mancanti.']}},
  {v:12,data:'2026-10-04',titolo:'Controllo merce a colori e invii sicuri',
    tutti:['Controllo della merce più semplice: tocca ogni prodotto. 1 tocco verde «c\'è», 2 tocchi rosso «manca», 3 tocchi giallo «ne è arrivato meno» (scegli quanti). In alto vedi quanti ne hai fatti, per esempio «9 di 14». Se è tutto giusto basta «È arrivato tutto».','Se manca la rete, in alto compare «Non ancora arrivata a Maurizio»: la richiesta parte da sola appena torna la rete e vedi «Arrivata ✓». Se hai fretta c\'è il pulsante «Manda SMS».'],
    chef:['In approvazione la richiesta è divisa in blocchi colorati, uno per fornitore. Con «+ Aggiungi da …» dentro il blocco aggiungi prodotti cercando solo nel listino di quel fornitore.','I prodotti senza fornitore sono in un blocco rosso: scegli il fornitore prima di approvare.','Nel controllo merce ora vedi anche i prodotti «non controllati».'],
    dev:{aggiunte:['`reqPickSheet` (azioni `rpick`, `rpadd`): righe aggiunte dallo chef con `aggiunto:true` e `qtaOrig:0`, non finiscono in `rimossi`.','Semaforo in `receiveSheet`: `rcvState().lines[i].st` (`\'\'`/`ok`/`ko`/`meno`), `SEM`, `SEM_NEXT`, azione `rst`; `ricezione.righe` invariato con nuovo motivo `nonctrl` e campo `nonControllati` sull\'ordine.','Invii in sospeso: `pushSend` mette in coda (IndexedDB `jona-outbox`) le push non partite; `obxFlush` su `online`, apertura, `visibilitychange` e ogni minuto; `sw.js` con Background Sync (`jona-outbox`); `navigator.setAppBadge`; `obxBar`/`obxTick` con «Arrivata ✓».'],
      noti:['Background Sync non c\'è su iPhone: lì le push in coda partono solo ad app aperta. Le scritture Firestore in sospeso ripartono solo ad app aperta.']}},
  {v:11,data:'2026-10-04',titolo:'Guida alle notifiche',
    tutti:['Se le notifiche non si attivano o non arrivano, c\'è una guida semplice per il tuo telefono (iPhone, Xiaomi, Samsung, Huawei, Oppo e altri): tocca la tua foto → «Problemi con le notifiche? Guida». Si apre da sola anche quando qualcosa va storto.'],
    dev:{aggiunte:['`pushHelp()` con `PUSH_HELP` (passi per marca, marca indovinata da `userAgent` quando possibile, `S.pushBrand`); `pushOn` apre la guida sugli errori e restituisce `true` se riesce.']}},
  {v:10,data:'2026-10-03',titolo:'Messaggio più chiaro sulle notifiche',
    dev:{correzioni:['`pushOn`: se `pushManager.subscribe` fallisce (es. `AbortError` su telefoni senza servizi Google o browser che bloccano il push) compare un messaggio chiaro invece di «Operazione non riuscita (20)».']}},
  {v:9,data:'2026-10-03',titolo:'Notifiche sul telefono',
    tutti:['Ora l\'app ti può avvisare anche quando è chiusa. Tocca la tua foto in alto → «Attiva le notifiche» → Consenti. Con «Prova» controlli che arrivino.','Su iPhone le notifiche funzionano solo se apri l\'app dall\'icona sulla schermata Home.'],
    dev:{aggiunte:['Push con Web Push + VAPID: server in `worker/` (Cloudflare, `/chiave`, `/invia`), iscrizioni in Firestore `push/<id>` (`pushOn`, `pushSend` dentro `notify()`), `sw.js` mostra la notifica. La chiave `VAPID_JWK` la crea il workflow alla prima pubblicazione.'],noti:['Le regole Firestore vanno incollate di nuovo (nuova collezione `push`), altrimenti le notifiche non si attivano. Se chi invia è senza rete la notifica push non parte (resta quella dentro l\'app).']}},
  {v:8,data:'2026-10-03',titolo:'Database centrale pronto',
    chef:['Il database centrale è pronto: quando lo sviluppatore lo attiva, tutti i telefoni vedono gli stessi ordini. Gli altri telefoni si collegano con il QR code (Impostazioni → Database centrale → Invita).'],
    dev:{aggiunte:['`firebase-config.js` con il progetto `jona-ordini`: in Impostazioni → Database centrale compaiono Attiva e Ho un codice. Finché non si preme Attiva ogni telefono resta su `LocalStore`.']}},
  {v:7,data:'2026-10-03',titolo:'Ordine a voce e Novità',
    tutti:['Puoi ordinare con la voce: premi il microfono e di\' per esempio «4 kg pomodori da Fratelli Mariano». Poi controlli e confermi.','Nuova sezione «Novità»: qui trovi cosa cambia nell\'app a ogni aggiornamento.'],
    chef:['In Storico c\'è «Consumi e costi»: quanto hai speso e quanta merce è arrivata, per periodo, fornitore, reparto e prodotto (per esempio «riso»), con grafico e file Excel.'],
    dev:{aggiunte:['Ordine con la voce: Web Speech API (`it-IT`), parser di quantità, unità, prodotto e fornitore, conferma prima di aggiungere al carrello; campo di testo se il telefono non ha il riconoscimento vocale.','Report «Consumi e costi» (funzioni `rp*`): quantità arrivate se la consegna è controllata, altrimenti quelle ordinate; grafico SVG; Excel con due fogli.','`S.db.range(collezione,campo,da,a)` in `LocalStore` e `FirebaseStore`: con più di 300 ordini il resoconto scarica dal database quelli più vecchi (`rpOrders`, `rpOld`).','Novità: `NEWS` e `APP_VER` in `index.html`, contatore per ruolo (`newsFor`, `newsCount`, `newsSheet`), ultima versione vista in `jona_news_<id>` (profilo vero, `realU()`); il ruolo mostrato segue `meU()`, così la vista Test fa vedere cosa vedono gli altri.']}},
  {v:6,data:'2026-10-03',titolo:'Copie automatiche',
    chef:['Ogni giorno l\'app salva da sola una copia di tutti i dati e la tiene per 14 giorni.','In Impostazioni → Copie automatiche puoi scaricare una copia o ripristinarla. Funziona solo con il database centrale.'],
    dev:{aggiunte:['Collezione `backup`: ogni copia è divisa in pezzi da 300.000 caratteri (sotto il limite di 1 MB per documento).','`autoBackup` (una volta al giorno, dal primo telefono di chi gestisce; giorno in `jona_bk`), `bkSheet` (lista, scarica, ripristina), `BK_DAYS` = 14 con pulizia delle copie più vecchie.','Regole `firebase/firestore.rules` aggiornate per `backup`.','Prova `tools/test-firebase-backup.mjs`.'],
      correzioni:['`today()` accetta una data.','`firebase.json` spostato nella radice: l\'emulatore non accettava le regole fuori dalla cartella.']}},
  {v:5,data:'2026-10-03',titolo:'Più semplice per lo staff',
    tutti:['Pulsanti e scritte più grandi.','Un solo «+» per prodotto: il fornitore lo sceglie l\'app (lo chef può cambiarlo).','Il pulsante «Invia allo chef» è sempre in basso.','«I tuoi soliti»: in cima al catalogo trovi i prodotti che chiedi più spesso.','Se un prodotto è già stato chiesto nelle ultime 24 ore, l\'app te lo dice prima di inviare.'],
    chef:['Nelle richieste compare l\'avviso «possibile doppione».','Ora limite per ogni fornitore, con un promemoria un\'ora prima.','In Storico c\'è il riepilogo della settimana.'],
    dev:{aggiunte:['`staffGroup`, `defOpt` (fornitore scelto in automatico), `cartBar`, `stepsHint`, `usualOf` (soliti).','`findDoppi`: la richiesta salva il campo `doppi`.','`oraLimite`, `dlInfo`, `dlBadge`, `deadlineTick` (un promemoria al giorno per fornitore, in `jona_rem`).','Dati di prova: `makeTestData` / `delTestData` (id `test_…`).','`weekSummary` in Storico.','Prove automatiche in `tools/`.'],
      correzioni:['`ask()` mantiene gli a capo del testo.','La barra del carrello sta sopra il menu anche sugli schermi larghi.']}},
  {v:4,data:'2026-10-03',titolo:'Stessi dati su tutti i telefoni',
    tutti:['L\'app funziona anche senza rete: le richieste partono da sole quando torna la connessione. In alto compare «Senza rete».','Per collegare il telefono basta inquadrare il QR code dello chef.'],
    chef:['Appena il database centrale (Firebase) è collegato, tutti i telefoni vedono gli stessi dati.','Impostazioni → Database centrale: Attiva, Invita (QR code e link), Scollega.'],
    dev:{aggiunte:['`FirebaseStore`: Firestore compat 10.14.1 in `lib/`, copia offline con `enablePersistence`.','Prodotti in `listini/<fornitore>` (campo `p.<id>`) con scritture accorpate (`lFlush`).','Accesso anonimo + chiave del ristorante: `chiave/ristorante`, `membri`, `pubblico/stato`; regole in `firebase/firestore.rules`.','Schermate «Collega questo telefono» e «Accesso non valido»; `syncPill` nell\'intestazione.','Ripristino di un backup su tutti i telefoni.','Guida `docs/FIREBASE.md`.'],
      risolti:['I telefoni non condividevano i dati.','Il QR code si crea sul telefono (`lib/qrcode-1.4.4.js`): funziona anche senza rete.']}},
  {v:3,data:'2026-10-03',titolo:'Foto dei listini con Gemini',
    chef:['In Fornitori → Importa puoi scattare o scegliere le foto del listino, anche più pagine: Gemini le trascrive.','Senza chiave mandi le foto all\'app Gemini e poi incolli la risposta.'],
    dev:{aggiunte:['Vista «Staff» nella barra Test.','`gemRun`: prova `gemini-flash-latest`, poi `gemini-2.5-flash`; chiave in `jona_gemini_key`, solo sul telefono.','`shrinkImg`: foto ridotte a 2000 px in JPEG.','`gemShare`: foto mandate all\'app Gemini con Web Share.'],
      correzioni:['Al cambio di vista nella barra Test il carrello si ricarica.']}},
  {v:2,data:'2026-10-03',titolo:'Prove per lo sviluppatore',
    dev:{aggiunte:['Barra «Test» con Admin Chef / Sviluppatore: `VIEW_AS`, `meU()` sostituisce il ruolo, `realU()` resta il profilo vero; scelta ricordata in `jona_viewas`. Il profilo salvato non cambia.']}},
  {v:1,data:'2026-10-03',titolo:'Schermo intero',
    tutti:['L\'app installata si apre a schermo intero.'],
    dev:{aggiunte:['`display: fullscreen` e `display_override` in `manifest.webmanifest`.'],
      correzioni:['Cache `jona-ordini-v4` in `sw.js`: per vedere il cambio bisogna reinstallare l\'app.'],
      risolti:['Nell\'app installata si vedeva la barra in alto (indirizzo del sito, barra del telefono).']}},
  {v:0,data:'2026-10-03',titolo:'Prima versione',
    tutti:['Cerchi i prodotti nel catalogo, li metti nel carrello e li mandi allo chef.','In «I miei ordini» vedi se la richiesta è approvata, ordinata o arrivata.','In «Arrivi» controlli la merce che arriva.'],
    chef:['Approvi o rifiuti le richieste, anche cambiando quantità e fornitore.','In «Invii» gli ordini sono già divisi per fornitore e partono come preferisce ognuno: WhatsApp, email, sito, telefono, modulo compilato, Excel, Word o PDF.','Controllo delle consegne con la foto della bolla e le differenze.','Fornitori e listini: Excel/CSV, fattura elettronica XML o tabella di Gemini incollata.','Profili dello staff da approvare.','Storico degli ordini.'],
    dev:{aggiunte:['Tutta l\'app in un solo file `index.html`.','`LocalStore`: dati in localStorage (`jona_db_v2`).','Service worker «prima la rete» (`sw.js`), manifest e icone.','Dati iniziali: Metro, F.lli Mariano, DAC, Dolpa, Nieddittas, Pascucci Caffè.'],
      noti:['I dati restavano solo sul telefono (risolto nella versione 4).','Nell\'app installata si vedeva la barra del browser (risolto nella versione 1).']}}
];

/* ================= constants ================= */
const REPARTI={cucina:'Cucina',sala:'Sala',fb:'F&B Manager',resp:'Responsabile',altro:'Altro'};
const MANSIONI=['Chef','Sous chef','Cuoco','Commis','Pasticcere','Lavapiatti','Maître','Cameriere','Sommelier','Barman','F&B manager','Altro'];
const CATS=['Pesce','Carne','Verdura e frutta','Latticini e uova','Secco e dispensa','Bevande','Caffè','Pulizia e monouso','Altro'];
const METODI={modulo:{l:'Modulo d\'ordine compilato',i:'file'},whatsapp:{l:'WhatsApp',i:'chat'},email:{l:'Email',i:'mail'},excel:{l:'File Excel per email',i:'sheet'},word:{l:'File Word per email',i:'file'},pdf:{l:'PDF per email',i:'file'},sito:{l:'Sito del fornitore',i:'globe'},telefono:{l:'Telefono',i:'phone'}};
const PAL=['#1F7F86','#3B7A57','#AE4E37','#94661C','#5B6FA8','#8A5A8C','#6B7F3A','#B0705A'];
const hue=id=>{let h=0;for(const c of String(id||'x'))h=(h*31+c.charCodeAt(0))>>>0;return PAL[h%PAL.length]};
const LIB={
  firebase:{src:['lib/firebase-10.14.1.js'],ok:()=>window.firebase&&firebase.firestore&&firebase.auth},
  qr:{src:['lib/qrcode-1.4.4.js'],ok:()=>window.qrcode},
  jsqr:{src:['lib/jsqr-1.4.0.js'],ok:()=>window.jsQR},
  xlsx:{src:['https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'],ok:()=>window.XLSX},
  jszip:{src:['https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js'],ok:()=>window.JSZip},
  jspdf:{src:['https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'],ok:()=>window.jspdf},
  pdfjs:{src:['https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js','https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'],ok:()=>window.pdfjsLib&&window.pdfjsWorker}
};
const libP={};
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('script'));document.head.appendChild(s)})}
function need(k){if(!libP[k])libP[k]=(async()=>{if(LIB[k].ok())return;for(const s of LIB[k].src)await loadScript(s);if(!LIB[k].ok())throw new Error('lib');if(k==='pdfjs')window.pdfjsLib.GlobalWorkerOptions.workerSrc=LIB.pdfjs.src[1]})().catch(e=>{delete libP[k];throw{code:'lib'}});return libP[k]}

/* ================= data store (sostituibile) =================
   Interfaccia unica usata da tutta l'app: collection(nome).doc(id).set/update/delete,
   collection(nome).orderBy().limit().onSnapshot(). Questa versione "locale" salva sul
   dispositivo; le versioni Firebase e Google Fogli implementeranno la stessa interfaccia. */
const LocalStore=(()=>{
  const KEY=lsK('jona_db_v2');let data={};
  try{data=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){data={}}
  const subs=new Set();let t=null;
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){throw{code:'quota_exceeded'}}};
  const fire=()=>{clearTimeout(t);t=setTimeout(()=>subs.forEach(s=>s()),0)};
  addEventListener('storage',e=>{if(e.key===KEY){try{data=JSON.parse(e.newValue||'{}')||{}}catch(_){}fire()}});
  const doc=(c,id)=>({id,
    set:async d=>{(data[c]=data[c]||{})[id]=clone(d);save();fire()},
    update:async d=>{if(!data[c]||!data[c][id])throw{code:'not_found'};
      // come Firestore: «a.b» cambia solo il campo b dentro a
      for(const [k,v] of Object.entries(clone(d))){const p=k.split('.');let x=data[c][id];for(const f of p.slice(0,-1))x=x[f]&&typeof x[f]==='object'?x[f]:(x[f]={});x[p[p.length-1]]=v}
      save();fire()},
    delete:async()=>{if(data[c]&&data[c][id]){delete data[c][id];save();fire()}}});
  const query=(c,ord,lim)=>({
    orderBy:(f,dir)=>query(c,[f,dir],lim),limit:n=>query(c,ord,n),
    onSnapshot(next){let prev=null;
      const run=()=>{let ds=Object.entries(data[c]||{}).map(([id,d])=>({id,data:()=>d}));
        if(ord)ds.sort((a,b)=>(ord[1]==='desc'?-1:1)*((a.data()[ord[0]]||0)-(b.data()[ord[0]]||0)));
        if(lim)ds=ds.slice(0,lim);
        const changes=ds.filter(d=>!prev||!prev.has(d.id)).map(d=>({type:'added',doc:d}));prev=new Set(ds.map(d=>d.id));
        next({docs:ds,docChanges:()=>changes})};
      subs.add(run);setTimeout(run,0);return()=>subs.delete(run)}});
  return{kind:'locale',collection:c=>Object.assign(query(c),{doc:id=>doc(c,id||uid())}),
    dump:()=>clone(data),load:d=>{const old=data;data=clone(d);try{save()}catch(e){data=old;throw e}fire()},
    range:async(c,f,a,b)=>Object.entries(data[c]||{}).filter(([,d])=>(d[f]||0)>=a&&(d[f]||0)<b).map(([id,d])=>Object.assign({id},clone(d))),
    empty:()=>!Object.keys(data.fornitori||{}).length};
})();

/* ================= database centrale (Firebase) =================
   Stessa interfaccia del salvataggio locale. Firestore tiene una copia dei dati sul telefono:
   l'app funziona anche senza rete e invia le modifiche appena torna la connessione.
   I prodotti stanno in un documento per fornitore («listini/<fornitore>»): ogni apertura legge pochi documenti.
   Accesso: accesso anonimo + chiave del ristorante (link o QR); vedi firebase/firestore.rules. */
const fbCfg=()=>DEMO?null:self.JONA_FIREBASE||ls('jona_fb')||null;
const FB_COLS=['staff','fornitori','config','richieste','ordini','notifiche'];
const randKey=(n=24)=>{const a='abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789';return[...crypto.getRandomValues(new Uint8Array(n))].map(x=>a[x%a.length]).join('')};
function fbInit(){
  const app=firebase.apps.length?firebase.app():firebase.initializeApp(fbCfg());const fs=firebase.firestore(),auth=firebase.auth();
  if(ls('jona_fb_lp')&&!fbInit.lp){fbInit.lp=1;try{fs.settings({experimentalForceLongPolling:true,merge:true})}catch(e){}}
  const emu=ls('jona_fb_emu');if(emu&&!fbInit.emu){fbInit.emu=1;fs.useEmulator(emu,8080);auth.useEmulator('http://'+emu+':9099',{disableWarnings:true})}
  return{fs,auth};
}
// reti Wi-Fi con filtri (es. UniFi con IPS) trattengono il collegamento continuo di Firestore: se una scrittura non arriva in 4 s
// con la rete accesa, si passa al long polling (jona_fb_lp); si ricarica solo dopo la conferma, senza fogli aperti né testo in chat
function netWatch(p){
  if(ls('jona_fb_lp')||!S.db||S.db.kind!=='firebase')return p;
  const t=setTimeout(()=>{if(navigator.onLine===false||document.hidden||ls('jona_fb_lp'))return;ls('jona_fb_lp',1);
    toast('Questa rete Wi-Fi rallenta i messaggi: chiudi e riapri l\'app per usare un collegamento compatibile.','warn');updOn()},4000);
  Promise.resolve(p).then(()=>clearTimeout(t),()=>clearTimeout(t));return p}
const fbTmo=(p,ms=20000)=>Promise.race([p,new Promise((_,j)=>setTimeout(()=>j({code:'fb_slow'}),ms))]);
async function fbSignIn(auth){await new Promise(r=>{const u=auth.onAuthStateChanged(()=>{u();r()})});if(!auth.currentUser)await auth.signInAnonymously();return auth.currentUser.uid}
async function fbPublic(){try{await need('firebase');const{fs}=fbInit();const d=await fbTmo(fs.doc('pubblico/stato').get(),12000);return!!(d.exists&&d.data().attivo)}catch(e){return null}}
function FirebaseStore(key){
  const{fs,auth}=fbInit();
  fs.enablePersistence({synchronizeTabs:true}).catch(()=>{});
  const FV=firebase.firestore.FieldValue,FP=firebase.firestore.FieldPath;
  const st={ready:false,err:'',pend:0,net:navigator.onLine!==false,busy:'',step:''};
  const ping=()=>schedule();
  addEventListener('online',()=>{st.net=true;ping()});addEventListener('offline',()=>{st.net=false;ping()});
  const mapErr=e=>({code:!e?'fb':e.code==='not-found'?'not_found':e.code==='permission-denied'?'fb_perm':e.code==='unavailable'?'fb_net':e.code?'fb':'fb',msg:e&&e.message});
  let okReady;const readyP=new Promise(r=>okReady=r);
  const track=p=>{if(st.ready)netWatch(p);if(!st.pend){st.pendT=Date.now();setTimeout(ping,PEND_MS+100)}st.pend++;ping();p.then(()=>{if(!--st.pend)st.pendT=0;ping()},e=>{if(!--st.pend)st.pendT=0;const m=mapErr(e);if(m.code==='fb_perm'){st.err='fb_perm';st.ready=false}ping();toast(errMsg(m),'err')})};
  const run=f=>{track(readyP.then(f));return Promise.resolve()};
  const cache={};
  // ---- telefono nuovo: resta in attesa («ok» falso) finché un telefono approvato non lo approva ----
  const newMember=()=>({k:key,ok:false,creato:now(),ua:navigator.userAgent.slice(0,120)});
  const approval=u=>new Promise((res,rej)=>{let un=null;const to=setTimeout(()=>{if(un)un();rej({code:'fb_slow'})},20000);
    un=fs.doc('membri/'+u).onSnapshot({includeMetadataChanges:true},d=>{if(!d.exists&&d.metadata.fromCache)return;clearTimeout(to);
      if(!d.exists){st.wait='no';st.req=null;ping();return}
      const x=d.data();if(x.ok===false){st.wait='attesa';st.req=x.req||null;st.reqOk=!!x.req&&!d.metadata.hasPendingWrites&&!d.metadata.fromCache;ping();return}
      if(d.metadata.hasPendingWrites||d.metadata.fromCache)return;
      un();st.wait='';st.req=null;ping();res()},e=>{clearTimeout(to);rej(e)})});
  // al ritorno in primo piano il collegamento vecchio può essere morto senza che Firestore lo sappia: lo rifà subito
  let hidAt=0;
  document.addEventListener('visibilitychange',()=>{if(document.hidden){hidAt=Date.now();return}
    if(hidAt&&Date.now()-hidAt>5000&&st.ready&&navigator.onLine!==false)fs.disableNetwork().then(()=>fs.enableNetwork()).catch(()=>{});hidAt=0});
  // ---- collegamento: accesso anonimo e iscrizione del telefono con la chiave ----
  (async function connect(){
    try{
      st.step='accesso';ping();
      const u=await fbTmo(fbSignIn(auth));st.uid=u;
      if(ls('jona_member')!==u){st.step='iscrizione';ping();const m=await fbTmo(fs.doc('membri/'+u).get(),12000);
        if(!m.exists)await fbTmo(fs.doc('membri/'+u).set(newMember()));else if(m.data().ok!==false)ls('jona_member',u);
        if(ls('jona_member')!==u){st.step='';await approval(u);ls('jona_member',u)}}
      st.step='';
      if(ls('jona_fb_upload')){st.busy='upload';ping();await loadAll(LocalStore.dump());ls('jona_fb_upload',null);st.busy='';toast('Database centrale attivo: i dati di questo telefono sono stati caricati')}
      st.ready=true;st.err='';ping();okReady();
    }catch(e){st.err=e&&e.code==='fb_slow'?'fb_slow':mapErr(e).code;st.busy='';if(st.err==='fb_slow')ls('jona_fb_lp',1);ping();if(st.err!=='fb_perm')setTimeout(connect,5000)}
  })();
  // ---- prodotti raggruppati per fornitore ----
  const L={data:{},fidOf:{},buf:new Map(),t:null};
  const pCur=pid=>L.buf.has(pid)?L.buf.get(pid):L.data[pid];
  function lFlush(){
    const buf=L.buf;L.buf=new Map();L.t=null;const byF=new Map();
    const add=(fid,pid,v)=>{if(!byF.has(fid))byF.set(fid,new Map());byF.get(fid).set(pid,v)};
    for(const [pid,d] of buf){const old=L.fidOf[pid];const fid=d?String(d.fornitoreId||'_'):null;
      if(old&&old!==fid)add(old,pid,FV.delete());if(fid)add(fid,pid,d)}
    for(const [fid,m] of byF){const obj={p:{}},paths=[];for(const [pid,v] of m){obj.p[pid]=v;paths.push(new FP('p',pid))}
      track(readyP.then(()=>fs.collection('listini').doc(fid).set(obj,{mergeFields:paths})))}
  }
  const lPut=(pid,d)=>{L.buf.set(pid,d);if(!L.t)L.t=setTimeout(lFlush,30);return Promise.resolve()};
  const pDoc=pid=>({id:pid,
    set:d=>lPut(pid,clone(d)),
    update:async d=>{const cur=pCur(pid);if(!cur)throw{code:'not_found'};return lPut(pid,Object.assign(clone(cur),clone(d)))},
    delete:()=>pCur(pid)?lPut(pid,null):Promise.resolve()});
  // ---- documenti normali ----
  const doc=(c,id)=>c==='prodotti'?pDoc(id):({id,
    set:d=>run(()=>fs.collection(c).doc(id).set(clone(d))),
    update:d=>run(()=>fs.collection(c).doc(id).update(clone(d))),
    delete:()=>run(()=>fs.collection(c).doc(id).delete())});
  const wrap=s=>({docs:s.docs.map(d=>({id:d.id,data:()=>d.data()})),docChanges:()=>s.docChanges().map(ch=>({type:ch.type,doc:{id:ch.doc.id,data:()=>ch.doc.data()}}))});
  const query=(c,ord,lim)=>({
    orderBy:(f,dir)=>query(c,[f,dir],lim),limit:n=>query(c,ord,n),
    onSnapshot(next){let un=null,stop=false;
      readyP.then(()=>{if(stop)return;
        const onErr=e=>{st.err=mapErr(e).code;ping()};
        if(c==='prodotti'){let prev=null;
          un=fs.collection('listini').onSnapshot(s=>{const m={},fo={};for(const d of s.docs){const p=(d.data()||{}).p||{};for(const pid in p){m[pid]=p[pid];fo[pid]=d.id}}
            L.data=m;L.fidOf=fo;cache.prodotti=m;
            const docs=Object.keys(m).map(id=>({id,data:()=>m[id]}));const changes=docs.filter(d=>!prev||!prev.has(d.id)).map(d=>({type:'added',doc:d}));prev=new Set(Object.keys(m));
            next({docs,docChanges:()=>changes})},onErr);return}
        let q=fs.collection(c);if(ord)q=q.orderBy(ord[0],ord[1]||'asc');if(lim)q=q.limit(lim);
        un=q.onSnapshot(s=>{const m={};s.docs.forEach(d=>{m[d.id]=d.data()});cache[c]=m;next(wrap(s))},onErr)});
      return()=>{stop=true;if(un)un()}}});
  // ---- ripristino o primo caricamento: sostituisce tutto ----
  async function loadAll(d){
    const ops=[];
    for(const c of FB_COLS){const s=await fs.collection(c).get();const nw=d[c]||{};
      s.docs.forEach(x=>{if(!nw[x.id])ops.push(b=>b.delete(x.ref))});
      for(const id in nw){const v=clone(nw[id]);delete v.id;ops.push(b=>b.set(fs.collection(c).doc(id),v))}}
    const ls0=await fs.collection('listini').get();ls0.docs.forEach(x=>ops.push(b=>b.delete(x.ref)));
    const byF={};for(const [pid,p] of Object.entries(d.prodotti||{})){const v=clone(p);delete v.id;const f=String(v.fornitoreId||'_');(byF[f]=byF[f]||{})[pid]=v}
    for(const f in byF)ops.push(b=>b.set(fs.collection('listini').doc(f),{p:byF[f]}));
    for(let i=0;i<ops.length;i+=400){const b=fs.batch();ops.slice(i,i+400).forEach(o=>o(b));await b.commit()}
  }
  // ---- copie automatiche (collezione «backup»): «<giorno>» dice quanti pezzi, «<giorno>_<sigla>_<n>» sono i pezzi sotto 1 MB ----
  const BK_PART=300000; // caratteri per pezzo: anche con lettere accentate restano sotto 900 KB
  async function fullDump(){const d={};
    for(const c of FB_COLS){const s=await fs.collection(c).get({source:'server'});d[c]={};s.docs.forEach(x=>{d[c][x.id]=x.data()})}
    const l=await fs.collection('listini').get({source:'server'});d.prodotti={};l.docs.forEach(x=>Object.assign(d.prodotti,(x.data()||{}).p||{}));return d}
  const backup={
    has:async g=>{await readyP;return(await fs.doc('backup/'+g).get({source:'server'})).exists},
    save:async(g,by)=>{await readyP;const txt=JSON.stringify({app:'jona-ordini',versione:2,data:now(),dati:await fullDump()});
      const sig=randKey(6),n=Math.max(1,Math.ceil(txt.length/BK_PART));
      for(let i=0;i<n;i++)await fs.doc('backup/'+g+'_'+sig+'_'+i).set({g,s:txt.slice(i*BK_PART,(i+1)*BK_PART)});
      await fs.doc('backup/'+g).set({g,meta:true,sig,parti:n,dim:txt.length,data:now(),da:by||''})},
    list:async()=>{await readyP;const s=await fs.collection('backup').where('meta','==',true).get({source:'server'});return s.docs.map(x=>x.data()).sort((a,b)=>a.g<b.g?1:-1)},
    get:async g=>{await readyP;const m=await fs.doc('backup/'+g).get({source:'server'});if(!m.exists)throw{code:'not_found'};const b=m.data();
      const ps=await Promise.all(Array.from({length:b.parti},(_,i)=>fs.doc('backup/'+g+'_'+b.sig+'_'+i).get({source:'server'})));
      if(ps.some(x=>!x.exists))throw{code:'not_found'};return JSON.parse(ps.map(x=>x.data().s).join(''))},
    prune:async keep=>{await readyP;const s=await fs.collection('backup').where('g','<',keep).get({source:'server'});for(const x of s.docs)await x.ref.delete()}
  };
  return{kind:'firebase',collection:c=>Object.assign(query(c),{doc:id=>doc(c,id||uid())}),backup,
    prodServer:async()=>{await readyP;const l=await fs.collection('listini').get({source:'server'});const m={};l.docs.forEach(x=>Object.assign(m,(x.data()||{}).p||{}));return m},
    status:()=>({ready:st.ready,err:st.err,pend:st.pend+(L.buf.size?1:0),pendT:st.pendT||0,net:st.net,busy:st.busy,step:st.step,wait:st.wait||'',req:st.req||null,reqOk:!!st.reqOk}),
    netRetry:()=>fs.disableNetwork().then(()=>fs.enableNetwork()),
    phone:{req:r=>fs.doc('membri/'+st.uid).update({req:r}),again:()=>fs.doc('membri/'+st.uid).set(newMember()),
      // entrata libera (v40): con pubblico/porta aperta il telefono si approva da solo e, se nuovo, crea il suo profilo
      auto:async r=>{const p=await fs.doc('pubblico/porta').get({source:'server'});if(!p.exists||!((p.data().fino||0)>Date.now()))return false;
        const m=fs.doc('membri/'+st.uid);await m.update({ok:true,approvato:now(),da:'porta'});
        if(r.nuovo){const q=await fs.collection('staff').get({source:'server'});const all={};q.docs.forEach(d=>{all[d.id]=Object.assign({},d.data(),{id:d.id})});
          if(!all[r.sid])await fs.doc('staff/'+r.sid).set(phStaff(r,all,'porta'))}
        await m.update({req:firebase.firestore.FieldValue.delete()}).catch(()=>{});return true},
      porta:async fino=>{await readyP;await fs.doc('pubblico/porta').set({fino,da:realU()?realU().id:'',quando:now()})},
      portaGet:async()=>{await readyP;const d=await fs.doc('pubblico/porta').get({source:'server'});return d.exists?d.data().fino||0:0},
      // invito monouso (v40): inviti/<gettone> {sid, fino}; chi lo usa si approva, consuma l'invito e mette la sua password in un colpo solo
      inv:async t=>{const d=await fs.doc('inviti/'+t).get({source:'server'});return d.exists?d.data():null},
      tk:async(t,sid,pass)=>{const b=fs.batch();b.update(fs.doc('membri/'+st.uid),{ok:true,approvato:now(),da:'invito',tk:t});b.delete(fs.doc('inviti/'+t));
        b.update(fs.doc('staff/'+sid),{pass,stato:'attivo',attivato:now()});await b.commit()},
      invNew:async(t,d)=>{await readyP;await fs.doc('inviti/'+t).set(d)},
      invDel:async sid=>{await readyP;const q=await fs.collection('inviti').where('sid','==',sid).get({source:'server'});for(const x of q.docs)await x.ref.delete()}},
    dump:()=>clone(cache),
    load:async d=>{if(!navigator.onLine)throw{code:'fb_net'};await readyP;await loadAll(d)},
    range:async(c,f,a,b)=>{await readyP;const s=await fs.collection(c).where(f,'>=',a).where(f,'<',b).get();return s.docs.map(d=>Object.assign({id:d.id},d.data()))},
    empty:()=>false};
}

/* ================= data layer ================= */
const ref=(c,id)=>S.db.collection(c).doc(id);
const put=(c,id,d)=>ref(c,id).set(d);
const upd=(c,id,d)=>ref(c,id).update(d);
const del=(c,id)=>ref(c,id).delete();
function errMsg(e){const c=e&&e.code;return({
  quota_exceeded:'Memoria del dispositivo piena. Esporta un backup dalle Impostazioni e pulisci notifiche o foto delle bolle vecchie.',
  not_found:'Questo elemento non esiste più. Ricarica la pagina.',

const wallMsg=(t,p,act='')=>`<div class="wall linen"><div class="logo-full" role="img" aria-label="Jona Ristorante"></div><div class="wall-card"><h1>${esc(t)}</h1><p class="muted">${esc(p)}</p>${act}</div></div>`;
function wallFb(s){
  if(s.wait)return screenPhone(s);
  if(s.err==='fb_perm')return wallMsg('Accesso non valido','Il codice di questo telefono non è più valido. Chiedi allo chef il QR code o il link e aprilo di nuovo.',`<button type="button" class="btn ghost block" data-a="fbLeave">Scollega questo telefono</button>`);
  if(s.busy==='upload')return wallMsg('Carico i dati…','Sto copiando sul database centrale i dati di questo telefono. Non chiudere l\'app.');
  if(s.err==='fb_slow')return wallMsg('Il collegamento non riesce','Controlla che ci sia internet (meglio il Wi-Fi o i dati attivi), poi tocca Riprova. Se non va, apri il link con Safari o Chrome, non dentro WhatsApp.',`<button type="button" class="btn primary block big" data-a="reload">Riprova</button>`);
  return wallMsg('Collegamento al ristorante…',!s.net||s.err?'Non c\'è connessione. Appena torna la rete l\'app si collega da sola.':s.step==='iscrizione'?'Registro questo telefono…':'Un momento…');
}

const normUser=s=>String(s||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/['’`]/g,'').replace(/\s+/g,'.');
function userSug(f,selfId){const b=[f.nome,f.cognome].map(x=>normUser(x).replace(/[^a-z0-9.]/g,'')).filter(Boolean).join('.').replace(/\.+/g,'.').slice(0,26);if(!b)return'';
  const used=new Set(Object.values(D().staff||{}).filter(x=>x.id!==selfId).map(x=>x.username));let u=b,n=2;while(used.has(u))u=b+n++;return u}
function checkForm(needPw,selfId){
  const f=S.form;
  if(!String(f.nome||'').trim())return'Scrivi il nome.';
  const u=normUser(f.username);
  if(!u)return'Scrivi il nome utente: è quello che userai per entrare (per esempio mario.loi).';
  if(u.length<3)return'Il nome utente deve avere almeno 3 caratteri (per esempio mario.loi).';
  if(!/^[a-z0-9._-]{3,30}$/.test(u))return'Nel nome utente usa solo lettere, numeri, punto o trattino (massimo 30).';
  if(Object.values(D().staff).some(x=>x.username===u&&x.id!==selfId))return'Questo nome utente è già usato: scegline un altro.';
  if(needPw||f.pw){if(String(f.pw||'').length<6)return'La password deve avere almeno 6 caratteri.';if(f.pw!==f.pw2)return'Le due password non coincidono.'}
  if(withContr(f)&&!f.libero){const o=num(f.ore);if(!(o>=1&&o<=60))return'Le ore a settimana vanno da 1 a 60.'}
  return'';
}
async function createProfile(mode){
  const inv=mode==='admin'&&!!S.form._inv&&!!S.db&&S.db.kind==='firebase';
  const e=checkForm(!inv);if(e)return toast(e,'warn');
  const f=S.form,id=uid(),ruolo=mode==='self'?'staff':(f.ruolo||'staff');
  const doc={nome:f.nome.trim(),cognome:String(f.cognome||'').trim(),username:normUser(f.username),ruolo,
    reparto:ruolo==='staff'?(f.reparto||'altro'):(ruolo==='gm'?'cucina':'altro'),mansione:ruolo==='staff'?(f.mansione||''):(ruolo==='gm'?'Chef':'Sviluppatore'),
    foto:f.foto||'',stato:mode==='self'?'in_attesa':inv?'invitato':'attivo',pass:inv?'':await sha(id+':'+f.pw),creato:now(),creatoDa:S.me||''};
  if(mode==='admin'&&withContr(f))doc.contratto=orContr(f);
  await put('staff',id,doc);S.form={};
  if(mode==='setup'){login(id);return}
  closeSheet();if(inv)return invMonoSend(id,{...doc,id});
  if(mode==='self'){await notify('gestori','Nuovo profilo da approvare',fullName(doc)+', '+(REPARTI[doc.reparto]||''),'staff',id);ls('jona_reg',null);ls('jona_wait',{id,t:Date.now()});repaint()}
  else toast('Profilo creato: comunica a '+doc.nome+' nome utente e password.');
}
/* invito monouso (v40): gettone lungo in inviti/<gettone> (7 giorni), link corto con il codice per la chiave + il gettone */
async function invMonoSend(sid,nuovo){
  const u=D().staff[sid]||nuovo;if(!u||!S.db||S.db.kind!=='firebase')return;
  if(!navigator.onLine)return toast('Serve internet per creare l\'invito.','warn');
  const t=randKey(32);
  try{await S.db.phone.invDel(sid);await S.db.phone.invNew(t,{sid,nome:u.nome,cognome:u.cognome||'',username:u.username,fino:Date.now()+7*864e5,da:S.me||'',creato:now()})}
  catch(e){return toast(e&&e.code==='permission-denied'?'Il database non lo permette ancora: aggiorna le regole (docs/FIREBASE.md).':'Invito non creato: controlla la connessione e riprova.','err')}
  S.invL=null;const r=await invNew();const l=r.c?r.l+'/'+t:inviteLink()+'&t='+t;
  const txt='Ciao '+u.nome+'! Ecco il tuo invito all\'app del Jona.\nTocca il link, scegli la tua password e sei dentro.\nIl tuo nome utente: '+u.username+'\nIl link vale una volta sola (7 giorni).\n'+l;
  S.invM={sid,txt,u:{nome:u.nome,cognome:u.cognome||''}};invMonoSheet();
}
function invMonoSheet(){const m=S.invM,u=m&&(D().staff[m.sid]||m.u);if(!u)return;
  openSheet({render:()=>`<div class="grab"></div><div class="sh-h"><div class="sh-t">Invito pronto<div class="sh-s">${esc(fullName(u))}</div></div><button type="button" class="icon-btn" data-a="closeSheet" aria-label="Chiudi">${ic('x')}</button></div>
  <p class="muted" style="margin:0">Manda il link a ${esc(u.nome)} su WhatsApp. Vale <b>una volta sola</b> per 7 giorni: chi lo apre sceglie la password ed entra subito.</p>
  <div style="margin-top:18px;display:grid;gap:12px"><a class="btn primary block big" href="https://wa.me/?text=${encodeURIComponent(m.txt)}" target="_blank" rel="noopener">Manda su WhatsApp</a>
  <button type="button" class="btn ghost block" data-a="invMonoGo" data-v="share">Condividi in un altro modo</button><button type="button" class="btn ghost block" data-a="invMonoGo" data-v="copy">Copia il messaggio</button></div>`});

async function invMonoShare(k){const m=S.invM;if(!m)return;

  try{await navigator.clipboard.writeText(m.txt);toast('Messaggio copiato: incollalo su WhatsApp.')}catch(e){toast('Non riesco a copiare: usa «Manda su WhatsApp».','warn')}}
