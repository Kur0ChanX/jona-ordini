<style>
*{box-sizing:border-box}
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --font:"Jost","Futura","Avenir Next","Century Gothic",system-ui,sans-serif;
  --bg:#EFEBE6;--surface:#FFFFFF;--sunk:#F6F3EF;--ink:#2B2321;--ink2:#5E534D;--muted:#8A7F76;--line:#E4DDD5;--sand:#BDB2A6;
  --solid:#3A2F2C;--on-solid:#F3EDE7;
  --lagoon:#1F7F86;--on-lagoon:#FFFFFF;--lagoon-soft:#DBECEC;
  --mirto:#3B7A57;--mirto-soft:#DFEDE4;--corallo:#AE4E37;--corallo-soft:#F5E1DA;--ocra:#94661C;--ocra-soft:#F3E7D1;
  --lift:0 1px 0 rgba(43,35,33,.04),0 12px 30px -18px rgba(43,35,33,.30);
  --cocoa:#3A2F2C;--linen:#CFC5BA;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1E1816;--surface:#29211F;--sunk:#231C1A;--ink:#F1EBE5;--ink2:#CFC4BA;--muted:#A0948A;--line:#3D3330;--sand:#C9BEB2;
    --solid:#E9E1D9;--on-solid:#2A2220;--lagoon:#57B0B6;--on-lagoon:#0E2426;--lagoon-soft:#1D3436;
    --mirto:#7DBE98;--mirto-soft:#1E3127;--corallo:#E08A72;--corallo-soft:#3A2420;--ocra:#D9A955;--ocra-soft:#3A2E1A;
    --lift:0 1px 0 rgba(0,0,0,.2),0 14px 30px -18px rgba(0,0,0,.7);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1E1816;--surface:#29211F;--sunk:#231C1A;--ink:#F1EBE5;--ink2:#CFC4BA;--muted:#A0948A;--line:#3D3330;--sand:#C9BEB2;
  --solid:#E9E1D9;--on-solid:#2A2220;--lagoon:#57B0B6;--on-lagoon:#0E2426;--lagoon-soft:#1D3436;
  --mirto:#7DBE98;--mirto-soft:#1E3127;--corallo:#E08A72;--corallo-soft:#3A2420;--ocra:#D9A955;--ocra-soft:#3A2E1A;
  --lift:0 1px 0 rgba(0,0,0,.2),0 14px 30px -18px rgba(0,0,0,.7);color-scheme:dark;
}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
html.on-wall{background:var(--cocoa)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--font);-webkit-font-smoothing:antialiased;min-height:100%}
html.on-wall body{background:var(--cocoa)}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
img{max-width:100%}
:focus-visible{outline:2px solid var(--lagoon);outline-offset:2px}
.ic{width:20px;height:20px;flex:none}
.ic.big{width:44px;height:44px}
.muted{color:var(--muted)}
.small{font-size:13px}
[hidden]{display:none!important}

ain no-repeat}
.wall-sub{font:300 17px/1.4 var(--font);letter-spacing:.06em;color:#B9AEA2;margin:22px 0 0}
.wall-by{margin:auto 0 -12px;padding:0 0 env(safe-area-inset-bottom);display:flex;flex-direction:column;align-items:center;gap:2px;opacity:.8}
.splash .wall-by{margin-bottom:24px}
.wall-by span{font:400 10px/1 var(--font);letter-spacing:.34em;text-transform:uppercase;color:#B9AEA2;padding-left:.34em}
.wall-by i{display:block;width:172px;aspect-ratio:496/190;background:linear-gradient(100deg,#DDD3C8 42%,#FFF8EE 50%,#DDD3C8 58%) 100% 0/300% 100%;-webkit-mask:url(media/ynoy.png) center/contain no-repeat;mask:url(media/ynoy.png) center/contain no-repeat}
.intro .wall-by span{animation:byIn 1.3s .6s cubic-bezier(.22,1,.36,1) both}
.intro .wall-by i{animation:ynoyIn 2s 1s cubic-bezier(.22,1,.36,1) both,ynoyShine 1.5s 2.4s cubic-bezier(.45,0,.25,1) both}
@keyframes byIn{from{opacity:0;letter-spacing:.9em}}
@keyframes ynoyIn{from{opacity:0;transform:translateY(8px) scale(.94);clip-path:inset(0 100% 0 0)}60%{opacity:1}to{opacity:1;transform:none;clip-path:inset(0)}}
@keyframes ynoyShine{from{background-position:100% 0}to{background-position:0 0}}
.wall-groups{width:100%;max-width:760px}
.wall h2{font:400 14px var(--font);letter-spacing:.08em;color:#A3978D;margin:38px 0 16px;text-align:center}
.faces{display:flex;flex-wrap:wrap;justify-content:center;gap:24px 14px}
.face{width:100px;display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;color:inherit;padding:6px 0;border-radius:14px}
.face .av{box-shadow:0 0 0 1.5px rgba(207,197,186,.35),0 14px 26px -12px rgba(0,0,0,.7);transition:transform .15s}
.face:hover .av{box-shadow:0 0 0 2px var(--linen),0 14px 26px -12px rgba(0,0,0,.7)}
.face:active .av{transform:scale(.95)}
.face .fn{font:400 15.5px/1.2 var(--font)}
.face .fr{font:300 12.5px/1.2 var(--font);color:#A3978D;margin-top:-4px}
.face.pending{opacity:.55}
.wall-new{margin-top:44px;background:transparent;border:1px solid rgba(207,197,186,.35);color:#E4DCD3;min-height:46px;padding:0 22px;border-radius:999px;display:inline-flex;align-items:center;gap:8px;font:400 15px var(--font)}
.wall-new:hover{border-color:var(--linen)}
.wall-card{width:100%;max-width:520px;margin-top:30px;background:var(--surface);color:var(--ink);border-radius:22px;padding:22px 20px 24px;box-shadow:0 30px 60px -30px rgba(0,0,0,.7)}
.wall-card h1{font:300 26px/1.2 var(--font);margin:0 0 6px}
.wall-msg{max-width:420px;text-align:center;color:#CFC5BA;font:300 16px/1.6 var(--font);margin-top:26px}
.intro .logo-full,.intro .wall-sub,.intro .wall-card{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
.intro .wall-sub{animation-delay:.12s}.intro .wall-card{animation-delay:.2s}
.intro .face{animation:rise .55s calc(.2s + var(--i,0)*40ms) cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- avatar ---------- */
.av{--s:44px;width:var(--s);height:var(--s);border-radius:50%;flex:none;display:grid;place-items:center;overflow:hidden;background:var(--c,#8A7F76);color:#fff;font:400 calc(var(--s)*.38)/1 var(--font);letter-spacing:.02em}
.av img{width:100%;height:100%;object-fit:cover;display:block}

/* ---------- shell ---------- */
.main{max-width:880px;margin:0 auto;padding:0 16px 110px}

.top-t{flex:1;font:300 17px var(--font);letter-spacing:.04em;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-btn{border:0;background:none;padding:0;border-radius:50%}
.icon-btn{width:40px;height:40px;flex:none;display:grid;place-items:center;border:0;border-radius:50%;background:transparent;color:var(--ink2);position:relative}
.icon-btn:hover{background:var(--sunk)}
.icon-btn.danger{color:var(--corallo)}
.bell .dot{position:absolute;top:3px;right:2px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--corallo);color:#fff;font:600 11px/18px var(--font);text-align:center}
/* novità: chip piccola nell'intestazione, contatore più piccolo di quello della campanella */
.news-btn{flex:none;position:relative;display:inline-flex;align-items:center;gap:4px;height:30px;padding:0 10px 0 8px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink2);font:400 13px/1 var(--font)}
.news-btn:hover{background:var(--sunk)}
.news-btn .ic{width:16px;height:16px;color:var(--ocra)}
.news-n{position:absolute;top:-6px;right:-6px;min-width:15px;height:15px;padding:0 4px;border-radius:8px;background:var(--lagoon);color:var(--on-lagoon);font:600 9.5px/15px var(--font);text-align:center}
html.staff-ui .news-btn{height:36px;font-size:14px}
html.staff-ui .news-btn .ic{width:18px;height:18px}
/* poco spazio (schermi stretti o «Senza rete» visibile): solo l'icona; la scritta «Senza rete» può andare su due righe */
@media (max-width:520px){.top:has(.sync-pill) .news-btn{width:34px;padding:0;justify-content:center}.top:has(.sync-pill) .news-l{display:none}}
.top .sync-pill{min-width:0;white-space:normal;line-height:1.15}
@media (max-width:360px){.top{gap:6px}.top .mark{display:none}.news-btn,html.staff-ui .news-btn{width:34px;padding:0;justify-content:center}.news-l{display:none}}
.news-v{padding:16px 2px 18px;border-top:1px solid var(--line)}
.ph-t{font:500 16px/1.3 var(--font);margin:18px 0 6px}
.ph-ol{margin:4px 0 8px;padding-left:24px}
.ph-ol li{margin:10px 0;line-height:1.5;font-size:15.5px}
.ph-brands{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 4px}
.ph-brands .btn{min-height:48px;white-space:normal;line-height:1.2}
.ph-brands .btn[aria-pressed="true"]{border-color:var(--lagoon);background:var(--lagoon-soft);color:var(--lagoon)}

/* ---------- type & structure ---------- */

<script>
'use strict';
/* ================= utils ================= */
const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const clone=o=>JSON.parse(JSON.stringify(o));

const eur=n=>(n==null||n===''||isNaN(n))?'':new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(n);
const fq=n=>{const v=Number(n)||0;return v.toLocaleString('it-IT',{maximumFractionDigits:3})};
const norm=s=>String(s??'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
const STOP=new Set(['con','per','del','della','dei','delle','alla','allo','agli','alle','gli','una','uno','tipo','the','and','kg','gr','grammi','pz','conf','cartone','lt','litri','ml','busta','sacco','latta','fresco','fresca','freschi']);
const gkey=n=>{const w=norm(n).split(' ').filter(x=>x.length>2&&!STOP.has(x)&&!/^\d/.test(x));return w.slice(0,2).join(' ')||norm(n)};
const firstName=s=>String(s||'').split(' ')[0];
const byNome=(a,b)=>String(a.nome||'').localeCompare(String(b.nome||''),'it');
function ago(t){if(!t)return'';const d=(now()-t)/1000;if(d<60)return'adesso';if(d<3600)return Math.floor(d/60)+' min fa';const dt=new Date(t),td=new Date();const hm=dt.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});if(dt.toDateString()===td.toDateString())return'oggi '+hm;const y=new Date(td);y.setDate(td.getDate()-1);if(dt.toDateString()===y.toDateString())return'ieri '+hm;return dt.toLocaleDateString('it-IT',{day:'numeric',month:'short'})+' '+hm}
const fdate=t=>t?new Date(t).toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'}):'';
const today=(d=new Date())=>{return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};

function num(v){if(v==null||v==='')return null;if(typeof v==='number')return isFinite(v)?v:null;let s=String(v).replace(/[^\d,.\-]/g,'');if(!s)return null;if(s.includes(',')&&s.includes('.'))s=s.lastIndexOf(',')>s.lastIndexOf('.')?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,'');else if(s.includes(','))s=s.replace(',','.');const n=parseFloat(s);return isNaN(n)?null:Math.round(n*1000)/1000}
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function loadImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const i=new Image();i.onload=()=>{res(i);setTimeout(()=>URL.revokeObjectURL(u),1000)};i.onerror=()=>rej(new Error('img'));i.src=u})}
async function fileToAvatar(file){let img=null;try{img=await createImageBitmap(file,{resizeWidth:640,resizeQuality:'high'})}catch(e){}if(!img||img.width>1200){if(img&&img.close)img.close();img=await loadImg(file)}const s=Math.min(img.width,img.height);const c=document.createElement('canvas');c.width=c.height=256;c.getContext('2d').drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,256,256);return c.toDataURL('image/jpeg',.8)}
async function shrink(file,max=2000){const img=await loadImg(file);const sc=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,'image/jpeg',.86))}
async function runPool(tasks,n=6){let i=0,err=null;const w=async()=>{while(i<tasks.length){const t=tasks[i++];try{await t()}catch(e){err=err||e}}};await Promise.all(Array.from({length:Math.min(n,tasks.length)},w));if(err)throw err}

    chef:['L\'invito ora ha un link corto e un codice di 6 lettere (vale 7 giorni). Se il telefono nuovo chiede un codice, basta scriverlo nella schermata «Collega questo telefono».','L\'anteprima su WhatsApp non ha più il finto pulsante: si tocca il link.'],
    tutti:['I vocali in chat mostrano la forma della voce, come su WhatsApp: barre alte dove si parla, linea piatta nel silenzio. Mentre ascolti le barre si colorano; tocca un punto per saltare lì. Mentre registri vedi le barre muoversi.','Sull\'icona dell\'app compare un pallino col numero delle cose importanti: messaggi in chat non letti, avvisi e cose da approvare. Le novità dell\'app non contano.','Su iPhone il pallino si vede con l\'app sulla schermata Home e le notifiche permesse nelle Impostazioni del telefono. Su Android dipende dal telefono: di solito compare solo con le notifiche attive.'],
    dev:{aggiunte:['Forma d\'onda dei vocali: `wfStart`/`wfStop` (AnalyserNode sul microfono, volume ogni 100 ms), `wfCode` (40 cifre 0–9 nel campo `wf` del messaggio), `wfBars`, `chSeek` (tocco sulle barre per saltare), barre dal vivo durante la registrazione (`#ch-rw`).','Inviti con codice: Worker `invito` (link corto `invito.<WK_SUB>.workers.dev/<CODICE>` → app con `#i=`), `/inviti` e `/invito/<codice>` nel Worker principale (tabella `inviti` nel primo D1, 7 giorni); app `invNew`, `invRedeem`, `jona_icode`, `fbJoinKey` accetta il codice; link lungo `#k=` di ripiego.','`badgeCount`/`appBadge` (in `render`, `obxBadge` lo richiama), numero salvato nella cache `jona-badge` (`./badge-n`); `sw.js` lo aumenta di 1 a ogni push con l\'app non in vista e lo cala dopo l\'invio della coda.']}},
  {v:29,data:'2026-10-04',titolo:'Invito più bello',
    chef:['Impostazioni → Database centrale → Invita: «Manda l\'invito» spedisce un messaggio di benvenuto con i passi da fare, e su WhatsApp il link compare con l\'anteprima del Jona.','Nuovo pulsante «Cartolina con QR»: un\'immagine con logo e QR code da mandare o stampare (per esempio da appendere in cucina).'],
    dev:{aggiunte:['`inviteText`, `inviteCard` (canvas 1080×1350, condivisione file o download), meta Open Graph con `media/invito.jpg`.']}},
  {v:28,data:'2026-10-04',titolo:'Vocali su iPhone e tasto indietro',
    tutti:['I vocali mandati da Android ora si ascoltano anche su iPhone. I vocali vecchi che l\'iPhone non riesce ad aprire vanno rimandati.','Il gesto «indietro» del telefono (scorrere dal bordo dello schermo) ora torna indietro di una pagina: chiude la finestra aperta, la chat o torna alla scheda di prima, invece di uscire dall\'app.'],
    dev:{correzioni:['Chrome con `audio/mp4` senza codec registrava Opus dentro l\'MP4, illeggibile su iPhone: `chRec` usa MediaRecorder solo con `mp4a.40.2` (o MP4 semplice su iPhone/Safari, `chApple`), altrimenti `aacRec` (WebCodecs `AudioEncoder` AAC + intestazioni ADTS, `audio/aac`, 32 kbps), WebM/Opus per ultimo.','`chPlay` usa un solo lettore (`chAu`) sbloccato con un attimo di silenzio dentro il tocco (su iPhone il play dopo lo scaricamento veniva rifiutato); barra con `dur` del messaggio se il file non dice la durata; messaggi d\'errore distinti.'],aggiunte:['Indietro del telefono: `NAV` (una voce in più nella cronologia finché c\'è qualcosa da chiudere, `navSync` in `render`/`openSheet`/`closeSheet`/`chOpen`), `navBack` (foto, reazioni, registrazione, conversazione → lista, chat, `sugBack`/`impBack`, foglio, scheda precedente da `NAV.tabs`).']}},
  {v:27,data:'2026-10-04',titolo:'Reazioni ai messaggi',
    tutti:['In chat puoi rispondere a un messaggio con una faccina: tieni premuto il messaggio e scegli 👍 ❤️ 😂 ✅ 😢 o 👎. Tocca di nuovo la stessa faccina per toglierla.','Tenendo premuto un messaggio scritto puoi anche copiarne il testo.'],
    dev:{aggiunte:['Reazioni in `messaggi/<id>.r.<persona>` (solo le emoji di `CH_RE`, tolta con `FieldValue.delete()`): `chRx`, `chRb`, `chReact`, `chLp` (pressione lunga 450 ms o tasto destro, il clic dopo viene ignorato), `chCopy`. Nessuna regola nuova: `messaggi` è già scrivibile dai membri.']}},
  {v:26,data:'2026-10-04',titolo:'Foto e vocali in chat',
    tutti:['In chat puoi mandare una «foto» (tasto con la macchina fotografica) e un «messaggio vocale» (tasto con il microfono: parla, poi premi la freccia per inviare o il cestino per cancellare). I vocali durano al massimo 2 minuti.','Foto e vocali restano 60 giorni, poi si cancellano da soli.','Nuovi reparti: «F&B Manager» e «Responsabile».','Se hai bloccato le notifiche per sbaglio, l\'app ti spiega passo passo come sbloccarle.'],
    dev:{aggiunte:['Worker `/allegati` (POST base64 con `x-tipo`, GET `/allegati/<db>-<id>`, `/allegati/spazio`) su D1 `ALLEGATI0..3` creati dal workflow (Account › D1 › Edit sul token), tetto 440 MB per database con cancellazione dei più vecchi, cron notturno oltre 60 giorni. App: `ALG`, `algUp`/`algGet` (cache `jona-allegati`), `algImg` (1280 px WebP/JPEG + `mini` 40 px), `chRec` (MediaRecorder MP4/AAC o WebM/Opus, 24 kbps, 2 min), `chPlay`, `chView`, spazio in fondo alla lista chat per lo sviluppatore.','`REPARTI` con `fb` e `resp` (la chiave `altro` resta «Altro»); `PUSH_DENY` e `pushDenied()` in `pushHelp` quando `Notification.permission` è `denied`.']}},
  {v:25,data:'2026-10-04',titolo:'Chat anche sul Wi-Fi lento',
    tutti:['Se il Wi-Fi rallenta i messaggi (per esempio quello dell\'hotel), l\'app se ne accorge e passa da sola a un collegamento che funziona meglio.','Nella chat: «Usa questa chat in modo responsabile e solo per lavoro».'],
    dev:{risolti:['`netWatch`: scrittura non confermata in 4 s con la rete accesa → `jona_fb_lp` e ricarica dopo la conferma (solo senza fogli aperti, testo in chat o scritture in sospeso), altrimenti alla prossima apertura. Usato in `track` e in `chSend`.']}},
  {v:24,data:'2026-10-04',titolo:'Telefoni approvati e chat più svelta',
    tutti:['Quando riapri l\'app la chat si aggiorna subito, senza aspettare.'],
    chef:['Un telefono nuovo non vede più nessun dato finché tu o Mario non lo approvate: lo trovi in Staff → «Telefoni da approvare». Con un profilo nuovo, approvando crei anche il profilo.'],
    dev:{aggiunte:['`membri/<uid>.ok=false` per i telefoni nuovi, richiesta in `req` (profilo nuovo con `sid` e `pass`, o «ho già un profilo»); `screenPhone`, `phoneSheet`, `phSend`; gestori: `PH`, `phWatch`, `phApprove`, `phReject`. Regole: `membro()` vuole `ok` non falso, solo chi ha attivato (`chiave.uid`) entra senza attesa. Worker `/gemini` rifiuta `ok:false`.'],
      risolti:['Chat lenta dopo il ritorno in primo piano: `disableNetwork`/`enableNetwork` se l\'app è rimasta nascosta più di 5 s.','L\'approvazione conta solo se confermata dal server (non da una scrittura locale).']}},
  {v:23,data:'2026-10-04',titolo:'Nome utente automatico',
    tutti:['Mentre scrivi nome e cognome, il nome utente si compila da solo (per esempio mario.loi). Puoi cambiarlo se vuoi.','Accenti e apostrofi nel nome utente vanno bene: li togliamo noi.'],
    dev:{risolti:['Registrazione: con il nome utente vuoto o con accenti/apostrofi l\'errore diceva sempre «almeno 3 caratteri». Ora `normUser` toglie accenti e apostrofi e `checkForm` ha tre messaggi (vuoto, corto, caratteri).'],aggiunte:['`userSug`: nome.cognome senza accenti, con un numero se già usato; proposto finché il campo è vuoto o uguale alla proposta (`_uSug`), mai nella modifica di un profilo esistente.']}},
  {v:22,data:'2026-10-04',titolo:'Registrazione più semplice',
    tutti:['Dopo aver creato il profilo vedi la schermata «In attesa di approvazione»: appena Maurizio o Mario approvano, l\'app si apre da sola.','Se il telefono ricarica l\'app mentre fai la foto del profilo, i dati scritti restano.'],
    dev:{risolti:['iPhone: la foto profilo veniva aperta a grandezza piena (fino a 48 MP) e Safari ricaricava la pagina. Ora `createImageBitmap` con `resizeWidth:640`, altrimenti la strada di prima.','Modulo di registrazione salvato in `jona_reg` (senza password e foto) prima di aprire fotocamera o galleria, ripristinato all\'avvio da `regRestore` (30 min).'],aggiunte:['`screenWait` e `waitCheck`: `jona_wait` ({id,t}) dopo la registrazione; profilo attivo → `login` automatico; disattivato o cancellato → avviso.']}},
  {v:21,data:'2026-10-04',titolo:'Nuovi telefoni: niente più attese infinite',
    chef:['Se un telefono nuovo non riesce a collegarsi, invece di restare su «Un momento…» dice cosa fare e mostra il pulsante Riprova.'],
    dev:{risolti:['Primo collegamento bloccato su iPhone: accesso e iscrizione in `membri` ora hanno un tempo massimo (`fbTmo`, 20 s); oltre, errore `fb_slow` con Riprova e, al tentativo dopo, Firestore in long polling forzato (`jona_fb_lp`).','La schermata di collegamento compare subito dopo la creazione del database (prima restava quella iniziale finché il collegamento non finiva).']}},
  {v:20,data:'2026-10-04',titolo:'Gemini per tutto il ristorante',
    chef:['«Chiedi a Jona» e le foto dei listini funzionano senza mettere la chiave Gemini su ogni telefono: basta la chiave del ristorante sul server.'],
    dev:{aggiunte:['`/gemini` nel Worker: chiave nel segreto `GEMINI_KEY` (dal segreto GitHub `GEMINI_API_KEY`), accesso solo ai telefoni in `membri/<uid>` (gettone Firebase controllato leggendo il proprio documento), se Gemini risponde 429 aspetta il `retryDelay` e riprova, poi passa al modello Lite.','`gemCall` nell\'app: chiave del telefono se c\'è, altrimenti il server; `/salute` dice `gemini:true`.']}},
  {v:19,data:'2026-10-04',titolo:'Animazione girata',
    tutti:['Nell\'animazione dopo «Invia allo chef» ora è lo chef, a sinistra, che porge il menù JONA.'],
    dev:{correzioni:['`media/invio-chef.mp4` invertito nel tempo (ffmpeg `reverse`) invece che specchiato, così il logo resta leggibile. Per rifarlo: `tools/anim-invio.py` e poi lo stesso `reverse`.']}},
  {v:18,data:'2026-10-04',titolo:'Fornitori più belli e animazione nuova',
    tutti:['L\'animazione dopo «Invia allo chef» è nuova: il menù JONA passa dalle tue mani a quelle dello chef.'],
    chef:['La pagina Fornitori ha schede grandi. Puoi aggiungere il logo di ogni fornitore: apri il fornitore, «Contatti e invio», «Scegli immagine», poi «Salva». Il logo compare anche negli ordini e negli invii.'],
    dev:{aggiunte:['`fDot` (logo o iniziale) in tutti i segni dei fornitori, `fornitori.logo` (data URL, massimo 320 px, `fileToLogo`), griglia `.fgrid`/`.fcard`.','Video rifatto dal filmato nuovo di Mario con `tools/anim-invio.py <video> 4.2 0.12 0.12` (riempimento dei buchi per il logo chiaro, memoria degli scontorni in `/tmp/anim-invio-cache`).'],
      correzioni:['Chat: «1 persona» al singolare.']}},
  {v:17,data:'2026-10-04',titolo:'Chat tra colleghi e «Chiedi a Jona»',
    tutti:['In alto, accanto alla campanella, c\'è la chat: scrivi a tutto lo staff, al tuo reparto o a un collega. Tocca la matita per una chat nuova. Le spunte diventano blu quando l\'altro ha letto.','Quando arriva un messaggio vedi un avviso e il numero dei messaggi nuovi sul pulsante della chat.'],
    chef:['Il pulsante tondo con la stellina in basso a destra è «Chiedi a Jona»: fai domande sui dati dell\'app, scritte o a voce («Quanto abbiamo speso da Metro questo mese?», «Chi lavora sabato sera?»). Risponde Gemini con la chiave di questo telefono.','Nella chat vedi i gruppi di tutti i reparti.'],
    dev:{aggiunte:['Chat: collezione `messaggi` (un documento per messaggio `{c,da,t,creato}`, `messaggi/letti` annidato per persona e chat), chat `tutti`, `rep_<reparto>`, `dm_<a>--<b>`. Parla direttamente con Firestore come le push: senza le regole nuove l\'app non si blocca e la chat spiega come attivarla. Ultimi 500 messaggi in ascolto, «Messaggi precedenti» per i vecchi. Push con `pushSend` a più persone.','«Chiedi a Jona»: `jonaCtx` (riassunto JSON di fornitori, listino, ordini, richieste, staff, orari e timbrature; contratti solo per l\'amministratore), `jonaAsk` con `system_instruction` e le ultime 8 domande, `jonaMic` per dettare.'],
      noti:['Le regole Firestore vanno pubblicate di nuovo (collezione `messaggi`): fino ad allora la chat resta spenta.']}},
  {v:16,data:'2026-10-04',titolo:'Cambi turno, timbratura e ordine suggerito',
    tutti:['Nella voce «Orari» puoi chiedere un cambio turno a un collega: tocca «Chiedi un cambio» sotto il giorno, scegli il collega e, se vuoi, un suo giorno da fare tu. Il collega accetta o rifiuta, poi Maurizio approva e gli orari si aggiornano da soli.','Se Maurizio accende la timbratura, nella voce «Orari» trovi il pulsante «Timbra»: quando arrivi e quando finisci inquadra il QR attaccato in cucina.'],
    chef:['In Invii c\'è «Ordine suggerito»: per ogni fornitore l\'app propone le quantità guardando gli ordini degli ultimi 2 mesi, ogni quanti giorni ordini, la gente prevista e il meteo di Porto Cervo. Controlli, cambi e aggiungi all\'ordine.','Contratto, ore e pause li imposti solo tu, e lo staff non li vede più. Chi fa gli orari li usa per i controlli.','Quando un turno non rispetta una regola, l\'app chiede il consenso prima di salvare: con «Salva lo stesso» l\'errore resta segnato come accettato (bordo tratteggiato) e non blocca la pubblicazione.','I cambi turno chiesti dallo staff li trovi in Staff → Orari, con il controllo delle regole: «Approva» aggiorna gli orari pubblicati e avvisa i due.','Timbratura con QR (in Impostazioni, spenta di partenza): QR da stampare, «Cambia codice», orari timbrati nella tabella e «Presenze» in Excel per il consulente del lavoro.'],
    dev:{aggiunte:['Ordine suggerito: `sugStats` (cadenza mediana e uso al giorno dagli ordini inviati degli ultimi 56 giorni), `sugRows`, `sugSheet`, `sugAdd` (un solo `put` dell\'ordine aperto), meteo Open-Meteo con `meteo()` e `wxFactor`.','Timbratura: `config/app.timbra` e `timbraK`, `config/timbr_<lunedì>` (`t.<id>.<g>` come gli orari, «HH:MM-» = in servizio, `m` = senza QR), `tbPunch` e `tbOpen` (16 ore, dopo mezzanotte), lettura con `BarcodeDetector` o `lib/jsqr-1.4.0.js`, `tbExcel`.','Cambi turno: `cambi.<id>` nella settimana pubblicata, `cmApply` scambia le giornate, `cmDecide` aggiorna `t` e `tp` passando da `orConsent`.','Consenso consapevole: `orConsent` e `ok.<persona>` con i testi degli errori accettati. Contratto modificabile solo con `isGM`.']}},
  {v:15,data:'2026-10-04',titolo:'Invio allo chef con animazione',
    tutti:['Quando tocchi «Invia allo chef» compare una breve animazione: il menù JONA passa dalle tue mani a quelle dello chef. Se hai fretta, tocca lo schermo per saltarla.','Nel carrello il pulsante per i prodotti che servono subito ora si chiama «È urgente».'],
    dev:{aggiunte:['`media/invio-chef.mp4`: video H.264 con il colore sopra e la trasparenza sotto (alpha impilato, 720×404 ciascuna); `sendAnim` lo unisce con WebGL su un canvas trasparente sopra l\'app, poi apre il solito foglio «Inviato allo chef». Caricato come blob da `animPrefetch` (apertura del carrello e invio). Si salta con «riduci movimento», senza WebGL o se il video non parte.','Video ricavato dal filmato di Mario: scontorno con rembg (isnet + u2net), tolti i bianchi e grigi neutri (sfondo e giacca), bordi sfumati, colore dei bordi preso dal soggetto.']}},
  {v:14,data:'2026-10-04',titolo:'Orari del personale',
    tutti:['Nel menu in basso c\'è la nuova voce «Orari»: vedi i tuoi turni della settimana, giorno per giorno, con le ore di lavoro. Il giorno di oggi è evidenziato.','Quando Maurizio pubblica gli orari, o li cambia, ricevi un avviso. Se sono già pronti quelli della settimana dopo, li trovi con «Settimana prossima».'],
    chef:['Nella scheda Staff tocca «Orari»: c\'è la tabella della settimana con tutte le persone, divise per reparto. Tocca una casella per mettere un turno tipo (Pranzo, Cena, Spezzato, Giornata), un\'assenza (Riposo, Ferie, Malattia, Permesso) o gli orari a mano. Con «Uguale anche per» lo metti su più giorni insieme.','Nel profilo di ogni persona ci sono le ore a settimana del contratto, la pausa e i giorni liberi.','L\'app controlla da sola: 11 ore di riposo tra un giorno e l\'altro, un riposo di 24 ore nella settimana, giornate oltre 13 ore, pause, giorni liberi e ore oltre il contratto. Le caselle con un problema hanno il bordo rosso (errore) o giallo (avviso) e in alto trovi l\'elenco «da controllare».','«Copia settimana prima» per partire dai turni già fatti, «Pubblica» per mandarli allo staff, «Avvisa delle modifiche» avvisa solo chi ha i turni cambiati. Lo staff vede gli orari solo dopo la pubblicazione.'],
    dev:{aggiunte:['Orari in `config/orari_<lunedì>`: `t` bozza, `tp` copia pubblicata, valori `HH:MM-HH:MM[,HH:MM-HH:MM]` (fine ≤ inizio = dopo mezzanotte) o `R`/`F`/`M`/`P`. Turni tipo in `config/orari_tipi`, contratto in `staff.contratto` `{ore,pausa,liberi}`. Nessuna regola Firestore nuova.','`orCheck` (sovrapposizioni, 11 ore anche dalla domenica prima, 13 ore, 24 ore di fila, giorni liberi, oltre 6 ore senza pausa, contratto e 48 ore), `vOrari` nella scheda Staff (interruttore in `jona_staffsub`), `orCellSheet`, `orTipiSheet`, `orCopy`, `orPublish` (notifica tipo `orari` solo a chi ha la riga cambiata), `vMieiOrari` nella nuova voce `orari` dello staff.','Una persona si salva con `upd(\'config\',id,{\'t.<persona>\':riga})`: `LocalStore.update` ora capisce i percorsi con il punto, come Firestore.']}},
  {v:13,data:'2026-10-04',titolo:'Prodotti urgenti e prezzi aumentati',
    tutti:['Nel carrello, sotto ogni prodotto, c\'è il pulsante «È urgente?». Toccalo se quel prodotto serve subito: Maurizio riceve un avviso importante e vede la tua richiesta in cima.','Se nel controllo merce manca un prodotto che avevi chiesto tu, ricevi un avviso.'],
    chef:['Le richieste con prodotti urgenti sono in cima, con la scritta rossa URGENTE. La notifica sul telefono resta sullo schermo finché non la tocchi.','Quando carichi un listino o una fattura, in alto vedi i prodotti che costano di più, con la percentuale di aumento. Dopo il salvataggio compare il riepilogo «Prezzi aumentati» e arriva una notifica.','Nella notifica del controllo merce vedi i prodotti mancanti o arrivati in meno e chi li aveva chiesti.'],
    dev:{aggiunte:['Import: `pctUp`, `pctS`, `rvUps` (aumenti rispetto a `matchProd`), banner in `reviewSheet`, `upsSheet` dopo `reviewSave`, notifica tipo `prezzi`; nel listino il pill «era» diventa rosso con la percentuale.','Urgenza: `S.cart[i].urg` (azione `curg`), `items[i].urgente` nella richiesta e `urgente` sulla riga d\'ordine; `reqUrg` ordina le richieste; notifica tipo `urgente` con titolo che inizia per «URGENTE» (`sw.js`: `requireInteraction` e vibrazione lunga).','Controllo merce: `ricezione.righe[i]` ha `key` e `da` (nomi di chi aveva chiesto); `rcvDiffTxt`; avviso per persona a chi aveva chiesto i prodotti mancanti.']}},
  {v:12,data:'2026-10-04',titolo:'Controllo merce a colori e invii sicuri',
    tutti:['Controllo della merce più semplice: tocca ogni prodotto. 1 tocco verde «c\'è», 2 tocchi rosso «manca», 3 tocchi giallo «ne è arrivato meno» (scegli quanti). In alto vedi quanti ne hai fatti, per esempio «9 di 14». Se è tutto giusto basta «È arrivato tutto».','Se manca la rete, in alto compare «Non ancora arrivata a Maurizio»: la richiesta parte da sola appena torna la rete e vedi «Arrivata ✓». Se hai fretta c\'è il pulsante «Manda SMS».'],
    chef:['In approvazione la richiesta è divisa in blocchi colorati, uno per fornitore. Con «+ Aggiungi da …» dentro il blocco aggiungi prodotti cercando solo nel listino di quel fornitore.','I prodotti senza fornitore sono in un blocco rosso: scegli il fornitore prima di approvare.','Nel controllo merce ora vedi anche i prodotti «non controllati».'],
    dev:{aggiunte:['`reqPickSheet` (azioni `rpick`, `rpadd`): righe aggiunte dallo chef con `aggiunto:true` e `qtaOrig:0`, non finiscono in `rimossi`.','Semaforo in `receiveSheet`: `rcvState().lines[i].st` (`\'\'`/`ok`/`ko`/`meno`), `SEM`, `SEM_NEXT`, azione `rst`; `ricezione.righe` invariato con nuovo motivo `nonctrl` e campo `nonControllati` sull\'ordine.','Invii in sospeso: `pushSend` mette in coda (IndexedDB `jona-outbox`) le push non partite; `obxFlush` su `online`, apertura, `visibilitychange` e ogni minuto; `sw.js` con Background Sync (`jona-outbox`); `navigator.setAppBadge`; `obxBar`/`obxTick` con «Arrivata ✓».'],
      noti:['Background Sync non c\'è su iPhone: lì le push in coda partono solo ad app aperta. Le scritture Firestore in sospeso ripartono solo ad app aperta.']}},
  {v:11,data:'2026-10-04',titolo:'Guida alle notifiche',
    tutti:['Se le notifiche non si attivano o non arrivano, c\'è una guida semplice per il tuo telefono (iPhone, Xiaomi, Samsung, Huawei, Oppo e altri): tocca la tua foto → «Problemi con le notifiche? Guida». Si apre da sola anche quando qualcosa va storto.'],
    dev:{aggiunte:['`pushHelp()` con `PUSH_HELP` (passi per marca, marca indovinata da `userAgent` quando possibile, `S.pushBrand`); `pushOn` apre la guida sugli errori e restituisce `true` se riesce.']}},
  {v:10,data:'2026-10-03',titolo:'Messaggio più chiaro sulle notifiche',
    dev:{correzioni:['`pushOn`: se `pushManager.subscribe` fallisce (es. `AbortError` su telefoni senza servizi Google o browser che bloccano il push) compare un messaggio chiaro invece di «Operazione non riuscita (20)».']}},

function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('script'));document.head.appendChild(s)})}
function need(k){if(!libP[k])libP[k]=(async()=>{if(LIB[k].ok())return;for(const s of LIB[k].src)await loadScript(s);if(!LIB[k].ok())throw new Error('lib');if(k==='pdfjs')window.pdfjsLib.GlobalWorkerOptions.workerSrc=LIB.pdfjs.src[1]})().catch(e=>{delete libP[k];throw{code:'lib'}});return libP[k]}

/* ================= data store (sostituibile) =================
   Interfaccia unica usata da tutta l'app: collection(nome).doc(id).set/update/delete,
   collection(nome).orderBy().limit().onSnapshot(). Questa versione "locale" salva sul
   dispositivo; le versioni Firebase e Google Fogli implementeranno la stessa interfaccia. */
const LocalStore=(()=>{
  const KEY='jona_db_v2';let data={};
  try{data=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){data={}}
  const subs=new Set();let t=null;
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){throw{code:'quota_exceeded'}}};
  const fire=()=>{clearTimeout(t);t=setTimeout(()=>subs.forEach(s=>s()),0)};
  addEventListener('storage',e=>{if(e.key===KEY){try{data=JSON.parse(e.newValue||'{}')||{}}catch(_){}fire()}});
  const doc=(c,id)=>({id,
    set:async d=>{(data[c]=data[c]||{})[id]=clone(d);save();fire()},
    update:async d=>{if(!data[c]||!data[c][id])throw{code:'not_found'};
      // come Firestore: «a.b» cambia solo il campo b dentro a
      for(const [k,v] of Object.entries(clone(d))){const p=k.split('.');let x=data[c][id];for(const f of p.slice(0,-1))x=x[f]&&typeof x[f]==='object'?x[f]:(x[f]={});x[p[p.length-1]]=v}
      save();fire()},
    delete:async()=>{if(data[c]&&data[c][id]){delete data[c][id];save();fire()}}});
  const query=(c,ord,lim)=>({
    orderBy:(f,dir)=>query(c,[f,dir],lim),limit:n=>query(c,ord,n),
    onSnapshot(next){let prev=null;
      const run=()=>{let ds=Object.entries(data[c]||{}).map(([id,d])=>({id,data:()=>d}));
        if(ord)ds.sort((a,b)=>(ord[1]==='desc'?-1:1)*((a.data()[ord[0]]||0)-(b.data()[ord[0]]||0)));
        if(lim)ds=ds.slice(0,lim);
        const changes=ds.filter(d=>!prev||!prev.has(d.id)).map(d=>({type:'added',doc:d}));prev=new Set(ds.map(d=>d.id));
        next({docs:ds,docChanges:()=>changes})};
      subs.add(run);setTimeout(run,0);return()=>subs.delete(run)}});
  return{kind:'locale',collection:c=>Object.assign(query(c),{doc:id=>doc(c,id||uid())}),
    dump:()=>clone(data),load:d=>{const old=data;data=clone(d);try{save()}catch(e){data=old;throw e}fire()},
    range:async(c,f,a,b)=>Object.entries(data[c]||{}).filter(([,d])=>(d[f]||0)>=a&&(d[f]||0)<b).map(([id,d])=>Object.assign({id},clone(d))),
    empty:()=>!Object.keys(data.fornitori||{}).length};
})();

/* ================= database centrale (Firebase) =================
   Stessa interfaccia del salvataggio locale. Firestore tiene una copia dei dati sul telefono:
   l'app funziona anche senza rete e invia le modifiche appena torna la connessione.
   I prodotti stanno in un documento per fornitore («listini/<fornitore>»): ogni apertura legge pochi documenti.
   Accesso: accesso anonimo + chiave del ristorante (link o QR); vedi firebase/firestore.rules. */
const fbCfg=()=>self.JONA_FIREBASE||ls('jona_fb')||null;
const FB_COLS=['staff','fornitori','config','richieste','ordini','notifiche'];
const randKey=(n=24)=>{const a='abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789';return[...crypto.getRandomValues(new Uint8Array(n))].map(x=>a[x%a.length]).join('')};
function fbInit(){
  const app=firebase.apps.length?firebase.app():firebase.initializeApp(fbCfg());const fs=firebase.firestore(),auth=firebase.auth();
  if(ls('jona_fb_lp')&&!fbInit.lp){fbInit.lp=1;try{fs.settings({experimentalForceLongPolling:true,merge:true})}catch(e){}}
  const emu=ls('jona_fb_emu');if(emu&&!fbInit.emu){fbInit.emu=1;fs.useEmulator(emu,8080);auth.useEmulator('http://'+emu+':9099',{disableWarnings:true})}
  return{fs,auth};
}
// reti Wi-Fi con filtri (es. UniFi con IPS) trattengono il collegamento continuo di Firestore: se una scrittura non arriva in 4 s
// con la rete accesa, si passa al long polling (jona_fb_lp); si ricarica solo dopo la conferma, senza fogli aperti né testo in chat
function netWatch(p){
  if(ls('jona_fb_lp')||!S.db||S.db.kind!=='firebase')return p;
  const t=setTimeout(()=>{if(navigator.onLine===false||document.hidden||ls('jona_fb_lp'))return;ls('jona_fb_lp',1);
    toast('Questa rete Wi-Fi rallenta i messaggi: chiudi e riapri l\'app per usare un collegamento compatibile.','warn');updOn()},4000);
  Promise.resolve(p).then(()=>clearTimeout(t),()=>clearTimeout(t));return p}
const fbTmo=(p,ms=20000)=>Promise.race([p,new Promise((_,j)=>setTimeout(()=>j({code:'fb_slow'}),ms))]);
async function fbSignIn(auth){await new Promise(r=>{const u=auth.onAuthStateChanged(()=>{u();r()})});if(!auth.currentUser)await auth.signInAnonymously();return auth.currentUser.uid}
async function fbPublic(){try{await need('firebase');const{fs}=fbInit();const d=await fbTmo(fs.doc('pubblico/stato').get(),12000);return!!(d.exists&&d.data().attivo)}catch(e){return null}}
function FirebaseStore(key){
  const{fs,auth}=fbInit();
  fs.enablePersistence({synchronizeTabs:true}).catch(()=>{});
  const FV=firebase.firestore.FieldValue,FP=firebase.firestore.FieldPath;
  const st={ready:false,err:'',pend:0,net:navigator.onLine!==false,busy:'',step:''};
  const ping=()=>schedule();
  addEventListener('online',()=>{st.net=true;ping()});addEventListener('offline',()=>{st.net=false;ping()});
  const mapErr=e=>({code:!e?'fb':e.code==='not-found'?'not_found':e.code==='permission-denied'?'fb_perm':e.code==='unavailable'?'fb_net':e.code?'fb':'fb',msg:e&&e.message});
  let okReady;const readyP=new Promise(r=>okReady=r);
  const track=p=>{if(st.ready)netWatch(p);st.pend++;ping();p.then(()=>{st.pend--;ping()},e=>{st.pend--;const m=mapErr(e);if(m.code==='fb_perm'){st.err='fb_perm';st.ready=false}ping();toast(errMsg(m),'err')})};
  const run=f=>{track(readyP.then(f));return Promise.resolve()};
  const cache={};
  // ---- telefono nuovo: resta in attesa («ok» falso) finché un telefono approvato non lo approva ----
  const newMember=()=>({k:key,ok:false,creato:now(),ua:navigator.userAgent.slice(0,120)});
  const approval=u=>new Promise((res,rej)=>{let un=null;const to=setTimeout(()=>{if(un)un();rej({code:'fb_slow'})},20000);
    un=fs.doc('membri/'+u).onSnapshot({includeMetadataChanges:true},d=>{if(!d.exists&&d.metadata.fromCache)return;clearTimeout(to);
      if(!d.exists){st.wait='no';st.req=null;ping();return}
      const x=d.data();if(x.ok===false){st.wait='attesa';st.req=x.req||null;ping();return}
      if(d.metadata.hasPendingWrites||d.metadata.fromCache)return;
      un();st.wait='';st.req=null;ping();res()},e=>{clearTimeout(to);rej(e)})});
  // al ritorno in primo piano il collegamento vecchio può essere morto senza che Firestore lo sappia: lo rifà subito
  let hidAt=0;
  document.addEventListener('visibilitychange',()=>{if(document.hidden){hidAt=Date.now();return}
    if(hidAt&&Date.now()-hidAt>5000&&st.ready&&navigator.onLine!==false)fs.disableNetwork().then(()=>fs.enableNetwork()).catch(()=>{});hidAt=0});
  // ---- collegamento: accesso anonimo e iscrizione del telefono con la chiave ----
  (async function connect(){
    try{
      st.step='accesso';ping();
      const u=await fbTmo(fbSignIn(auth));st.uid=u;
      if(ls('jona_member')!==u){st.step='iscrizione';ping();const m=await fbTmo(fs.doc('membri/'+u).get(),12000);
        if(!m.exists)await fbTmo(fs.doc('membri/'+u).set(newMember()));else if(m.data().ok!==false)ls('jona_member',u);
        if(ls('jona_member')!==u){st.step='';await approval(u);ls('jona_member',u)}}
      st.step='';
      if(ls('jona_fb_upload')){st.busy='upload';ping();await loadAll(LocalStore.dump());ls('jona_fb_upload',null);st.busy='';toast('Database centrale attivo: i dati di questo telefono sono stati caricati')}
      st.ready=true;st.err='';ping();okReady();

  return`<nav class="nav n${tabs.length}" aria-label="Sezioni"><div class="nav-brand"><div class="logo-full" role="img" aria-label="Jona Ristorante"></div></div>${tabs.map(t=>{const b=t.b?t.b():0;return`<button type="button" data-a="tab" data-v="${t.id}" ${S.tab===t.id?'aria-current="page"':''}>${ic(t.i)}<span>${t.l}</span>${b?`<span class="badge">${b>99?'99+':b}</span>`:''}</button>`}).join('')}</nav>
  <main class="main${nc?' has-bar':''}"><header class="top"><div class="mark" aria-hidden="true"></div><div class="top-t">${esc(cfg().nomeLocale)}</div>${syncPill()}${newsBtn(me)}
  ${(()=>{const c=chUnread(realU());return`<button type="button" class="icon-btn bell" data-a="chatOpen" aria-label="Chat${c?', '+c+' messaggi nuovi':''}">${ic('msg')}${c?`<span class="dot">${c>9?'9+':c}</span>`:''}</button>`})()}
  <button type="button" class="icon-btn bell" data-a="notifs" aria-label="Notifiche${n?', '+n+' nuove':''}">${ic('bell')}${n?`<span class="dot">${n>9?'9+':n}</span>`:''}</button>
  <button type="button" class="me-btn" data-a="meMenu" aria-label="Il tuo profilo">${avatar(me,36)}</button></header>${obxBar()}${banner()}${testBar()}${V[S.tab](me)}</main>${nc?cartBar(nc):''}${isMgr(me)?`<button type="button" class="mic-fab ask-fab" data-a="jonaOpen" aria-label="Chiedi a Jona" title="Chiedi a Jona">${ic('sparkle')}</button>`:micBtn()}`;
}
// Staff: barra fissa sopra il menu in basso, porta al carrello per inviare allo chef.
// Staff: microfono sempre visibile in basso a destra (ordine a voce).
const micBtn=()=>`<button type="button" class="mic-fab" data-a="voice" aria-label="Ordina con la voce" title="Ordina con la voce">${ic('mic')}</button>`;
const cartBar=n=>`<div class="cartbar"><button type="button" class="btn primary big block" data-a="tab" data-v="carrello">${ic('cart')}<span>${n} ${n===1?'articolo':'articoli'} · Invia allo chef</span>${ic('chev')}</button></div>`;
function testBar(){
  const u=realU();if(!isDev(u))return'';
  return`<div class="testbar"><span class="muted small">Test</span><div class="seg" role="group" aria-label="Vedi l'app come">${[['gm','Admin Chef'],['staff','Staff'],['dev','Sviluppatore '+u.nome]].map(([k,l])=>`<button type="button" aria-pressed="${(VIEW_AS[S.viewAs]?S.viewAs:'dev')===k}" data-a="viewAs" data-v="${k}">${esc(l)}</button>`).join('')}</div></div>`;
}

/* ================= staff: catalogo ================= */
function cartQty(pid){const c=S.cart.find(c=>c.pid===pid);return c?c.qta:0}
function saveCart(){if(S.me)ls('jona_cart_'+S.me,S.cart)}
function setCart(pid,q,extra){q=Math.max(0,r3(q));const i=S.cart.findIndex(c=>c.pid===pid);if(q<=0){if(i>=0)S.cart.splice(i,1)}else if(i>=0)S.cart[i].qta=q;else S.cart.push(Object.assign({pid,qta:q},extra||{}));saveCart();render()}
function vCatalogo(me){
  const ps=prods();
  if(!ps.length)return`<h1 class="vt">Cosa serve?</h1>`+empty('store','Il catalogo è vuoto','Lo chef deve ancora caricare i listini dei fornitori. Intanto puoi chiedere un prodotto scrivendolo qui sotto.')+catSearch([])+`<div id="results">${catResults()}</div>`;
  const cats=[...new Set(ps.map(p=>p.categoria||'Altro'))].sort((a,b)=>CATS.indexOf(a)-CATS.indexOf(b));
  return`<h1 class="vt">Cosa serve?</h1>${isMgr(me)?'<p class="vsub">Cerca, scegli il fornitore e aggiungi al carrello.</p>':stepsHint()}${catSearch(cats)}<div id="results">${catResults()}</div>`;
}
const stepsHint=()=>`<ol class="steps3" aria-label="Come si fa"><li><b>1</b>Cerca</li><li><b>2</b>Premi +</li><li><b>3</b>Invia allo chef</li></ol>`;
function catSearch(cats){
  return`<div class="search">${ic('search')}<input id="q" type="search" placeholder="${isMgr(meU())?'Prodotto, codice o fornitore':'Cerca un prodotto, es. zucchero'}" value="${esc(S.q)}" data-in="q" autocomplete="off" enterkeyhint="search"><button type="button" class="icon-btn" data-a="qclear" aria-label="Svuota ricerca">${ic('x')}</button></div>
  ${cats.length?`<div class="chips" role="group" aria-label="Categorie"><button type="button" class="chip" aria-pressed="${!S.cat}" data-a="cat" data-v="">Tutte</button>${cats.map(c=>`<button type="button" class="chip" aria-pressed="${S.cat===c}" data-a="cat" data-v="${esc(c)}">${esc(c)}</button>`).join('')}</div>`:''}`;
}
// Quante volte l'utente ha chiesto ogni prodotto (una volta per richiesta) e quando l'ultima volta.
function usualOf(me){const m=new Map();for(const r of Object.values(D().richieste)){if(r.utenteId!==me.id)continue;const seen=new Set();for(const it of r.items||[]){if(!it.pid||seen.has(it.pid))continue;seen.add(it.pid);const x=m.get(it.pid)||{n:0,t:0};x.n++;x.t=Math.max(x.t,r.creato||0);m.set(it.pid,x)}}return m}
function catResults(){
  const me=meU();const sp=showPrices();const q=norm(S.q);const toks=q?q.split(' '):[];
  const U=usualOf(me);let list=prods();let title='',keep=false;
  if(toks.length)list=list.filter(p=>{const h=norm(p.nome+' '+(p.codice||'')+' '+forn(p.fornitoreId).nome+' '+(p.categoria||''));return toks.every(t=>h.includes(t))});
  if(S.cat)list=list.filter(p=>(p.categoria||'Altro')===S.cat);
  const hit=new Set(list.map(p=>p.id));
  if(!toks.length&&!S.cat){
    const rec=[...U.entries()].filter(([pid])=>D().prodotti[pid]).sort((a,b)=>b[1].n-a[1].n||b[1].t-a[1].t).slice(0,12).map(([pid])=>D().prodotti[pid]);
    if(rec.length){list=rec;title='I tuoi soliti';keep=true}else{list=list.slice().sort(byNome).slice(0,40);title='Tutti i prodotti'}
  }
  const groups=new Map();
  for(const p of list){const k=gkey(p.nome);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(p)}
  if(toks.length||S.cat){for(const [k,arr] of groups){for(const p of S.gidx.get(k)||[])if(!arr.includes(p))arr.push(p)}}
  let arr=[...groups.values()];if(!keep)arr.sort((a,b)=>byNome(a[0],b[0]));arr=arr.slice(0,80);
  let html='';
  if(title)html+=`<h2 class="sec">${title}</h2>`;
  if(arr.length)html+=`<div class="panel">${arr.map(g=>isMgr(me)?groupHTML(g,sp):staffGroup(g,U,hit)).join('')}${toks.length?freeRow():''}</div>`;
  else if(toks.length)html+=`<div class="panel">${freeRow(true)}</div>`;
  return html;
}
// Staff: l'opzione che aggiunge il "+": quella già nel carrello, altrimenti (tra quelle che corrispondono alla ricerca)
// la più economica se ci sono i prezzi, poi quella che l'utente ha chiesto più spesso, poi la prima.
function defOpt(items,U,hit){
  const c=items.find(p=>cartQty(p.id));if(c)return c;
  const pool=items.some(p=>hit&&hit.has(p.id))?items.filter(p=>hit.has(p.id)):items;
  const pr=pool.filter(p=>p.prezzo!=null).sort((a,b)=>a.prezzo-b.prezzo);if(pr.length)return pr[0];
  let b=null;for(const p of pool){const x=U.get(p.id);if(x&&(!b||x.n>U.get(b.id).n))b=p}
  return b||pool[0];
}
// Staff: una riga per prodotto, senza scelta del fornitore (lo chef può cambiarlo quando approva).
function staffGroup(items,U,hit){
  const p=defOpt(items,U,hit);const q=cartQty(p.id);
  const title=items.map(x=>x.nome).sort((a,b)=>a.length-b.length)[0];
  return`<div class="pg one"><div class="opt"><div class="opt-i"><div class="pg-t">${esc(title)}</div>${p.nome!==title?`<div class="opt-n">${esc(p.nome)}</div>`:''}<div class="pg-c">${esc(p.categoria||'Altro')}${p.unita?' · '+esc(p.unita):''}</div></div>
  ${q?stepper('c',p.id,q,`data-p="${p.id}"`):`<button type="button" class="add" data-a="cadd" data-p="${p.id}" aria-label="Aggiungi ${esc(title)}">${ic('plus')}</button>`}</div></div>`;
}
function groupHTML(items,sp){
  items=items.slice().sort((a,b)=>(a.prezzo??1e9)-(b.prezzo??1e9));
  const multi=new Set(items.map(p=>p.fornitoreId)).size>1;
  const title=multi?items.map(p=>p.nome).sort((a,b)=>a.length-b.length)[0]:items[0].nome;
  const best=multi&&sp&&items[0].prezzo!=null?items[0].id:null;
  return`<div class="pg"><div class="pg-t">${esc(title)}</div><div class="pg-c">${esc(items[0].categoria||'Altro')}${multi?`, da ${new Set(items.map(p=>p.fornitoreId)).size} fornitori`:''}</div>
  ${items.map(p=>{const q=cartQty(p.id);return`<div class="opt"><div class="opt-i"><span class="sup" style="--c:${fcolor(p.fornitoreId)}"><i></i>${esc(forn(p.fornitoreId).nome)}</span>${p.id===best?' <span class="tag best">più conveniente</span>':''}${p.demo?' <span class="tag">demo</span>':''}
  ${multi&&p.nome!==title?`<div class="opt-n">${esc(p.nome)}</div>`:''}
  <div class="opt-m">${p.codice?`<span>cod. ${esc(p.codice)}</span>`:''}${sp&&p.prezzo!=null?`<span><b>${eur(p.prezzo)}</b>${p.unita?' / '+esc(p.unita):''}</span>`:(p.unita?`<span>${esc(p.unita)}</span>`:'')}</div></div>
  ${q?stepper('c',p.id,q,`data-p="${p.id}"`):`<button type="button" class="add" data-a="cadd" data-p="${p.id}" aria-label="Aggiungi ${esc(p.nome)}">${ic('plus')}</button>`}</div>`}).join('')}</div>`;
}
function freeRow(alone){return`<div class="free" ${alone?'style="border-top:0"':''}>${ic('paste')}<div>${alone?'Nessun prodotto trovato.':'Non è quello giusto?'} Puoi chiedere «${esc(S.q.trim())}» allo chef, sceglierà lui il fornitore.</div><button type="button" class="btn ghost sm" data-a="cfree">Chiedi</button></div>`}

/* ================= staff: carrello ================= */
function cartLines(){return S.cart.map(c=>c.libero?Object.assign({},c,{fid:''}):Object.assign({},c,{p:D().prodotti[c.pid],fid:(D().prodotti[c.pid]||{}).fornitoreId})).filter(x=>x.libero||x.p)}
function vCarrello(me){
  const lines=cartLines();const sp=showPrices();
  if(!lines.length)return`<h1 class="vt">Carrello</h1>`+empty('cart','Il carrello è vuoto','Cerca i prodotti che servono in cucina o in sala e aggiungili qui.',`<button type="button" class="btn primary" data-a="tab" data-v="catalogo">${ic('search')} Vai al catalogo</button>`);
  const g=new Map();for(const l of lines){if(!g.has(l.fid))g.set(l.fid,[]);g.get(l.fid).push(l)}
  let tot=0;for(const l of lines)if(l.p&&l.p.prezzo!=null)tot+=l.p.prezzo*l.qta;
  const nf=[...g.keys()].filter(Boolean).length;const staff=!isMgr(me);
  const lineH=l=>`<div class="line wrap${staff?' big':''}"><div class="ln-i"><div class="ln-n">${esc(l.libero?l.nome:l.p.nome)}${l.libero&&staff?' <span class="tag">fuori listino</span>':''}</div>${l.libero?`<input class="inp unit-inp" id="cu-${l.pid}" value="${esc(l.unita||'')}" placeholder="unità" data-ch="cunit" data-p="${l.pid}" aria-label="Unità">`:`<div class="ln-m">${l.p.codice&&!staff?'cod. '+esc(l.p.codice):''}${sp&&l.p.prezzo!=null?` ${eur(l.p.prezzo)}${l.p.unita?' / '+esc(l.p.unita):''}`:(l.p.unita?' '+esc(l.p.unita):'')}</div>`}</div>
  ${stepper('c',l.pid,l.qta,`data-p="${l.pid}"`)}<button type="button" class="icon-btn" data-a="crm" data-p="${l.pid}" aria-label="Rimuovi">${ic('trash')}</button>
  <div class="ln-x"><button type="button" class="urg-b${l.urg?' on':''}" data-a="curg" data-p="${l.pid}" aria-pressed="${!!l.urg}">${ic('warn')} ${l.urg?'Urgente ✓':'È urgente'}</button></div></div>`;
  const nu=lines.filter(l=>l.urg).length;
  return`<h1 class="vt">Carrello</h1><p class="vsub">${lines.length} ${lines.length===1?'articolo':'articoli'}${nf&&!staff?` da ${nf} ${nf===1?'fornitore':'fornitori'}`:''}. ${staff?'Controlla le quantità e premi «Invia allo chef».':'Controlla le quantità e invia allo chef.'} Se un prodotto serve subito tocca «È urgente».</p>
  ${nu?`<div class="banner dup" role="note">${ic('warn')}<div><b>${nu===1?'1 prodotto urgente':nu+' prodotti urgenti'}.</b> Maurizio riceve un avviso importante e li vede in cima.</div></div>`:''}
  <div class="panel">${staff?`<div class="fsec">${lines.map(lineH).join('')}</div>`:[...g.entries()].map(([fid,ls])=>`<div class="fsec"><div class="fsec-h"><span class="sup" style="--c:${fcolor(fid)}"><i></i>${fid?esc(forn(fid).nome):'Fuori listino, lo assegna lo chef'}</span><span class="muted small">${ls.length}</span></div>
  ${ls.map(lineH).join('')}</div>`).join('')}
  ${sp&&tot?`<div class="total"><span>Totale stimato</span><b>${eur(tot)}</b></div>`:''}</div>
  <label class="lbl" for="cart-note">Nota per lo chef</label><textarea id="cart-note" class="inp" rows="2" placeholder="Es. serve per il servizio di stasera" data-in="cnote">${esc(S.cnote)}</textarea>
  <div class="cart-foot" style="margin-top:16px"><button type="button" class="btn primary block big" data-a="csend">${ic('send')} Invia allo chef</button></div>`;
}
async function sendCart(){
  const me=meU();const lines=cartLines();if(!lines.length)return;animPrefetch();
  const items=lines.map(l=>l.libero?{libero:true,nome:l.nome,qta:l.qta,unita:l.unita||'pz',fornitoreId:'',fornitoreNome:'',codice:'',prezzo:null}
    :{pid:l.p.id,nome:l.p.nome,codice:l.p.codice||'',unita:l.p.unita||'',prezzo:l.p.prezzo??null,fornitoreId:l.p.fornitoreId,fornitoreNome:forn(l.p.fornitoreId).nome,qta:l.qta});
  lines.forEach((l,i)=>{if(l.urg)items[i].urgente=true});
  const dup=findDoppi(items,me);
  if(dup.length){
    const L=dup.slice(0,5).map(d=>`${d.nome}: chiesto da ${d.self?'te':firstName(d.da)} ${quandoAlle(d.quando)} (${d.st})`);if(dup.length>5)L.push('…e altri '+(dup.length-5));
    if(!await ask('Attenzione: già richiesto',L.join('\n')+'\n\nÈ corretto inviarlo di nuovo?','Sì, invia lo stesso'))return;
  }
  const id=uid();const nf=new Set(items.map(i=>i.fornitoreId).filter(Boolean)).size;
  const doc={utenteId:me.id,utenteNome:fullName(me),reparto:me.reparto||'altro',mansione:me.mansione||'',items,nota:S.cnote.trim(),stato:'inviata',creato:now()};
  if(dup.length)doc.doppi=dup.map(d=>({nome:d.nome,da:d.da,quando:d.quando}));
  await put('richieste',id,doc);
  const urg=items.filter(i=>i.urgente);
  if(urg.length)await notify('gm','URGENTE: '+me.nome+' chiede '+urg.map(i=>i.nome).slice(0,3).join(', ')+(urg.length>3?'…':''),`${urg.length===1?'Serve subito':urg.length+' prodotti servono subito'}. Richiesta di ${items.length} ${items.length===1?'articolo':'articoli'}${dup.length?' (possibile doppione)':''}`,'urgente',id);
  else await notify('gm','Nuova richiesta da '+me.nome,`${REPARTI[me.reparto]||''}, ${items.length} ${items.length===1?'articolo':'articoli'}${nf?' da '+nf+(nf===1?' fornitore':' fornitori'):''}${dup.length?' (possibile doppione)':''}`,'richiesta',id);
  S.cart=[];saveCart();S.cnote='';S.tab='miei';render();window.scrollTo(0,0);
  await sendAnim();
  openSheet({render:()=>`<div class="grab"></div><div class="done">${ic('check','big')}<h2>Inviato allo chef</h2><p class="muted">Riceverai una notifica quando approva o rifiuta la richiesta.</p><div class="btns col"><button type="button" class="btn primary block" data-a="logout">${ic('logout')} Esci dal profilo</button><button type="button" class="btn ghost block" data-a="closeSheet">Continua</button></div></div>`});
}

// Richieste delle ultime 24 ore (non rifiutate, di chiunque) con lo stesso prodotto: stesso pid o un'alternativa
// dello stesso gruppo (lo chef può aver cambiato fornitore), oppure stesso nome per i prodotti scritti a mano.
function findDoppi(items,me){
  const since=now()-864e5,out=[],seen=new Set();
  const rs=Object.values(D().richieste).filter(r=>(r.creato||0)>=since&&r.stato!=='rifiutata').sort((a,b)=>b.creato-a.creato);
  for(const x of items){
    const p=x.pid&&D().prodotti[x.pid];const ids=new Set(p?(S.gidx.get(gkey(p.nome))||[]).map(q=>q.id):[]);if(x.pid)ids.add(x.pid);const nn=norm(x.nome);
    for(const r of rs){if(seen.has(nn+'|'+r.id))continue;
      if((r.items||[]).some(it=>(it.pid&&ids.has(it.pid))||norm(it.nome)===nn)){seen.add(nn+'|'+r.id);out.push({nome:x.nome,da:r.utenteNome||'',self:r.utenteId===me.id,quando:r.creato,st:reqStatus(r)[1].toLowerCase()})}}
  }
  return out;
}
function quandoAlle(t){const d=new Date(t),td=new Date(),y=new Date(td);y.setDate(td.getDate()-1);const hm=d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});return(d.toDateString()===td.toDateString()?'oggi':d.toDateString()===y.toDateString()?'ieri':d.toLocaleDateString('it-IT',{day:'numeric',month:'short'}))+' alle '+hm}

/* ================= requests readonly ================= */
function reqStatus(r){
  if(r.stato==='inviata')return['wait','In attesa'];
  if(r.stato==='rifiutata')return['ko','Rifiutata'];
  const fs=[...new Set((r.items||[]).map(i=>i.fornitoreId).filter(Boolean))];const done=fs.filter(f=>r.ordinati&&r.ordinati[f]).length;
  const arr=fs.filter(f=>r.arrivati&&r.arrivati[f]).length;
  if(fs.length&&arr===fs.length)return['ok','Arrivata'];
  if(fs.length&&done===fs.length)return['sent','Ordinata'];
  if(done)return['sent','Ordinata in parte'];
  return['ok',r.modificata?'Approvata con modifiche':'Approvata'];
}
function groupByF(items){const g=new Map();for(const it of items){const k=it.fornitoreId||'';if(!g.has(k))g.set(k,[]);g.get(k).push(it)}return[...g.entries()]}
function itemsRO(r){
  return groupByF(r.items||[]).map(([fid,its])=>`<div class="fsec"><div class="fsec-h"><span class="sup" style="--c:${fcolor(fid)}"><i></i>${fid?esc(forn(fid).nome||its[0].fornitoreNome):'Da assegnare'}</span>${r.ordinati&&r.ordinati[fid]?`<span class="muted small">ordinato ${ago(r.ordinati[fid])}</span>`:''}</div>
  ${its.map(it=>`<div class="line"><div class="ln-i"><div class="ln-n">${esc(it.nome)}${it.urgente?' <span class="tag urg">urgente</span>':''}</div><div class="ln-m">${it.codice?'cod. '+esc(it.codice)+' ':''}${it.aggiunto?'<span class="was">aggiunto dallo chef</span>':it.qtaOrig!=null&&it.qtaOrig!==it.qta?`<span class="was">chiesti ${fq(it.qtaOrig)}, lo chef ha messo ${fq(it.qta)}</span>`:''}</div></div><b>${fq(it.qta)}</b><span class="ln-u">${esc(it.unita||'')}</span></div>`).join('')}</div>`).join('')
  +((r.rimossi&&r.rimossi.length)?`<p class="removed">Tolti dallo chef: ${esc(r.rimossi.map(x=>x.nome).join(', '))}</p>`:'');
}
function reqSummary(r,who){
  const [k,l]=reqStatus(r);const u=D().staff[r.utenteId]||{id:r.utenteId,nome:r.utenteNome};const n=(r.items||[]).length;
  return`<details class="rs"><summary><div class="rs-i">${who?avatar(u,38):''}<div><div class="rs-t">${who?esc(r.utenteNome)+', ':''}${n} ${n===1?'articolo':'articoli'}</div><div class="rs-m">${ago(r.creato)}${who?', '+esc(REPARTI[r.reparto]||''):''}</div></div></div>${pill(k,l)}</summary>
  <div class="rs-b">${r.notaGM?`<p class="gm-note"><b>Chef:</b> ${esc(r.notaGM)}</p>`:''}${r.nota?`<p class="muted small" style="margin:0 0 6px">Nota: ${esc(r.nota)}</p>`:''}${itemsRO(r)}</div></details>`;
}
function vMiei(me){
  const rs=Object.values(D().richieste).filter(r=>r.utenteId===me.id).sort((a,b)=>b.creato-a.creato);
  if(!rs.length)return`<h1 class="vt">I miei ordini</h1>`+empty('clock','Nessuna richiesta ancora','Le richieste che invii allo chef compaiono qui, con lo stato aggiornato.');
  const open=rs.filter(r=>r.stato==='inviata').length;
  return`<h1 class="vt">I miei ordini</h1><p class="vsub">${open?open+' in attesa dello chef':'Tutte le richieste sono state gestite'}</p><div class="panel">${rs.slice(0,60).map(r=>reqSummary(r,false)).join('')}</div>`;
}
</script>
<script>
/* ================= animazioni dell'invio =================
   media/invio-chef.mp4 (lo staff invia allo chef: la ragazza porge il menù) e media/invio-fornitore.mp4
   (ordine inviato al fornitore: lo chef porge il menù) sono video normali (H.264: va anche su iPhone) con due immagini una sopra l'altra:
   sopra il colore, sotto la trasparenza in bianco e nero. WebGL le unisce su un canvas trasparente.
   Il video arriva come blob (niente richieste a pezzi nel service worker). Si salta con «riduci movimento»,
   senza WebGL o se il video non parte; un tocco la chiude. */
const ANIM_SRC={chef:'media/invio-chef.mp4',forn:'media/invio-fornitore.mp4'};
const animUrl={};
const animOff=()=>{try{return matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){return false}};
function animPrefetch(k='chef'){
  if(!animUrl[k]&&!animOff())animUrl[k]=fetch(ANIM_SRC[k]).then(r=>{if(!r.ok)throw 0;return r.blob()}).then(b=>URL.createObjectURL(b)).catch(()=>{animUrl[k]=null;return null});
  return animUrl[k]||Promise.resolve(null);
}
function animGL(cv){
  const gl=cv.getContext('webgl',{alpha:true,premultipliedAlpha:true,antialias:false,preserveDrawingBuffer:true});if(!gl)return null;
  const sh=(t,src)=>{const x=gl.createShader(t);gl.shaderSource(x,src);gl.compileShader(x);return gl.getShaderParameter(x,gl.COMPILE_STATUS)?x:null};
  const vs=sh(gl.VERTEX_SHADER,'attribute vec2 p;varying vec2 uv;void main(){uv=vec2(p.x*.5+.5,.5-p.y*.5);gl_Position=vec4(p,0.,1.);}');
  // ombra leggera attorno alle figure (alfa sfocata su due anelli, un po' più in basso): sullo sfondo chiaro la giacca bianca non si confonde
  const fs=sh(gl.FRAGMENT_SHADER,'precision mediump float;varying vec2 uv;uniform sampler2D t;float al(vec2 p){p=clamp(p,0.,1.);return smoothstep(.05,.95,dot(texture2D(t,vec2(p.x,.5+p.y*.5)).rgb,vec3(.299,.587,.114)));}void main(){vec3 c=texture2D(t,vec2(uv.x,uv.y*.5)).rgb;float a=al(uv);float s=0.;vec2 q=uv-vec2(0.,2./404.);for(int i=0;i<12;i++){float th=float(i)*.5236;vec2 d=vec2(cos(th)/720.,sin(th)/404.);s+=al(q+d*4.)+al(q+d*8.);}s=s/24.*.3*smoothstep(0.,.06,uv.x)*smoothstep(0.,.06,1.-uv.x)*smoothstep(0.,.08,uv.y)*smoothstep(0.,.08,1.-uv.y);gl_FragColor=vec4(c*a,a+(1.-a)*s);}');
  if(!vs||!fs)return null;const pr=gl.createProgram();gl.attachShader(pr,vs);gl.attachShader(pr,fs);gl.linkProgram(pr);if(!gl.getProgramParameter(pr,gl.LINK_STATUS))return null;gl.useProgram(pr);
  gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  const l=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,2,gl.FLOAT,false,0,0);
  gl.bindTexture(gl.TEXTURE_2D,gl.createTexture());
  for(const [k,v] of [[gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE],[gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE],[gl.TEXTURE_MIN_FILTER,gl.LINEAR],[gl.TEXTURE_MAG_FILTER,gl.LINEAR]])gl.texParameteri(gl.TEXTURE_2D,k,v);
  gl.clearColor(0,0,0,0);
  const draw=v=>{if(v.readyState<2)return false;gl.viewport(0,0,cv.width,cv.height);gl.clear(gl.COLOR_BUFFER_BIT);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,v);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);return true};
  draw.free=()=>{try{const x=gl.getExtension('WEBGL_lose_context');if(x)x.loseContext()}catch(e){}};
  return draw;
}
function sendAnim(k='chef',testo='Inviato allo chef'){return new Promise(async done=>{
  if(animOff())return done();
  const url=await Promise.race([animPrefetch(k),new Promise(r=>setTimeout(()=>r(null),1500))]);if(!url)return done();
  const cv=document.createElement('canvas');cv.width=720;cv.height=404;let draw=null;try{draw=animGL(cv)}catch(e){}if(!draw)return done();
  const v=document.createElement('video');v.muted=true;v.defaultMuted=true;v.playsInline=true;v.setAttribute('playsinline','');v.setAttribute('muted','');v.preload='auto';v.src=url;
  const el=document.createElement('div');el.className='snd-anim';el.setAttribute('role','status');
  el.innerHTML=`<div class="snd-stage"></div><div class="snd-cap">${ic('check')}<span>${esc(testo)}</span></div><p class="snd-hint">Tocca per continuare</p>`;
  el.querySelector('.snd-stage').appendChild(cv);
  let fin=false,raf=0,shown=false;const cap=el.querySelector('.snd-cap');
  const end=()=>{if(fin)return;fin=true;cancelAnimationFrame(raf);clearTimeout(safe);v.pause();el.classList.remove('in');setTimeout(()=>{el.remove();v.removeAttribute('src');v.load();draw.free();done()},280)};
  const showCap=()=>{if(!shown){shown=true;cap.classList.add('in')}};
  const tick=()=>{if(fin)return;if(draw(v)&&!el.classList.contains('in'))el.classList.add('in');if(v.duration&&v.currentTime>v.duration*.72)showCap();raf=requestAnimationFrame(tick)};
  const safe=setTimeout(end,9000);
  el.addEventListener('click',end);v.addEventListener('error',end);
  v.addEventListener('ended',()=>{showCap();draw(v);setTimeout(end,1100)});
  document.body.appendChild(el);
  try{v.playbackRate=1.15;await v.play()}catch(e){fin=true;clearTimeout(safe);el.remove();draw.free();return done()}
  raf=requestAnimationFrame(tick);
})}

/* ================= sheets & toasts ================= */
const sheets=[];
function openSheet(o){
  const el=document.createElement('div');el.className='sheet-wrap';
  el.innerHTML=`<div class="scrim" data-a="closeSheet"></div><div class="sheet ${o.cls||''}" role="dialog" aria-modal="true"></div>`;
  $('#sheets').appendChild(el);o.el=el;sheets.push(o);paintSheet(o);
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('open')));
  document.body.classList.add('noscroll');
  setTimeout(()=>{const f=o.el.querySelector('[autofocus]');if(f)f.focus()},280);
  navSync();return o;
}
function paintSheet(o){const h=o.render();if(h!==o.last){paint(o.el.querySelector('.sheet'),h);o.last=h}}
function refreshSheet(){const o=sheets[sheets.length-1];if(o)paintSheet(o)}
function closeSheet(instant){const o=sheets.pop();if(!o)return;if(o.onClose)o.onClose();o.el.classList.remove('open');if(instant)o.el.remove();else setTimeout(()=>o.el.remove(),260);if(!sheets.length)document.body.classList.remove('noscroll');navSync()}
function toast(msg,kind){const t=document.createElement('div');t.className='toast '+(kind||'');t.textContent=msg;$('#toasts').appendChild(t);requestAnimationFrame(()=>requestAnimationFrame(()=>t.classList.add('in')));setTimeout(()=>{t.classList.remove('in');setTimeout(()=>t.remove(),300)},kind==='err'?5200:3400)}
function ask(title,text,ok,danger,input){
  return new Promise(res=>{let done=false;S.askVal=input&&input.value||'';
    openSheet({onClose:()=>{if(!done)res(false)},render:()=>`<div class="grab"></div><div class="sh-h"><div class="sh-t">${esc(title)}</div></div>${text?`<p class="muted" style="margin-top:0;white-space:pre-line">${esc(text)}</p>`:''}
    ${input?`<label class="lbl" for="ask-in">${esc(input.label)}</label><input class="inp" id="ask-in" value="${esc(S.askVal)}" data-in="askv" placeholder="${esc(input.ph||'')}">`:''}
    <div class="btns" style="margin-top:20px"><button type="button" class="btn ghost" data-a="closeSheet">Annulla</button><button type="button" class="btn ${danger?'dark':'primary'}" id="ask-ok">${esc(ok)}</button></div>`});
    $('#ask-ok').onclick=()=>{done=true;const v=S.askVal;closeSheet();res(input?{v}:true)};
  });
}

/* ================= GM: richieste ================= */
function itemsOf(r){return S.drafts[r.id]||r.items||[]}
const reqUrg=r=>(r.items||[]).some(i=>i.urgente)?1:0;
function draft(rid){if(!S.drafts[rid]){const r=D().richieste[rid];S.drafts[rid]=clone(r.items||[]).map(it=>Object.assign(it,{qtaOrig:it.qtaOrig??it.qta}));S.removed[rid]=[]}return S.drafts[rid]}
function altsOf(it){const p=D().prodotti[it.pid];const arr=S.gidx.get(gkey(p?p.nome:it.nome))||[];return arr.some(x=>x.id===it.pid)?arr:[]}
function vRichieste(){
  const pend=Object.values(D().richieste).filter(r=>r.stato==='inviata').sort((a,b)=>reqUrg(b)-reqUrg(a)||a.creato-b.creato);
  const seg=`<div class="seg" role="group" aria-label="Raggruppa">${[['utente','Per persona'],['fornitore','Per fornitore'],['reparto','Per reparto']].map(([k,l])=>`<button type="button" aria-pressed="${S.grp===k}" data-a="grp" data-v="${k}">${l}</button>`).join('')}</div>`;
  let body;
  if(!pend.length)body=empty('inbox','Nessuna richiesta in attesa','Quando qualcuno dello staff invia una richiesta ricevi una notifica e la trovi qui.');
  else if(S.grp==='fornitore')body=bySupplier(pend);
  else if(S.grp==='reparto')body=Object.entries(REPARTI).map(([k,l])=>{const rs=pend.filter(r=>(r.reparto||'altro')===k);return rs.length?`<h2 class="sec">${l}<span>${rs.length}</span></h2>${rs.map(reqCard).join('')}`:''}).join('');
  else body=`<div style="height:12px"></div>`+pend.map(reqCard).join('');
  const t0=new Date();t0.setHours(0,0,0,0);
  const dec=Object.values(D().richieste).filter(r=>r.stato!=='inviata'&&(r.deciso||0)>=t0.getTime()).sort((a,b)=>b.deciso-a.deciso);
  return`<h1 class="vt">Richieste</h1><p class="vsub">${pend.length?`${pend.length} da approvare`:'Tutto in ordine'}</p>${pend.length?seg:''}${body}
  ${dec.length?`<h2 class="sec">Gestite oggi<span>${dec.length}</span></h2><div class="panel">${dec.map(r=>reqSummary(r,true)).join('')}</div>`:''}`;
}
function bySupplier(pend){
  const m=new Map();
  for(const r of pend)for(const it of itemsOf(r)){const fid=it.fornitoreId||'';if(!m.has(fid))m.set(fid,new Map());const L=m.get(fid);const k=it.pid||('l:'+norm(it.nome));
    if(!L.has(k))L.set(k,{nome:it.nome,codice:it.codice,unita:it.unita,qta:0,da:[]});const x=L.get(k);if(it.urgente)x.urgente=true;x.qta=r3(x.qta+Number(it.qta));x.da.push(firstName(r.utenteNome)+' '+fq(it.qta))}
  return`<div style="height:12px"></div>`+[...m.entries()].map(([fid,L])=>`<section class="panel"><div class="fsum-h"><span class="sup big" style="--c:${fcolor(fid)}"><i></i>${fid?esc(forn(fid).nome):'Da assegnare'}</span><span class="muted small">${L.size} ${L.size===1?'prodotto':'prodotti'}</span></div>
  ${[...L.values()].map(x=>`<div class="sline"><div><div class="ln-n">${esc(x.nome)}${x.urgente?' <span class="tag urg">urgente</span>':''}</div><div class="ln-m">${x.codice?'cod. '+esc(x.codice)+', ':''}${esc(x.da.join(', '))}</div></div><span class="sl-q">${fq(x.qta)} ${esc(x.unita||'')}</span></div>`).join('')}</section>`).join('')
  +`<p class="hint">Per approvare o modificare passa alla vista Per persona.</p>`;
}
function reqCard(r){
  const items=itemsOf(r).map((it,idx)=>Object.assign({},it,{idx}));const u=D().staff[r.utenteId]||{id:r.utenteId,nome:r.utenteNome};const dirty=!!S.drafts[r.id];
  let tot=0;for(const it of items)if(it.prezzo!=null)tot+=it.prezzo*it.qta;
  return`<article class="panel${reqUrg(r)?' urg':''}">
  <header class="req-h">${avatar(u,46)}<div class="req-who"><div class="req-n">${esc(r.utenteNome)}${reqUrg(r)?' <span class="tag urg">URGENTE</span>':''}</div><div class="req-m">${esc([r.mansione,REPARTI[r.reparto]].filter(Boolean).join(', '))}</div></div><time class="req-t">${ago(r.creato)}</time></header>
  ${r.nota?`<p class="req-note">${esc(r.nota)}</p>`:''}
  ${r.doppi&&r.doppi.length?`<div class="banner dup" role="note">${ic('warn')}<div><b>Possibile doppione.</b> Già chiesto nelle ultime 24 ore:<ul>${r.doppi.slice(0,5).map(d=>`<li>${esc(d.nome)}: chiesto da ${esc(d.da||'?')} ${esc(quandoAlle(d.quando))}</li>`).join('')}</ul>Decidi tu se ordinarlo di nuovo.</div></div>`:''}
  ${groupByF(items).map(([fid,its])=>{const f=forn(fid);const m=fid&&METODI[f.metodo];return`<div class="fsec fblk${fid?'':' nof'}" style="--c:${fcolor(fid)}"><div class="fsec-h"><span class="sup"><i></i>${fid?esc(f.nome):'Senza fornitore'}</span>${m?`<span class="muted small">${ic(m.i)} ${m.l}</span>`:''}</div>${fid?'':`<p class="nof-h">${ic('warn')} Scegli il fornitore: senza non si può approvare.</p>`}${its.map(it=>gmLine(r.id,it)).join('')}${fid?`<button type="button" class="btn ghost sm block fadd" data-a="rpick" data-r="${r.id}" data-f="${fid}">${ic('plus')} Aggiungi da ${esc(f.nome)}</button>`:''}</div>`}).join('')}
  ${items.length?'':'<p class="muted" style="padding:0 16px">Hai tolto tutti gli articoli: puoi rifiutare la richiesta.</p>'}
  ${tot?`<div class="total"><span>Totale stimato</span><b>${eur(tot)}</b></div>`:''}
  <div class="req-f"><input class="inp" id="gmn-${r.id}" placeholder="Nota per ${esc(firstName(r.utenteNome))} (facoltativa)" value="${esc(S.gmn[r.id]||'')}" data-in="gmn" data-r="${r.id}">
  <div class="req-btns">${dirty?`<button type="button" class="btn ghost" data-a="rreset" data-r="${r.id}">Annulla modifiche</button>`:''}<button type="button" class="btn ghost danger" data-a="reject" data-r="${r.id}">${ic('x')} Rifiuta</button><button type="button" class="btn primary" data-a="approve" data-r="${r.id}">${ic('check')} Approva</button></div></div></article>`;
}
function gmLine(rid,it){
  let sw='';
  if(it.libero)sw=`<select class="inp sm" id="rsup-${rid}-${it.idx}" data-ch="rsup" data-r="${rid}" data-i="${it.idx}" aria-label="Fornitore"><option value="">Scegli il fornitore…</option>${Object.values(D().fornitori).sort(byNome).map(f=>`<option value="${f.id}" ${it.fornitoreId===f.id?'selected':''}>${esc(f.nome)}</option>`).join('')}</select>`;
  else{const alts=altsOf(it);if(alts.length>1)sw=`<select class="inp sm" id="rsw-${rid}-${it.idx}" data-ch="rswap" data-r="${rid}" data-i="${it.idx}" aria-label="Cambia fornitore">${alts.map(p=>`<option value="${p.id}" ${p.id===it.pid?'selected':''}>${esc(forn(p.fornitoreId).nome)}${p.prezzo!=null?', '+eur(p.prezzo)+(p.unita?' / '+p.unita:''):''}</option>`).join('')}</select>`}
  const ch=!it.aggiunto&&it.qtaOrig!=null&&it.qtaOrig!==it.qta;
  return`<div class="line wrap big"><div class="ln-i"><div class="ln-n">${esc(it.nome)}${it.urgente?' <span class="tag urg">urgente</span>':''}${it.libero?' <span class="tag">fuori listino</span>':''}${it.aggiunto?' <span class="tag gm">aggiunto da te</span>':''}</div><div class="ln-m">${it.codice?'cod. '+esc(it.codice):''}${it.prezzo!=null?' '+eur(it.prezzo)+(it.unita?' / '+esc(it.unita):''):''}${ch?` <span class="was">chiesti ${fq(it.qtaOrig)}</span>`:''}</div></div>
  ${stepper('rq',rid+'-'+it.idx,it.qta,`data-r="${rid}" data-i="${it.idx}"`)}<span class="ln-u">${esc(it.unita||'')}</span><button type="button" class="icon-btn" data-a="rrm" data-r="${rid}" data-i="${it.idx}" aria-label="Togli ${esc(it.nome)}">${ic('x')}</button>${sw?`<div class="ln-x">${sw}</div>`:''}</div>`;
}
// «+ Aggiungi» dentro il blocco di un fornitore: cerca solo nel suo listino, così ogni prodotto aggiunto ha già il fornitore.
function reqPickSheet(rid,fid){
  S.pkq='';
  openSheet({cls:'tall',render:()=>{const r=D().richieste[rid];if(!r||r.stato!=='inviata')return'<p class="muted">Questa richiesta non è più da approvare.</p>';
    const f=forn(fid);const q=norm(S.pkq);const toks=q?q.split(' '):[];const its=itemsOf(r);
    const list=prods().filter(p=>p.fornitoreId===fid&&(!toks.length||toks.every(t=>norm(p.nome+' '+(p.codice||'')).includes(t)))).sort(byNome).slice(0,120);
    return`<div class="grab"></div><div class="sh-h">${fDot(fid,'lg')}<div class="sh-t">Aggiungi da ${esc(f.nome)}<div class="sh-s">Alla richiesta di ${esc(firstName(r.utenteNome))}</div></div><button type="button" class="icon-btn" data-a="closeSheet" aria-label="Chiudi">${ic('x')}</button></div>
    <div class="search" style="box-shadow:none;border-color:var(--line)">${ic('search')}<input id="rpq" type="search" placeholder="Cerca nel listino di ${esc(f.nome)}" value="${esc(S.pkq)}" data-in="pkq" autocomplete="off"></div>
    <div>${list.length?list.map(p=>{const inR=its.find(x=>x.pid===p.id);return`<div class="prow"><div class="row-i"><div class="row-t">${esc(p.nome)}</div><div class="row-m">${p.codice?'cod. '+esc(p.codice)+', ':''}${p.prezzo!=null?eur(p.prezzo)+(p.unita?' / '+esc(p.unita):''):esc(p.unita||'')}${inR?`, nella richiesta: ${fq(inR.qta)}`:''}</div></div><button type="button" class="add" data-a="rpadd" data-r="${rid}" data-p="${p.id}" aria-label="Aggiungi ${esc(p.nome)}">${ic('plus')}</button></div>`}).join(''):`<p class="muted">Nessun prodotto${q?' trovato':' a listino'}.</p>`}</div>
    <div class="sheet-foot"><button type="button" class="btn primary block" data-a="closeSheet">Fatto</button></div>`}});
}
async function approve(rid){
  const r=D().richieste[rid];if(!r||r.stato!=='inviata')return;const me=meU();
  let items=clone(itemsOf(r)).filter(i=>Number(i.qta)>0);
  if(!items.length)return toast('La richiesta è vuota: rifiutala.','warn');
  const miss=items.find(i=>!i.fornitoreId);if(miss)return toast('Scegli il fornitore per «'+miss.nome+'».','warn');
  const removed=(S.removed[rid]||[]).concat(itemsOf(r).filter(i=>!i.aggiunto&&!(Number(i.qta)>0)).map(i=>({nome:i.nome,qta:i.qtaOrig??i.qta})));
  let modified=removed.length>0;
  items=items.map(i=>{if(i.qtaOrig!=null&&i.qtaOrig!==i.qta)modified=true;else delete i.qtaOrig;if(i.cambiato)modified=true;return i});
  const notaGM=(S.gmn[rid]||'').trim();
  await upd('richieste',rid,{stato:'approvata',items,rimossi:removed,modificata:modified,notaGM,deciso:now(),decisoDa:me.id});
  for(const [fid,its] of groupByF(items)){
    const oid='aperto_'+fid;const cur=D().ordini[oid];
    const o=cur?clone(cur):{fornitoreId:fid,fornitoreNome:forn(fid).nome,stato:'aperto',items:[],richieste:[],creato:now()};
    for(const it of its){const key=it.pid||('l:'+norm(it.nome));let L=o.items.find(x=>x.key===key);
      if(!L){L={key,pid:it.pid||'',nome:it.nome,codice:it.codice||'',unita:it.unita||'',prezzo:it.prezzo??null,qta:0,da:[]};o.items.push(L)}
      if(it.urgente)L.urgente=true;L.qta=r3(L.qta+Number(it.qta));L.da.push({n:r.utenteNome,r:r.reparto,q:Number(it.qta)})}
    if(!o.richieste.includes(rid))o.richieste.push(rid);o.aggiornato=now();delete o.id;
    await put('ordini',oid,o);
  }
  await notify(r.utenteId,modified?'Richiesta approvata con modifiche':'Richiesta approvata',notaGM||(items.length+' '+(items.length===1?'articolo verrà ordinato':'articoli verranno ordinati')),'approvata',rid);
  delete S.drafts[rid];delete S.removed[rid];delete S.gmn[rid];toast('Approvata. Gli articoli sono in Invii.');
}
async function reject(rid){
  const r=D().richieste[rid];if(!r)return;
  const a=await ask('Rifiutare la richiesta di '+firstName(r.utenteNome)+'?','Riceverà una notifica con il motivo.','Rifiuta',true,{label:'Motivo (facoltativo)',value:S.gmn[rid]||'',ph:'Es. abbiamo ancora scorte'});
  if(!a)return;
  await upd('richieste',rid,{stato:'rifiutata',notaGM:a.v.trim(),deciso:now(),decisoDa:S.me});
  await notify(r.utenteId,'Richiesta rifiutata',a.v.trim()||'Parlane con lo chef','rifiutata',rid);
  delete S.drafts[rid];delete S.gmn[rid];toast('Richiesta rifiutata');
}

/* ================= GM: invii ai fornitori ================= */
function waNum(s){let d=String(s||'').replace(/\D/g,'');if(d.startsWith('00'))d=d.slice(2);if(d.length===10&&d.startsWith('3'))d='39'+d;return d}
function metaOf(o){if(!S.ometa[o.id])S.ometa[o.id]={consegna:o.consegna||'',fascia:o.fascia||'mattina',note:o.noteFornitore||''};return S.ometa[o.id]}
function orderText(o){
