<style>
*{box-sizing:border-box}
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --font:"Jost","Futura","Avenir Next","Century Gothic",system-ui,sans-serif;
  --bg:#EFEBE6;--surface:#FFFFFF;--sunk:#F6F3EF;--ink:#2B2321;--ink2:#5E534D;--muted:#8A7F76;--line:#E4DDD5;--sand:#BDB2A6;
  --solid:#3A2F2C;--on-solid:#F3EDE7;
  --lagoon:#1F7F86;--on-lagoon:#FFFFFF;--lagoon-soft:#DBECEC;
  --mirto:#3B7A57;--mirto-soft:#DFEDE4;--corallo:#AE4E37;--corallo-soft:#F5E1DA;--ocra:#94661C;--ocra-soft:#F3E7D1;
  --lift:0 1px 0 rgba(43,35,33,.04),0 12px 30px -18px rgba(43,35,33,.30);
  --cocoa:#3A2F2C;--linen:#CFC5BA;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1E1816;--surface:#29211F;--sunk:#231C1A;--ink:#F1EBE5;--ink2:#CFC4BA;--muted:#A0948A;--line:#3D3330;--sand:#C9BEB2;
    --solid:#E9E1D9;--on-solid:#2A2220;--lagoon:#57B0B6;--on-lagoon:#0E2426;--lagoon-soft:#1D3436;
    --mirto:#7DBE98;--mirto-soft:#1E3127;--corallo:#E08A72;--corallo-soft:#3A2420;--ocra:#D9A955;--ocra-soft:#3A2E1A;
    --lift:0 1px 0 rgba(0,0,0,.2),0 14px 30px -18px rgba(0,0,0,.7);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1E1816;--surface:#29211F;--sunk:#231C1A;--ink:#F1EBE5;--ink2:#CFC4BA;--muted:#A0948A;--line:#3D3330;--sand:#C9BEB2;
  --solid:#E9E1D9;--on-solid:#2A2220;--lagoon:#57B0B6;--on-lagoon:#0E2426;--lagoon-soft:#1D3436;
  --mirto:#7DBE98;--mirto-soft:#1E3127;--corallo:#E08A72;--corallo-soft:#3A2420;--ocra:#D9A955;--ocra-soft:#3A2E1A;
  --lift:0 1px 0 rgba(0,0,0,.2),0 14px 30px -18px rgba(0,0,0,.7);color-scheme:dark;
}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
html.on-wall{background:var(--cocoa)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--font);-webkit-font-smoothing:antialiased;min-height:100%}
html.on-wall body{background:var(--cocoa)}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
img{max-width:100%}
:focus-visible{outline:2px solid var(--lagoon);outline-offset:2px}
.ic{width:20px;height:20px;flex:none}
.ic.big{width:44px;height:44px}
.muted{color:var(--muted)}
.small{font-size:13px}
[hidden]{display:none!important}

  repeating-linear-gradient(0deg,rgba(255,255,255,.028) 0 1px,transparent 1px 3px),
  repeating-linear-gradient(90deg,rgba(0,0,0,.07) 0 1px,transparent 1px 4px),
  radial-gradient(120% 80% at 50% 0%,rgba(255,255,255,.06),transparent 60%)}

.wall-sub{font:300 17px/1.4 var(--font);letter-spacing:.06em;color:#B9AEA2;margin:22px 0 0}
.wall-by{margin:auto 0 -12px;padding:0 0 env(safe-area-inset-bottom);display:flex;flex-direction:column;align-items:center;gap:2px;opacity:.8}
.splash .wall-by{margin-bottom:24px}
.splash .logo-full{margin-top:auto}
.wall-by span{font:400 10px/1 var(--font);letter-spacing:.34em;text-transform:uppercase;color:#B9AEA2;padding-left:.34em}
.wall-by i{display:block;width:177px;aspect-ratio:496/190;background:linear-gradient(100deg,#DDD3C8 42%,#FFF8EE 50%,#DDD3C8 58%) 100% 0/300% 100%;-webkit-mask:url(media/ynoy.png) center/contain no-repeat;mask:url(media/ynoy.png) center/contain no-repeat}
.intro .wall-by span{animation:byIn 1.3s .6s cubic-bezier(.22,1,.36,1) both}
.intro .wall-by i{animation:ynoyIn 2s 1s cubic-bezier(.22,1,.36,1) both,ynoyShine 1.5s 2.4s cubic-bezier(.45,0,.25,1) both}
@keyframes byIn{from{opacity:0;letter-spacing:.9em}}
@keyframes ynoyIn{from{opacity:0;transform:translateY(8px) scale(.94);clip-path:inset(0 100% 0 0)}60%{opacity:1}to{opacity:1;transform:none;clip-path:inset(0)}}
@keyframes ynoyShine{from{background-position:100% 0}to{background-position:0 0}}
/* v62 schermata d'apertura: JONA cade da davanti allo schermo e si posa con un colpo (schiacciamento, rimbalzo, scossa, onde, granelli rasoterra, ombra); poi la firma si scrive e parte l'app. Niente filter:blur sugli elementi con maschera (righe bianche su Android) */
.splash{overflow:hidden;position:relative}
.splash .jhit{position:relative;margin-top:auto;display:flex;justify-content:center}
.splash .jhit>i,.splash .jhit>b{position:absolute;pointer-events:none}
.splash .jsh{left:8%;right:8%;bottom:-14%;height:20%;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.6),rgba(0,0,0,0));opacity:0}
.splash .jrg{left:-4%;right:-4%;bottom:-16%;height:26%;border-radius:50%;border:2px solid rgba(237,230,223,.7);opacity:0}
.splash .jpb{left:50%;bottom:-6%;width:var(--s);height:var(--s);border-radius:50%;background:#EDE6DF;opacity:0}
.intro .splash{animation:jShake .5s .55s linear both}
.intro .splash .logo-full{transform-origin:50% 88%;animation:jonaIn 1.2s linear both}
.intro .splash .jsh{animation:jShadow 1.2s linear both}
.intro .splash .jhit{animation:jAway .35s 3.25s cubic-bezier(.5,0,.75,0) forwards}
.intro .splash .wall-by>span{animation:yAway .3s 3.48s ease-in-out forwards}
.intro .splash .jrg{animation:jRing .9s .55s cubic-bezier(.1,.7,.25,1) forwards}
.intro .splash .jrg+.jrg{animation-duration:1.15s;animation-delay:.63s}
.intro .splash .jpb{animation:jPb var(--t) var(--d) cubic-bezier(.1,.75,.3,1) forwards}
.intro .splash .wall-sub{animation:rise .7s 1s cubic-bezier(.2,.7,.2,1) both,jAway .35s 3.25s cubic-bezier(.5,0,.75,0) forwards}
@keyframes jonaIn{0%{opacity:0;transform:scale(4.2);animation-timing-function:cubic-bezier(.55,0,.95,.5)}16%{opacity:1}46%{transform:none;animation-timing-function:cubic-bezier(.2,.8,.4,1)}53%{transform:translateY(2%) scale(1.1,.84)}67%{transform:translateY(-2%) scale(.96,1.05)}81%{transform:scale(1.02,.98)}100%{opacity:1;transform:none}}
@keyframes jShadow{0%{opacity:0;transform:scale(.15);animation-timing-function:cubic-bezier(.55,0,.95,.5)}46%{opacity:.75;transform:scale(1);animation-timing-function:ease-out}53%{opacity:1;transform:scaleX(1.3)}100%{opacity:.5;transform:none}}
@keyframes jRing{0%{opacity:.9;transform:scale(.45);border-width:3px}100%{opacity:0;transform:scale(2.6);border-width:.5px}}
@keyframes jPb{0%{opacity:0;transform:none}10%{opacity:var(--o)}60%{opacity:calc(var(--o)*.7)}100%{opacity:0;transform:translate(var(--x),var(--y))}}
@keyframes jShake{0%,100%{transform:none}12%{transform:translate(0,7px)}28%{transform:translate(-4px,-3px)}44%{transform:translate(3px,2px)}62%{transform:translate(-2px,-1px)}80%{transform:translate(1px,0)}}
/* firma: prima «BY» (le due lettere cadono una alla volta), poi YNOY si scrive come a mano, tratto dopo tratto nell'ordine della scrittura (SVG: tratti di tools/ynoy-tratti.py che scoprono il logo), poi il riflesso; esce per ultima: prima sfuma JONA (3,25-3,6 s), poi BY e YNOY (3,48-3,78 s) */
.splash .wall-by{opacity:1}
.splash .wall-by span{color:#B9AEA2}
.splash .wall-by em{display:inline-block;font-style:normal;opacity:0}
.splash .yn{position:relative;width:177px;aspect-ratio:496/190}
.splash .yn>i{position:absolute;inset:0;width:auto}
.splash .ywr{position:absolute;inset:0;width:100%;height:100%}
.splash .ywr path{fill:none;stroke:#fff;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:100 300}
.intro .splash .ywr path{animation:yStroke .3s cubic-bezier(.4,.1,.6,.9) both}
.intro .splash .wall-by em{animation:byDrop .55s .85s cubic-bezier(.3,1.6,.5,1) both}
.intro .splash .wall-by em+em{animation-delay:1s}
.intro .splash .y0{animation:yShow 0s 2.80s both,ynoyShine .55s 2.80s ease-in-out both}
.intro .splash .yn{animation:yAway .3s 3.48s ease-in-out forwards}
@keyframes byDrop{0%{opacity:0;transform:translateY(-26px) rotate(-25deg)}60%{opacity:1}100%{opacity:1;transform:none}}
@keyframes yStroke{from{stroke-dashoffset:var(--o)}to{stroke-dashoffset:0}}
@keyframes yShow{from{opacity:0}to{opacity:1}}
@keyframes jAway{to{opacity:0;transform:scale(.93)}}
@keyframes yAway{to{opacity:0;transform:scale(1.03)}}

.wall-groups{width:100%;max-width:760px}
.wall h2{font:400 14px var(--font);letter-spacing:.08em;color:#A3978D;margin:38px 0 16px;text-align:center}
.faces{display:flex;flex-wrap:wrap;justify-content:center;gap:24px 14px}
.face{width:100px;display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;color:inherit;padding:6px 0;border-radius:14px}
.face .av{box-shadow:0 0 0 1.5px rgba(207,197,186,.35),0 14px 26px -12px rgba(0,0,0,.7);transition:transform .15s}
.face:hover .av{box-shadow:0 0 0 2px var(--linen),0 14px 26px -12px rgba(0,0,0,.7)}
.face:active .av{transform:scale(.95)}
.face .fn{font:400 15.5px/1.2 var(--font)}
.face .fr{font:300 12.5px/1.2 var(--font);color:#A3978D;margin-top:-4px}
.face.pending{opacity:.55}
.wall-new{margin-top:44px;background:transparent;border:1px solid rgba(207,197,186,.35);color:#E4DCD3;min-height:46px;padding:0 22px;border-radius:999px;display:inline-flex;align-items:center;gap:8px;font:400 15px var(--font)}
.wall-new:hover{border-color:var(--linen)}
.wall-card{width:100%;max-width:520px;margin-top:30px;background:var(--surface);color:var(--ink);border-radius:22px;padding:22px 20px 24px;box-shadow:0 30px 60px -30px rgba(0,0,0,.7)}
.wall-card h1{font:300 26px/1.2 var(--font);margin:0 0 6px}
.wall-msg{max-width:420px;text-align:center;color:#CFC5BA;font:300 16px/1.6 var(--font);margin-top:26px}
.intro .logo-full,.intro .wall-sub,.intro .wall-card{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
.intro .wall-sub{animation-delay:.12s}.intro .wall-card{animation-delay:.2s}
.intro .face{animation:rise .55s calc(.2s + var(--i,0)*40ms) cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- avatar ---------- */
.av{--s:44px;width:var(--s);height:var(--s);border-radius:50%;flex:none;display:grid;place-items:center;overflow:hidden;background:var(--c,#8A7F76);color:#fff;font:400 calc(var(--s)*.38)/1 var(--font);letter-spacing:.02em}
.av img{width:100%;height:100%;object-fit:cover;display:block}

.top-t{flex:1;font:300 17px var(--font);letter-spacing:.04em;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-btn{border:0;background:none;padding:0;border-radius:50%}
.icon-btn{width:40px;height:40px;flex:none;display:grid;place-items:center;border:0;border-radius:50%;background:transparent;color:var(--ink2);position:relative}
.icon-btn:hover{background:var(--sunk)}
.icon-btn.danger{color:var(--corallo)}
.bell .dot{position:absolute;top:3px;right:2px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--corallo);color:#fff;font:600 11px/18px var(--font);text-align:center}
/* novità: chip piccola nell'intestazione, contatore più piccolo di quello della campanella */
.news-btn{flex:none;position:relative;display:inline-flex;align-items:center;gap:4px;height:30px;padding:0 10px 0 8px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink2);font:400 13px/1 var(--font)}
.news-btn:hover{background:var(--sunk)}
.news-btn .ic{width:16px;height:16px;color:var(--ocra)}
.news-n{position:absolute;top:-6px;right:-6px;min-width:15px;height:15px;padding:0 4px;border-radius:8px;background:var(--lagoon);color:var(--on-lagoon);font:600 9.5px/15px var(--font);text-align:center}
html.staff-ui .news-btn{height:36px;font-size:14px}
html.staff-ui .news-btn .ic{width:18px;height:18px}
/* poco spazio (schermi stretti o «Senza rete» visibile): solo l'icona; la scritta «Senza rete» può andare su due righe */
@media (max-width:520px){.top:has(.sync-pill) .news-btn{width:34px;padding:0;justify-content:center}.top:has(.sync-pill) .news-l{display:none}}
.top .sync-pill{min-width:0;white-space:normal;line-height:1.15}
@media (max-width:360px){.top{gap:6px}.top .mark{display:none}.news-btn,html.staff-ui .news-btn{width:34px;padding:0;justify-content:center}.news-l{display:none}}
.news-v{padding:16px 2px 18px;border-top:1px solid var(--line)}
.ph-t{font:500 16px/1.3 var(--font);margin:18px 0 6px}
.ph-ol{margin:4px 0 8px;padding-left:24px}.pst{white-space:nowrap}.pst.off{color:var(--corallo)}.ph-err{margin:0 0 10px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--corallo) 18%,transparent);word-break:break-word}
.ph-ol li{margin:10px 0;line-height:1.5;font-size:15.5px}
.ph-brands{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 4px}

/* ---------- type & structure ---------- */
.vhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}

.sec{display:flex;align-items:baseline;gap:8px;font:400 15px var(--font);color:var(--ink2);margin:26px 2px 10px}
.sec span{color:var(--muted);font-size:13px}
.panel{background:var(--surface);border-radius:18px;box-shadow:var(--lift);margin-bottom:14px}
.hint{color:var(--muted);font-size:14px;text-align:center;margin:18px 0}
.row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.panel>.row:first-child,.panel>*:first-child>.row:first-child{border-top:0}
.row.link:hover{background:var(--sunk)}
.panel>.row.link:first-child{border-radius:18px 18px 0 0}
.panel>.row.link:last-child{border-radius:0 0 18px 18px}
.panel>.row.link:only-child{border-radius:18px}
.row.dim{opacity:.55}
.row-i{flex:1;min-width:0}
.row-t{font:400 16px/1.3 var(--font)}
.row-m{font-size:13.5px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.row-m .ic{width:15px;height:15px}
.fdot{width:40px;height:40px;border-radius:12px;flex:none;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 16%,var(--surface));color:var(--c);font:500 17px var(--font)}
.fdot.lg{width:46px;height:46px;font-size:20px}
.tag{display:inline-block;font:400 11.5px/1 var(--font);padding:4px 7px;border-radius:6px;background:var(--sunk);color:var(--muted);vertical-align:2px;border:1px solid var(--line)}
.tag.gm{background:var(--lagoon-soft);color:var(--lagoon);border-color:transparent}
.tag.urg{background:var(--corallo);color:#fff;border-color:transparent;font-weight:700}
.panel.urg{box-shadow:inset 4px 0 0 var(--corallo)}
.urg-b{min-height:44px;border-radius:12px;border:2px solid var(--corallo);background:transparent;color:var(--corallo);font:600 15px/1 var(--font);padding:0 14px;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.urg-b.on{background:var(--corallo);color:#fff}
.tag.best{background:var(--mirto-soft);color:var(--mirto);border-color:transparent}
.cheap{min-height:44px;border-radius:12px;border:0;background:var(--mirto-soft);color:var(--mirto);font:500 14px/1.3 var(--font);padding:8px 12px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;text-align:left}
.sup{display:inline-flex;align-items:center;gap:7px;font:500 13.5px/1.2 var(--font);color:var(--ink2)}
.sup i{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.sup.big{font-size:18px;font-weight:400;color:var(--ink)}

.st{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font:500 12.5px/1.2 var(--font);background:var(--sunk);color:var(--muted);white-space:nowrap}
.st.wait{background:var(--ocra-soft);color:var(--ocra)}
.st.ok{background:var(--mirto-soft);color:var(--mirto)}
.st.ko{background:var(--corallo-soft);color:var(--corallo)}
.st.sent{background:var(--lagoon-soft);color:var(--lagoon)}
.banner{background:var(--ocra-soft);color:var(--ocra);padding:12px 14px;border-radius:12px;font-size:14.5px;margin:6px 0 14px}
.wall .banner{max-width:520px;margin-top:22px}
.callout{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;background:var(--lagoon-soft);color:var(--ink);margin-bottom:14px}
.callout>.ic{color:var(--lagoon)}
.callout>div{flex:1;min-width:0}
.empty{text-align:center;padding:46px 20px;color:var(--muted)}

/* ---------- controls ---------- */

.lbl{display:block;font:500 13.5px var(--font);color:var(--ink2);margin:14px 0 6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.two.stack{grid-template-columns:1fr}}
.obx{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--ocra-soft);color:var(--ocra);border:1px solid var(--ocra);border-radius:14px;padding:12px 14px;margin:10px 0 4px}
.obx>.ic{width:24px;height:24px;flex:none}.obx-i{flex:1 1 200px;min-width:0}.obx-i b{display:block;font-size:16px}.obx-i span{display:block;font-size:13.5px;color:var(--ink2);margin-top:2px}
.obx-b{display:flex;gap:8px;flex-wrap:wrap}.obx-b .btn{min-height:42px}
.wall .obx{max-width:420px;width:calc(100% - 32px);box-sizing:border-box;margin:0 auto 12px}
.sync-pill.sync-wait{border:0;cursor:pointer;background:var(--corallo-soft);color:var(--corallo)}
.sync-pill{display:inline-flex;align-items:center;gap:5px;font:500 12.5px var(--font);background:var(--ocra-soft);color:var(--ocra);padding:4px 10px;border-radius:999px;white-space:nowrap}.sync-pill .ic{width:15px;height:15px}
.qr{display:flex;justify-content:center;margin:14px 0 0}.qr img{width:min(240px,70vw);height:auto;background:#fff;padding:10px;border-radius:12px}
.demo-inv{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}.demo-inv p{margin:4px 0 10px}.inv-code{text-align:center;margin:14px 0 0}.inv-code b{display:block;font-size:34px;font-weight:500;letter-spacing:.18em;color:var(--ink)}
.invite-steps{margin:0;padding-left:20px;color:var(--ink2);line-height:1.5}
.testbar{display:flex;align-items:center;gap:10px;margin:0 0 14px}
.demobar{margin:0 0 14px;padding:10px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.demobar-t{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.demobar-t span{flex:1;min-width:150px;font-size:.85rem;color:var(--muted)}
.demobar .seg{display:flex}.demobar .seg button{flex:1}
.demo-l{list-style:none;padding:0;margin:14px 0 18px;display:flex;flex-direction:column;gap:10px}.demo-l li{display:flex;gap:10px;align-items:flex-start}.demo-l .ic{flex:none;width:22px;height:22px;color:var(--lagoon)}
.demo-n{text-align:center;margin:12px 0 0}
.testbar .seg{flex-wrap:wrap;border-radius:18px;min-width:0}
.testbar .seg button[aria-pressed="true"]{background:var(--lagoon);color:var(--on-lagoon);font-weight:500}
.seg{display:inline-flex;padding:3px;background:var(--sunk);border-radius:999px;border:1px solid var(--line);max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg.wide{display:flex}
.seg.wide button{flex:1}
@media(max-width:360px){.seg.wide{border-radius:20px}.seg.wide button{white-space:normal;padding:7px 8px;line-height:1.2;border-radius:16px}}
.seg.rep{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;border-radius:18px;overflow:visible}
.seg.rep button{white-space:normal;min-height:44px;padding:8px 4px;border-radius:14px;line-height:1.2}
.seg button{border:0;background:none;padding:8px 14px;border-radius:999px;font:400 14.5px var(--font);color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none;margin:0 -2px}
.chips::-webkit-scrollbar,.seg::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 15px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font:400 14.5px var(--font);color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--solid);color:var(--on-solid);border-color:var(--solid)}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:16px;padding:0 6px 0 16px;box-shadow:var(--lift);margin:4px 0 14px;border:1px solid transparent}
.search:focus-within{border-color:var(--lagoon)}
.search .ic{color:var(--muted)}
.search input:placeholder-shown~.icon-btn{display:none}
.search input::-webkit-search-cancel-button{display:none}
.search input{flex:1;border:0;background:none;min-height:54px;font:400 17px var(--font);outline:none;min-width:0}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--sunk);flex:none}
.step button{width:40px;height:40px;border:0;background:none;display:grid;place-items:center;color:var(--ink);border-radius:50%}
.step button .ic{width:17px;height:17px}
.step input{width:46px;text-align:center;border:0;background:none;font:500 16px var(--font);color:var(--ink);padding:0;min-height:40px}
.step input:focus{outline:none}
.add{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--lagoon);background:transparent;color:var(--lagoon);display:grid;place-items:center;flex:none}
.add:hover{background:var(--lagoon);color:var(--on-lagoon)}
.toggle{position:relative;width:50px;height:30px;flex:none}
.toggle input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.toggle span{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:.2s;pointer-events:none}
.toggle span::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
.toggle input:checked+span{background:var(--lagoon)}
.toggle input:checked+span::after{transform:translateX(20px)}
.toggle input:focus-visible+span{outline:2px solid var(--lagoon);outline-offset:2px}

.cht{position:fixed;inset:0;z-index:60;display:grid;grid-template-columns:1fr;background:var(--bg);opacity:0;transform:translateY(14px);transition:opacity .22s ease,transform .22s ease;padding-top:env(safe-area-inset-top,0px)}

.cht-in .cht-mic,.cht-in.has-t .cht-snd{display:grid}.cht-in .cht-snd,.cht-in.has-t .cht-mic{display:none}.cht-in.no-alg .cht-snd{display:grid}.cht-in.no-alg .cht-mic{display:none}
.cht-cam{width:44px;height:48px;flex:none;border:0;background:none;color:var(--muted);display:grid;place-items:center;border-radius:50%}.cht-cam .ic{width:25px;height:25px}

.cht-up{align-self:flex-end;margin:6px 0;padding:6px 12px;border-radius:10px;background:var(--surface);color:var(--muted);font-size:13px}
.cht-view{position:absolute;inset:0;z-index:5;display:grid;place-items:center;background:rgba(0,0,0,.92)}.cht-view img{max-width:100%;max-height:100%;object-fit:contain}
.cht-view .icon-btn{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:10px;color:#fff;background:rgba(255,255,255,.15)}
.cht-sp{margin:12px 16px 16px;font-size:12.5px;color:var(--muted)}.cht-send:active{transform:scale(.94)}
.cht-more{display:block;margin:6px auto 4px;padding:7px 14px;border:0;border-radius:99px;background:var(--surface);color:var(--lagoon);font:500 13px var(--font);box-shadow:0 1px 1px rgba(0,0,0,.08)}
.cht-hint{align-self:center;margin:20px 0;padding:8px 14px;border-radius:10px;background:var(--ocra-soft);color:var(--ink2);font-size:13.5px}
/* ---------- «Chiedi a Jona» ---------- */
.ask-fab{background:var(--solid);color:var(--on-solid)}.ask-fab .ic{color:var(--ocra)}
.sheet.jona-sh{display:flex;flex-direction:column}
.jona-av{width:40px;height:40px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--ocra-soft);color:var(--ocra)}.jona-av .ic{width:22px;height:22px}
.jona-key{display:flex;gap:12px;padding:12px 14px;border-radius:14px;background:var(--ocra-soft);margin:0 0 10px}.jona-key>.ic{color:var(--ocra);flex:none}
.jona-key b{display:block;font-weight:500}.jona-key span{display:block;font-size:13.5px;color:var(--ink2);margin:2px 0 8px}
.jona-msgs{flex:1;min-height:120px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:6px 0 12px}
.jona-m{max-width:90%;padding:10px 14px;border-radius:18px;font-size:15.5px;line-height:1.45;overflow-wrap:anywhere}
.jona-m.q{align-self:flex-end;background:var(--lagoon);color:var(--on-lagoon);border-bottom-right-radius:5px}
.jona-m.a{align-self:flex-start;background:var(--sunk);border-bottom-left-radius:5px}
.jona-m ul{margin:4px 0;padding-left:20px}.jona-m li{margin:2px 0}
.jona-m.busy i{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--muted);animation:jdot 1s infinite ease-in-out}
.jona-m.busy i:nth-child(2){animation-delay:.15s}.jona-m.busy i:nth-child(3){animation-delay:.3s}
@keyframes jdot{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.jona-tips{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto}.jona-tips .chip{white-space:normal;text-align:left;line-height:1.3}
.jona-in{position:sticky;bottom:0;display:flex;align-items:flex-end;gap:6px;padding:10px 0 4px;background:var(--surface);border-top:1px solid var(--line)}
.jona-in textarea{flex:1;min-width:0;resize:none;min-height:48px;max-height:120px;border-radius:24px;padding:12px 16px}
.jona-send{width:48px;height:48px;flex:none;border:0;border-radius:50%;background:var(--lagoon);color:var(--on-lagoon);display:grid;place-items:center}.jona-send:disabled{opacity:.45}.jona-send .ic{width:22px;height:22px}
.jona-note{margin:4px 0 0;font-size:12px;color:var(--muted);text-align:center}
/* ---------- timbratura ---------- */
.tb-card{background:var(--surface);border-radius:18px;box-shadow:var(--lift);padding:14px 16px;margin:0 0 14px;display:grid;gap:12px}
.tb-card.on{box-shadow:inset 0 0 0 2px var(--mirto),var(--lift)}
.tb-st{display:flex;align-items:center;gap:12px}.tb-st>.ic{width:30px;height:30px;color:var(--muted);flex:none}.tb-card.on .tb-st>.ic{color:var(--mirto)}
.tb-st b{display:block;font:400 19px var(--font)}.tb-st span{display:block;font-size:14.5px;color:var(--muted)}.tb-st .tb-oggi{color:var(--mirto);margin-top:2px}
.tb-cam{position:relative;aspect-ratio:3/4;max-height:58vh;margin:0 auto;border-radius:18px;overflow:hidden;background:#111;display:grid;place-items:center}
.tb-cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s}.tb-cam.live video{opacity:1}
.tb-cam p{position:relative;color:#eee;padding:20px;text-align:center;font-size:15px}
.tb-frame{position:absolute;inset:22% 16%;border:3px solid rgba(255,255,255,.85);border-radius:18px;box-shadow:0 0 0 999px rgba(0,0,0,.25)}
.tb-qr{display:grid;justify-items:center;gap:4px;text-align:center}.tb-qr b{font:400 20px var(--font)}.tb-qr span{color:var(--muted);font-size:14px}
.or-tb{display:block;font:500 11px/1.2 var(--font);padding:2px 0;border-radius:6px;color:var(--mirto);white-space:nowrap}
.or-tb.ok::before{content:'✓ '}.or-tb.diff{color:var(--ocra)}.or-tb.miss{color:var(--corallo)}
.or-tbh{display:flex!important;align-items:center;gap:3px;color:var(--mirto)!important}.or-tbh .ic{width:12px;height:12px}
.or-leg b.or-tb{display:inline;font-size:12px;margin-right:4px}
.or-dtb{display:flex;align-items:center;gap:6px;font-size:15px;color:var(--mirto)}.or-dtb .ic{width:18px;height:18px}
.or-cm{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;gap:8px;justify-self:start;min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);color:var(--ink2);font:400 15px var(--font);cursor:pointer}
.or-cm .ic{width:18px;height:18px;color:var(--lagoon)}.or-cm:focus-visible{outline:2px solid var(--lagoon);outline-offset:2px}
/* ---------- cambi turno ---------- */
.cm-box{background:var(--surface);border-radius:18px;box-shadow:var(--lift);padding:6px 14px;margin:0 0 14px}
.cm-box.gm{padding-top:14px}
.cm-it{display:flex;align-items:center;flex-wrap:wrap;gap:10px 12px;padding:12px 0;border-top:1px solid var(--line)}
.cm-box>.cm-it:first-child,.cm-box h2+.cm-it{border-top:0}
.cm-tx{flex:1 1 180px;min-width:0}.cm-tx b{display:block;font:400 16px/1.3 var(--font)}.cm-tx span{display:block;font-size:14px;color:var(--ink2)}
.cm-tx i{display:inline-block;font-style:normal;font-size:12.5px;margin-top:3px;padding:2px 8px;border-radius:99px;background:var(--ocra-soft);color:var(--ocra)}
.cm-it.approvato .cm-tx i{background:var(--mirto-soft);color:var(--mirto)}.cm-it.rifiutato .cm-tx i,.cm-it.annullato .cm-tx i{background:var(--sunk);color:var(--muted)}
.cm-tx em{display:flex;align-items:center;gap:5px;font-style:normal;font-size:13px;margin-top:4px}.cm-tx em .ic{width:15px;height:15px}
.cm-err{color:var(--corallo)}.cm-ok{color:var(--mirto)}
.cm-it .btns{margin-left:auto}
.cm-av{display:flex}.cm-av .av+.av{margin-left:-10px;box-shadow:0 0 0 2px var(--surface)}
.cm-ppl{display:grid;gap:6px}
.cm-p{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:14px;border:1px solid var(--line);cursor:pointer}
.cm-p[aria-pressed="true"]{border-color:var(--lagoon);background:var(--lagoon-soft)}
.cm-p span{display:grid}.cm-p b{font:400 16px var(--font)}.cm-p i{font-style:normal;font-size:13.5px;color:var(--muted)}
.cm-g{flex-wrap:wrap}
.cm-prev{margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--sunk);display:grid;gap:8px}
.cm-prev>b{font:500 14px var(--font);color:var(--ink2)}
.cm-row{display:flex;align-items:center;flex-wrap:wrap;gap:8px}.cm-row>span{font:400 15px var(--font);min-width:60px}
.cm-row div{display:flex;flex-wrap:wrap;gap:6px}.cm-row em{font-style:normal;font-size:13.5px;padding:3px 9px;border-radius:99px;background:var(--surface);border:1px solid var(--line)}
/* ---------- fornitori: schede grandi con logo ---------- */
.fdot.logo{background:#fff;padding:3px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.fdot img{width:100%;height:100%;object-fit:contain;border-radius:inherit}
.fdot.xl{width:64px;height:64px;border-radius:18px;font-size:28px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.fcard{all:unset;box-sizing:border-box;display:flex;flex-direction:column;background:var(--surface);border-radius:20px;box-shadow:var(--lift);overflow:hidden;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease;-webkit-tap-highlight-color:transparent}
.fcard:hover{transform:translateY(-2px)}.fcard:active{transform:scale(.98)}.fcard:focus-visible{outline:2px solid var(--lagoon);outline-offset:2px}
.fc-top{height:108px;display:grid;place-items:center;background:linear-gradient(140deg,color-mix(in srgb,var(--c) 26%,var(--surface)),color-mix(in srgb,var(--c) 8%,var(--surface)))}
.fc-top img{max-width:78%;max-height:76px;object-fit:contain;background:#fff;border-radius:14px;padding:8px;box-shadow:0 6px 16px -10px rgba(0,0,0,.45)}
.fc-top b{width:66px;height:66px;border-radius:20px;display:grid;place-items:center;background:var(--c);color:#fff;font:300 32px var(--font);box-shadow:0 8px 18px -10px var(--c)}
.fc-b{display:grid;gap:5px;padding:12px 14px 14px}
.fc-n{font:500 17px/1.25 var(--font);color:var(--ink);overflow-wrap:anywhere}
.fc-m{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}.fc-m .ic{width:15px;height:15px;flex:none}
.fc-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:3px}
.fc-tags i{display:inline-flex;align-items:center;gap:4px;font-style:normal;font-size:12px;padding:3px 9px;border-radius:99px;background:var(--sunk);color:var(--ink2)}
.fc-tags i.t{background:var(--ocra-soft);color:var(--ocra)}.fc-tags .ic{width:13px;height:13px}
.f-logo{display:flex;align-items:center;gap:14px;padding:12px;margin:4px 0 2px;border-radius:16px;background:var(--sunk)}
.f-logo b{display:block;font-weight:500}.f-logo>div>span{display:block;font-size:13px;color:var(--muted);margin:1px 0 8px}.f-logo .btns{justify-content:flex-start}
/* ---------- ordine suggerito ---------- */
.sug-cta{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;margin:0 0 14px;border-radius:18px;background:linear-gradient(120deg,var(--lagoon-soft),var(--surface) 70%);box-shadow:var(--lift);cursor:pointer}
.sug-cta:focus-visible{outline:2px solid var(--lagoon);outline-offset:2px}
.sug-cta>.ic:first-child{width:28px;height:28px;flex:none;color:var(--ocra)}
.sug-cta>.ic:last-child{color:var(--muted)}
.sug-cta div{flex:1;min-width:0}.sug-cta b{display:block;font:500 16px var(--font);color:var(--ink)}.sug-cta span{display:block;font-size:13.5px;color:var(--muted)}
.sug-wx{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.sug-d{flex:1 0 56px;display:grid;justify-items:center;gap:2px;padding:8px 4px;border-radius:12px;background:var(--sunk);font-size:12px;color:var(--muted);text-transform:capitalize}
.sug-d .ic{width:22px;height:22px;color:var(--ocra)}.sug-d b{font:500 15px var(--font);color:var(--ink)}.sug-d i{font-style:normal;color:var(--lagoon)}
.sug-wxr{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;justify-content:space-between;font-size:14px;color:var(--ink2);margin:2px 0 2px}
.sug-list{margin-top:12px}
.sug-r{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;padding:10px 0;border-top:1px solid var(--line)}
.sug-r.off .sug-i,.sug-r.off .step{opacity:.5}
.sug-i{flex:1 1 150px;min-width:0;cursor:pointer}.sug-i b{display:block;font:400 15.5px/1.3 var(--font)}.sug-i span{font-size:13px;color:var(--muted)}
.sug-r .step{margin-left:auto}
.sug-r .rv-c{margin-top:0}
/* ---------- orari del personale ---------- */
.staff-sw{margin:0 0 16px}
.staff-sw .ic{width:17px;height:17px;vertical-align:-3px;margin-right:5px}
.rep-cucina{--k:var(--ocra)}.rep-sala{--k:var(--lagoon)}.rep-altro{--k:var(--mirto)}
.or-week{display:flex;align-items:center;gap:6px;background:var(--surface);border-radius:16px;box-shadow:var(--lift);padding:6px}
.or-wt{flex:1;min-width:0;text-align:center}
.or-wt b{display:block;font:400 18px/1.25 var(--font)}
.or-wt>span{font-size:13px;color:var(--muted)}
.or-today{border:0;background:none;padding:2px;color:var(--lagoon);font:500 13px var(--font);text-decoration:underline}
.or-st{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;margin:12px 2px 10px}
.or-acts{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.or-acts .btn.primary{margin-left:auto}
@media (max-width:560px){.or-acts .btn{flex:1 1 auto}.or-acts .btn.primary{flex-basis:100%;margin-left:0}}
.or-pb{border:1px solid color-mix(in srgb,var(--corallo) 35%,var(--line));background:var(--corallo-soft);border-radius:14px;margin:0 0 12px;overflow:hidden}
.or-pb.w{border-color:color-mix(in srgb,var(--ocra) 35%,var(--line));background:var(--ocra-soft)}
.or-pbh{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:10px 14px;cursor:pointer;color:var(--ink)}
.or-pbh:focus-visible{outline:2px solid var(--lagoon);outline-offset:-2px;border-radius:14px}
.or-pbh .ic{width:20px;height:20px;flex:none;color:var(--corallo)}.or-pb.w .or-pbh .ic{color:var(--ocra)}
.or-pbh .ic.dn{transform:rotate(90deg);color:var(--ink2)!important}.or-pbh .ic.up{transform:rotate(-90deg);color:var(--ink2)!important}
.or-pbh b{font-weight:500;flex:1}
.or-pbh span{font-size:13px;color:var(--ink2)}
.or-pl{display:grid;gap:4px;padding:0 8px 8px}
.or-pi{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--surface);color:var(--ink);font-size:14px;line-height:1.3;border-left:4px solid var(--corallo)}
button.or-pi{cursor:pointer}
.or-pi.warn{border-left-color:var(--ocra)}
.or-pi>.ic{width:18px;height:18px;flex:none;color:var(--corallo)}.or-pi.warn>.ic{color:var(--ocra)}
.or-ok{display:flex;align-items:center;gap:8px;padding:11px 14px;border-radius:14px;background:var(--mirto-soft);color:var(--mirto);font-size:14.5px;margin:0 0 12px}
.or-ok .ic{width:20px;height:20px;flex:none}
.or-scroll{overflow-x:auto;background:var(--surface);border-radius:18px;box-shadow:var(--lift);margin:0 0 10px;overscroll-behavior-x:contain}
.or-scroll:focus-visible{outline:2px solid var(--lagoon);outline-offset:2px}
.or-grid{border-collapse:separate;border-spacing:0;width:100%;min-width:740px;table-layout:fixed}
.or-grid th,.or-grid td{padding:4px 3px;border-bottom:1px solid var(--line);vertical-align:middle;text-align:center;font-weight:400}
.or-grid thead th{padding:10px 3px 8px;color:var(--muted)}
.or-grid thead th span{display:block;font:500 11px var(--font);letter-spacing:.08em;text-transform:uppercase}
.or-grid thead th b{display:inline-grid;place-items:center;min-width:30px;height:30px;margin-top:2px;border-radius:50%;font:400 18px/1 var(--font);color:var(--ink)}
.or-grid thead th.today b{background:var(--lagoon);color:var(--on-lagoon)}
.or-grid thead th.today span{color:var(--lagoon)}
.or-grid td.today{background:color-mix(in srgb,var(--lagoon) 7%,var(--surface))}
.or-grid .or-pc{position:sticky;left:0;z-index:2;width:136px;background:var(--surface);text-align:left;padding:6px 8px;border-right:1px solid var(--line);font:400 13px var(--font);color:var(--muted)}
.or-grid .or-pc.err{box-shadow:inset 4px 0 0 var(--corallo)}.or-grid .or-pc.warn{box-shadow:inset 4px 0 0 var(--ocra)}
.or-who{display:flex;align-items:center;gap:8px}
.or-who>div{flex:1;min-width:0}
.or-who>div>b{display:block;font:400 14.5px/1.2 var(--font);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.or-who>div>span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.or-bar{display:block;height:4px;margin-top:4px;border-radius:9px;background:var(--sunk);overflow:hidden}
.or-bar i{display:block;height:100%;border-radius:9px;background:var(--lagoon)}
.or-bar.full i{background:var(--mirto)}.or-bar.over i{background:var(--ocra)}
.or-rep th{background:var(--sunk);padding:7px 10px;text-align:left;font:500 11.5px var(--font);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.or-rep th span{position:sticky;left:10px}
.or-c{all:unset;box-sizing:border-box;position:relative;display:flex;flex-direction:column;justify-content:center;gap:3px;width:100%;min-height:54px;padding:3px;border:2px solid transparent;border-radius:10px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.or-c:hover{background:var(--sunk)}
.or-c:focus-visible{outline:2px solid var(--lagoon);outline-offset:1px}
.or-c.err{border-color:var(--corallo);background:var(--corallo-soft)}
.or-c.warn{border-color:var(--ocra);background:var(--ocra-soft)}
.or-b{display:block;padding:7px 2px;border-radius:7px;border-left:3px solid var(--k);background:color-mix(in srgb,var(--k) 16%,var(--surface));color:var(--ink);font:500 13.5px/1.15 var(--font);font-variant-numeric:tabular-nums;white-space:nowrap}
.or-a{display:block;padding:6px 2px;border-radius:7px;border:1px dashed var(--sand);background:var(--sunk);color:var(--ink2);font:500 12px/1.15 var(--font)}
.or-e{display:grid;place-items:center;color:var(--sand)}.or-e .ic{width:18px;height:18px}
.or-dot{position:absolute;top:2px;right:2px;width:9px;height:9px;border-radius:50%;background:var(--lagoon);box-shadow:0 0 0 2px var(--surface)}
.or-grid tfoot th,.or-grid tfoot td{border-bottom:0;padding:8px 3px 10px}
.or-grid tfoot .or-pc{color:var(--ink2);font-weight:500}
.or-grid tfoot td b{display:block;font:400 18px/1.2 var(--font);color:var(--ink)}
.or-grid tfoot td span{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap}
.or-leg{display:flex;flex-wrap:wrap;gap:6px 14px;margin:4px 2px 18px;font-size:12.5px;color:var(--muted)}
.or-leg span{display:inline-flex;align-items:center;gap:6px}
.or-leg i{width:13px;height:13px;border-radius:4px;border-left:3px solid var(--k);background:color-mix(in srgb,var(--k) 25%,var(--surface))}
.or-leg i.abs{border:1px dashed var(--sand);background:var(--sunk)}
.or-leg i.dot{width:9px;height:9px;border:0;border-radius:50%;background:var(--lagoon)}
.or-pb.a{border-color:var(--line);background:var(--sunk)}.or-pb.a .or-pbh .ic{color:var(--muted)}
.or-pi.acc{border-left-color:var(--sand);color:var(--ink2)}.or-pi.acc>.ic{color:var(--muted)}
.or-acc{font-style:normal;font-size:12px;padding:2px 7px;border-radius:99px;background:var(--sunk);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.or-c.acc{border:2px dashed color-mix(in srgb,var(--corallo) 55%,var(--line))}
.or-grid .or-pc.acc{box-shadow:inset 4px 0 0 var(--sand)}
/* foglio della casella e turni tipo */
.or-shp{display:grid;gap:4px;margin:0 0 6px}
.or-shp .or-pi{background:var(--sunk)}
.or-chips{display:flex;flex-wrap:wrap;gap:8px}
.or-chips .chip{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:44px;justify-content:center;border-radius:14px}
.or-chips .chip b{font-weight:500}
.or-chips .chip span{font-size:12.5px;color:var(--muted)}
.or-chips .chip[aria-pressed="true"] span{color:inherit;opacity:.85}
.or-tm{display:flex;align-items:center;gap:8px;margin:0 0 8px}
.or-tm .inp{flex:1;min-width:0}
.or-sum{margin:6px 0 0;padding:11px 14px;border-radius:12px;background:var(--sunk);font-size:15px;color:var(--ink2)}
.or-sum b{font-weight:500;color:var(--ink)}
.or-days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.or-days .chip{padding:10px 0;text-align:center;min-width:0}
.or-days .chip:disabled{opacity:1}
.or-h3{font:400 17px var(--font);margin:22px 0 0;padding-top:16px;border-top:1px solid var(--line)}
/* contratto nel profilo */
.or-cf{margin:18px 0 0;padding:4px 14px 16px;border-radius:16px;background:var(--sunk);border:1px solid var(--line)}
.or-cfh{display:flex;align-items:center;gap:8px;margin-top:10px;font:500 15.5px var(--font)}

  {v:65,data:'2026-10-10',titolo:'Foto dei listini: Gemini più affidabile',

  {v:62,data:'2026-10-09',titolo:'Nuova apertura dell\'app',

    dev:{aggiunte:['Schermata d\'apertura (`.splash`, solo con `.intro`): `jonaIn` 1,2 s (scala 4,2 → 1 in 0,55 s in accelerazione, poi schiacciamento 1,1×0,84, rimbalzo e assestamento); al colpo (0,55 s) `jShake` sulla `.splash`, dentro `.jhit` ombra `jShadow`, due onde `jRing` e 34 granelli rasoterra `.jpb`/`jPb` (valori fissi nell\'HTML, niente `filter:blur`). Firma: «b» e «y» cadono (`byDrop` 0,85/1 s), YNOY si scrive tratto dopo tratto 1,2-2,8 s (SVG `.ywr`: 19 tratti di `tools/ynoy-tratti.py` in una maschera sul logo, `yStroke`), poi `.y0` col riflesso `ynoyShine` da 2,8 s. Uscita: `jAway` su JONA e sottotitolo 3,25-3,6 s, poi `yAway` su BY e YNOY 3,48-3,78 s. `S.splash` 3,8 s, `.intro` tolta a 4,1 s. La schermata d\'ingresso con i profili non cambia.'],correzioni:['Tolto `cutoutFix()` (v60): con «schermo intero» Chrome mette di proposito il nero nella zona fotocamera (`viewport-fit=cover` vale solo con la richiesta di schermo intero); non serviva.']}},
  {v:61,data:'2026-10-09',titolo:'Agenda: avvisi alla persona giusta',

  {v:59,data:'2026-10-09',titolo:'Agenda per pianificare giorni e settimane',
