/* promemoria per giorno: fornitore.giorniOrdine [0=lun..6=dom] e oraPromemoria (vuota: un'ora prima dell'ora limite, altrimenti 10:00).
   due = oggi è giorno d'ordine, l'ora è arrivata, l'ora limite non è passata e oggi non è già partito un ordine a quel fornitore */
function promInfo(f){const gs=f&&f.giorniOrdine;if(!Array.isArray(gs)||!gs.length)return null;
  const d=new Date(),g=(d.getDay()+6)%7,t0=new Date(d);t0.setHours(0,0,0,0);
  const lim=orMin(f.oraLimite),at=orMin(f.oraPromemoria)??(lim!=null?Math.max(0,lim-60):600),nm=d.getHours()*60+d.getMinutes();
  const sent=Object.values(D().ordini).some(o=>o.fornitoreId===f.id&&(o.inviato||0)>=t0.getTime());
  return{at,due:gs.includes(g)&&nm>=at&&(lim==null||nm<lim)&&!sent}}
/* v35 scadenze per lo staff: config/app.scad = [{id, f: fornitore o '' (tutte le richieste), g: [0=lun..6=dom], entro, avv: 'HH:MM' (vuota = un'ora prima),
   rep: reparti (vuoto = tutto lo staff)}]; avviso a ogni persona dello staff (notifica «scad_<id>_<giorno>_<persona>»).
   «Oggi si ordina» va ai profili di config/app.promA (vuoto = tutti gli Admin Chef) */
const scadL=()=>(Array.isArray(cfg().scad)?cfg().scad:[]).filter(s=>s&&s.id&&Array.isArray(s.g)&&s.g.length&&orMin(s.entro)!=null);
const scadAvv=s=>{const a=orMin(s.avv),e=orMin(s.entro);return a!=null&&a<e?a:Math.max(0,e-60)};
const scadNome=s=>s.f&&D().fornitori[s.f]?D().fornitori[s.f].nome||'':'';
const scadTit=s=>(scadNome(s)?'Richieste per '+scadNome(s):'Richieste allo chef')+' entro le '+s.entro;
const scadTxt=s=>'Manda allo chef le richieste'+(scadNome(s)?' per '+scadNome(s):'')+' entro le '+s.entro+'.';
const scadPer=(s,u)=>!!u&&u.stato==='attivo'&&u.ruolo==='staff'&&(!(s.rep||[]).length||s.rep.includes(u.reparto));
const minHm=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
function scadDue(s){const d=new Date(),g=(d.getDay()+6)%7,nm=d.getHours()*60+d.getMinutes();return s.g.includes(g)&&nm>=scadAvv(s)&&nm<orMin(s.entro)}
const promDest=()=>{const st=D().staff,l=(cfg().promA||[]).filter(id=>st[id]&&st[id].stato==='attivo');return l.length?l:'gm'};
const promTo=(d,u)=>!!u&&u.stato==='attivo'&&(d==='gm'?isGM(u):d.includes(u.id));
/* avviso nella campanella e a schermo: lo scrive il telefono dello staff per sé e quello dell'Admin Chef per tutti */
async function scadTick(me){const td=today(),rem=ls('jona_rem')||{};let push=[];
  for(const s of scadL()){if(!scadDue(s))continue;
    for(const u of Object.values(D().staff)){if(!scadPer(s,u)||!(isGM(me)||u.id===me.id))continue;const nid='scad_'+s.id+'_'+td+'_'+u.id;

    if(scadPer(s,me)&&rem['s_'+s.id]!==td){rem['s_'+s.id]=td;ls('jona_rem',rem);toast(scadTit(s),'warn')}}
  return push}
/* promemoria dal server (worker /promemoria, cron ogni 5 minuti): il telefono del gestore manda il piano solo quando cambia
   (o ogni 6 ore); finché il server ha il piano giusto (meno di 24 ore) l'app non manda la sua push «Oggi si ordina da…» */
function promPlan(){const st=D().staff,forn=[];
  for(const f of Object.values(D().fornitori)){const gs=f.giorniOrdine;if(!Array.isArray(gs)||!gs.length)continue;
    const lim=orMin(f.oraLimite),at=orMin(f.oraPromemoria)??(lim!=null?Math.max(0,lim-60):600);
    const s=Math.max(0,...Object.values(D().ordini).filter(o=>o.fornitoreId===f.id).map(o=>+o.inviato||0));
    forn.push({id:f.id,nome:f.nome||'',g:gs,at,lim,s})}
  forn.sort((a,b)=>a.id<b.id?-1:1);
  const ps=Object.entries(PUSH.subs).sort((a,b)=>a[0]<b[0]?-1:1).map(([,p])=>p),dst=promDest(),sub=ok=>ps.filter(p=>ok(st[p.u])).map(p=>p.sub);
  const subs=sub(u=>promTo(dst,u)),gest=sub(u=>!!u&&u.stato==='attivo'&&isMgr(u));
  const scad=scadL().map(s=>({id:s.id,nome:scadNome(s),g:s.g,avv:scadAvv(s),entro:orMin(s.entro),subs:sub(u=>scadPer(s,u))})).sort((a,b)=>a.id<b.id?-1:1);
  let tz='Europe/Rome';try{tz=Intl.DateTimeFormat().resolvedOptions().timeZone||tz}catch(e){}
  return JSON.stringify({tz,forn,subs,gest,scad})}
async function promSrv(){if(!pushFb())return false;pushWatch();if(!PUSH.ld)return false;
  const body=promPlan(),h=await sha(body),last=ls('jona_prom')||{};
  if(last.h===h&&now()-(last.t||0)<6*36e5)return true;
  if(promSrv.busy||now()<(promSrv.retry||0))return last.h===h&&now()-(last.t||0)<864e5;
  promSrv.busy=1;try{const r=await fetch(PUSH_URL+'/promemoria',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+await algTok()},body});
    if(!r.ok)throw new Error('promemoria '+r.status);ls('jona_prom',{h,t:now()});return true}
  catch(e){promSrv.retry=now()+15*60000;return last.h===h&&now()-(last.t||0)<864e5}finally{promSrv.busy=0}}
async function deadlineTick(){
  if(!S.db||!allLoaded())return;const me=meU();if(!me||me.stato!=='attivo')return;
  const sp=await scadTick(me);if(!isGM(me))return;
  if(S.tab==='invii')render();
  const td=today(),t0=new Date();t0.setHours(0,0,0,0);const rem=ls('jona_rem')||{};for(const k in rem)if(rem[k]!==td)delete rem[k];
  for(const o of Object.values(D().ordini)){
    if(o.stato!=='aperto'||!o.items||!o.items.length)continue;const fid=o.fornitoreId;const x=dlInfo(fid);
    if(!x||x.k!=='soon'||rem[fid]===td)continue;
    rem[fid]=td;ls('jona_rem',rem);const f=forn(fid);const n=o.items.length;const txt=n+' '+(n===1?'articolo':'articoli')+' da inviare';
    const old=Object.values(D().notifiche).find(z=>z.tipo==='scadenza'&&z.rif===fid&&(z.creato||0)>=t0.getTime());

    if(!(old&&old.da!==me.id&&now()-(old.creato||0)<120000))toast('Ordine a '+f.nome+' entro le '+f.oraLimite+': '+txt,'warn');
  }
  const srv=await promSrv().catch(()=>false);
  if(!srv)for(const[s,id]of sp)pushSend([id],scadTit(s),scadTxt(s)).catch(()=>{});
  const dst=promDest();
  for(const f of Object.values(D().fornitori)){const x=promInfo(f);if(!x||!x.due||rem['p_'+f.id]===td)continue;
    rem['p_'+f.id]=td;ls('jona_rem',rem);

    const o=Object.values(D().ordini).find(z=>z.stato==='aperto'&&z.fornitoreId===f.id),n=o&&o.items?o.items.length:0;
    const txt=(n?n+(n===1?' articolo':' articoli')+' nel carrello':'Il carrello è vuoto: prepara l\'ordine')+(f.oraLimite?', da inviare entro le '+f.oraLimite:'');
    if(dst==='gm')await notify('gm','Oggi si ordina da '+f.nome,txt,'promemoria',f.id,srv);else for(const id of dst)await notify(id,'Oggi si ordina da '+f.nome,txt,'promemoria',f.id,srv);
    if(promTo(dst,me))toast('Oggi si ordina da '+f.nome+': '+txt,'warn');
  }
  ls('jona_rem',rem);
}

/* ================= ordine suggerito =================
   Dagli ordini inviati negli ultimi 2 mesi: ogni quanti giorni si ordina da quel fornitore (mediana) e quanto si usa al giorno
   (quantità ordinate prima dell'ultimo ordine / giorni tra il primo e l'ultimo). Proposta = uso al giorno × giorni fino al
   prossimo ordine × gente prevista × meteo, meno quello che è già nell'ordine aperto. Meteo: Open-Meteo (gratis, senza chiave). */
const SUG_DAYS=56,DAY=864e5,METEO_POS={lat:41.1366,lon:9.5323,nome:'Porto Cervo'};
const SUG_GENTE=[[0.8,'Meno'],[1,'Normale'],[1.2,'Di più'],[1.5,'Evento']];
const sugKey=l=>l.pid||'n:'+norm(l.nome);
function sugStats(fid){
  const t0=now()-SUG_DAYS*DAY;
  const os=Object.values(D().ordini).filter(o=>o.fornitoreId===fid&&o.stato==='inviato'&&(o.inviato||0)>=t0).sort((a,b)=>a.inviato-b.inviato);
  if(os.length<2)return{n:os.length};
  const gaps=os.slice(1).map((o,i)=>(o.inviato-os[i].inviato)/DAY).sort((a,b)=>a-b);
  const cad=Math.max(1,Math.round(gaps[Math.floor(gaps.length/2)]));
  const span=Math.max(1,(os[os.length-1].inviato-os[0].inviato)/DAY),P=new Map();
  os.forEach((o,i)=>{for(const l of o.items||[]){const k=sugKey(l),q=Number(l.qta)||0;
    const x=P.get(k)||{k,pid:l.pid||'',nome:l.nome,unita:l.unita||'',q:0,qs:[]};x.qs.push(q);if(i<os.length-1)x.q+=q;P.set(k,x)}});
  const items=[...P.values()].map(x=>{const s=x.qs.slice().sort((a,b)=>a-b);return Object.assign(x,{n:x.qs.length,tip:s[Math.floor(s.length/2)],day:x.q/span})});
  const late=(now()-os[os.length-1].inviato)/DAY;
  return{n:os.length,cad,last:os[os.length-1].inviato,due:late>=cad-0.5,items};
}
const sugUnitHalf=u=>/^(kg|g|gr|lt?|litri?|ml)$/i.test(String(u||'').trim());

// meteo dei prossimi 7 giorni, in memoria per 3 ore
let wxMem=null;
async function meteo(){
  if(wxMem&&now()-wxMem.t<3*36e5)return wxMem.d;
  try{const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${METEO_POS.lat}&longitude=${METEO_POS.lon}&daily=weather_code,temperature_2m_max,precipitation_probability_max&timezone=Europe%2FRome&forecast_days=7`);
    if(!r.ok)throw 0;const j=await r.json(),y=j.daily;const d=y.time.map((t,i)=>({t,c:y.weather_code[i],tx:Math.round(y.temperature_2m_max[i]),p:y.precipitation_probability_max[i]||0}));
    wxMem={t:now(),d};return d}catch(e){return null}
}
const wxIc=c=>c>=51||c>=95?'rain':c>=1?'cloud':'sun';
// effetto del meteo sui giorni coperti dall'ordine: pioggia → meno gente in terrazza, caldo e sole → di più
function wxFactor(d,cad){
  if(!d)return{f:1,t:''};const ds=d.slice(1,1+Math.max(1,cad));if(!ds.length)return{f:1,t:''};
  const p=ds.reduce((s,x)=>s+x.p,0)/ds.length,tx=ds.reduce((s,x)=>s+x.tx,0)/ds.length;
  if(p>=60)return{f:0.9,t:'Pioggia probabile: −10%'};
  if(tx>=27&&p<30)return{f:1.1,t:'Sole e caldo: +10%'};
  return{f:1,t:'Tempo normale: nessuna correzione'};
}
function sugRows(){
  const G=S.sug,st=sugStats(G.fid);if(!st.items)return[];
  const wf=G.useWx?wxFactor(G.wx,st.cad).f:1,cur=D().ordini['aperto_'+G.fid];
  return st.items.map(x=>{const inO=cur&&cur.items.find(l=>(l.key||l.pid)===x.pid)?.qta||0;
    const base=sugRound(x.day*st.cad*G.gente*wf-inO,x.unita);const p=x.pid?D().prodotti[x.pid]:null;
    const q=G.q[x.k]!=null?G.q[x.k]:base;const sel=G.sel[x.k]!=null?G.sel[x.k]:(x.n>=2&&base>0&&!!p);
    return Object.assign({},x,{p,inO,base,q,sel})}).filter(x=>x.p).sort((a,b)=>(b.sel-a.sel)||(b.n-a.n)||String(a.nome).localeCompare(String(b.nome),'it'));
}

      <div class="panel" style="box-shadow:none;border:1px solid var(--line)">${fs.map(({f,st})=>st.n>=2?`<button type="button" class="row link" data-a="sugF" data-f="${f.id}">${fDot(f.id)}<div class="row-i"><div class="row-t">${esc(f.nome)}</div><div class="row-m">Di solito ogni ${st.cad===1?'giorno':st.cad+' giorni'} · ultimo ${ago(st.last)}</div></div>${st.due?pill('wait','da riordinare'):''}${ic('chev')}</button>`

      ${stepper('sugQ',esc(r.k).replace(/[^\w-]/g,'_'),r.q,`data-k="${esc(r.k)}"`)}<span class="ln-u">${esc(r.unita)}</span></div>`).join(''):'<p class="muted">Nessun prodotto da proporre.</p>'}</div>

async function confirmReceipt(oid,all){
  const o=D().ordini[oid];if(!o||o.ricevuto)return;const R=rcvState(oid);const me=meU();const f=forn(o.fornitoreId);
  const nc0=all?0:R.lines.filter(l=>!l.st).length;

  const righe=o.items.map((l,i)=>{const L=all?{st:'ok'}:R.lines[i];
    const arr=L.st==='ko'?0:L.st==='meno'?L.arr:l.qta;const motivo=!L.st?'nonctrl':L.st==='ko'?'mancante':arr!==l.qta?'quantita':'';

  const diffs=righe.filter(r=>r.motivo&&r.motivo!=='nonctrl');const nc=righe.length-righe.filter(r=>r.motivo!=='nonctrl').length;
  await upd('ordini',oid,{ricevuto:now(),ricevutoDa:me.id,ricevutoNome:fullName(me),ricezione:{righe,note:all?'':R.note.trim(),foto:all?'':R.foto},differenze:diffs.length,nonControllati:nc});
  for(const rid of o.richieste||[]){const r=D().richieste[rid];if(r)await upd('richieste',rid,{arrivati:Object.assign({},r.arrivati||{},{[o.fornitoreId]:now()})})}
  await notify('gm',diffs.length?`Consegna ${f.nome}: ${diffs.length===1?'1 differenza':diffs.length+' differenze'}`:`Consegna ${f.nome} arrivata`,
    (diffs.length?diffs.slice(0,5).map(d=>rcvDiffTxt(d)+(d.da.length?' (chiesto da '+d.da.join(', ')+')':'')).join('; ')+(diffs.length>5?'; …e altri '+(diffs.length-5):'')+'. Controllata da '+me.nome:'Controllata da '+me.nome+(nc?'':', tutto ok'))+(nc?(diffs.length?'; ':', ')+nc+' non controllati':''),'arrivo',oid);
  // Chi aveva chiesto un prodotto mancante o arrivato in meno riceve un avviso solo per i suoi prodotti.
  if(diffs.length){const per=new Map();

function mapRows(rows){
  for(let h=0;h<Math.min(rows.length,20);h++){
    const r=(rows[h]||[]).map(c=>norm(c));const find=(re,not=[])=>r.findIndex((c,i)=>!not.includes(i)&&re.test(c));
    const iN=find(/^nome|descr|prodott|articol|denomin/);if(iN<0)continue;
    const iP=find(/prezz|listino|euro|importo|costo|^eur/,[iN]);
    const iC=find(/^cod|codice|^art$|sku|ean|^rif/,[iN]);const iU=find(/^u ?m$|^unita|misura/,[iN]);const iK=find(/categ|famiglia/,[iN]);const iF=find(/fornit|ditta|supplier/,[iN]);
    if(iP<0&&iC<0&&iU<0)continue;
    const items=rows.slice(h+1).map(row=>({fornitore:iF>=0?String(row[iF]??'').trim():'',nome:String(row[iN]??'').trim(),codice:iC>=0?String(row[iC]??'').trim():'',unita:iU>=0?String(row[iU]??'').trim():'',prezzo:iP>=0?num(row[iP]):null,categoria:iK>=0?String(row[iK]??'').trim():''})).filter(i=>i.nome);
    if(items.length)return items;
  }
  return null;
}
function parseFatturaPA(t){

  const cp=d.getElementsByTagNameNS('*','CedentePrestatore')[0];const fn=cp?g(cp,'Denominazione'):'';
  const items=[...d.getElementsByTagNameNS('*','DettaglioLinee')].map(l=>({fornitore:fn,nome:g(l,'Descrizione'),codice:g(l,'CodiceValore'),unita:g(l,'UnitaMisura'),prezzo:num(g(l,'PrezzoUnitario')),categoria:''})).filter(i=>i.nome&&i.prezzo>0);

}
function guessSupplier(name){const n=norm(name);if(!n)return'';const fs=Object.values(D().fornitori);

async function impRun(kind,files){
  const I=S.imp;if(!I)return;I.err='';

    let items=null,fonte='';

      else{toast('Apro il file…');await need('xlsx');const wb=XLSX.read(await fl.arrayBuffer(),{type:'array'});const rows=[];wb.SheetNames.forEach(n=>rows.push(...XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:''})));items=mapRows(rows)}

    const def=I.fid;

// Aumento di prezzo in percentuale (0 se non è aumentato o manca il prezzo vecchio).

function rvUps(items){const out=[];for(const it of items){if(!it.fid)continue;const m=matchProd(prods().filter(p=>p.fornitoreId===it.fid),it);const nw=num(it.prezzo);

function weekRange(off){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-(d.getDay()+6)%7-7*off);const e=new Date(d);e.setDate(e.getDate()+7);return[d.getTime(),e.getTime()]}

/* ================= orari del personale =================
   Una settimana per documento in «config»: orari_<lunedì AAAA-MM-GG> = {tipo:'orari',lun,t:{<persona>:{'0'..'6':valore}},tp:copia pubblicata,pub,pubDa,mod}.
   Valore del giorno: "10:00-15:00" o "10:00-15:00,18:00-23:00" (fine ≤ inizio = finisce dopo mezzanotte); R riposo, F ferie, M malattia, P permesso.
   Turni tipo in config/orari_tipi {l:[{id,n,v}]}; contratto in staff.contratto {ore,pausa (minuti),liberi}. Lo staff vede solo «tp», la sua riga. */
const OR_ASS={R:'Riposo',F:'Ferie',M:'Malattia',P:'Permesso'};
const OR_GG=['Lun','Mar','Mer','Gio','Ven','Sab','Dom'];
const OR_GGL=['Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato','Domenica'];
const OR_TIPI0=[{id:'pranzo',n:'Pranzo',v:'10:00-15:00'},{id:'cena',n:'Cena',v:'18:00-23:30'},{id:'spezzato',n:'Spezzato',v:'10:00-15:00,18:00-23:00'},{id:'giornata',n:'Giornata',v:'09:00-17:30'}];
const CONTR0={ore:40,pausa:30,liberi:1};
const contrOf=u=>u&&u.contratto?Object.assign({},CONTR0,u.contratto):null;
const withContr=f=>!!f._c&&(f.ruolo||'staff')!=='dev';
const orContr=f=>({ore:num(f.ore),pausa:Number(f.pausa)||0,liberi:Number(f.liberi)||1});
const orDate=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d)};
const orLun=(d=new Date())=>{const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-(x.getDay()+6)%7);return today(x)};
const orShift=(lun,w)=>{const d=orDate(lun);d.setDate(d.getDate()+7*w);return today(d)};
const orDay=(lun,g)=>{const d=orDate(lun);d.setDate(d.getDate()+g);return d};
const orWeek=lun=>D().config['orari_'+lun]||null;
const orTipi=()=>{const t=D().config.orari_tipi;return t&&Array.isArray(t.l)?t.l:OR_TIPI0};
const orRange=lun=>{const a=orDay(lun,0),b=orDay(lun,6),m=d=>d.toLocaleDateString('it-IT',{month:'long'});return a.getMonth()===b.getMonth()?`${a.getDate()} – ${b.getDate()} ${m(b)}`:`${a.getDate()} ${m(a)} – ${b.getDate()} ${m(b)}`};
const orDayL=(lun,g)=>OR_GGL[g]+' '+orDay(lun,g).toLocaleDateString('it-IT',{day:'numeric',month:'long'});
const orMin=s=>{const m=/^(\d{1,2}):(\d{2})$/.exec(String(s||'').trim());return m&&+m[1]<24&&+m[2]<60?+m[1]*60+ +m[2]:null};
const orHM=m=>String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const orHMc=m=>Math.floor(m/60)%24+(m%60?':'+String(m%60).padStart(2,'0'):'');
// turni del giorno in minuti da mezzanotte, ordinati: [[inizio,fine]] (fine oltre 1440 = dopo mezzanotte)
function orShifts(v){if(!v||OR_ASS[v])return[];const r=[];for(const p of String(v).split(',')){const [a,b]=p.split('-').map(orMin);if(a==null||b==null)continue;r.push([a,b<=a?b+1440:b])}return r.sort((x,y)=>x[0]-y[0])}
const orFmt=v=>OR_ASS[v]||orShifts(v).map(([a,b])=>orHM(a)+'–'+orHM(b)).join(', ');
const orH=m=>{m=Math.round(m);const h=Math.floor(m/60),r=m%60;return r?h+'h'+String(r).padStart(2,'0'):h+'h'};
// minuti di lavoro: pausa del contratto tolta nei turni oltre 6 ore; ferie, malattia e permesso valgono ore/(7 − liberi)
function orNet(v,c){if(!v||v==='R')return 0;if(OR_ASS[v])return c?Math.round(c.ore*60/Math.max(1,7-c.liberi)):0;const p=c?c.pausa:0;return orShifts(v).reduce((s,[a,b])=>s+(b-a)-(b-a>360?p:0),0)}
const orTot=(row,c)=>{let m=0;for(let g=0;g<7;g++)m+=orNet(row&&row[g],c);return m};
const orHas=row=>!!row&&Object.values(row).some(Boolean);
const orAny=t=>Object.values(t||{}).some(orHas);
const orDiffDays=(a,b)=>{const r=[];for(let g=0;g<7;g++)if(((a||{})[g]||'')!==((b||{})[g]||''))r.push(g);return r};
const orIds=w=>[...new Set(Object.keys(w.t||{}).concat(Object.keys(w.tp||{})))];
const orChanged=w=>orIds(w).filter(id=>orDiffDays((w.tp||{})[id],(w.t||{})[id]).length);
const orPeople=()=>Object.values(D().staff).filter(u=>u.stato==='attivo'&&(u.ruolo!=='dev'||u.contratto)).sort(byNome);
const orRep=u=>REPARTI[u.reparto]?u.reparto:'altro';
// controlli di una persona in una settimana (prev = sua riga della settimana prima): [{g,k:'err'|'warn',t}], g=-1 vale per tutta la settimana
function orCheck(u,row,prev){
  const c=contrOf(u),out=[],add=(g,k,t)=>out.push({g,k,t});row=row||{};
  const iv=[];for(const [a,b] of orShifts(prev&&prev[6]))iv.push({g:-1,a:a-1440,b:b-1440});
  let worked=0;const np=[];
  for(let g=0;g<7;g++){const sh=orShifts(row[g]);if(!sh.length)continue;worked++;
    for(let i=1;i<sh.length;i++)if(sh[i][0]<sh[i-1][1])add(g,'err',`${OR_GG[g]}: i due turni si sovrappongono`);
    const span=Math.max(...sh.map(s=>s[1]))-sh[0][0];if(span>780)add(g,'err',`${OR_GG[g]}: giornata di ${orH(span)} dall'inizio alla fine, al massimo 13 ore`);
    if(c&&c.pausa<10&&sh.some(([a,b])=>b-a>360))np.push(g);
    for(const [a,b] of sh)iv.push({g,a:a+g*1440,b:b+g*1440})}
  if(np.length)out.push({g:np[0],gs:np,k:'warn',t:`${np.map(g=>OR_GG[g]).join(', ')}: turni oltre 6 ore senza pausa (il contratto non ha la pausa)`});
  iv.sort((x,y)=>x.a-y.a);
  let end=0,gap=0,last=null;
  for(const x of iv){
    if(last&&x.g!==last.g&&x.g>=0){const r=x.a-last.b;
      if(r<0)add(x.g,'err',`${OR_GG[x.g]}: il turno inizia prima che finisca quello del giorno prima`);
      else if(r<660)add(x.g,'err',`${OR_GG[x.g]}: solo ${orH(r)} di riposo dopo il turno di ${last.g<0?'domenica scorsa':OR_GGL[last.g].toLowerCase()}, ne servono 11`)}
    if(x.a>end)gap=Math.max(gap,x.a-end);end=Math.max(end,x.b);if(!last||x.b>=last.b)last=x}
  gap=Math.max(gap,7*1440-end);
  if(worked&&gap<1440)add(-1,'err','Nessun riposo di 24 ore di fila in questa settimana');
  if(c&&worked>7-c.liberi)add(-1,'err',`Lavora ${worked} giorni: con ${c.liberi} ${c.liberi===1?'giorno libero':'giorni liberi'} al massimo ${7-c.liberi}`);
  const tot=orTot(row,c);
  if(tot>48*60)add(-1,'err',`${orH(tot)} in settimana: il massimo è 48 ore`);
  else if(c&&tot>c.ore*60)add(-1,'warn',`${orH(tot-c.ore*60)} oltre il contratto: ${orH(tot)} su ${c.ore}h`);
  return out;
}
function orProblems(lun){const t=(orWeek(lun)||{}).t||{},pt=(orWeek(orShift(lun,-1))||{}).t||{};const r=[];
  for(const u of orPeople())for(const x of orCheck(u,t[u.id],pt[u.id]))r.push(Object.assign({u},x));
  const w=orWeek(lun);for(const p of r)if(p.k==='err'&&orOk(w,p.u.id).includes(p.t))p.ok=true;
  return r.sort((a,b)=>(a.ok?2:a.k==='err'?0:1)-(b.ok?2:b.k==='err'?0:1))}
function orStato(w){
  if(!w||(!orAny(w.t)&&!w.tp))return{k:'',l:'Settimana vuota'};
  if(!w.tp)return{k:'wait',l:'Bozza: lo staff non la vede ancora'};
  return orChanged(w).length?{k:'wait',l:'Modifiche da avvisare',ch:true}:{k:'ok',l:'Pubblicata '+ago(w.pub)};
}

// chiede il consenso per gli errori nuovi; restituisce i testi da salvare in ok.<persona> o null se annullato
async function orConsent(u,errs,prima){
  const nuovi=errs.filter(p=>!prima.includes(p.t));if(!nuovi.length)return errs.map(p=>p.t);
  const t=nuovi.length===1?'Questo turno non rispetta una regola':'Questo turno non rispetta '+nuovi.length+' regole';
  if(!await ask(t,u.nome+': '+nuovi.map(p=>p.t).join('\n')+'\n\nSe salvi lo stesso, l\'errore resta segnato come accettato da te.','Salva lo stesso',true))return null;
  return errs.map(p=>p.t);
}

    if([[E.a1,E.b1],[E.a2,E.b2]].some(([a,b])=>a&&a===b))return toast('Inizio e fine non possono essere uguali.','warn');

/* ================= timbratura con QR (si accende in Impostazioni, spenta di partenza) =================
   QR stampato in cucina con «JONA-TIMBRA:<codice>» (config/app.timbraK). Lo staff lo inquadra dalla voce Orari.
   Una settimana per documento: config/timbr_<lunedì> = {tipo:'timbr',lun,t:{<persona>:{'0'..'6':'09:58-15:03,18:00-'}},m:{<persona>:{<g>:1}}}
   stesso formato degli orari; «18:00-» = in servizio adesso; m = timbrata senza QR (fotocamera non disponibile). */
const TB_MAX=16*60; // un'entrata aperta da più di 16 ore non si chiude più: la prossima timbratura è una nuova entrata
const tbOn=()=>!!cfg().timbra;
const tbWeek=lun=>D().config['timbr_'+lun]||null;
const tbCode=()=>'JONA-TIMBRA:'+(cfg().timbraK||'');
const tbVal=(lun,id,g)=>(((tbWeek(lun)||{}).t||{})[id]||{})[g]||'';
// entrata aperta (oggi o ieri entro 16 ore): {lun,g,a} oppure null
function tbOpen(id,d=new Date()){
  const lun=orLun(d),g=(d.getDay()+6)%7,mins=d.getHours()*60+d.getMinutes();
  const pl=g?lun:orShift(lun,-1),pg=g?g-1:6;
  for(const [L,G,off] of [[lun,g,0],[pl,pg,1440]]){const m=/(?:^|,)(\d\d:\d\d)-$/.exec(tbVal(L,id,G));if(m){const a=orMin(m[1]);if(mins+off-a<=TB_MAX&&mins+off>=a)return{lun:L,g:G,a}}}
  return null;
}
async function tbPunch(id,manual){
  const d=new Date(),hm=orHM(d.getHours()*60+d.getMinutes()),op=tbOpen(id,d);
  const lun=op?op.lun:orLun(d),g=op?op.g:(d.getDay()+6)%7,v=tbVal(lun,id,g);
  const nv=op?v+hm:(v?v+',':'')+hm+'-';
  const set={['t.'+id+'.'+g]:nv};if(manual)set['m.'+id+'.'+g]=1;
  if(tbWeek(lun))await upd('config','timbr_'+lun,set);
  else await put('config','timbr_'+lun,{tipo:'timbr',lun,t:{[id]:{[g]:nv}},m:manual?{[id]:{[g]:1}}:{}});
  return{out:!!op,hm};
}
// ore timbrate nette (stessa pausa del contratto, come negli orari)
const tbNet=(v,c)=>orNet(String(v||'').split(',').filter(p=>/^\d\d:\d\d-\d\d:\d\d$/.test(p)).join(','),c);
// confronto con il turno previsto: ok (entro 10 minuti), diff, miss (turno passato senza timbratura)
function tbCmp(plan,act,dayEnd){
  const P=orShifts(plan),A=String(act||'').split(',').filter(Boolean);
  if(!P.length)return A.length?'diff':'';
  if(!A.length)return dayEnd?'miss':'';
  const a0=orMin(A[0].split('-')[0]),lastEnd=A[A.length-1].split('-')[1];
  if(Math.abs(a0-P[0][0])>10)return'diff';
  if(lastEnd){let e=orMin(lastEnd);const pe=P[P.length-1][1];if(e<a0)e+=1440;if(Math.abs(e-pe)>10)return'diff'}
  return'ok';
}
const tbFmt=v=>String(v||'').split(',').filter(Boolean).map(p=>{const [a,b]=p.split('-');return orHMc(orMin(a))+'–'+(b?orHMc(orMin(b)):'…')}).join(' ');

      timer=setInterval(async()=>{const v=$('#tb-v');if(stop||busy||!v||v.readyState<2)return;busy=true;
        try{let txt='';

          else{const w=Math.min(640,v.videoWidth),h=Math.round(v.videoHeight*w/v.videoWidth);cv.width=w;cv.height=h;cx.drawImage(v,0,0,w,h);const r=jsQR(cx.getImageData(0,0,w,h).data,w,h,{inversionAttempts:'dontInvert'});txt=r&&r.data||''}
          if(txt){if(txt===tbCode()&&cfg().timbraK)await done(false);else if(/^JONA-TIMBRA:/.test(txt)&&!warned){warned=true;toast('Questo QR è vecchio: chiedi a Maurizio quello nuovo.','warn')}}
        }catch(e){}busy=false},280);
    }catch(e){close();if(!S.tbs)return;S.tbs.st='err';S.tbs.err=e&&e.m||'Non riesco ad aprire la fotocamera. Controlla il permesso nelle impostazioni del telefono.';refreshSheet()}
  })();
}

  const mese=d0.toLocaleDateString('it-IT',{month:'long',year:'numeric'});

  const ws1=XLSX.utils.aoa_to_sheet(R);ws1['!cols']=[{wch:26},{wch:13},{wch:13},{wch:11}];
  const ws2=XLSX.utils.aoa_to_sheet(rows);for(let i=1;i<rows.length;i++){const c=ws2[XLSX.utils.encode_cell({r:i,c:1})];if(c)c.z='dd/mm/yyyy'}
  ws2['!cols']=[{wch:24},{wch:11},{wch:11},{wch:24},{wch:12},{wch:24},{wch:12},{wch:11},{wch:22}];

/* ================= scambio turno tra colleghi =================
   Nella settimana pubblicata: cambi.<id> = {da,a,g1,g2 (-1 = nessuno),stato,creato}. Si scambiano le giornate g1 (e g2) tra le due persone.
   chiesto → (il collega) accettato | rifiutato → (chi fa gli orari) approvato | rifiutato; chi chiede può annullare prima dell'approvazione.
   All'approvazione cambiano sia la bozza «t» sia la copia pubblicata «tp»; gli errori chiedono il consenso come nella tabella. */
const CM_ST={chiesto:'In attesa del collega',accettato:'In attesa di approvazione',approvato:'Approvato',rifiutato:'Rifiutato',annullato:'Annullato'};
const cmDays=c=>[c.g1].concat(c.g2>=0&&c.g2!==c.g1?[c.g2]:[]);
function cmApply(rows,c){const A=Object.assign({},rows[c.da]||{}),B=Object.assign({},rows[c.a]||{});
  for(const g of cmDays(c)){const x=A[g],y=B[g];if(y)A[g]=y;else delete A[g];if(x)B[g]=x;else delete B[g]}return[A,B]}
// cambi delle settimane caricate (le più recenti), con la settimana di appartenenza
function cmAll(){const r=[];for(const [k,w] of Object.entries(D().config))if(/^orari_\d{4}-/.test(k)&&w.cambi)for(const [id,c] of Object.entries(w.cambi))r.push(Object.assign({id,lun:w.lun},c));return r.sort((a,b)=>b.creato-a.creato)}
const cmOpen=c=>c.stato==='chiesto'||c.stato==='accettato';
const cmToMe=me=>me?cmAll().filter(c=>c.a===me.id&&c.stato==='chiesto'):[];
const cmToApprove=()=>cmAll().filter(c=>c.stato==='accettato');
const cmTxt=(c,lun)=>{const w=orWeek(lun)||{},tp=w.tp||{},v=(id,g)=>orFmt((tp[id]||{})[g])||'nessun turno';
  return cmDays(c).map(g=>`${OR_GGL[g]}: ${v(c.da,g)} ↔ ${v(c.a,g)}`).join(' · ')};
async function cmSet(c,x){await upd('config','orari_'+c.lun,Object.fromEntries(Object.entries(x).map(([k,v])=>['cambi.'+c.id+'.'+k,v])))}

// chi fa gli orari: approva (con controllo delle regole) o rifiuta
async function cmDecide(lun,id,si){
  const w=orWeek(lun);const c=w&&w.cambi&&w.cambi[id];if(!c||!cmOpen(c))return;const x=Object.assign({id,lun},c);
  const da=D().staff[c.da],a=D().staff[c.a];if(!da||!a)return toast('Una delle due persone non c\'è più.','warn');
  if(!si){await cmSet(x,{stato:'rifiutato',deciso:now()});for(const p of [c.da,c.a])await notify(p,'Cambio turno non approvato',cmTxt(c,lun),'cambio',lun);return toast('Cambio rifiutato')}
  const t=w.t||{},tp=w.tp||{},[tA,tB]=cmApply(t,c),[pA,pB]=cmApply(tp,c),prev=(orWeek(orShift(lun,-1))||{}).t||{};
  const set={['t.'+c.da]:tA,['t.'+c.a]:tB,['tp.'+c.da]:pA,['tp.'+c.a]:pB,mod:now()};
  for(const [u,r] of [[da,tA],[a,tB]]){const ok=await orConsent(u,orCheck(u,r,prev[u.id]).filter(p=>p.k==='err'),orOk(w,u.id));if(ok===null)return;set['ok.'+u.id]=ok}
  const txt=cmTxt(c,lun);
  set['cambi.'+id+'.stato']='approvato';set['cambi.'+id+'.deciso']=now();
  await upd('config','orari_'+lun,set);
  for(const p of [c.da,c.a])await notify(p,'Cambio turno approvato',txt,'cambio',lun);
  toast('Cambio approvato: orari aggiornati e pubblicati');
}

// «In turno oggi»: turni di oggi dalla settimana pubblicata (tp), ordinati per inizio; «adesso» se il turno è in corso
function orOggi(){
  const lun=orLun(),w=orWeek(lun),tp=w&&w.tp;if(!tp)return'';
  const g=(new Date().getDay()+6)%7,n0=new Date(),nm=n0.getHours()*60+n0.getMinutes(),st=D().staff;
  const l=Object.entries(tp).map(([id,r])=>({u:st[id],sh:orShifts((r||{})[g])})).filter(x=>x.u&&x.u.stato==='attivo'&&x.sh.length).sort((a,b)=>a.sh[0][0]-b.sh[0][0]||byNome(a.u,b.u));
  const on=x=>x.sh.some(([a,b])=>nm>=a&&nm<b),nOn=l.filter(on).length;
  return`<section class="or-now" aria-label="In turno oggi"><div class="or-nowh">${ic('users')}<b>In turno oggi</b><span>${l.length?l.length+(l.length===1?' persona':' persone')+(nOn?' · '+nOn+' adesso':''):'nessuno'}</span></div>
  ${l.length?`<ul>${l.map(x=>`<li class="rep-${orRep(x.u)}${on(x)?' on':''}">${avatar(x.u,32)}<b>${esc(x.u.nome)}${x.u.cognome?' '+esc(x.u.cognome.charAt(0))+'.':''}</b><span>${x.sh.map(([a,b])=>orHMc(a)+'–'+orHMc(b)).join(', ')}</span>${on(x)?'<i class="tag gm">Adesso</i>':''}</li>`).join('')}</ul>`:''}</section>`;

  const staff=Object.values(d.staff).filter(u=>u.stato!=='in_attesa').map(u=>{const c=isGM(meU())?contrOf(u):null;return[u.id,fullName(u),RUOLI[u.ruolo],REPARTI[u.reparto]||'',u.mansione||'',u.stato,c?c.ore+'h/sett, pausa '+c.pausa+' min, '+c.liberi+' liberi':'']});

      timbrature:tbOn()&&tbWeek(l)?Object.fromEntries(Object.entries(tbWeek(l).t||{}).map(([id,r])=>[sn(id),Object.fromEntries(Object.entries(r).map(([g,v])=>[OR_GGL[g],v]))])):undefined}}).filter(Boolean);

    adesso:dt(now()),locale:cfg().nomeLocale,

    richieste_colonne:['data','persona','reparto','stato','prodotti: nome, quantità, unità'],

    staff_colonne:['id','nome','ruolo','reparto','mansione','stato','contratto'],staff,orari});

/* ================= chat tra colleghi =================
   Collezione «messaggi»: un documento per messaggio {c,da,t,creato}; «messaggi/letti» = {<persona>:{<chat>:ultimo letto}}.
   c: 'tutti' | 'rep_cucina' | 'rep_sala' | 'rep_altro' | 'dm_<idA>_<idB>' (id in ordine alfabetico).
   Su Firebase la chat parla direttamente con Firestore (come le push): finché le regole non hanno «messaggi» l'app non si blocca
   e la chat spiega come attivarla. Si leggono gli ultimi 500 messaggi; «Messaggi precedenti» carica i più vecchi. */
const CHAT={on:false,err:'',msgs:[],old:[],letti:{},seen:null,retry:0,box:null,last:{}};
const chFb=()=>!!S.db&&S.db.kind==='firebase';
const chCol=()=>fbInit().fs.collection('messaggi');
const chDm=(a,b)=>'dm_'+[a,b].sort().join('--'); // «--» non compare negli id (che possono avere «_»)
const chDmIds=c=>c.slice(3).split('--');
function chWatch(){
  if(CHAT.on||now()<CHAT.retry||!S.db||!realU())return;
  if(chFb()){if(!S.db.status().ready)return;CHAT.on=true;
    CHAT.un=chCol().orderBy('creato','desc').limit(500).onSnapshot({includeMetadataChanges:true},q=>{CHAT.err='';
      CHAT.msgs=q.docs.map(d=>Object.assign({id:d.id,pend:d.metadata.hasPendingWrites},d.data()));chNew();schedule()},
      e=>{CHAT.err=e&&e.code||'errore';CHAT.on=false;CHAT.retry=now()+60000;schedule()});
    chCol().doc('letti').onSnapshot(d=>{CHAT.letti=d.exists?d.data():{};schedule()},()=>{});
  }else{CHAT.on=true;
    S.db.collection('messaggi').orderBy('creato','desc').limit(500).onSnapshot(q=>{const all=q.docs.map(d=>Object.assign({id:d.id},d.data()));
      const l=all.find(m=>m.id==='letti');CHAT.lettiOk=!!l;CHAT.letti=l?Object.assign({},l):{};delete CHAT.letti.id;CHAT.msgs=all.filter(m=>m.creato&&m.c);chNew();schedule()})}
}
// chat visibili: tutti, il proprio reparto (i gestori vedono tutti i reparti), i messaggi diretti
const chPeople=()=>Object.values(D().staff).filter(u=>u.stato==='attivo');
function chMembers(c){const P=chPeople();if(c==='tutti')return P;if(c.startsWith('rep_'))return P.filter(u=>isMgr(u)||(u.reparto||'altro')===c.slice(4));if(c.startsWith('dm_'))return chDmIds(c).map(id=>D().staff[id]).filter(Boolean);return[]}
function chCan(c,me){if(c==='tutti')return true;if(c.startsWith('rep_'))return isMgr(me)||(me.reparto||'altro')===c.slice(4);if(c.startsWith('dm_'))return chDmIds(c).includes(me.id);return false}
function chInfo(c,me){
  if(c==='tutti'){const n=chPeople().length;return{n:'Tutto lo staff',s:n===1?'1 persona':n+' persone',g:'tutti'}}
  if(c.startsWith('rep_'))return{n:REPARTI[c.slice(4)]||c.slice(4),s:chMembers(c).map(u=>u.nome).join(', '),g:c.slice(4)};
  const o=D().staff[chDmIds(c).find(id=>id!==me.id)]||{nome:'Profilo eliminato'};return{n:fullName(o),s:isMgr(o)?RUOLI[o.ruolo]:[o.mansione,REPARTI[o.reparto]].filter(Boolean).join(', '),u:o};
}
const chAll=()=>CHAT.old.length?CHAT.msgs.concat(CHAT.old.filter(o=>!CHAT.msgs.some(m=>m.id===o.id))):CHAT.msgs;
const chRead=(me,c)=>((CHAT.letti[me.id]||{})[c])||0;
function chList(me){
  const by=new Map();for(const m of chAll())if(chCan(m.c,me)){const x=by.get(m.c);if(!x||m.creato>x.creato)by.set(m.c,m)}
  const base=['tutti'].concat(isMgr(me)?Object.keys(REPARTI).map(r=>'rep_'+r).filter(c=>chMembers(c).length>1):['rep_'+(me.reparto||'altro')]);
  const cs=[...new Set(base.concat([...by.keys()]))];
  return cs.map(c=>({c,last:by.get(c),un:chAll().filter(m=>m.c===c&&m.da!==me.id&&m.creato>chRead(me,c)).length})).sort((a,b)=>((b.last||{}).creato||0)-((a.last||{}).creato||0));
}
const chUnread=me=>me?chList(me).reduce((s,x)=>s+x.un,0):0;
// avviso in app per i messaggi nuovi di altri (non quando la chat è aperta proprio lì)
function chNew(){
  const me=realU();if(!me)return;const ids=new Set(CHAT.msgs.map(m=>m.id));
  if(CHAT.seen){for(const m of CHAT.msgs)if(!CHAT.seen.has(m.id)&&m.da!==me.id&&chCan(m.c,me)&&now()-m.creato<120000&&!(S.chat&&S.chat.c===m.c&&!document.hidden)){
    const u=D().staff[m.da]||{nome:'?'};toast(u.nome+(m.c.startsWith('dm_')?'':' · '+chInfo(m.c,me).n)+': '+m.t.slice(0,80));try{navigator.vibrate&&navigator.vibrate(40)}catch(e){}}}
  CHAT.seen=ids;
}
async function chSend(){
  const C=S.chat,me=realU();if(!C||!C.c||!me)return;const el=$('#ch-ta');const t=String(el?el.value:C.draft[C.c]||'').trim();if(!t)return;
  if(t.length>2000)return toast('Messaggio troppo lungo.','warn');
  const d={c:C.c,da:me.id,t,creato:now()};C.draft[C.c]='';if(el){el.value='';el.style.height=''}C.stick=true;
  if(chFb())netWatch(chCol().add(d)).catch(e=>toast(e&&e.code==='permission-denied'?'La chat non è ancora attiva sul database.':'Messaggio non inviato: riprova.','err'));
  else await put('messaggi',uid(),d);
  chMarkRead(C.c,d.creato);chPush(C.c,me,t);
}
function chPush(c,me,t){const to=chMembers(c).filter(u=>u.id!==me.id).map(u=>u.id),info=chInfo(c,me);
  if(to.length)pushSend(to,me.nome+(c.startsWith('dm_')?'':' · '+info.n),t.slice(0,140))}

/* ---- foto e vocali: il file va nel Worker (database D1, in base64), nel messaggio restano tipo, id e anteprima.
   {tipo:'foto', m, w, h, mini} | {tipo:'audio', m, dur}; «t» resta un testo («📷 Foto») per le liste, gli avvisi e le versioni vecchie.
   I file scaricati restano nella cache «jona-allegati» del telefono (il service worker non la cancella). */
const ALG={ok:null,p:null,url:{},load:{},gone:{},pl:null,sp:null,io:null,au:null,auOk:0};
const algOn=()=>chFb()&&ALG.ok===true;
function algCheck(){if(ALG.ok!==null||ALG.p||!chFb())return;
  ALG.p=fetch(PUSH_URL+'/salute').then(r=>r.json()).then(j=>{ALG.ok=!!j.allegati;chPaint(true)}).catch(()=>{}).finally(()=>{ALG.p=null})}
async function algTok(){try{return await fbInit().auth.currentUser.getIdToken()}catch(e){return''}}
const algB64=blob=>new Promise((ok,ko)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]||'');r.onerror=()=>ko(r.error);r.readAsDataURL(blob)});
async function algUp(blob){
  const r=await fetch(PUSH_URL+'/allegati',{method:'POST',headers:{'content-type':'text/plain','x-tipo':blob.type.split(';')[0],authorization:'Bearer '+await algTok()},body:await algB64(blob)});
  const j=await r.json().catch(()=>({}));if(!r.ok||!j.id)throw Object.assign(new Error(j.errore||'errore'),{status:r.status});return j.id}
function algGet(id){
  if(ALG.url[id])return Promise.resolve(ALG.url[id]);
  return ALG.load[id]||(ALG.load[id]=(async()=>{const key=PUSH_URL+'/allegati/'+id;let c=null,res=null;
    try{c=await caches.open('jona-allegati');res=await c.match(key)}catch(e){}
    if(!res){const r=await fetch(key,{headers:{authorization:'Bearer '+await algTok()}});
      if(r.status===404){ALG.gone[id]=1;throw Object.assign(new Error('via'),{gone:1})}if(!r.ok)throw new Error('errore '+r.status);
      const bin=atob(await r.text()),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
      res=new Response(new Blob([u],{type:r.headers.get('x-tipo')||''}));
      if(c)try{await c.put(key,res.clone());const ks=await c.keys();for(const k of ks.slice(0,Math.max(0,ks.length-400)))await c.delete(k)}catch(e){}}
    return ALG.url[id]=URL.createObjectURL(await res.blob())})().finally(()=>{delete ALG.load[id]}))}
async function algSpace(){try{const r=await fetch(PUSH_URL+'/allegati/spazio',{headers:{authorization:'Bearer '+await algTok()}});if(r.ok){ALG.sp=await r.json();chPaint(true)}}catch(e){}}
const algMB=b=>b>=1e9?(b/1e9).toFixed(1).replace('.',',')+' GB':Math.round(b/1e6)+' MB';
// foto: lato lungo 1280 px (WebP 0,7, o JPEG dove il WebP non c'è), anteprima 40 px dentro il messaggio
async function algImg(file){
  const im=await loadImg(file),W=im.naturalWidth||im.width,H=im.naturalHeight||im.height;
  const cv=m=>{const k=Math.min(1,m/Math.max(W,H)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(W*k));c.height=Math.max(1,Math.round(H*k));c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c};
  const big=cv(1280);let blob=await new Promise(r=>big.toBlob(r,'image/webp',.7));
  if(!blob||blob.type!=='image/webp')blob=await new Promise(r=>big.toBlob(r,'image/jpeg',.72));
  return{blob,w:big.width,h:big.height,mini:cv(40).toDataURL('image/jpeg',.5)}}
async function chFile(tipo,blob,x){
  const me=realU();if(!x.c||!me||!blob)return;
  if(blob.size>1.3e6)return toast(tipo==='foto'?'Foto troppo grande.':'Vocale troppo lungo.','warn');
  CHAT.up=(CHAT.up||0)+1;chPaint(true);
  try{const id=await algUp(blob);ALG.url[id]=URL.createObjectURL(blob);
    const t=tipo==='foto'?'📷 Foto':'🎤 Messaggio vocale ('+chDur(x.dur)+')';
    const d=Object.assign({c:x.c,da:me.id,t,creato:now(),tipo,m:id},tipo==='foto'?{w:x.w,h:x.h,mini:x.mini}:Object.assign({dur:x.dur},x.wf?{wf:x.wf}:{}));
    if(S.chat)S.chat.stick=true;
    netWatch(chCol().add(d)).catch(e=>toast('Messaggio non inviato: riprova.','err'));

      <div class="cht-r"><span>${l?(l.da===me.id?'Tu: ':!x.c.startsWith('dm_')&&w?esc(w.nome)+': ':'')+esc(l.t):`<i>${esc(i.s)}</i>`}</span>${x.un?`<em>${x.un>99?'99+':x.un}</em>`:''}</div></div></button>`}).join('')}

  const i=chInfo(C.c,me);const fresh=set('.cht-c',`<header class="cht-h cht-ch"><button type="button" class="icon-btn" data-a="chBack" aria-label="Torna alla lista">${ic('back')}</button>${chAv(i,40)}<div class="cht-ct"><b>${esc(i.n)}</b><span>${esc(i.s)}</span></div></header>

  if(fresh){const ta=$('#ch-ta');if(ta){ta.value=C.draft[C.c]||'';ta.parentNode.classList.toggle('has-t',!!ta.value.trim())}}
  const ms=chAll().filter(m=>m.c===C.c).sort((a,b)=>a.creato-b.creato),other=C.c.startsWith('dm_')?chDmIds(C.c).find(id=>id!==me.id):null;
  const oRead=other?((CHAT.letti[other]||{})[C.c]||0):0;let h=ms.length>=20&&!(C.noMore&&C.noMore[C.c])?`<button type="button" class="cht-more" data-a="chMore">Messaggi precedenti</button>`:'',day='',prev=null;

  for(const m of ms){const dd=chDay(m.creato);if(dd!==day){day=dd;h+=`<div class="cht-day"><span>${dd}</span></div>`;prev=null}
    const mine=m.da===me.id,u=D().staff[m.da]||{nome:'?'},first=!prev||prev.da!==m.da||m.creato-prev.creato>5*60000;
    const tick=mine?(m.pend?ic('clock','tk'):`<i class="tk${oRead>=m.creato?' rd':''}">${other?'✓✓':'✓'}</i>`):'';

  if(CHAT.up)h+=`<div class="cht-up" role="status">Invio in corso…</div>`;
  const box=B.querySelector('#ch-m');if(!box)return;const near=box.scrollHeight-box.scrollTop-box.clientHeight<90;
  if(fresh||CHAT.last['#ch-m']!==h){CHAT.last['#ch-m']=h;const top=box.scrollTop,hh=box.scrollHeight;box.innerHTML=h;chImgs(box);
    if(fresh||C.stick||near){box.scrollTop=box.scrollHeight;C.stick=false}else if(force)box.scrollTop=top+(box.scrollHeight-hh)
    chRbFix(box)}
  if(!document.hidden&&ms.length){const lastO=ms.filter(m=>m.da!==me.id).pop();if(lastO&&lastO.creato>chRead(me,C.c))chMarkRead(C.c,lastO.creato)}
  if(fresh){const ta=$('#ch-ta');if(ta&&matchMedia('(min-width:760px)').matches)ta.focus({preventScroll:true})}
}

const NEWS_DEV=[['aggiunte','Aggiunte'],['correzioni','Correzioni'],['risolti','Problemi risolti'],['noti','Problemi noti']];
function newsFor(me){const lv=isDev(me)?2:isGM(me)?1:0;return NEWS.map(n=>{const it=(n.tutti||[]).concat(lv>=1&&n.chef||[]);const d=lv>=2&&n.dev||{};return{v:n.v,data:n.data,titolo:n.titolo,it,tech:NEWS_DEV.filter(([k])=>d[k]&&d[k].length).map(([k,l])=>[l,d[k]])}}).filter(n=>n.it.length||n.tech.length)}
function newsSeen(){const u=realU();if(!u)return APP_VER;const k='jona_news_'+u.id;const v=ls(k);if(typeof v==='number')return v;ls(k,APP_VER-1);return APP_VER-1}
const newsCount=me=>{const s=newsSeen();return newsFor(me).filter(n=>n.v>s).length};
const newsBtn=me=>{const n=newsCount(me);return`<button type="button" class="news-btn" data-a="news" aria-label="Novità${n?', '+n+' da vedere':''}">${ic('sparkle')}<span class="news-l">Novità</span>${n?`<span class="news-n">${n>9?'9+':n}</span>`:''}</button>`};
const newsDay=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('it-IT',{day:'numeric',month:'long',year:'numeric'})};
const newsTx=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>');
function newsSheet(){
  const me=meU(),u=realU(),seen=newsSeen(),list=newsFor(me);
  if(u)ls('jona_news_'+u.id,APP_VER);
  openSheet({cls:'tall',render:()=>`<div class="grab"></div><div class="sh-h"><div class="sh-t">Novità</div><button type="button" class="icon-btn" data-a="closeSheet" aria-label="Chiudi">${ic('x')}</button></div>
  <p class="muted" style="margin-top:0">Cosa è cambiato nell'app, dalla versione più nuova.</p>
  ${list.map(n=>`<section class="news-v"><div class="news-h"><span class="news-vn">Beta v${n.v}</span><span class="news-d">${newsDay(n.data)}</span>${n.v>seen?'<span class="news-new">nuova</span>':''}</div><h3 class="news-t">${esc(n.titolo)}</h3>
  ${n.it.length?`<ul class="news-ul">${n.it.map(x=>`<li>${newsTx(x)}</li>`).join('')}</ul>`:''}${n.tech.length?`<div class="news-dev">${n.tech.map(([l,a])=>`<h4>${l}</h4><ul>${a.map(x=>`<li>${newsTx(x)}</li>`).join('')}</ul>`).join('')}</div>`:''}</section>`).join('')||'<p class="muted">Nessuna novità.</p>'}`});
  render();
}

/* QR da cucina (v35): codice d'invito che non scade (Worker /inviti con fisso), in config/app.qrFisso {c, creato};
   chi lo inquadra chiede di entrare e i gestori lo approvano in Staff (avviso con /richiesta) */
function qfRow(){const q=cfg().qrFisso;return`<div class="setrow"><div><b>QR da cucina</b><span>${q&&q.c?'Codice '+esc(q.c)+': non scade. Chi lo inquadra chiede di entrare e voi lo approvate in Staff':'Un QR da stampare e appendere: non scade, chi lo inquadra chiede di entrare e voi lo approvate'}</span></div>
  <div class="btns">${q&&q.c?`<button type="button" class="btn primary sm" data-a="qfCard">${ic('qr')} Stampa o condividi</button><button type="button" class="btn ghost sm" data-a="qfNew" data-v="1">Cambia QR</button>`:`<button type="button" class="btn primary sm" data-a="qfNew" data-v="">${ic('qr')} Crea il QR</button>`}</div></div>`}
async function qfNew(cambia){const q=cfg().qrFisso;
  if(cambia&&!await ask('Cambiare il QR da cucina?','Il QR appeso smette di funzionare: dovrai stampare quello nuovo. Chi è già entrato non deve fare niente.','Cambia'))return;
  if(!navigator.onLine)return toast('Serve la connessione per creare il QR.','warn');
  try{const r=await fetch(PUSH_URL+'/inviti',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+await algTok()},body:JSON.stringify({fisso:true,vecchio:q&&q.c||''})});const j=await r.json().catch(()=>({}));
    if(!r.ok||!/^[A-HJ-NP-Z2-9]{6}$/.test(j.codice||''))throw new Error('inviti '+r.status);
    await put('config','app',Object.assign({},cfg(),{qrFisso:{c:j.codice,creato:now()}}));toast(cambia?'QR cambiato: stampa quello nuovo':'QR da cucina pronto');await qfCard(j.codice)}
  catch(e){toast('Non riesco a creare il QR: controlla la connessione e riprova.','err')}}
/* entrata libera (v40): pubblico/porta {fino} aperta 48 ore da un gestore; nel frattempo i telefoni nuovi entrano senza approvazione */
const PT={fino:0,t:0,busy:false};
async function ptLoad(){PT.busy=true;try{PT.fino=await S.db.phone.portaGet();PT.t=now()}catch(e){PT.t=now()}PT.busy=false;schedule()}
function ptRow(){if(!PT.busy&&now()-PT.t>60000)ptLoad();const on=PT.fino>now();
  return`<div class="setrow"><div><b>Entrata libera</b><span>${on?'Aperta fino a '+esc(new Date(PT.fino).toLocaleString('it-IT',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}))+': chi inquadra il QR o apre un invito entra subito, senza approvazione':'Chiusa: ogni telefono nuovo va approvato in Staff. Aprila quando arriva tanto personale nuovo'}</span></div>
  <div class="btns">${on?`<button type="button" class="btn ghost sm" data-a="ptSet" data-v="0">Chiudi ora</button>`:`<button type="button" class="btn primary sm" data-a="ptSet" data-v="48">Apri per 48 ore</button>`}</div></div>`}
async function ptSet(h){
  if(h&&!await ask('Aprire l\'entrata libera per 48 ore?','Chi ha il QR della cucina o un invito entra subito, senza la vostra approvazione. Dopo 48 ore si richiude da sola.','Apri'))return;
  if(!navigator.onLine)return toast('Serve la connessione.','warn');
  const fino=h?now()+h*3600000:0;
  try{await fbTmo(S.db.phone.porta(fino),15000);PT.fino=fino;PT.t=now();toast(h?'Entrata libera aperta per 48 ore':'Entrata libera chiusa');schedule()}
  catch(e){toast(e&&e.code==='permission-denied'?'Il database non lo permette ancora: aggiorna le regole (docs/FIREBASE.md).':'Non riuscito: controlla la connessione e riprova.','err')}}
async function qfCard(k){const q=cfg().qrFisso,c=k||q&&q.c;if(!c)return;try{await inviteCard({l:INV_URL+'/'+c,c})}catch(e){toast('Immagine del QR non riuscita: riprova.','err')}}

  if(!T.length)return sup?{onlySup:true,fornitore:sup}:null;
  let q=vQty(T,0);
  if(q)T=T.slice(q.end);
  else for(let i=1;i<T.length;i++){const r=vQty(T,i);if(r&&r.end===T.length){q=r;T=T.slice(0,i);break}}
  if(!sup&&q&&T.length>1){bare();clean()}
  while(T.length&&VART.has(T[0].n))T=T.slice(1);
  while(T.length&&(VART.has(T[T.length-1].n)||VMARK.has(T[T.length-1].n)||VTRAIL.has(T[T.length-1].n)))T=T.slice(0,-1);
  const toks=vSig(T.map(t=>t.n));
  if(!toks.length)return sup&&!q?{onlySup:true,fornitore:sup}:null;
  return{qta:q?q.q:null,unita:q?q.u:null,testo:T.map(t=>t.o).join(' ').replace(/' /g,"'"),toks,fornitore:sup,lead,detto};
}
// Testo detto → righe {qta,unita,testo,fornitore} (qta/unita null se non dette; fornitore = id o null).
function parseVoice(text,ctx){
  ctx=ctx||vCtx();const out=[];let lead=null,tail=null;
  for(const seg of vSegments(vTokens(text),ctx)){
    const L=vLine(seg,ctx);if(!L)continue;
    if(L.onlySup){lead=L.fornitore;tail=L.fornitore;continue}
    tail=null;if(L.lead)lead=L.fornitore;
    if(!L.fornitore&&lead)L.fornitore=lead;
    out.push(L);
  }
  if(tail)out.forEach(L=>{if(!L.fornitore)L.fornitore=tail});
  return out;
}
// Prodotto del catalogo per una riga: punteggio sulle parole dette (la prima conta doppio), poi preferenze come il "+" del catalogo.
function vMatch(L,ctx){
  const S0=L.toks;const list=[];if(!S0.length)return{best:null,list};
  const W=S0.map((w,i)=>i?1:2),WT=W.reduce((a,b)=>a+b,0);
  for(const x of ctx.ps){
    if(!x.t.length)continue;let cov=0;const hit=new Set();
    S0.forEach((w,i)=>{let b=0,bi=-1;x.t.forEach((y,j)=>{const s=vSim(w,y);if(s>b){b=s;bi=j}});cov+=W[i]*b;if(b>=.8)hit.add(bi)});
    cov/=WT;if(cov<=0)continue;
    let sc=.7*cov+.3*hit.size/x.t.length;
    if(vSim(S0[0],x.t[0])>=.8)sc+=.05;
    if(L.fornitore&&x.p.fornitoreId===L.fornitore)sc+=.15;
    list.push({p:x.p,cov,sc:r3(sc)});
  }
  list.sort((a,b)=>b.sc-a.sc||byNome(a.p,b.p));
  const top=list[0];if(!top||top.cov<.6)return{best:null,list};
  let best=top.p;
  if(!(L.fornitore&&best.fornitoreId===L.fornitore)){const k=gkey(best.nome);const grp=list.filter(c=>c.cov>=.6&&c.sc>=top.sc-.15&&gkey(c.p.nome)===k).map(c=>c.p);if(grp.length>1)best=defOpt(grp,usualOf(meU()),null)}
  return{best,list};
}
// Quantità per il prodotto scelto: kg/etti/grammi e litri si convertono; se l'unità detta non si converte va nella nota per lo chef.
function vSetP(r,p){
  const L=r.line;let q=L.qta==null?1:L.qta,u=L.unita,nota='';
  if(p){
    const pu=vPUnit(p.unita),q0=q,said=()=>fq(q0)+' '+vULab(u,q0);
    if(u&&u!==pu){const a=VFAM[u],b=VFAM[pu],sz=vSize(p.nome),c=sz&&VFAM[sz.u];
      if(a&&b&&a[0]===b[0])q=q*a[1]/b[1];
      else if((u==='pz'||pu==='pz')&&VSMALL.has(u)&&VSMALL.has(pu)){}
      else if(a&&!b&&c&&c[0]===a[0]){const x=q*a[1]/(sz.v*c[1]);q=Math.max(1,Math.round(x));if(Math.abs(x-q)>.001)nota=said()}
      else if(!a&&b&&c&&c[0]===b[0])q=q*sz.v*c[1]/b[1];
      else{nota=said();if(pu&&!b)q=a?1:Math.max(1,Math.round(q))}}
    Object.assign(r,{pid:p.id,nome:'',unita:p.unita||'',qta:r3(q),nota});
  }else{
    if(u==='hg'){q=q/10;u='kg'}
    const f=L.fornitore?forn(L.fornitore).nome:'';
    Object.assign(r,{pid:null,nome:vCap(L.testo)+(f?' (da '+f+')':''),unita:u?vULab(u,q):'pz',qta:r3(q),nota:''});
  }
  return r;
}
function vRows(text,ctx){
  ctx=ctx||vCtx();

    r.alts=m.list.filter(c=>c.cov>=.4&&c.p!==m.best).slice(0,5).map(c=>c.p.id);return r});
}

  const tid=e.target&&e.target.id;
  if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&(tid==='ch-ta'||tid==='jona-q')){e.preventDefault();guard(tid==='ch-ta'?chSend:()=>jonaAsk());return}
  if(e.key==='Escape'&&sheets.length){closeSheet();return}
  if(e.key==='Escape'&&CHAT.box){if(S.chat&&S.chat.c){S.chat.c=null;chPaint(true)}else chClose();return}
  if(e.key==='Enter'&&e.target&&e.target.closest&&e.target.closest('[data-form="login"]')){e.preventDefault();guard(doLogin)}
});

/* ---- indietro del telefono (gesto dal bordo o tasto): torna indietro di un passo dentro l'app invece di uscire.
   Finché c'è qualcosa da chiudere resta una voce in più nella cronologia («trap»): il gesto la toglie, «navBack» fa un passo
   e, se resta ancora qualcosa, la voce si rimette. Ordine: foto aperta, barra delle reazioni, conversazione → lista, chat,
   passo indietro dentro il foglio (sugBack/impBack), foglio, scheda precedente. */
const NAV={trap:false,skip:0,tabs:[]};
const navVis=el=>!!(el&&el.getClientRects().length);
const navCan=()=>!!(CHAT.box||sheets.length||NAV.tabs.length);
function navSync(){if(NAV.skip)return;const need=navCan();
  if(need&&!NAV.trap){try{history.pushState({jona:1},'');NAV.trap=true}catch(e){}}
  else if(!need&&NAV.trap){NAV.trap=false;NAV.skip=1;history.back()}}
function navBack(){
  if(CHAT.box){const v=CHAT.box.querySelector('.cht-view');if(v)return v.remove();
    if(CHAT.box.querySelector('.cht-rb'))return chReClose();
    if(S.chat&&S.chat.rec)return chRecStop(false);
    const b=CHAT.box.querySelector('[data-a="chBack"]');if(S.chat&&S.chat.c&&navVis(b))return b.click();
    return chClose()}
  const o=sheets[sheets.length-1];
  if(o){const b=[...o.el.querySelectorAll('[data-a="sugBack"],[data-a="impBack"]')].find(navVis);return b?b.click():closeSheet()}
  while(NAV.tabs.length){const t=NAV.tabs.pop();if(t&&t!==S.tab){S.tab=t;window.scrollTo(0,0);return render()}}}
addEventListener('popstate',()=>{if(NAV.skip){NAV.skip=0;return navSync()}NAV.trap=false;guard(navBack);navSync()});

/* ================= avvio ================= */
(()=>{const h=new URLSearchParams(location.hash.slice(1));const k=h.get('k'),c=h.get('i');if(!k&&!c)return;
  if(c&&/^[A-HJ-NP-Z2-9]{6}$/i.test(c))ls('jona_icode',c.toUpperCase());
  if(h.get('c')){try{ls('jona_fb',JSON.parse(atob(h.get('c'))))}catch(e){}}
  if(/^[A-Za-z0-9]{16,64}$/.test(k)&&ls('jona_key')!==k){ls('jona_key',k);ls('jona_member',null)}
  history.replaceState(null,'',location.pathname+location.search)})();
async function boot(){
  applyTheme();document.documentElement.classList.add('intro');setTimeout(()=>document.documentElement.classList.remove('intro'),4700);
  /* chi è già entrato vede l'apertura fino alla fine dell'animazione (4,4 s; un tocco la salta); niente con «riduci movimento» né nelle prove automatiche */
  if(ls('jona_me')&&!animOff()&&!navigator.webdriver){S.splash=true;const end=()=>{if(!S.splash)return;S.splash=false;removeEventListener('click',end,true);render()};addEventListener('click',end,true);setTimeout(end,4400)}
  $('#picker').addEventListener('change',()=>{const p=$('#picker');const fs=[...(p.files||[])];const cb=pickCb;pickCb=null;if(fs.length&&cb)guard(()=>cb(fs))});
  render();
  const icod=ls('jona_icode');if(icod){ls('jona_icode',null);try{const k=await invRedeem(icod);if(ls('jona_key')!==k){ls('jona_key',k);ls('jona_member',null)}}catch(e){S.joinK=icod;toast(e.message==='scaduto'?'Codice d\'invito scaduto: chiedi allo chef un invito nuovo.':'Non riesco a leggere il codice: controlla la rete e tocca «Collega».','warn')}}
  const key=ls('jona_key');
  if(fbCfg()&&key){try{await need('firebase');S.db=FirebaseStore(key);render()}catch(e){S.fbLibErr=true;render();return}}
  else S.db=LocalStore;
  try{await seedIfEmpty()}catch(e){toast(errMsg(e),'err')}
  if(S.db.kind==='locale'&&fbCfg())fbPublic().then(a=>{S.fbActive=a;schedule()});
  Object.keys(COLS).forEach(subscribe);
  regRestore();
  setTimeout(()=>{if(!allLoaded()){S.loadTimeout=true;render()}},5000);
}
boot();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
  // versione nuova pubblicata mentre l'app era aperta: il service worker nuovo prende il posto del vecchio → avviso «App da aggiornare»
  const had=!!navigator.serviceWorker.controller;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had)updOn()});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)navigator.serviceWorker.getRegistration().then(r=>r&&r.update()).catch(()=>{})})}
</script>
