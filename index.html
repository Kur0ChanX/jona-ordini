const stepsHint=()=>`<ol class="steps3" aria-label="Come si fa"><li><b>1</b>Cerca</li><li><b>2</b>Premi +</li><li><b>3</b>Invia allo chef</li></ol>`;
function catSearch(cats){
  return`<div class="search">${ic('search')}<input id="q" type="search" placeholder="${isMgr(meU())?'Prodotto, codice o fornitore':'Cerca un prodotto, es. zucchero'}" value="${esc(S.q)}" data-in="q" autocomplete="off" enterkeyhint="search"><button type="button" class="icon-btn" data-a="qclear" aria-label="Svuota ricerca">${ic('x')}</button></div>
  ${cats.length?`<div class="chips" role="group" aria-label="Categorie"><button type="button" class="chip" aria-pressed="${!S.cat}" data-a="cat" data-v="">Tutte</button>${cats.map(c=>`<button type="button" class="chip" aria-pressed="${S.cat===c}" data-a="cat" data-v="${esc(c)}">${esc(c)}</button>`).join('')}</div>`:''}`;
}
// Quante volte l'utente ha chiesto ogni prodotto (una volta per richiesta) e quando l'ultima volta.
function usualOf(me){const m=new Map();for(const r of Object.values(D().richieste)){if(r.utenteId!==me.id)continue;const seen=new Set();for(const it of r.items||[]){if(!it.pid||seen.has(it.pid))continue;seen.add(it.pid);const x=m.get(it.pid)||{n:0,t:0};x.n++;x.t=Math.max(x.t,r.creato||0);m.set(it.pid,x)}}return m}
function catResults(){
  const me=meU();const sp=showPrices();const q=norm(S.q);const toks=q?q.split(' '):[];
  const U=usualOf(me);let list=prods();let title='',keep=false;
  if(toks.length)list=list.filter(p=>{const h=norm(p.nome+' '+(p.codice||'')+' '+forn(p.fornitoreId).nome+' '+(p.categoria||''));return toks.every(t=>h.includes(t))});
  if(S.cat)list=list.filter(p=>(p.categoria||'Altro')===S.cat);
  const hit=new Set(list.map(p=>p.id));
  if(!toks.length&&!S.cat){
    const rec=[...U.entries()].filter(([pid])=>D().prodotti[pid]).sort((a,b)=>b[1].n-a[1].n||b[1].t-a[1].t).slice(0,12).map(([pid])=>D().prodotti[pid]);
    if(rec.length){list=rec;title='I tuoi soliti';keep=true}else{list=list.slice().sort(byNome).slice(0,40);title='Tutti i prodotti'}
  }
  const groups=new Map();
  for(const p of list){const k=gkey(p.nome);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(p)}
  if(toks.length||S.cat){for(const [k,arr] of groups){for(const p of S.gidx.get(k)||[])if(!arr.includes(p))arr.push(p)}}
  let arr=[...groups.values()];if(!keep)arr.sort((a,b)=>byNome(a[0],b[0]));arr=arr.slice(0,80);
  let html='';
  if(title)html+=`<h2 class="sec">${title}</h2>`;
  if(arr.length)html+=`<div class="panel">${arr.map(g=>isMgr(me)?groupHTML(g,sp):staffGroup(g,U,hit)).join('')}${toks.length?freeRow():''}</div>`;
  else if(toks.length)html+=`<div class="panel">${freeRow(true)}</div>`;
  return html;
}
// Staff: l'opzione che aggiunge il "+": quella già nel carrello, altrimenti (tra quelle che corrispondono alla ricerca)
// la più economica se ci sono i prezzi, poi quella che l'utente ha chiesto più spesso, poi la prima.
function defOpt(items,U,hit){
  const c=items.find(p=>cartQty(p.id));if(c)return c;
  const pool=items.some(p=>hit&&hit.has(p.id))?items.filter(p=>hit.has(p.id)):items;
  const pr=pool.filter(p=>p.prezzo!=null).sort((a,b)=>a.prezzo-b.prezzo);if(pr.length)return pr[0];
  let b=null;for(const p of pool){const x=U.get(p.id);if(x&&(!b||x.n>U.get(b.id).n))b=p}
  return b||pool[0];
}
// Staff: una riga per prodotto, senza scelta del fornitore (lo chef può cambiarlo quando approva).
function staffGroup(items,U,hit){
  const p=defOpt(items,U,hit);const q=cartQty(p.id);
  const title=items.map(x=>x.nome).sort((a,b)=>a.length-b.length)[0];
  return`<div class="pg one"><div class="opt"><div class="opt-i"><div class="pg-t">${esc(title)}</div>${p.nome!==title?`<div class="opt-n">${esc(p.nome)}</div>`:''}<div class="pg-c">${esc(p.categoria||'Altro')}${p.unita?' · '+esc(p.unita):''}</div></div>
  ${q?stepper('c',p.id,q,`data-p="${p.id}"`):`<button type="button" class="add" data-a="cadd" data-p="${p.id}" aria-label="Aggiungi ${esc(title)}">${ic('plus')}</button>`}</div></div>`;
}
function groupHTML(items,sp){
  items=items.slice().sort((a,b)=>(a.prezzo??1e9)-(b.prezzo??1e9));
  const multi=new Set(items.map(p=>p.fornitoreId)).size>1;
  const title=multi?items.map(p=>p.nome).sort((a,b)=>a.length-b.length)[0]:items[0].nome;
  const best=multi&&sp&&items[0].prezzo!=null?items[0].id:null;
  return`<div class="pg"><div class="pg-t">${esc(title)}</div><div class="pg-c">${esc(items[0].categoria||'Altro')}${multi?`, da ${new Set(items.map(p=>p.fornitoreId)).size} fornitori`:''}</div>
  ${items.map(p=>{const q=cartQty(p.id);return`<div class="opt"><div class="opt-i"><span class="sup" style="--c:${fcolor(p.fornitoreId)}"><i></i>${esc(forn(p.fornitoreId).nome)}</span>${p.id===best?' <span class="tag best">più conveniente</span>':''}${p.demo?' <span class="tag">demo</span>':''}
  ${multi&&p.nome!==title?`<div class="opt-n">${esc(p.nome)}</div>`:''}
  <div class="opt-m">${p.codice?`<span>cod. ${esc(p.codice)}</span>`:''}${sp&&p.prezzo!=null?`<span><b>${eur(p.prezzo)}</b>${p.unita?' / '+esc(p.unita):''}</span>`:(p.unita?`<span>${esc(p.unita)}</span>`:'')}</div></div>
  ${q?stepper('c',p.id,q,`data-p="${p.id}"`):`<button type="button" class="add" data-a="cadd" data-p="${p.id}" aria-label="Aggiungi ${esc(p.nome)}">${ic('plus')}</button>`}</div>`}).join('')}</div>`;
}
function freeRow(alone){return`<div class="free" ${alone?'style="border-top:0"':''}>${ic('paste')}<div>${alone?'Nessun prodotto trovato.':'Non è quello giusto?'} Puoi chiedere «${esc(S.q.trim())}» allo chef, sceglierà lui il fornitore.</div><button type="button" class="btn ghost sm" data-a="cfree">Chiedi</button></div>`}

/* ================= staff: carrello ================= */
function cartLines(){return S.cart.map(c=>c.libero?Object.assign({},c,{fid:''}):Object.assign({},c,{p:D().prodotti[c.pid],fid:(D().prodotti[c.pid]||{}).fornitoreId})).filter(x=>x.libero||x.p)}
function vCarrello(me){
  const lines=cartLines();const sp=showPrices();
  if(!lines.length)return`<h1 class="vt">Carrello</h1>`+empty('cart','Il carrello è vuoto','Cerca i prodotti che servono in cucina o in sala e aggiungili qui.',`<button type="button" class="btn primary" data-a="tab" data-v="catalogo">${ic('search')} Vai al catalogo</button>`);
  const g=new Map();for(const l of lines){if(!g.has(l.fid))g.set(l.fid,[]);g.get(l.fid).push(l)}
  let tot=0;for(const l of lines)if(l.p&&l.p.prezzo!=null)tot+=l.p.prezzo*l.qta;
  const nf=[...g.keys()].filter(Boolean).length;const staff=!isMgr(me);
  const lineH=l=>`<div class="line wrap${staff?' big':''}"><div class="ln-i"><div class="ln-n">${esc(l.libero?l.nome:l.p.nome)}${l.libero&&staff?' <span class="tag">fuori listino</span>':''}</div>${l.libero?`<input class="inp unit-inp" id="cu-${l.pid}" value="${esc(l.unita||'')}" placeholder="unità" data-ch="cunit" data-p="${l.pid}" aria-label="Unità">`:`<div class="ln-m">${l.p.codice&&!staff?'cod. '+esc(l.p.codice):''}${sp&&l.p.prezzo!=null?` ${eur(l.p.prezzo)}${l.p.unita?' / '+esc(l.p.unita):''}`:(l.p.unita?' '+esc(l.p.unita):'')}</div>`}</div>
  ${stepper('c',l.pid,l.qta,`data-p="${l.pid}"`)}<button type="button" class="icon-btn" data-a="crm" data-p="${l.pid}" aria-label="Rimuovi">${ic('trash')}</button>
  <div class="ln-x"><button type="button" class="urg-b${l.urg?' on':''}" data-a="curg" data-p="${l.pid}" aria-pressed="${!!l.urg}">${ic('warn')} ${l.urg?'Urgente ✓':'È urgente'}</button></div></div>`;
  const nu=lines.filter(l=>l.urg).length;
  return`<h1 class="vt">Carrello</h1><p class="vsub">${lines.length} ${lines.length===1?'articolo':'articoli'}${nf&&!staff?` da ${nf} ${nf===1?'fornitore':'fornitori'}`:''}. ${staff?'Controlla le quantità e premi «Invia allo chef».':'Controlla le quantità e invia allo chef.'} Se un prodotto serve subito tocca «È urgente».</p>
  ${nu?`<div class="banner dup" role="note">${ic('warn')}<div><b>${nu===1?'1 prodotto urgente':nu+' prodotti urgenti'}.</b> Maurizio riceve un avviso importante e li vede in cima.</div></div>`:''}
  <div class="panel">${staff?`<div class="fsec">${lines.map(lineH).join('')}</div>`:[...g.entries()].map(([fid,ls])=>`<div class="fsec"><div class="fsec-h"><span class="sup" style="--c:${fcolor(fid)}"><i></i>${fid?esc(forn(fid).nome):'Fuori listino, lo assegna lo chef'}</span><span class="muted small">${ls.length}</span></div>
  ${ls.map(lineH).join('')}</div>`).join('')}
  ${sp&&tot?`<div class="total"><span>Totale stimato</span><b>${eur(tot)}</b></div>`:''}</div>
  <label class="lbl" for="cart-note">Nota per lo chef</label><textarea id="cart-note" class="inp" rows="2" placeholder="Es. serve per il servizio di stasera" data-in="cnote">${esc(S.cnote)}</textarea>
  <div class="cart-foot" style="margin-top:16px"><button type="button" class="btn primary block big" data-a="csend">${ic('send')} Invia allo chef</button></div>`;
}
async function sendCart(){
  const me=meU();const lines=cartLines();if(!lines.length)return;animPrefetch();
  const items=lines.map(l=>l.libero?{libero:true,nome:l.nome,qta:l.qta,unita:l.unita||'pz',fornitoreId:'',fornitoreNome:'',codice:'',prezzo:null}
    :{pid:l.p.id,nome:l.p.nome,codice:l.p.codice||'',unita:l.p.unita||'',prezzo:l.p.prezzo??null,fornitoreId:l.p.fornitoreId,fornitoreNome:forn(l.p.fornitoreId).nome,qta:l.qta});
  lines.forEach((l,i)=>{if(l.urg)items[i].urgente=true});
  const dup=findDoppi(items,me);
  if(dup.length){
    const L=dup.slice(0,5).map(d=>`${d.nome}: chiesto da ${d.self?'te':firstName(d.da)} ${quandoAlle(d.quando)} (${d.st})`);if(dup.length>5)L.push('…e altri '+(dup.length-5));
    if(!await ask('Attenzione: già richiesto',L.join('\n')+'\n\nÈ corretto inviarlo di nuovo?','Sì, invia lo stesso'))return;
  }
  const id=uid();const nf=new Set(items.map(i=>i.fornitoreId).filter(Boolean)).size;
  const doc={utenteId:me.id,utenteNome:fullName(me),reparto:me.reparto||'altro',mansione:me.mansione||'',items,nota:S.cnote.trim(),stato:'inviata',creato:now()};
  if(dup.length)doc.doppi=dup.map(d=>({nome:d.nome,da:d.da,quando:d.quando}));
  await put('richieste',id,doc);
  const urg=items.filter(i=>i.urgente);
  if(urg.length)await notify('gm','URGENTE: '+me.nome+' chiede '+urg.map(i=>i.nome).slice(0,3).join(', ')+(urg.length>3?'…':''),`${urg.length===1?'Serve subito':urg.length+' prodotti servono subito'}. Richiesta di ${items.length} ${items.length===1?'articolo':'articoli'}${dup.length?' (possibile doppione)':''}`,'urgente',id);
  else await notify('gm','Nuova richiesta da '+me.nome,`${REPARTI[me.reparto]||''}, ${items.length} ${items.length===1?'articolo':'articoli'}${nf?' da '+nf+(nf===1?' fornitore':' fornitori'):''}${dup.length?' (possibile doppione)':''}`,'richiesta',id);
  S.cart=[];saveCart();S.cnote='';S.tab='miei';render();window.scrollTo(0,0);
  await sendAnim();
  openSheet({render:()=>`<div class="grab"></div><div class="done">${ic('check','big')}<h2>Inviato allo chef</h2><p class="muted">Riceverai una notifica quando approva o rifiuta la richiesta.</p><div class="btns col"><button type="button" class="btn primary block" data-a="logout">${ic('logout')} Esci dal profilo</button><button type="button" class="btn ghost block" data-a="closeSheet">Continua</button></div></div>`});
}

// Richieste delle ultime 24 ore (non rifiutate, di chiunque) con lo stesso prodotto: stesso pid o un'alternativa
// dello stesso gruppo (lo chef può aver cambiato fornitore), oppure stesso nome per i prodotti scritti a mano.
function findDoppi(items,me){
  const since=now()-864e5,out=[],seen=new Set();
  const rs=Object.values(D().richieste).filter(r=>(r.creato||0)>=since&&r.stato!=='rifiutata').sort((a,b)=>b.creato-a.creato);
  for(const x of items){
    const p=x.pid&&D().prodotti[x.pid];const ids=new Set(p?(S.gidx.get(gkey(p.nome))||[]).map(q=>q.id):[]);if(x.pid)ids.add(x.pid);const nn=norm(x.nome);
    for(const r of rs){if(seen.has(nn+'|'+r.id))continue;
      if((r.items||[]).some(it=>(it.pid&&ids.has(it.pid))||norm(it.nome)===nn)){seen.add(nn+'|'+r.id);out.push({nome:x.nome,da:r.utenteNome||'',self:r.utenteId===me.id,quando:r.creato,st:reqStatus(r)[1].toLowerCase()})}}
  }
  return out;
}
function quandoAlle(t){const d=new Date(t),td=new Date(),y=new Date(td);y.setDate(td.getDate()-1);const hm=d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});return(d.toDateString()===td.toDateString()?'oggi':d.toDateString()===y.toDateString()?'ieri':d.toLocaleDateString('it-IT',{day:'numeric',month:'short'}))+' alle '+hm}

/* ================= requests readonly ================= */
function reqStatus(r){
  if(r.stato==='inviata')return['wait','In attesa'];
  if(r.stato==='rifiutata')return['ko','Rifiutata'];
  const fs=[...new Set((r.items||[]).map(i=>i.fornitoreId).filter(Boolean))];const done=fs.filter(f=>r.ordinati&&r.ordinati[f]).length;
  const arr=fs.filter(f=>r.arrivati&&r.arrivati[f]).length;
  if(fs.length&&arr===fs.length)return['ok','Arrivata'];
  if(fs.length&&done===fs.length)return['sent','Ordinata'];
  if(done)return['sent','Ordinata in parte'];
  return['ok',r.modificata?'Approvata con modifiche':'Approvata'];
}
function groupByF(items){const g=new Map();for(const it of items){const k=it.fornitoreId||'';if(!g.has(k))g.set(k,[]);g.get(k).push(it)}return[...g.entries()]}
function itemsRO(r){
  return groupByF(r.items||[]).map(([fid,its])=>`<div class="fsec"><div class="fsec-h"><span class="sup" style="--c:${fcolor(fid)}"><i></i>${fid?esc(forn(fid).nome||its[0].fornitoreNome):'Da assegnare'}</span>${r.ordinati&&r.ordinati[fid]?`<span class="muted small">ordinato ${ago(r.ordinati[fid])}</span>`:''}</div>
  ${its.map(it=>`<div class="line"><div class="ln-i"><div class="ln-n">${esc(it.nome)}${it.urgente?' <span class="tag urg">urgente</span>':''}</div><div class="ln-m">${it.codice?'cod. '+esc(it.codice)+' ':''}${it.aggiunto?'<span class="was">aggiunto dallo chef</span>':it.qtaOrig!=null&&it.qtaOrig!==it.qta?`<span class="was">chiesti ${fq(it.qtaOrig)}, lo chef ha messo ${fq(it.qta)}</span>`:''}</div></div><b>${fq(it.qta)}</b><span class="ln-u">${esc(it.unita||'')}</span></div>`).join('')}</div>`).join('')
  +((r.rimossi&&r.rimossi.length)?`<p class="removed">Tolti dallo chef: ${esc(r.rimossi.map(x=>x.nome).join(', '))}</p>`:'');
}
function reqSummary(r,who,dec){
  const [k,l]=reqStatus(r);const u=D().staff[r.utenteId]||{id:r.utenteId,nome:r.utenteNome};const n=(r.items||[]).length;
  const dd=dec&&D().staff[r.decisoDa],hm=dec?new Date(r.deciso).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}):'';
  const meta=dec?`alle ${hm}${dd?' da '+esc(dd.nome):''}${r.reparto?', '+esc(REPARTI[r.reparto]||''):''}`:`${ago(r.creato)}${who?', '+esc(REPARTI[r.reparto]||''):''}`;
  return`<details class="rs"><summary><div class="rs-i">${who?avatar(u,38):''}<div><div class="rs-t">${who?esc(r.utenteNome)+', ':''}${n} ${n===1?'articolo':'articoli'}</div><div class="rs-m">${meta}</div></div></div>${pill(k,l)}</summary>
  <div class="rs-b">${dec?`<p class="muted small" style="margin:0 0 6px">Inviata ${esc(ago(r.creato))}</p>`:''}${r.notaGM?`<p class="gm-note"><b>Chef:</b> ${esc(r.notaGM)}</p>`:''}${r.nota?`<p class="muted small" style="margin:0 0 6px">Nota: ${esc(r.nota)}</p>`:''}${itemsRO(r)}</div></details>`;
}
function vMiei(me){
  const rs=Object.values(D().richieste).filter(r=>r.utenteId===me.id).sort((a,b)=>b.creato-a.creato);
  if(!rs.length)return`<h1 class="vt">I miei ordini</h1>`+empty('clock','Nessuna richiesta ancora','Le richieste che invii allo chef compaiono qui, con lo stato aggiornato.');
  const open=rs.filter(r=>r.stato==='inviata').length;
  return`<h1 class="vt">I miei ordini</h1><p class="vsub">${open?open+' in attesa dello chef':'Tutte le richieste sono state gestite'}</p><div class="panel">${rs.slice(0,60).map(r=>reqSummary(r,false)).join('')}</div>`;
}
</script>
<script>
/* ================= animazioni dell'invio =================
   media/invio-chef.mp4 (lo staff invia allo chef: la ragazza porge il menù) e media/invio-fornitore.mp4
   (ordine inviato al fornitore: lo chef porge il menù) sono video normali (H.264: va anche su iPhone) con due immagini una sopra l'altra:
   sopra il colore, sotto la trasparenza in bianco e nero. WebGL le unisce su un canvas trasparente.
   Il video arriva come blob (niente richieste a pezzi nel service worker). Si salta con «riduci movimento»,
   senza WebGL o se il video non parte; un tocco la chiude. */
const ANIM_SRC={chef:'media/invio-chef.mp4',forn:'media/invio-fornitore.mp4'};
const animUrl={};
const animOff=()=>{try{return matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){return false}};
function animPrefetch(k='chef'){
  if(!animUrl[k]&&!animOff())animUrl[k]=fetch(ANIM_SRC[k]).then(r=>{if(!r.ok)throw 0;return r.blob()}).then(b=>URL.createObjectURL(b)).catch(()=>{animUrl[k]=null;return null});
  return animUrl[k]||Promise.resolve(null);
}
function animGL(cv){
  const gl=cv.getContext('webgl',{alpha:true,premultipliedAlpha:true,antialias:false,preserveDrawingBuffer:true});if(!gl)return null;
  const sh=(t,src)=>{const x=gl.createShader(t);gl.shaderSource(x,src);gl.compileShader(x);return gl.getShaderParameter(x,gl.COMPILE_STATUS)?x:null};
  const vs=sh(gl.VERTEX_SHADER,'attribute vec2 p;varying vec2 uv;void main(){uv=vec2(p.x*.5+.5,.5-p.y*.5);gl_Position=vec4(p,0.,1.);}');
  // ombra leggera attorno alle figure (alfa sfocata su due anelli, un po' più in basso): sullo sfondo chiaro la giacca bianca non si confonde
  const fs=sh(gl.FRAGMENT_SHADER,'precision mediump float;varying vec2 uv;uniform sampler2D t;float al(vec2 p){p=clamp(p,0.,1.);return smoothstep(.05,.95,dot(texture2D(t,vec2(p.x,.5+p.y*.5)).rgb,vec3(.299,.587,.114)));}void main(){vec3 c=texture2D(t,vec2(uv.x,uv.y*.5)).rgb;float a=al(uv);float s=0.;vec2 q=uv-vec2(0.,2./404.);for(int i=0;i<12;i++){float th=float(i)*.5236;vec2 d=vec2(cos(th)/720.,sin(th)/404.);s+=al(q+d*4.)+al(q+d*8.);}s=s/24.*.3*smoothstep(0.,.06,uv.x)*smoothstep(0.,.06,1.-uv.x)*smoothstep(0.,.08,uv.y)*smoothstep(0.,.08,1.-uv.y);gl_FragColor=vec4(c*a,a+(1.-a)*s);}');
  if(!vs||!fs)return null;const pr=gl.createProgram();gl.attachShader(pr,vs);gl.attachShader(pr,fs);gl.linkProgram(pr);if(!gl.getProgramParameter(pr,gl.LINK_STATUS))return null;gl.useProgram(pr);
  gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  const l=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,2,gl.FLOAT,false,0,0);
  gl.bindTexture(gl.TEXTURE_2D,gl.createTexture());
  for(const [k,v] of [[gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE],[gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE],[gl.TEXTURE_MIN_FILTER,gl.LINEAR],[gl.TEXTURE_MAG_FILTER,gl.LINEAR]])gl.texParameteri(gl.TEXTURE_2D,k,v);
  gl.clearColor(0,0,0,0);
  const draw=v=>{if(v.readyState<2)return false;gl.viewport(0,0,cv.width,cv.height);gl.clear(gl.COLOR_BUFFER_BIT);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,v);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);return true};
  draw.free=()=>{try{const x=gl.getExtension('WEBGL_lose_context');if(x)x.loseContext()}catch(e){}};
  return draw;
}
function sendAnim(k='chef',testo='Inviato allo chef'){return new Promise(async done=>{
  if(animOff())return done();
  const url=await Promise.race([animPrefetch(k),new Promise(r=>setTimeout(()=>r(null),1500))]);if(!url)return done();
  const cv=document.createElement('canvas');cv.width=720;cv.height=404;let draw=null;try{draw=animGL(cv)}catch(e){}if(!draw)return done();
  const v=document.createElement('video');v.muted=true;v.defaultMuted=true;v.playsInline=true;v.setAttribute('playsinline','');v.setAttribute('muted','');v.preload='auto';v.src=url;
  const el=document.createElement('div');el.className='snd-anim';el.setAttribute('role','status');
  el.innerHTML=`<div class="snd-stage"></div><div class="snd-cap">${ic('check')}<span>${esc(testo)}</span></div><p class="snd-hint">Tocca per continuare</p>`;
  el.querySelector('.snd-stage').appendChild(cv);
  let fin=false,raf=0,shown=false;const cap=el.querySelector('.snd-cap');
  const end=()=>{if(fin)return;fin=true;cancelAnimationFrame(raf);clearTimeout(safe);v.pause();el.classList.remove('in');setTimeout(()=>{el.remove();v.removeAttribute('src');v.load();draw.free();done()},280)};
  const showCap=()=>{if(!shown){shown=true;cap.classList.add('in')}};
  const tick=()=>{if(fin)return;if(draw(v)&&!el.classList.contains('in'))el.classList.add('in');if(v.duration&&v.currentTime>v.duration*.72)showCap();raf=requestAnimationFrame(tick)};
  const safe=setTimeout(end,9000);
  el.addEventListener('click',end);v.addEventListener('error',end);
  v.addEventListener('ended',()=>{showCap();draw(v);setTimeout(end,1100)});
  document.body.appendChild(el);
  try{v.playbackRate=1.15;await v.play()}catch(e){fin=true;clearTimeout(safe);el.remove();draw.free();return done()}
  raf=requestAnimationFrame(tick);
})}

/* ================= sheets & toasts ================= */
const sheets=[];
function openSheet(o){
  const el=document.createElement('div');el.className='sheet-wrap';
  el.innerHTML=`<div class="scrim" data-a="closeSheet"></div><div class="sheet ${o.cls||''}" role="dialog" aria-modal="true"></div>`;
  $('#sheets').appendChild(el);o.el=el;sheets.push(o);paintSheet(o);
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('open')));
  document.body.classList.add('noscroll');
  setTimeout(()=>{const f=o.el.querySelector('[autofocus]');if(f)f.focus()},280);
  navSync();return o;
}
function paintSheet(o){const h=o.render();if(h!==o.last){paint(o.el.querySelector('.sheet'),h);o.last=h}}
function refreshSheet(){const o=sheets[sheets.length-1];if(o)paintSheet(o)}
function closeSheet(instant){const o=sheets.pop();if(!o)return;if(o.onClose)o.onClose();o.el.classList.remove('open');if(instant)o.el.remove();else setTimeout(()=>o.el.remove(),260);if(!sheets.length)document.body.classList.remove('noscroll');navSync()}
function toast(msg,kind){const t=document.createElement('div');t.className='toast '+(kind||'');t.textContent=msg;$('#toasts').appendChild(t);requestAnimationFrame(()=>requestAnimationFrame(()=>t.classList.add('in')));setTimeout(()=>{t.classList.remove('in');setTimeout(()=>t.remove(),300)},kind==='err'?5200:3400)}
function ask(title,text,ok,danger,input){
  return new Promise(res=>{let done=false;S.askVal=input&&input.value||'';
    openSheet({onClose:()=>{if(!done)res(false)},render:()=>`<div class="grab"></div><div class="sh-h"><div class="sh-t">${esc(title)}</div></div>${text?`<p class="muted" style="margin-top:0;white-space:pre-line">${esc(text)}</p>`:''}
    ${input?`<label class="lbl" for="ask-in">${esc(input.label)}</label><input class="inp" id="ask-in" value="${esc(S.askVal)}" data-in="askv" placeholder="${esc(input.ph||'')}">`:''}
    <div class="btns" style="margin-top:20px"><button type="button" class="btn ghost" data-a="closeSheet">Annulla</button><button type="button" class="btn ${danger?'dark':'primary'}" id="ask-ok">${esc(ok)}</button></div>`});
    $('#ask-ok').onclick=()=>{done=true;const v=S.askVal;closeSheet();res(input?{v}:true)};
  });
}

/* ================= GM: richieste ================= */
function itemsOf(r){return S.drafts[r.id]||r.items||[]}
const reqUrg=r=>(r.items||[]).some(i=>i.urgente)?1:0;
function draft(rid){if(!S.drafts[rid]){const r=D().richieste[rid];S.drafts[rid]=clone(r.items||[]).map(it=>Object.assign(it,{qtaOrig:it.qtaOrig??it.qta}));S.removed[rid]=[]}return S.drafts[rid]}
// Stesso prodotto da un altro fornitore, con la stessa unità e un prezzo più basso (almeno 1%): il più economico, se c'è.
function cheaperOf(pid){const p=D().prodotti[pid];if(!p||p.prezzo==null)return null;const u=normUnita(p.unita).toLowerCase();let b=null;
  for(const q of S.gidx.get(gkey(p.nome))||[]){if(q.id===pid||q.fornitoreId===p.fornitoreId||q.prezzo==null||normUnita(q.unita).toLowerCase()!==u)continue;if(q.prezzo<p.prezzo*0.99&&(!b||q.prezzo<b.prezzo))b=q}
  return b}
function cheapHTML(p,b,qta,attr){const d=p.prezzo-b.prezzo;return`<div class="ln-x"><button type="button" class="cheap" ${attr}>${ic('receipt')}<span>Da <b>${esc(forn(b.fornitoreId).nome)}</b> costa ${eur(d)} in meno${p.unita?' / '+esc(p.unita):''}${qta>1?` (risparmi ${eur(d*qta)})`:''} · <u>Passa</u></span></button></div>`}
function rswapTo(rid,i,pid){const p=D().prodotti[pid];if(!p)return;const x=draft(rid);Object.assign(x[+i],{pid:p.id,nome:p.nome,codice:p.codice||'',unita:p.unita||'',prezzo:p.prezzo??null,fornitoreId:p.fornitoreId,fornitoreNome:forn(p.fornitoreId).nome,cambiato:true});render()}
function altsOf(it){const p=D().prodotti[it.pid];const arr=S.gidx.get(gkey(p?p.nome:it.nome))||[];return arr.some(x=>x.id===it.pid)?arr:[]}
function vRichieste(){

/* D9: richieste gestite divise per giorno della decisione (Oggi, Ieri, …), con ora e chi ha deciso; filtro Approvate/Rifiutate */
function vGestite(){
  const f=S.rqF||'tutte',all=Object.values(D().richieste).filter(r=>r.stato!=='inviata'&&r.deciso);
  const l=all.filter(r=>f==='tutte'||r.stato===f).sort((a,b)=>b.deciso-a.deciso).slice(0,300);
  const chips=`<div class="rq-f" role="group" aria-label="Filtro">${[['tutte','Tutte'],['approvata','Approvate'],['rifiutata','Rifiutate']].map(([k,t])=>`<button type="button" class="chip${f===k?' on':''}" aria-pressed="${f===k}" data-a="rqF" data-v="${k}">${t}</button>`).join('')}</div>`;
  if(!l.length)return chips+empty('clock',f==='tutte'?'Nessuna richiesta gestita':'Nessuna richiesta in questo filtro','Le richieste che approvi o rifiuti compaiono qui, divise per giorno.');
  const g=new Map();for(const r of l){const k=dayKey(r.deciso);if(!g.has(k))g.set(k,[]);g.get(k).push(r)}
  let i=0;return chips+[...g].map(([k,rs])=>`<details class="rq-day"${i++<2?' open':''}><summary><span>${esc(dayLbl(rs[0].deciso))}</span><span class="muted">${rs.length}</span></summary><div class="panel">${rs.map(r=>reqSummary(r,true,true)).join('')}</div></details>`).join('');
}
const dayKey=t=>{const d=new Date(t);return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate()};
function dayLbl(t){const d=new Date(t),o=new Date();o.setHours(0,0,0,0);const x=new Date(d);x.setHours(0,0,0,0);const n=Math.round((o-x)/864e5);
  if(n===0)return'Oggi';if(n===1)return'Ieri';const s=d.toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'});return s.charAt(0).toUpperCase()+s.slice(1)}
function bySupplier(pend){
  const m=new Map();
  for(const r of pend)for(const it of itemsOf(r)){const fid=it.fornitoreId||'';if(!m.has(fid))m.set(fid,new Map());const L=m.get(fid);const k=it.pid||('l:'+norm(it.nome));
    if(!L.has(k))L.set(k,{nome:it.nome,codice:it.codice,unita:it.unita,qta:0,da:[]});const x=L.get(k);if(it.urgente)x.urgente=true;x.qta=r3(x.qta+Number(it.qta));x.da.push(firstName(r.utenteNome)+' '+fq(it.qta))}
  return`<div style="height:12px"></div>`+[...m.entries()].map(([fid,L])=>`<section class="panel"><div class="fsum-h"><span class="sup big" style="--c:${fcolor(fid)}"><i></i>${fid?esc(forn(fid).nome):'Da assegnare'}</span><span class="muted small">${L.size} ${L.size===1?'prodotto':'prodotti'}</span></div>
  ${[...L.values()].map(x=>`<div class="sline"><div><div class="ln-n">${esc(x.nome)}${x.urgente?' <span class="tag urg">urgente</span>':''}</div><div class="ln-m">${x.codice?'cod. '+esc(x.codice)+', ':''}${esc(x.da.join(', '))}</div></div><span class="sl-q">${fq(x.qta)} ${esc(x.unita||'')}</span></div>`).join('')}</section>`).join('')
  +`<p class="hint">Per approvare o modificare passa alla vista Per persona.</p>`;
}

// «+ Aggiungi» dentro il blocco di un fornitore: cerca solo nel suo listino, così ogni prodotto aggiunto ha già il fornitore.

async function approve(rid){
  const r=D().richieste[rid];if(!r||r.stato!=='inviata')return;const me=meU();
  let items=clone(itemsOf(r)).filter(i=>Number(i.qta)>0);
  if(!items.length)return toast('La richiesta è vuota: rifiutala.','warn');
  const miss=items.find(i=>!i.fornitoreId);if(miss)return toast('Scegli il fornitore per «'+miss.nome+'».','warn');
  const removed=(S.removed[rid]||[]).concat(itemsOf(r).filter(i=>!i.aggiunto&&!(Number(i.qta)>0)).map(i=>({nome:i.nome,qta:i.qtaOrig??i.qta})));
  let modified=removed.length>0;
  items=items.map(i=>{if(i.qtaOrig!=null&&i.qtaOrig!==i.qta)modified=true;else delete i.qtaOrig;if(i.cambiato)modified=true;return i});
  const notaGM=(S.gmn[rid]||'').trim();
  await upd('richieste',rid,{stato:'approvata',items,rimossi:removed,modificata:modified,notaGM,deciso:now(),decisoDa:me.id});
  for(const [fid,its] of groupByF(items)){
    const oid='aperto_'+fid;const cur=D().ordini[oid];
    const o=cur?clone(cur):{fornitoreId:fid,fornitoreNome:forn(fid).nome,stato:'aperto',items:[],richieste:[],creato:now()};
    for(const it of its){const key=it.pid||('l:'+norm(it.nome));let L=o.items.find(x=>x.key===key);
      if(!L){L={key,pid:it.pid||'',nome:it.nome,codice:it.codice||'',unita:it.unita||'',prezzo:it.prezzo??null,qta:0,da:[]};o.items.push(L)}
      if(it.urgente)L.urgente=true;L.qta=r3(L.qta+Number(it.qta));L.da.push({n:r.utenteNome,r:r.reparto,q:Number(it.qta)})}
    if(!o.richieste.includes(rid))o.richieste.push(rid);o.aggiornato=now();delete o.id;
    await put('ordini',oid,o);
  }
  await notify(r.utenteId,modified?'Richiesta approvata con modifiche':'Richiesta approvata',notaGM||(items.length+' '+(items.length===1?'articolo verrà ordinato':'articoli verranno ordinati')),'approvata',rid);
  delete S.drafts[rid];delete S.removed[rid];delete S.gmn[rid];toast('Approvata. Gli articoli sono in Invii.');
}
async function reject(rid){
  const r=D().richieste[rid];if(!r)return;
  const a=await ask('Rifiutare la richiesta di '+firstName(r.utenteNome)+'?','Riceverà una notifica con il motivo.','Rifiuta',true,{label:'Motivo (facoltativo)',value:S.gmn[rid]||'',ph:'Es. abbiamo ancora scorte'});
  if(!a)return;
  await upd('richieste',rid,{stato:'rifiutata',notaGM:a.v.trim(),deciso:now(),decisoDa:S.me});
  await notify(r.utenteId,'Richiesta rifiutata',a.v.trim()||'Parlane con lo chef','rifiutata',rid);
  delete S.drafts[rid];delete S.gmn[rid];toast('Richiesta rifiutata');
}

/* v35 scadenze per lo staff: config/app.scad = [{id, f: fornitore o '' (tutte le richieste), g: [0=lun..6=dom], entro, avv: 'HH:MM' (vuota = un'ora prima),

const scadL=()=>(Array.isArray(cfg().scad)?cfg().scad:[]).filter(s=>s&&s.id&&Array.isArray(s.g)&&s.g.length&&orMin(s.entro)!=null);

function scadDue(s){const d=new Date(),g=(d.getDay()+6)%7,nm=d.getHours()*60+d.getMinutes();return s.g.includes(g)&&nm>=scadAvv(s)&&nm<orMin(s.entro)}

/* promemoria dal server (worker /promemoria, cron ogni 5 minuti): il telefono del gestore manda il piano solo quando cambia
   (o ogni 6 ore); finché il server ha il piano giusto (meno di 24 ore) l'app non manda la sua push «Oggi si ordina da…» */
function promPlan(){const st=D().staff,forn=[];
  for(const f of Object.values(D().fornitori)){const gs=f.giorniOrdine;if(!Array.isArray(gs)||!gs.length)continue;
    const lim=orMin(f.oraLimite),at=orMin(f.oraPromemoria)??(lim!=null?Math.max(0,lim-60):600);
    const s=Math.max(0,...Object.values(D().ordini).filter(o=>o.fornitoreId===f.id).map(o=>+o.inviato||0));
    forn.push({id:f.id,nome:f.nome||'',g:gs,at,lim,s})}
  forn.sort((a,b)=>a.id<b.id?-1:1);
  const ps=Object.entries(PUSH.subs).sort((a,b)=>a[0]<b[0]?-1:1).map(([,p])=>p),dst=promDest(),sub=ok=>ps.filter(p=>ok(st[p.u])).map(p=>p.sub);
  const subs=sub(u=>promTo(dst,u)),gest=sub(u=>!!u&&u.stato==='attivo'&&isMgr(u));
  const scad=scadL().map(s=>({id:s.id,nome:scadNome(s),g:s.g,avv:scadAvv(s),entro:orMin(s.entro),subs:sub(u=>scadPer(s,u))})).sort((a,b)=>a.id<b.id?-1:1);
  let tz='Europe/Rome';try{tz=Intl.DateTimeFormat().resolvedOptions().timeZone||tz}catch(e){}
  return JSON.stringify({tz,forn,subs,gest,scad})}

  promSrv.busy=1;try{const r=await fetch(PUSH_URL+'/promemoria',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+await algTok()},body});
    if(!r.ok)throw new Error('promemoria '+r.status);ls('jona_prom',{h,t:now()});return true}
  catch(e){promSrv.retry=now()+15*60000;return last.h===h&&now()-(last.t||0)<864e5}finally{promSrv.busy=0}}
async function deadlineTick(){

    const o=Object.values(D().ordini).find(z=>z.stato==='aperto'&&z.fornitoreId===f.id),n=o&&o.items?o.items.length:0;
    const txt=(n?n+(n===1?' articolo':' articoli')+' nel carrello':'Il carrello è vuoto: prepara l\'ordine')+(f.oraLimite?', da inviare entro le '+f.oraLimite:'');
    if(dst==='gm')await notify('gm','Oggi si ordina da '+f.nome,txt,'promemoria',f.id,srv);else for(const id of dst)await notify(id,'Oggi si ordina da '+f.nome,txt,'promemoria',f.id,srv);

/* ================= ordine suggerito =================
   Dagli ordini inviati negli ultimi 2 mesi: ogni quanti giorni si ordina da quel fornitore (mediana) e quanto si usa al giorno
   (quantità ordinate prima dell'ultimo ordine / giorni tra il primo e l'ultimo). Proposta = uso al giorno × giorni fino al
   prossimo ordine × gente prevista × meteo, meno quello che è già nell'ordine aperto. Meteo: Open-Meteo (gratis, senza chiave). */
const SUG_DAYS=56,DAY=864e5,METEO_POS={lat:41.1366,lon:9.5323,nome:'Porto Cervo'};
const SUG_GENTE=[[0.8,'Meno'],[1,'Normale'],[1.2,'Di più'],[1.5,'Evento']];
const sugKey=l=>l.pid||'n:'+norm(l.nome);
function sugStats(fid){
  const t0=now()-SUG_DAYS*DAY;
  const os=Object.values(D().ordini).filter(o=>o.fornitoreId===fid&&o.stato==='inviato'&&(o.inviato||0)>=t0).sort((a,b)=>a.inviato-b.inviato);
  if(os.length<2)return{n:os.length};
  const gaps=os.slice(1).map((o,i)=>(o.inviato-os[i].inviato)/DAY).sort((a,b)=>a-b);
  const cad=Math.max(1,Math.round(gaps[Math.floor(gaps.length/2)]));
  const span=Math.max(1,(os[os.length-1].inviato-os[0].inviato)/DAY),P=new Map();
  os.forEach((o,i)=>{for(const l of o.items||[]){const k=sugKey(l),q=Number(l.qta)||0;
    const x=P.get(k)||{k,pid:l.pid||'',nome:l.nome,unita:l.unita||'',q:0,qs:[]};x.qs.push(q);if(i<os.length-1)x.q+=q;P.set(k,x)}});
  const items=[...P.values()].map(x=>{const s=x.qs.slice().sort((a,b)=>a-b);return Object.assign(x,{n:x.qs.length,tip:s[Math.floor(s.length/2)],day:x.q/span})});
  const late=(now()-os[os.length-1].inviato)/DAY;
  return{n:os.length,cad,last:os[os.length-1].inviato,due:late>=cad-0.5,items};
}
const sugUnitHalf=u=>/^(kg|g|gr|lt?|litri?|ml)$/i.test(String(u||'').trim());

// meteo dei prossimi 7 giorni, in memoria per 3 ore
let wxMem=null;
async function meteo(){
  if(wxMem&&now()-wxMem.t<3*36e5)return wxMem.d;
  try{const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${METEO_POS.lat}&longitude=${METEO_POS.lon}&daily=weather_code,temperature_2m_max,precipitation_probability_max&timezone=Europe%2FRome&forecast_days=7`);
    if(!r.ok)throw 0;const j=await r.json(),y=j.daily;const d=y.time.map((t,i)=>({t,c:y.weather_code[i],tx:Math.round(y.temperature_2m_max[i]),p:y.precipitation_probability_max[i]||0}));
    wxMem={t:now(),d};return d}catch(e){return null}
}
const wxIc=c=>c>=51||c>=95?'rain':c>=1?'cloud':'sun';
// effetto del meteo sui giorni coperti dall'ordine: pioggia → meno gente in terrazza, caldo e sole → di più
function wxFactor(d,cad){
  if(!d)return{f:1,t:''};const ds=d.slice(1,1+Math.max(1,cad));if(!ds.length)return{f:1,t:''};
  const p=ds.reduce((s,x)=>s+x.p,0)/ds.length,tx=ds.reduce((s,x)=>s+x.tx,0)/ds.length;
  if(p>=60)return{f:0.9,t:'Pioggia probabile: −10%'};
  if(tx>=27&&p<30)return{f:1.1,t:'Sole e caldo: +10%'};
  return{f:1,t:'Tempo normale: nessuna correzione'};
}
function sugRows(){
  const G=S.sug,st=sugStats(G.fid);if(!st.items)return[];
  const wf=G.useWx?wxFactor(G.wx,st.cad).f:1,cur=D().ordini['aperto_'+G.fid];
  return st.items.map(x=>{const inO=cur&&cur.items.find(l=>(l.key||l.pid)===x.pid)?.qta||0;
    const base=sugRound(x.day*st.cad*G.gente*wf-inO,x.unita);const p=x.pid?D().prodotti[x.pid]:null;
    const q=G.q[x.k]!=null?G.q[x.k]:base;const sel=G.sel[x.k]!=null?G.sel[x.k]:(x.n>=2&&base>0&&!!p);
    return Object.assign({},x,{p,inO,base,q,sel})}).filter(x=>x.p).sort((a,b)=>(b.sel-a.sel)||(b.n-a.n)||String(a.nome).localeCompare(String(b.nome),'it'));
}

      <div class="panel" style="box-shadow:none;border:1px solid var(--line)">${fs.map(({f,st})=>st.n>=2?`<button type="button" class="row link" data-a="sugF" data-f="${f.id}">${fDot(f.id)}<div class="row-i"><div class="row-t">${esc(f.nome)}</div><div class="row-m">Di solito ogni ${st.cad===1?'giorno':st.cad+' giorni'} · ultimo ${ago(st.last)}</div></div>${st.due?pill('wait','da riordinare'):''}${ic('chev')}</button>`

      ${stepper('sugQ',esc(r.k).replace(/[^\w-]/g,'_'),r.q,`data-k="${esc(r.k)}"`)}<span class="ln-u">${esc(r.unita)}</span></div>`).join(''):'<p class="muted">Nessun prodotto da proporre.</p>'}</div>

async function confirmReceipt(oid,all){
  const o=D().ordini[oid];if(!o||o.ricevuto)return;const R=rcvState(oid);const me=meU();const f=forn(o.fornitoreId);
  const nc0=all?0:R.lines.filter(l=>!l.st).length;

  const righe=o.items.map((l,i)=>{const L=all?{st:'ok'}:R.lines[i];
    const arr=L.st==='ko'?0:L.st==='meno'?L.arr:l.qta;const motivo=!L.st?'nonctrl':L.st==='ko'?'mancante':arr!==l.qta?'quantita':'';

  const diffs=righe.filter(r=>r.motivo&&r.motivo!=='nonctrl');const nc=righe.length-righe.filter(r=>r.motivo!=='nonctrl').length;
  await upd('ordini',oid,{ricevuto:now(),ricevutoDa:me.id,ricevutoNome:fullName(me),ricezione:{righe,note:all?'':R.note.trim(),foto:all?'':R.foto},differenze:diffs.length,nonControllati:nc});
  for(const rid of o.richieste||[]){const r=D().richieste[rid];if(r)await upd('richieste',rid,{arrivati:Object.assign({},r.arrivati||{},{[o.fornitoreId]:now()})})}
  await notify('gm',diffs.length?`Consegna ${f.nome}: ${diffs.length===1?'1 differenza':diffs.length+' differenze'}`:`Consegna ${f.nome} arrivata`,
    (diffs.length?diffs.slice(0,5).map(d=>rcvDiffTxt(d)+(d.da.length?' (chiesto da '+d.da.join(', ')+')':'')).join('; ')+(diffs.length>5?'; …e altri '+(diffs.length-5):'')+'. Controllata da '+me.nome:'Controllata da '+me.nome+(nc?'':', tutto ok'))+(nc?(diffs.length?'; ':', ')+nc+' non controllati':''),'arrivo',oid);
  // Chi aveva chiesto un prodotto mancante o arrivato in meno riceve un avviso solo per i suoi prodotti.
  if(diffs.length){const per=new Map();

${GEM_HEAD}

- una riga per prodotto, nello stesso ordine del foglio, senza saltarne nessuno;

      // lettore = quello che il server dice di aver usato davvero (un server vecchio non lo dice: allora resta «Gemini» generico)

function shrinkImg(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const m=2000,r=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);c.toBlob(b=>b?res(new File([b],(file.name||'foto').replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'})):rej({code:'img'}),'image/jpeg',.85)};

/* riepilogo della settimana (lunedì-domenica, ora locale) */
function weekRange(off){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-(d.getDay()+6)%7-7*off);const e=new Date(d);e.setDate(e.getDate()+7);return[d.getTime(),e.getTime()]}
function weekSummary(){
  const off=S.wk===1?1:0;const [a,b]=weekRange(off);const inW=t=>t>=a&&t<b;
  const dd=t=>new Date(t).toLocaleDateString('it-IT',{day:'numeric',month:'short'});
  const rs=Object.values(D().richieste).filter(r=>inW(r.creato||0));
  const cnt={inviata:0,approvata:0,rifiutata:0};for(const r of rs)if(cnt[r.stato]!=null)cnt[r.stato]++;
  const os=Object.values(D().ordini);const sp=new Map();let tot=0,miss=false;
  for(const o of os){if(o.stato!=='inviato'||!inW(o.inviato||0))continue;const k=o.fornitoreId||'';
    const x=sp.get(k)||{fid:k,nome:(D().fornitori[k]||{}).nome||o.fornitoreNome||'Fornitore eliminato',n:0,t:0};x.n++;
    for(const l of o.items||[]){const pr=l.prezzo;if(pr==null||pr===''||isNaN(pr)){miss=true;continue}const v=Number(pr)*(Number(l.qta)||0);x.t+=v;tot+=v}sp.set(k,x)}
  const sps=[...sp.values()].sort((x,y)=>y.t-x.t||String(x.nome).localeCompare(String(y.nome),'it'));
  const tp=new Map();for(const r of rs)for(const it of r.items||[]){const k=norm(it.nome)+'|'+(it.unita||'');const x=tp.get(k)||{nome:it.nome,unita:it.unita||'',q:0};x.q=r3(x.q+(Number(it.qta)||0));tp.set(k,x)}
  const top=[...tp.values()].sort((x,y)=>y.q-x.q||String(x.nome).localeCompare(String(y.nome),'it')).slice(0,5);
  const rc=os.filter(o=>o.ricevuto&&inW(o.ricevuto));const nd=rc.filter(o=>o.differenze>0).length;
  return`<section class="panel wk" aria-label="Riepilogo della settimana"><div class="wk-h"><b>Riepilogo</b><span class="muted small">${dd(a)} – ${dd(b-1)}</span></div>
  <div class="wk-sg"><div class="seg wide" role="group" aria-label="Settimana">${[[0,'Questa settimana'],[1,'Settimana scorsa']].map(([k,l])=>`<button type="button" aria-pressed="${off===k}" data-a="wk" data-v="${k}">${l}</button>`).join('')}</div></div>
  <div class="wk-s"><span>Richieste</span><span class="muted">${rs.length}</span></div>
  <div class="wk-n"><div><b>${cnt.inviata}</b><span>in attesa</span></div><div><b>${cnt.approvata}</b><span>approvate</span></div><div><b>${cnt.rifiutata}</b><span>rifiutate</span></div></div>
  <div class="wk-s"><span>Consegne con differenze</span><span class="muted">${nd} su ${rc.length} ${rc.length===1?'controllata':'controllate'}</span></div><div style="height:10px"></div>
  <div class="wk-s"><span>Spesa stimata per fornitore</span><span class="muted">ordini inviati</span></div>
  ${sps.length?sps.map(x=>`<div class="sline"><div><span class="sup" style="--c:${fcolor(x.fid)}"><i></i>${esc(x.nome)}</span><div class="ln-m">${x.n} ${x.n===1?'ordine':'ordini'}</div></div><span class="sl-q">${eur(x.t)}</span></div>`).join('')
  +`<div class="total"><span>Totale stimato</span><b>${eur(tot)}</b></div>${miss?'<p class="wk-note muted small">Alcuni prezzi mancano: la spesa vera è più alta.</p>':''}`:'<p class="wk-note muted small">Nessun ordine inviato in questa settimana.</p>'}
  <div class="wk-s"><span>Più richiesti</span><span class="muted">quantità</span></div>
  ${top.length?top.map((x,i)=>`<div class="sline"><div class="ln-n">${i+1}. ${esc(x.nome)}</div><span class="sl-q">${fq(x.q)} ${esc(x.unita)}</span></div>`).join(''):'<p class="wk-note muted small">Nessuna richiesta in questa settimana.</p>'}
  </section>`;
}

const RP_PER=[['sett','Questa settimana'],['mese','Questo mese'],['mesep','Mese scorso'],['tre','Ultimi 3 mesi'],['anno','Quest\'anno'],['dal','Dal… al…']];
const rpIso=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};

function rpState(){if(!S.rp)S.rp={per:'mese',a:today().slice(0,8)+'01',b:today(),fid:'',rep:'',q:'',all:false};return S.rp}
function rpRange(R){
  const d=new Date();d.setHours(0,0,0,0);const y=d.getFullYear(),m=d.getMonth(),T=x=>x.getTime();
  if(R.per==='sett')return weekRange(0);
  if(R.per==='mese')return[T(new Date(y,m,1)),T(new Date(y,m+1,1))];
  if(R.per==='mesep')return[T(new Date(y,m-1,1)),T(new Date(y,m,1))];
  if(R.per==='anno')return[T(new Date(y,0,1)),T(new Date(y+1,0,1))];
  if(R.per==='tre'){const a=new Date(d);a.setMonth(a.getMonth()-3);const e=new Date(d);e.setDate(e.getDate()+1);return[T(a),T(e)]}
  const p=s=>{const x=String(s||'').split('-').map(Number);return x[0]?new Date(x[0],x[1]-1,x[2]):null};
  let a=p(R.a)||d,b=p(R.b)||d;if(b<a)[a,b]=[b,a];b=new Date(b);b.setDate(b.getDate()+1);return[T(a),T(b)];
}
/* confronto: stesso tratto del periodo prima (fino a oggi se il periodo non è finito) */
function rpPrev(R,a,b){const z=new Date();z.setHours(0,0,0,0);z.setDate(z.getDate()+1);const e=Math.min(b,z.getTime());if(e<=a)return null;
  const sh=t=>{const d=new Date(t);if(R.per==='mese'||R.per==='mesep')d.setMonth(d.getMonth()-1);else if(R.per==='anno')d.setFullYear(d.getFullYear()-1);else if(R.per==='sett')d.setDate(d.getDate()-7);else return t-(e-a);return d.getTime()};
  return[sh(a),sh(e)]}
function rpCmp(R,X){const r=rpPrev(R,X.a,X.b);if(!r||!(X.tot>0))return'';const P=rpCalc(R,r);if(!(P.tot>0))return'';

const rpF=n=>Math.round(n*10)/10;

function rpNice(x){if(!(x>0))return 1;const p=10**Math.floor(Math.log10(x)),n=x/p;return(n<=1?1:n<=2?2:n<=5?5:10)*p}

/* ================= orari del personale =================
   Una settimana per documento in «config»: orari_<lunedì AAAA-MM-GG> = {tipo:'orari',lun,t:{<persona>:{'0'..'6':valore}},tp:copia pubblicata,pub,pubDa,mod}.
   Valore del giorno: "10:00-15:00" o "10:00-15:00,18:00-23:00" (fine ≤ inizio = finisce dopo mezzanotte); R riposo, F ferie, M malattia, P permesso.
   Turni tipo in config/orari_tipi {l:[{id,n,v}]}; contratto in staff.contratto {ore,pausa (minuti),liberi}. Lo staff vede solo «tp», la sua riga. */
const OR_ASS={R:'Riposo',F:'Ferie',M:'Malattia',P:'Permesso'};
const OR_GG=['Lun','Mar','Mer','Gio','Ven','Sab','Dom'];
const OR_GGL=['Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato','Domenica'];
const OR_TIPI0=[{id:'pranzo',n:'Pranzo',v:'10:00-15:00'},{id:'cena',n:'Cena',v:'18:00-23:30'},{id:'spezzato',n:'Spezzato',v:'10:00-15:00,18:00-23:00'},{id:'giornata',n:'Giornata',v:'09:00-17:30'}];
const CONTR0={ore:40,pausa:30,liberi:1};
const contrOf=u=>u&&u.contratto&&!u.contratto.libero?Object.assign({},CONTR0,u.contratto):null;
const withContr=f=>!!f._c&&(f.ruolo||'staff')!=='dev';
const orContr=f=>f.libero?{libero:true}:{ore:num(f.ore),pausa:Number(f.pausa)||0,liberi:Number(f.liberi)||1};
// responsabili con orario libero: niente turni, niente controlli, fuori dal pianificatore
const orFree=u=>!!(u&&u.contratto&&u.contratto.libero);
const orDate=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d)};
const orLun=(d=new Date())=>{const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-(x.getDay()+6)%7);return today(x)};
const orShift=(lun,w)=>{const d=orDate(lun);d.setDate(d.getDate()+7*w);return today(d)};
const orDay=(lun,g)=>{const d=orDate(lun);d.setDate(d.getDate()+g);return d};
const orWeek=lun=>D().config['orari_'+lun]||null;
const orTipi=()=>{const t=D().config.orari_tipi;return t&&Array.isArray(t.l)?t.l:OR_TIPI0};
const orRange=lun=>{const a=orDay(lun,0),b=orDay(lun,6),m=d=>d.toLocaleDateString('it-IT',{month:'long'});return a.getMonth()===b.getMonth()?`${a.getDate()} – ${b.getDate()} ${m(b)}`:`${a.getDate()} ${m(a)} – ${b.getDate()} ${m(b)}`};
const orDayL=(lun,g)=>OR_GGL[g]+' '+orDay(lun,g).toLocaleDateString('it-IT',{day:'numeric',month:'long'});
const orMin=s=>{const m=/^(\d{1,2}):(\d{2})$/.exec(String(s||'').trim());return m&&+m[1]<24&&+m[2]<60?+m[1]*60+ +m[2]:null};
const orHM=m=>String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const orHMc=m=>Math.floor(m/60)%24+(m%60?':'+String(m%60).padStart(2,'0'):'');
// turni del giorno in minuti da mezzanotte, ordinati: [[inizio,fine]] (fine oltre 1440 = dopo mezzanotte)
function orShifts(v){if(!v||OR_ASS[v])return[];const r=[];for(const p of String(v).split(',')){const [a,b]=p.split('-').map(orMin);if(a==null||b==null)continue;r.push([a,b<=a?b+1440:b])}return r.sort((x,y)=>x[0]-y[0])}
const orFmt=v=>OR_ASS[v]||orShifts(v).map(([a,b])=>orHM(a)+'–'+orHM(b)).join(', ');
const orH=m=>{m=Math.round(m);const h=Math.floor(m/60),r=m%60;return r?h+'h'+String(r).padStart(2,'0'):h+'h'};
// minuti di lavoro: pausa del contratto tolta nei turni oltre 6 ore; ferie, malattia e permesso valgono ore/(7 − liberi)
function orNet(v,c){if(!v||v==='R')return 0;if(OR_ASS[v])return c?Math.round(c.ore*60/Math.max(1,7-c.liberi)):0;const p=c?c.pausa:0;return orShifts(v).reduce((s,[a,b])=>s+(b-a)-(b-a>360?p:0),0)}
const orTot=(row,c)=>{let m=0;for(let g=0;g<7;g++)m+=orNet(row&&row[g],c);return m};
const orHas=row=>!!row&&Object.values(row).some(Boolean);
const orAny=t=>Object.values(t||{}).some(orHas);
const orDiffDays=(a,b)=>{const r=[];for(let g=0;g<7;g++)if(((a||{})[g]||'')!==((b||{})[g]||''))r.push(g);return r};
const orIds=w=>[...new Set(Object.keys(w.t||{}).concat(Object.keys(w.tp||{})))];
const orChanged=w=>orIds(w).filter(id=>orDiffDays((w.tp||{})[id],(w.t||{})[id]).length);
const orPeople=()=>Object.values(D().staff).filter(u=>u.stato==='attivo'&&!orFree(u)&&(u.ruolo!=='dev'||u.contratto)).sort(byNome);
const orRep=u=>REPARTI[u.reparto]?u.reparto:'altro';
// controlli di una persona in una settimana (prev = sua riga della settimana prima): [{g,k:'err'|'warn',t}], g=-1 vale per tutta la settimana
function orCheck(u,row,prev){
  const c=contrOf(u),out=[],add=(g,k,t)=>out.push({g,k,t});row=row||{};
  const iv=[];for(const [a,b] of orShifts(prev&&prev[6]))iv.push({g:-1,a:a-1440,b:b-1440});
  let worked=0;const np=[];
  for(let g=0;g<7;g++){const sh=orShifts(row[g]);if(!sh.length)continue;worked++;
    for(let i=1;i<sh.length;i++)if(sh[i][0]<sh[i-1][1])add(g,'err',`${OR_GG[g]}: i due turni si sovrappongono`);
    const span=Math.max(...sh.map(s=>s[1]))-sh[0][0];if(span>780)add(g,'err',`${OR_GG[g]}: giornata di ${orH(span)} dall'inizio alla fine, al massimo 13 ore`);
    if(c&&c.pausa<10&&sh.some(([a,b])=>b-a>360))np.push(g);
    for(const [a,b] of sh)iv.push({g,a:a+g*1440,b:b+g*1440})}
  if(np.length)out.push({g:np[0],gs:np,k:'warn',t:`${np.map(g=>OR_GG[g]).join(', ')}: turni oltre 6 ore senza pausa (il contratto non ha la pausa)`});
  iv.sort((x,y)=>x.a-y.a);
  let end=0,gap=0,last=null;
  for(const x of iv){
    if(last&&x.g!==last.g&&x.g>=0){const r=x.a-last.b;
      if(r<0)add(x.g,'err',`${OR_GG[x.g]}: il turno inizia prima che finisca quello del giorno prima`);
      else if(r<660)add(x.g,'err',`${OR_GG[x.g]}: solo ${orH(r)} di riposo dopo il turno di ${last.g<0?'domenica scorsa':OR_GGL[last.g].toLowerCase()}, ne servono 11`)}
    if(x.a>end)gap=Math.max(gap,x.a-end);end=Math.max(end,x.b);if(!last||x.b>=last.b)last=x}
  gap=Math.max(gap,7*1440-end);
  if(worked&&gap<1440)add(-1,'err','Nessun riposo di 24 ore di fila in questa settimana');
  if(c&&worked>7-c.liberi)add(-1,'err',`Lavora ${worked} giorni: con ${c.liberi} ${c.liberi===1?'giorno libero':'giorni liberi'} al massimo ${7-c.liberi}`);
  const tot=orTot(row,c);
  if(tot>48*60)add(-1,'err',`${orH(tot)} in settimana: il massimo è 48 ore`);
  else if(c&&tot>c.ore*60)add(-1,'warn',`${orH(tot-c.ore*60)} oltre il contratto: ${orH(tot)} su ${c.ore}h`);
  return out;
}
function orProblems(lun){const t=(orWeek(lun)||{}).t||{},pt=(orWeek(orShift(lun,-1))||{}).t||{};const r=[];
  for(const u of orPeople())for(const x of orCheck(u,t[u.id],pt[u.id]))r.push(Object.assign({u},x));
  const w=orWeek(lun);for(const p of r)if(p.k==='err'&&orOk(w,p.u.id).includes(p.t))p.ok=true;
  return r.sort((a,b)=>(a.ok?2:a.k==='err'?0:1)-(b.ok?2:b.k==='err'?0:1))}
function orStato(w){
  if(!w||(!orAny(w.t)&&!w.tp))return{k:'',l:'Settimana vuota'};
  if(!w.tp)return{k:'wait',l:'Bozza: lo staff non la vede ancora'};
  return orChanged(w).length?{k:'wait',l:'Modifiche da avvisare',ch:true}:{k:'ok',l:'Pubblicata '+ago(w.pub)};
}
// a chi serve il pranzo e la cena: turni che toccano 12:00–14:30 e 19:30–22:00
const orIn=(v,a,b)=>orShifts(v).some(s=>s[0]<b&&s[1]>a);
async function orSaveRow(lun,id,row,ok){
  const x=ok?{['ok.'+id]:ok}:{};
  if(orWeek(lun))await upd('config','orari_'+lun,Object.assign({['t.'+id]:row,mod:now()},x));
  else await put('config','orari_'+lun,Object.assign({tipo:'orari',lun,t:{[id]:row},mod:now()},ok?{ok:{[id]:ok}}:{}));
}
// errori accettati con il consenso di chi fa gli orari: restano visibili ma non bloccano più
const orOk=(w,id)=>((w&&w.ok)||{})[id]||[];
// chiede il consenso per gli errori nuovi; restituisce i testi da salvare in ok.<persona> o null se annullato
async function orConsent(u,errs,prima){
  const nuovi=errs.filter(p=>!prima.includes(p.t));if(!nuovi.length)return errs.map(p=>p.t);
  const t=nuovi.length===1?'Questo turno non rispetta una regola':'Questo turno non rispetta '+nuovi.length+' regole';
  if(!await ask(t,u.nome+': '+nuovi.map(p=>p.t).join('\n')+'\n\nSe salvi lo stesso, l\'errore resta segnato come accettato da te.','Salva lo stesso',true))return null;
  return errs.map(p=>p.t);
}

  const D7=[0,1,2,3,4,5,6],tbo=tbOn(),now0=new Date(),nowM=now0.getHours()*60+now0.getMinutes(),tdy=today(now0);
  const tbCell=(u,g)=>{if(!tbo)return'';const p=((tp||t)[u.id]||{})[g]||'',a=tbVal(lun,u.id,g),dk=today(orDay(lun,g)),P=orShifts(p);

/* ================= timbratura con QR (si accende in Impostazioni, spenta di partenza) =================
   QR stampato in cucina con «JONA-TIMBRA:<codice>» (config/app.timbraK). Lo staff lo inquadra dalla voce Orari.
   Una settimana per documento: config/timbr_<lunedì> = {tipo:'timbr',lun,t:{<persona>:{'0'..'6':'09:58-15:03,18:00-'}},m:{<persona>:{<g>:1}}}
   stesso formato degli orari; «18:00-» = in servizio adesso; m = timbrata senza QR (fotocamera non disponibile). */
const TB_MAX=16*60; // un'entrata aperta da più di 16 ore non si chiude più: la prossima timbratura è una nuova entrata
const tbOn=()=>!!cfg().timbra;
const tbWeek=lun=>D().config['timbr_'+lun]||null;
const tbCode=()=>'JONA-TIMBRA:'+(cfg().timbraK||'');
const tbVal=(lun,id,g)=>(((tbWeek(lun)||{}).t||{})[id]||{})[g]||'';
// entrata aperta (oggi o ieri entro 16 ore): {lun,g,a} oppure null
function tbOpen(id,d=new Date()){
  const lun=orLun(d),g=(d.getDay()+6)%7,mins=d.getHours()*60+d.getMinutes();
  const pl=g?lun:orShift(lun,-1),pg=g?g-1:6;
  for(const [L,G,off] of [[lun,g,0],[pl,pg,1440]]){const m=/(?:^|,)(\d\d:\d\d)-$/.exec(tbVal(L,id,G));if(m){const a=orMin(m[1]);if(mins+off-a<=TB_MAX&&mins+off>=a)return{lun:L,g:G,a}}}
  return null;
}
async function tbPunch(id,manual){
  const d=new Date(),hm=orHM(d.getHours()*60+d.getMinutes()),op=tbOpen(id,d);
  const lun=op?op.lun:orLun(d),g=op?op.g:(d.getDay()+6)%7,v=tbVal(lun,id,g);
  const nv=op?v+hm:(v?v+',':'')+hm+'-';
  const set={['t.'+id+'.'+g]:nv};if(manual)set['m.'+id+'.'+g]=1;
  if(tbWeek(lun))await upd('config','timbr_'+lun,set);
  else await put('config','timbr_'+lun,{tipo:'timbr',lun,t:{[id]:{[g]:nv}},m:manual?{[id]:{[g]:1}}:{}});
  return{out:!!op,hm};
}
// ore timbrate nette (stessa pausa del contratto, come negli orari)
const tbNet=(v,c)=>orNet(String(v||'').split(',').filter(p=>/^\d\d:\d\d-\d\d:\d\d$/.test(p)).join(','),c);
// confronto con il turno previsto: ok (entro 10 minuti), diff, miss (turno passato senza timbratura)
function tbCmp(plan,act,dayEnd){
  const P=orShifts(plan),A=String(act||'').split(',').filter(Boolean);
  if(!P.length)return A.length?'diff':'';
  if(!A.length)return dayEnd?'miss':'';
  const a0=orMin(A[0].split('-')[0]),lastEnd=A[A.length-1].split('-')[1];
  if(Math.abs(a0-P[0][0])>10)return'diff';
  if(lastEnd){let e=orMin(lastEnd);const pe=P[P.length-1][1];if(e<a0)e+=1440;if(Math.abs(e-pe)>10)return'diff'}
  return'ok';
}

function tbScanSheet(){
  const me=meU();if(!me||!tbOn())return;S.tbs={st:'start',err:''};

  const done=async manual=>{close();const r=await tbPunch(me.id,manual);closeSheet();try{navigator.vibrate&&navigator.vibrate([30,40,30])}catch(e){}

  openSheet({onClose:close,render:()=>{const T=S.tbs||{};const op=tbOpen(me.id);
    return`<div class="grab"></div><div class="sh-h"><div class="sh-t">${op?'Timbra l\'uscita':'Timbra l\'entrata'}<div class="sh-s">Inquadra il QR attaccato in cucina</div></div><button type="button" class="icon-btn" data-a="closeSheet" aria-label="Chiudi">${ic('x')}</button></div>

    ${T.st==='err'?`<div class="btns col" style="margin-top:14px"><button type="button" class="btn primary block" data-a="tbRetry">Riprova</button><button type="button" class="btn ghost block" data-a="tbManual">Timbra senza QR</button></div><p class="muted small">Senza QR la timbratura resta segnata: Maurizio la vede.</p>`:''}`}});
  S.tbs.done=done;
  (async()=>{
    try{

      stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});if(stop){close();return}

      const cam=$('.tb-cam');if(cam){cam.classList.add('live');const p=cam.querySelector('p');if(p)p.remove()} // niente nuovo disegno: il video resterebbe vuoto
      if('BarcodeDetector' in window){try{det=new BarcodeDetector({formats:['qr_code']})}catch(e){det=null}}
      if(!det)await need('jsqr');
      const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});let busy=false;
      timer=setInterval(async()=>{const v=$('#tb-v');if(stop||busy||!v||v.readyState<2)return;busy=true;
        try{let txt='';
          if(det){const r=await det.detect(v);txt=r[0]&&r[0].rawValue||''}
          else{const w=Math.min(640,v.videoWidth),h=Math.round(v.videoHeight*w/v.videoWidth);cv.width=w;cv.height=h;cx.drawImage(v,0,0,w,h);const r=jsQR(cx.getImageData(0,0,w,h).data,w,h,{inversionAttempts:'dontInvert'});txt=r&&r.data||''}
          if(txt){if(txt===tbCode()&&cfg().timbraK)await done(false);else if(/^JONA-TIMBRA:/.test(txt)&&!warned){warned=true;toast('Questo QR è vecchio: chiedi a Maurizio quello nuovo.','warn')}}

/* presenze del mese in Excel: previsto e timbrato, giorno per giorno */

    for(const u of ppl){const c=contrOf(u),p=(pl[u.id]||{})[g]||'',a=tbVal(lun,u.id,g),man=(((tbWeek(lun)||{}).m||{})[u.id]||{})[g];if(!p&&!a)continue;

  const mese=d0.toLocaleDateString('it-IT',{month:'long',year:'numeric'});
  const R=[[cfg().nomeLocale+' - Presenze di '+mese],[],['Persona','Ore previste','Ore timbrate','Differenza'],...ppl.filter(u=>tot[u.id]).map(u=>[fullName(u),r3(tot[u.id].hp/60),r3(tot[u.id].ha/60),r3((tot[u.id].ha-tot[u.id].hp)/60)])];
  const ws1=XLSX.utils.aoa_to_sheet(R);ws1['!cols']=[{wch:26},{wch:13},{wch:13},{wch:11}];
  const ws2=XLSX.utils.aoa_to_sheet(rows);for(let i=1;i<rows.length;i++){const c=ws2[XLSX.utils.encode_cell({r:i,c:1})];if(c)c.z='dd/mm/yyyy'}
  ws2['!cols']=[{wch:24},{wch:11},{wch:11},{wch:24},{wch:12},{wch:24},{wch:12},{wch:11},{wch:22}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws1,'Riepilogo');XLSX.utils.book_append_sheet(wb,ws2,'Giorni');
  saveBlob('presenze_'+today(d0).slice(0,7)+'.xlsx',new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
  toast('Presenze di '+mese+' pronte');
}

/* ================= scambio turno tra colleghi =================
   Nella settimana pubblicata: cambi.<id> = {da,a,g1,g2 (-1 = nessuno),stato,creato}. Si scambiano le giornate g1 (e g2) tra le due persone.
   chiesto → (il collega) accettato | rifiutato → (chi fa gli orari) approvato | rifiutato; chi chiede può annullare prima dell'approvazione.
   All'approvazione cambiano sia la bozza «t» sia la copia pubblicata «tp»; gli errori chiedono il consenso come nella tabella. */
const CM_ST={chiesto:'In attesa del collega',accettato:'In attesa di approvazione',approvato:'Approvato',rifiutato:'Rifiutato',annullato:'Annullato'};
const cmDays=c=>[c.g1].concat(c.g2>=0&&c.g2!==c.g1?[c.g2]:[]);
function cmApply(rows,c){const A=Object.assign({},rows[c.da]||{}),B=Object.assign({},rows[c.a]||{});
  for(const g of cmDays(c)){const x=A[g],y=B[g];if(y)A[g]=y;else delete A[g];if(x)B[g]=x;else delete B[g]}return[A,B]}
// cambi delle settimane caricate (le più recenti), con la settimana di appartenenza
function cmAll(){const r=[];for(const [k,w] of Object.entries(D().config))if(/^orari_\d{4}-/.test(k)&&w.cambi)for(const [id,c] of Object.entries(w.cambi))r.push(Object.assign({id,lun:w.lun},c));return r.sort((a,b)=>b.creato-a.creato)}
const cmOpen=c=>c.stato==='chiesto'||c.stato==='accettato';
const cmToMe=me=>me?cmAll().filter(c=>c.a===me.id&&c.stato==='chiesto'):[];
const cmToApprove=()=>cmAll().filter(c=>c.stato==='accettato');
const cmTxt=(c,lun)=>{const w=orWeek(lun)||{},tp=w.tp||{},v=(id,g)=>orFmt((tp[id]||{})[g])||'nessun turno';
  return cmDays(c).map(g=>`${OR_GGL[g]}: ${v(c.da,g)} ↔ ${v(c.a,g)}`).join(' · ')};
async function cmSet(c,x){await upd('config','orari_'+c.lun,Object.fromEntries(Object.entries(x).map(([k,v])=>['cambi.'+c.id+'.'+k,v])))}

/* staff: chiedi un cambio per un giorno della settimana pubblicata */
function cmSheet(lun,g1){
  const me=meU();S.cm={lun,g1,a:'',g2:-1};
  openSheet({cls:'tall',live:()=>true,render:()=>{const C=S.cm;if(!C)return'';const w=orWeek(C.lun)||{},tp=w.tp||{};
    const mine=(tp[me.id]||{})[C.g1]||'',ppl=orPeople().filter(u=>u.id!==me.id&&!isDev(u)).sort((a,b)=>(orRep(b)===orRep(me))-(orRep(a)===orRep(me))||byNome(a,b));
    const o=C.a?D().staff[C.a]:null,their=o?(tp[o.id]||{}):{};const td=C.lun===orLun()?(new Date().getDay()+6)%7:-1;
    const c={da:me.id,a:C.a,g1:C.g1,g2:C.g2};const [A,B]=o?cmApply(tp,c):[{},{}];
    return`<div class="grab"></div><div class="sh-h"><div class="sh-t">Chiedi un cambio<div class="sh-s">${orDayL(C.lun,C.g1)} · ${esc(orFmt(mine)||'nessun turno')}</div></div><button type="button" class="icon-btn" data-a="closeSheet" aria-label="Chiudi">${ic('x')}</button></div>
    <span class="lbl">Con chi?</span><div class="cm-ppl">${ppl.map(u=>`<button type="button" class="cm-p" aria-pressed="${C.a===u.id}" data-a="cmWho" data-u="${u.id}">${avatar(u,36)}<span><b>${esc(u.nome)}</b><i>${OR_GG[C.g1]}: ${esc(orFmt((tp[u.id]||{})[C.g1])||'nessun turno')}</i></span></button>`).join('')||'<p class="muted">Nessun collega con gli orari.</p>'}</div>
    ${o?`<span class="lbl">In cambio fai un suo giorno? (facoltativo)</span><div class="chips cm-g">${[-1,0,1,2,3,4,5,6].filter(g=>g<0||(g!==C.g1&&g>=td&&orShifts(their[g]).length)).map(g=>`<button type="button" class="chip" aria-pressed="${C.g2===g}" data-a="cmG2" data-v="${g}">${g<0?'No':OR_GG[g]+' '+esc(orFmt(their[g]))}</button>`).join('')}</div>
    <div class="cm-prev"><b>Dopo il cambio</b>${[[me,A],[o,B]].map(([u,r])=>`<div class="cm-row">${avatar(u,28)}<span>${esc(u.nome)}</span><div>${cmDays(c).map(g=>`<em>${OR_GG[g]} ${esc(orFmt(r[g])||'libero')}</em>`).join('')}</div></div>`).join('')}</div>`:''}
    <div class="sheet-foot"><button type="button" class="btn primary block" data-a="cmSend" ${o?'':'disabled'}>${ic('send')} Chiedi a ${o?esc(o.nome):'…'}</button></div>`}});
}
async function cmSend(){
  const C=S.cm,me=meU();if(!C||!C.a)return;const o=D().staff[C.a];if(!o)return;
  if(cmAll().some(c=>cmOpen(c)&&c.lun===C.lun&&c.da===me.id&&cmDays(c).includes(C.g1)))return toast('Hai già chiesto un cambio per questo giorno.','warn');
  const id=uid(),c={da:me.id,a:o.id,g1:C.g1,g2:C.g2,stato:'chiesto',creato:now()};c.testo=cmTxt(c,C.lun);

async function cmAnswer(lun,id,si){
  const w=orWeek(lun);const c=w&&w.cambi&&w.cambi[id];if(!c||c.stato!=='chiesto')return;const x=Object.assign({id,lun},c),me=meU(),da=D().staff[c.da]||{};
  await cmSet(x,{stato:si?'accettato':'rifiutato',risposta:now()});

  else{await notify(c.da,'Cambio turno rifiutato da '+me.nome,cmTxt(c,lun),'cambio',lun);toast('Hai rifiutato il cambio')}
}
async function cmCancel(lun,id){const w=orWeek(lun),c=w&&w.cambi&&w.cambi[id];if(!c||!cmOpen(c))return;await cmSet({id,lun},{stato:'annullato'});toast('Richiesta annullata')}
// chi fa gli orari: approva (con controllo delle regole) o rifiuta
async function cmDecide(lun,id,si){
  const w=orWeek(lun);const c=w&&w.cambi&&w.cambi[id];if(!c||!cmOpen(c))return;const x=Object.assign({id,lun},c);
  const da=D().staff[c.da],a=D().staff[c.a];if(!da||!a)return toast('Una delle due persone non c\'è più.','warn');
  if(!si){await cmSet(x,{stato:'rifiutato',deciso:now()});for(const p of [c.da,c.a])await notify(p,'Cambio turno non approvato',cmTxt(c,lun),'cambio',lun);return toast('Cambio rifiutato')}
  const t=w.t||{},tp=w.tp||{},[tA,tB]=cmApply(t,c),[pA,pB]=cmApply(tp,c),prev=(orWeek(orShift(lun,-1))||{}).t||{};
  const set={['t.'+c.da]:tA,['t.'+c.a]:tB,['tp.'+c.da]:pA,['tp.'+c.a]:pB,mod:now()};
  for(const [u,r] of [[da,tA],[a,tB]]){const ok=await orConsent(u,orCheck(u,r,prev[u.id]).filter(p=>p.k==='err'),orOk(w,u.id));if(ok===null)return;set['ok.'+u.id]=ok}
  const txt=cmTxt(c,lun);
  set['cambi.'+id+'.stato']='approvato';set['cambi.'+id+'.deciso']=now();
  await upd('config','orari_'+lun,set);
  for(const p of [c.da,c.a])await notify(p,'Cambio turno approvato',txt,'cambio',lun);
  toast('Cambio approvato: orari aggiornati e pubblicati');
}

// «In turno oggi»: turni di oggi dalla settimana pubblicata (tp), ordinati per inizio; «adesso» se il turno è in corso
function orOggi(){
  const lun=orLun(),w=orWeek(lun),tp=w&&w.tp;if(!tp)return'';
  const g=(new Date().getDay()+6)%7,n0=new Date(),nm=n0.getHours()*60+n0.getMinutes(),st=D().staff;
  const l=Object.entries(tp).map(([id,r])=>({u:st[id],sh:orShifts((r||{})[g])})).filter(x=>x.u&&x.u.stato==='attivo'&&x.sh.length).sort((a,b)=>a.sh[0][0]-b.sh[0][0]||byNome(a.u,b.u));
  const on=x=>x.sh.some(([a,b])=>nm>=a&&nm<b),nOn=l.filter(on).length;
  return`<section class="or-now" aria-label="In turno oggi"><div class="or-nowh">${ic('users')}<b>In turno oggi</b><span>${l.length?l.length+(l.length===1?' persona':' persone')+(nOn?' · '+nOn+' adesso':''):'nessuno'}</span></div>
  ${l.length?`<ul>${l.map(x=>`<li class="rep-${orRep(x.u)}${on(x)?' on':''}">${avatar(x.u,32)}<b>${esc(x.u.nome)}${x.u.cognome?' '+esc(x.u.cognome.charAt(0))+'.':''}</b><span>${x.sh.map(([a,b])=>orHMc(a)+'–'+orHMc(b)).join(', ')}</span>${on(x)?'<i class="tag gm">Adesso</i>':''}</li>`).join('')}</ul>`:''}</section>`;

  ${[0,1,2,3,4,5,6].map(g=>{const v=r[g]||'',sh=orShifts(v);
    return`<article class="or-day${g===td?' today':''}${td>=0&&g<td?' past':''}"><div class="or-dh"><b>${OR_GGL[g]}</b><span>${orDay(lun,g).toLocaleDateString('it-IT',{day:'numeric',month:'long'})}</span>${g===td?'<span class="tag gm">Oggi</span>':''}</div>
    ${sh.length?sh.map(([a,b])=>`<div class="or-dt rep-${orRep(me)}">${orHM(a)} – ${orHM(b)}</div>`).join('')+(sh.some(s=>s[1]>1440)?'<div class="or-dm">Finisci dopo mezzanotte</div>':'')
    :OR_ASS[v]?`<div class="or-da">${OR_ASS[v]}</div>`:'<div class="or-dn">Nessun turno</div>'}
    ${tbOn()&&tbVal(lun,me.id,g)?`<div class="or-dtb">${ic('check')} Timbrato ${esc(tbFmt(tbVal(lun,me.id,g)))}</div>`:''}
    ${sh.length&&(td<0||g>=td)?`<button type="button" class="or-cm" data-a="cmOpen" data-l="${lun}" data-g="${g}">${ic('users')} Chiedi un cambio</button>`:''}</article>`}).join('')}`;

/* ================= «Chiedi a Jona» (gestori) =================
   Domande scritte o a voce sui dati dell'app. Risponde Gemini con la chiave di questo telefono (jona_gemini_key):
   gli mandiamo un riassunto compatto dei dati (fornitori, listino, ordini, richieste, staff, orari) e le ultime domande. */
const JONA_TIPS=['Quanto abbiamo speso da ogni fornitore questo mese?','Chi lavora sabato sera?','Quando abbiamo ordinato l\'ultima volta il burro?','Quali prodotti sono aumentati di prezzo?','Cosa chiede più spesso la sala?'];
function jonaCtx(){
  const d=D(),F=d.fornitori,fn=id=>(F[id]||{}).nome||'',dt=t=>t?new Date(t).toLocaleString('it-IT',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';
  const staff=Object.values(d.staff).filter(u=>u.stato!=='in_attesa').map(u=>{const c=isGM(meU())?contrOf(u):null;return[u.id,fullName(u),RUOLI[u.ruolo],REPARTI[u.reparto]||'',u.mansione||'',u.stato,c?c.ore+'h/sett, pausa '+c.pausa+' min, '+c.liberi+' liberi':isGM(meU())&&orFree(u)?'Full time Responsabile, orario libero':'']});
  const sn=id=>(d.staff[id]&&fullName(d.staff[id]))||id;
  const orari=[orShift(orLun(),-1),orLun(),orShift(orLun(),1)].map(l=>{const w=orWeek(l);if(!w)return null;const t=w.tp||w.t||{};
    return{settimana:'dal '+l,pubblicata:!!w.tp,turni:Object.fromEntries(Object.entries(t).map(([id,r])=>[sn(id),Object.fromEntries(Object.entries(r).map(([g,v])=>[OR_GGL[g],orFmt(v)]))])),
      timbrature:tbOn()&&tbWeek(l)?Object.fromEntries(Object.entries(tbWeek(l).t||{}).map(([id,r])=>[sn(id),Object.fromEntries(Object.entries(r).map(([g,v])=>[OR_GGL[g],v]))])):undefined}}).filter(Boolean);
  return JSON.stringify({
    adesso:dt(now()),locale:cfg().nomeLocale,
    fornitori:Object.values(F).map(f=>[f.nome,METODI[f.metodo]?METODI[f.metodo].l:f.metodo||'',f.categoria||'',f.oraLimite||'']),
    listino_colonne:['prodotto','fornitore','unità','prezzo €','prezzo precedente €','categoria'],
    listino:prods().map(p=>[p.nome,fn(p.fornitoreId),p.unita||'',p.prezzo??'',p.prezzoPrec??'',p.categoria||'']),
    ordini_colonne:['creato','inviato','fornitore','stato','arrivato','righe: prodotto, quantità, unità, prezzo €'],
    ordini:Object.values(d.ordini).sort((a,b)=>(b.creato||0)-(a.creato||0)).map(o=>[dt(o.creato),dt(o.inviato),fn(o.fornitoreId)||o.fornitoreNome,o.stato,o.ricevuto?dt(o.ricevuto)+(o.differenze?' con differenze':''):'',(o.items||[]).map(l=>[l.nome,l.qta,l.unita||'',l.prezzo??''])]),
    richieste_colonne:['data','persona','reparto','stato','prodotti: nome, quantità, unità'],
    richieste:Object.values(d.richieste).sort((a,b)=>(b.creato||0)-(a.creato||0)).slice(0,250).map(r=>[dt(r.creato),r.utenteNome,REPARTI[r.reparto]||'',r.stato,(r.items||[]).map(i=>[i.nome,i.qta,i.unita||''])]),
    staff_colonne:['id','nome','ruolo','reparto','mansione','stato','contratto'],staff,orari});
}
const jonaMd=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').split('\n').map(l=>/^\s*[-*•]\s+/.test(l)?'<li>'+l.replace(/^\s*[-*•]\s+/,'')+'</li>':l).join('\n')
  .replace(/(?:<li>.*?<\/li>\n?)+/g,m=>'<ul>'+m.replace(/\n/g,'')+'</ul>').replace(/\n/g,'<br>');
function jonaSheet(){
  S.jona=S.jona||{msgs:[],q:'',busy:false};
  openSheet({cls:'tall jona-sh',live:()=>true,render:()=>{const J=S.jona,key=gemOn();
    return`<div class="grab"></div><div class="sh-h"><span class="jona-av">${ic('sparkle')}</span><div class="sh-t">Chiedi a Jona<div class="sh-s">Domande sui dati dell'app, a voce o scritte</div></div><button type="button" class="icon-btn" data-a="closeSheet" aria-label="Chiudi">${ic('x')}</button></div>
    ${!key?`<div class="jona-key">${ic('sparkle')}<div><b>Serve la chiave Gemini su questo telefono</b><span>È gratis: la crei su aistudio.google.com/apikey e la incolli qui una volta sola.</span><button type="button" class="btn primary sm" data-a="gemKey">Inserisci la chiave</button></div></div>`:''}
    <div class="jona-msgs" id="jona-msgs">${J.msgs.length?J.msgs.map(m=>`<div class="jona-m ${m.r}">${m.r==='a'?jonaMd(m.t):esc(m.t)}</div>`).join(''):`<div class="jona-tips">${JONA_TIPS.map(t=>`<button type="button" class="chip" data-a="jonaTip" data-v="${esc(t)}">${esc(t)}</button>`).join('')}</div>`}
    ${J.busy?'<div class="jona-m a busy"><i></i><i></i><i></i></div>':''}</div>
    <div class="jona-in"><textarea class="inp" id="jona-q" rows="1" placeholder="Scrivi una domanda…" data-in="jonaQ" enterkeyhint="send">${esc(J.q)}</textarea>
    ${vSR()?`<button type="button" class="icon-btn" data-a="jonaMic" aria-label="Detta la domanda">${ic('mic')}</button>`:''}<button type="button" class="jona-send" data-a="jonaAsk" aria-label="Chiedi" ${J.busy||!key?'disabled':''}>${ic('send')}</button></div>
    <p class="jona-note">Le domande e i dati del ristorante vengono mandati a Google Gemini per la risposta. Controlla i numeri importanti.</p>`},onClose:()=>{}});
  setTimeout(()=>{const m=$('#jona-msgs');if(m)m.scrollTop=m.scrollHeight},50);
